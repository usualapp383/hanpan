const GW=13,GH=11,FUSE=2.4,FLAME=.55,TLIM=180;

const NET={host:false,solo:false,ch:null,code:"",sb:null,last:0};

/* ---------------- 게임 상태 ---------------- */
let S=null; // 시뮬레이션(방장) 또는 받은 상태(손님)
function makeGrid(){const g=[];for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){let c=0;if(x===0||y===0||x===GW-1||y===GH-1||(x%2===0&&y%2===0))c=1;else if(Math.random()<.68)c=2;g.push(c)}

const SPAWN=[[1,1],[11,9],[11,1],[1,9],[5,5],[7,5]];

  S={t:0,left:TLIM,grid:grid.split("").map(Number),items:{},bombs:[],flames:[],pl:L.players.map((p,i)=>({id:p.id,nick:p.nick,bot:p.bot,ch:p.ch,x:SPAWN[i][0],y:SPAWN[i][1],rx:SPAWN[i][0],ry:SPAWN[i][1],dir:2,alive:1,rng:2,max:1,spd:3.6,ix:0,iy:0,wantB:0,walk:0})),end:null,shrink:0,fx:[]};

  $("#mk").onclick=async()=>{if(!getNick())return;const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[rnd(32)]).join("");NET.code=code;NET.host=true;$("#mk").disabled=true;try{await joinChannel(code)}catch(e){toast("연결하지 못했어요");$("#mk").disabled=false;return}L={code,host:ME.id,players:[]};hostJoin(ME.id,ME.nick);history.replaceState(null,"","/pop/?r="+code)};
  $("#jn").onclick=async()=>{if(!getNick())return;const code=($("#jc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length!==4)return toast("방 코드 4자리를 넣어 주세요");NET.code=code;$("#jn").disabled=true;try{await joinChannel(code)}catch(e){toast("연결하지 못했어요");$("#jn").disabled=false;return}send({k:"hello",id:ME.id,nick:ME.nick});toast("방을 찾는 중…");setTimeout(()=>{if(!L){toast("방을 찾지 못했어요");$("#jn").disabled=false}},6000)};
  $("#solo").onclick=()=>{if(!getNick())return;NET.solo=true;NET.host=true;L={code:"",host:ME.id,players:[{id:ME.id,nick:ME.nick,bot:0,ch:0}]};for(let i=0;i<3;i++){L.players.push({id:"bot"+i,nick:BOTN[i+1],bot:1,ch:i+1})}hostStart()};
}
renderHome();
