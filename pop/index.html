const LANG=(()=>{try{const v=JSON.parse(localStorage.getItem("hanpan.lang")||"null");if(v)return v==="ko"?"ko":"en"}catch(e){}return /^ko/i.test(navigator.language||"ko")?"ko":"en"})();
const TRK=Object.keys(EN).sort((a,b)=>b.length-a.length);
function trS(s){if(LANG==="ko"||!s||!/[가-힣]/.test(s))return s;for(const k of TRK){if(k.length<9)break;if(s.indexOf(k)>=0)s=s.split(k).join(EN[k])}for(const [re,to] of TRX)s=s.replace(re,to);for(const k of TRK){if(s.indexOf(k)<0)continue;if(k.length<=2&&/[가-힣]/.test(k)){s=s.replace(new RegExp("(^|[\\s·(])"+k+"(?=[\\s·)!?.,]|$)","g"),"$1"+EN[k])}else s=s.split(k).join(EN[k])}return s.replace(/\s{2,}/g," ")}
function trDom(root){if(LANG==="ko"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=n.nodeValue;if(/[가-힣]/.test(v)){const t=trS(v);if(t!==v)n.nodeValue=t}}if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(e=>{for(const a of["placeholder","aria-label","title"]){const v=e.getAttribute(a);if(v&&/[가-힣]/.test(v))e.setAttribute(a,trS(v))}})}
if(LANG!=="ko"){document.documentElement.lang="en";document.title=trS(document.title);let q=0;new MutationObserver(()=>{if(q)return;q=1;requestAnimationFrame(()=>{q=0;trDom(document.body)})}).observe(document.body,{childList:true,subtree:true,characterData:true});addEventListener("DOMContentLoaded",()=>trDom(document.body));setTimeout(()=>trDom(document.body),0)}

function copyTxt(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();return Promise.resolve()}
function shareSheet(o){
  const T=typeof trS==="function"?trS:(s=>s),title=T(o.title),text=T(o.text),url=o.url,full=text+"\n👉 "+url,mob=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  const w=document.createElement("div");w.className="shs";w.innerHTML=`<div class="sb" role="dialog" aria-label="${T("공유하기")}"><h3>${esc(T(o.head||"친구 부르기"))}</h3><p>${esc(text)}</p><div class="u"><span>${esc(url)}</span></div><div class="gr">

  document.body.appendChild(w);const close=()=>w.remove();
  w.addEventListener("click",e=>{if(e.target===w)return close();const b=e.target.closest("[data-s]");if(!b)return;const s=b.dataset.s;

    if(s==="sms"){location.href=(/iPhone|iPad/i.test(navigator.userAgent)?"sms:&body=":"sms:?body=")+encodeURIComponent(full);return close()}
    if(s==="more"){navigator.share({title,text,url}).catch(()=>{});return close()}});
}
