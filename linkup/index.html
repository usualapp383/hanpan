/* ---------------- 맵 15종 ('#' 막힘) ---------------- */
const MK=(w,h,f)=>{const r=[];for(let y=0;y<h;y++){let s="";for(let x=0;x<w;x++)s+=f(x,y,w,h)?"#":".";r.push(s)}return r};
const MAPS=[
 ["열린 마당",MK(6,6,()=>0)],

 ["작은 미로",MK(8,8,(x,y)=>(x===2&&y<5)||(x===5&&y>2)||(y===7&&x===3))],

const LET="ABCDEF",LCOL=["#FFD23F","#6FA8FF","#3DD6B0","#FF8FA8","#FF9F5A","#B79BFF"];

/* ---------------- 판 ---------------- */
// G: {mi,W,H,blk:[], st:{idx:letter}, turn:0|1, n (놓은 수), phase:'place'|'prove'|'end', prover, caller, path:{}, win, dl, players:[{id,nick,bot}], first}
let G=null,UI={sel:null,let:"A",paint:null,placed:[]};
function newBoard(mi){const m=MAPS[mi][1];const W=m[0].length,H=m.length,blk=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)blk.push(m[y][x]==="#"?1:0);return{mi,W,H,blk,st:{},n:0}}
const usedLetters=g=>[...new Set(Object.values(g.st))].sort();
const nextLetter=g=>{const u=usedLetters(g);return LET[u.length]||null};
function allowedLetters(g){const u=usedLetters(g),nx=nextLetter(g);return nx?u.concat(nx):u}
/* 증명 확인: 같은 글자 돌이 모두 이어졌나, 길이 겹치지 않나 */
function check(g,path){const W=g.W,H=g.H,own={};for(const i in g.st)own[i]=g.st[i];for(const i in path){if(g.blk[i]||g.st[i]!=null)return{ok:false,why:"막힌 칸이나 돌 위에는 길을 놓을 수 없어요"};own[i]=path[i]}
  const res={ok:true,bad:[]};for(const L of usedLetters(g)){const st=Object.keys(g.st).filter(i=>g.st[i]===L).map(Number);if(st.length<2)continue;const seen=new Set([st[0]]),q=[st[0]];while(q.length){const c=q.pop(),x=c%W,y=(c/W)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const k=ny*W+nx;if(!seen.has(k)&&own[k]===L){seen.add(k);q.push(k)}}}if(!st.every(s=>seen.has(s))){res.ok=false;res.bad.push(L)}}
  return res}
/* 컴퓨터 풀이: 글자별로 돌을 하나씩 이어 붙이며 되돌아가기 */
function solve(g,budget){const W=g.W,H=g.H,N=W*H,occ=new Array(N).fill(null);for(let i=0;i<N;i++)if(g.blk[i])occ[i]="#";for(const i in g.st)occ[i]=g.st[i];
  const tasks=[];for(const L of usedLetters(g)){const st=Object.keys(g.st).filter(i=>g.st[i]===L).map(Number);if(st.length<2)continue;tasks.push({L,st})}
  tasks.sort((a,b)=>spread(a.st)-spread(b.st));function spread(s){let m=0;for(const a of s)for(const b of s)m=Math.max(m,Math.abs(a%W-b%W)+Math.abs(((a/W)|0)-((b/W)|0)));return m}
  let nodes=0;const path={};
  function paths(L,comp,target,lim){const out=[],seen=new Set();for(let a=0;a<lim*3&&out.length<lim;a++){const p=dij(comp,target,a===0?0:1.2);if(!p)break;const key=p.join(",");if(!seen.has(key)){seen.add(key);out.push(p)}}return out}
  function dij(comp,target,noise){const N=W*H,dist=new Float64Array(N).fill(1e9),prev=new Int32Array(N).fill(-1),wt=new Float64Array(N);for(let i=0;i<N;i++)wt[i]=1+Math.random()*noise;const pq=[];for(const c of comp){dist[c]=0;pq.push([0,c])}
    while(pq.length){let bi=0;for(let q=1;q<pq.length;q++)if(pq[q][0]<pq[bi][0])bi=q;const [d,c]=pq.splice(bi,1)[0];if(d>dist[c])continue;nodes++;
      if(c===target){const r=[];let k=prev[c];while(k>=0&&dist[k]>0){r.push(k);k=prev[k]}return r}
      const x=c%W,y=(c/W)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const k=ny*W+nx;if(k!==target&&occ[k]!==null)continue;const nd=d+wt[k];if(nd<dist[k]){dist[k]=nd;prev[k]=c;pq.push([nd,k])}}}
    return null}
  function go(ti,si){if(nodes>budget)return false;if(ti>=tasks.length)return true;const t=tasks[ti];if(si>=t.st.length)return go(ti+1,1);
    const comp=t.st.slice(0,si).concat(Object.keys(path).filter(i=>path[i]===t.L).map(Number));const tg=t.st[si];

  function adjacentTo(comp,tg){const x=tg%W,y=(tg/W)|0;return comp.some(c=>Math.abs(c%W-x)+Math.abs(((c/W)|0)-y)===1)}
  const ok=go(0,1);return ok?{path:Object.assign({},path),nodes}:{unknown:1,nodes}}
function solveHard(g,budget,tries){for(let k=0;k<tries;k++){const s=solve(g,budget);if(s.path)return s}return{unknown:1}}

async function sbClient(){for(let i=0;i<40&&!window.supabase;i++)await new Promise(r=>setTimeout(r,150));if(!window.supabase)throw new Error("load");return NET.sb||(NET.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:20}}}))}

function trS(s){if(LANG==="ko"||!s||!/[가-힣]/.test(s))return s;for(const k of TRK){if(k.length<9)break;if(s.indexOf(k)>=0)s=s.split(k).join(EN[k])}for(const [re,to] of TRX)s=s.replace(re,to);for(const k of TRK){if(s.indexOf(k)<0)continue;if(k.length<=2&&/[가-힣]/.test(k)){s=s.replace(new RegExp("(^|[\\s·(])"+k+"(?=[\\s·)!?.,]|$)","g"),"$1"+EN[k])}else s=s.split(k).join(EN[k])}return s.replace(/\s{2,}/g," ")}
