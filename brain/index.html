 {k:"vault",n:"금고 거래",ic:"🔐",rule:"짝과 금고를 두고 '나누기' 또는 '독차지'를 몰래 고르세요. 채팅으로 약속할 수 있지만 지킬지는 마음대로!",tip:"둘 다 나누기 +3씩 · 혼자 독차지 +5(상대 0) · 둘 다 독차지 0 · 두 번",x:1},
 {k:"math",n:"셈 탑 결승",ic:"🏆",rule:"마지막 셈 탑! 이번엔 칩이 두 배예요. 역전할 마지막 기회예요.",tip:"딱 맞히면 12칩 · 가장 빨리 맞힌 사람 +4칩",x:2,fin:1}
];
const ELIM_AFTER=[1,3]; // 라운드 번호(0부터) 뒤에 꼴찌 탈락
const T={intro:7,math:75,auc:18,min:14,vault:30,reveal:7,elim:6};
if(/[?&]fast=1/.test(location.search))for(const k in T)T[k]=Math.max(1,Math.round(T[k]/6));

/* ---------------- 네트워크 ---------------- */
const NET={ch:null,host:false,code:"",solo:false,lastSt:0,off:0};
async function sbClient(){for(let i=0;i<40&&!window.supabase;i++)await new Promise(r=>setTimeout(r,150));if(!window.supabase)throw new Error("load");return NET.sb||(NET.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:20}}}))}
async function joinChannel(code){
  const sb=await sbClient();const ch=sb.channel("brain-"+code.toLowerCase(),{config:{broadcast:{self:false}}});
  ch.on("broadcast",{event:"m"},({payload})=>onMsg(payload));
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error("timeout")),9000);ch.subscribe(s=>{if(s==="SUBSCRIBED"){clearTimeout(t);res()}else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){clearTimeout(t);rej(new Error(s))}})});
  NET.ch=ch;
}
function send(p){if(NET.solo)return;try{NET.ch&&NET.ch.send({type:"broadcast",event:"m",payload:p})}catch(e){}}
function act(a){a.id=ME.id;if(NET.host)hostAct(a);else send({k:"act",a})}
function onMsg(p){
  if(!p||typeof p!=="object")return;
  if(p.k==="st"&&!NET.host){NET.lastSt=Date.now();NET.off=Date.now()-p.now;G=p.G;render();return}
  if(p.k==="chat"){addChat(p.c);return}
  if(!NET.host)return;
  if(p.k==="hello"){hostJoin(p.id,p.nick);return}
  if(p.k==="act"&&p.a){hostAct(p.a);return}
  if(p.k==="bye"){const pl=G.players.find(x=>x.id===p.id);if(pl){if(G.phase==="lobby")G.players=G.players.filter(x=>x.id!==p.id);else{pl.bot=1;pl.nick=pl.nick+"(컴)"}}push()}
}
const now=()=>NET.host||NET.solo?Date.now():Date.now()-NET.off;

/* ---------------- 상태 (방장이 진행) ---------------- */
let G=null;
function newG(){return{phase:"lobby",ri:-1,players:[],dl:0,d:{},code:NET.code,host:ME.id,msg:""}}
function push(){render();if(!NET.solo)send({k:"st",G,now:Date.now()})}
function hostJoin(id,nick){
  if(G.players.some(p=>p.id===id)){push();return}
  if(G.phase!=="lobby"||G.players.length>=6){send({k:"st",G,now:Date.now()});return}
  G.players.push({id,nick:cleanNick(nick)||"손님",bot:0,alive:1,chips:0,last:0,col:COLS[G.players.length%6]});push();sfx(660,.1)
}
function addBots(n){const used=new Set(G.players.map(p=>p.nick));for(let i=0;i<n&&G.players.length<6;i++){let nm=BOTN.find(b=>!used.has(b))||("컴"+i);used.add(nm);G.players.push({id:"bot"+Math.random().toString(36).slice(2,7),nick:nm,bot:1,alive:1,chips:0,last:0,col:COLS[G.players.length%6],skill:.35+Math.random()*.55})}}
function alive(){return G.players.filter(p=>p.alive)}
function startGame(){if(G.players.length<2)addBots(Math.max(0,4-G.players.length));G.players.forEach((p,i)=>p.col=COLS[i%6]);G.ri=-1;nextRound()}
function nextRound(){
  G.ri++;if(G.ri>=ROUNDS.length)return endGame();
  G.phase="intro";G.dl=Date.now()+T.intro*1e3;G.d={};G.players.forEach(p=>p.last=0);push();
}
function beginPlay(){
  const R=ROUNDS[G.ri];G.phase="play";G.d={k:R.k,sub:{}};
  if(R.k==="math"){const m=genMath(R.fin);Object.assign(G.d,m);G.dl=Date.now()+T.math*1e3;G.d.t0=Date.now()}
  if(R.k==="auc"){G.d.lot=0;G.d.prizes=[2,3,5];G.d.coins={};alive().forEach(p=>G.d.coins[p.id]=10);G.d.hist=[];G.dl=Date.now()+T.auc*1e3}
  if(R.k==="min"){G.d.q=0;G.d.qs=shuffle(MINQ).slice(0,3);G.d.hist=[];G.dl=Date.now()+T.min*1e3}
  if(R.k==="vault"){G.d.r=0;G.d.hist=[];makePairs();G.dl=Date.now()+T.vault*1e3}
  push();scheduleBots();
}
function genMath(fin){
  for(let tries=0;tries<60;tries++){
    const nums=[];for(let i=0;i<5;i++)nums.push(1+rnd(9));nums.push(pick(fin?[25,50,75]:[10,20,25]));
    const target=fin?120+rnd(380):30+rnd(170);
    const s=solveBest(nums,target,4000);if(s&&s.v===target)return{nums:shuffle(nums),target};
  }
  return{nums:[2,3,5,7,8,25],target:fin?175:60};
}
function makePairs(){const a=shuffle(alive().map(p=>p.id));G.d.pairs=[];G.d.rest=null;while(a.length>=2)G.d.pairs.push([a.pop(),a.pop()]);if(a.length)G.d.rest=a[0]}
function hostAct(a){
  const p=G.players.find(x=>x.id===a.id);if(!p)return;
  if(a.t==="chat"){const c={n:p.nick,col:p.col,s:cleanMsg(a.s)};if(c.s){addChat(c);send({k:"chat",c})}return}
  if(G.phase!=="play"||!p.alive)return;
  const d=G.d;
  if(d.k==="math"&&a.t==="sub"){const v=evalExpr(a.tok||[]);if(v==null)return;const used=(a.tok||[]).filter(t=>t.t==="n").map(t=>t.i);if(new Set(used).size!==used.length||used.some(i=>i<0||i>=d.nums.length||d.nums[i]!==(a.tok.find(t=>t.i===i)||{}).v))return;
    d.sub[p.id]={v,s:a.s,t:Date.now()-d.t0};push();if(alive().every(x=>d.sub[x.id]&&Math.abs(d.sub[x.id].v-d.target)<1e-9))G.dl=Math.min(G.dl,Date.now()+1500)}
  if(d.k==="auc"&&a.t==="bid"){const b=Math.max(0,Math.min(d.coins[p.id]||0,a.v|0));d.sub[p.id]=b;push();if(alive().every(x=>d.sub[x.id]!=null))G.dl=Math.min(G.dl,Date.now()+800)}
  if(d.k==="min"&&a.t==="pick"){d.sub[p.id]=a.v|0;push();if(alive().every(x=>d.sub[x.id]!=null))G.dl=Math.min(G.dl,Date.now()+800)}
  if(d.k==="vault"&&a.t==="vc"){if(d.rest===p.id)return;d.sub[p.id]=a.v==="steal"?"steal":"split";push();if(alive().every(x=>x.id===d.rest||d.sub[x.id]))G.dl=Math.min(G.dl,Date.now()+800)}
}
function award(id,n,why){const p=G.players.find(x=>x.id===id);if(!p)return;p.chips+=n;p.last+=n}
function resolve(){
  const d=G.d,R=ROUNDS[G.ri],x=R.x;
  if(d.k==="math"){
    const rows=alive().map(p=>{const s=d.sub[p.id];const dist=s?Math.abs(s.v-d.target):1e9;let g=dist<1e-9?6:dist<=2?4:dist<=5?3:dist<=10?2:dist<=20?1:0;return{id:p.id,s,dist,g:g*x}});
    const ex=rows.filter(r=>r.dist<1e-9).sort((a,b)=>a.s.t-b.s.t);if(ex[0])ex[0].g+=2*x,ex[0].fast=1;
    rows.forEach(r=>award(r.id,r.g));d.res=rows;finishRound();return;
  }
  if(d.k==="auc"){
    const bids=alive().map(p=>({id:p.id,b:d.sub[p.id]==null?0:d.sub[p.id]}));bids.forEach(b=>d.coins[b.id]-=b.b);
    const cnt={};bids.forEach(b=>{if(b.b>0)cnt[b.b]=(cnt[b.b]||0)+1});
    const uniq=bids.filter(b=>b.b>0&&cnt[b.b]===1).sort((a,b)=>b.b-a.b);const w=uniq[0];const pr=d.prizes[d.lot]*x;if(w)award(w.id,pr);
    d.hist.push({bids,w:w&&w.id,pr});d.lot++;d.sub={};
    if(d.lot<3){G.phase="mid";G.dl=Date.now()+5e3;push();return}
    d.res=null;finishRound();return;
  }
  if(d.k==="min"){
    const picks=alive().map(p=>({id:p.id,v:d.sub[p.id]==null?-1:d.sub[p.id]})),cnt=[0,0,0];picks.forEach(p=>{if(p.v>=0)cnt[p.v]++});
    const nz=cnt.map((c,i)=>({c,i})).filter(o=>o.c>0).sort((a,b)=>a.c-b.c);let wins=[];
    if(nz.length>1){const m=nz[0].c;wins=nz.filter(o=>o.c===m).map(o=>o.i)}
    const pts=wins.length===1?3:1;picks.forEach(p=>{if(wins.includes(p.v))award(p.id,pts*x)});
    d.hist.push({q:d.qs[d.q],cnt,wins,pts});d.q++;d.sub={};
    if(d.q<3){G.phase="mid";G.dl=Date.now()+5e3;push();return}
    finishRound();return;
  }
  if(d.k==="vault"){
    const out=[];for(const [a,b] of d.pairs){const ca=d.sub[a]||"split",cb=d.sub[b]||"split";let ga=0,gb=0;
      if(ca==="split"&&cb==="split"){ga=gb=3}else if(ca==="steal"&&cb==="split"){ga=5}else if(ca==="split"&&cb==="steal"){gb=5}
      award(a,ga*x);award(b,gb*x);out.push({a,b,ca,cb,ga,gb})}
    if(d.rest)award(d.rest,2*x);
    d.hist.push({out,rest:d.rest});d.r++;d.sub={};
    if(d.r<2){G.phase="mid";G.dl=Date.now()+6e3;push();return}
    finishRound();return;
  }
}
function finishRound(){G.phase="reveal";G.dl=Date.now()+(T.reveal+(G.d.k==="math"?3:0))*1e3;push();sfx(880,.15)}
function afterReveal(){
  if(ELIM_AFTER.includes(G.ri)&&alive().length>=4){
    const al=alive().slice().sort((a,b)=>a.chips-b.chips||a.last-b.last||Math.random()-.5);const o=al[0];o.alive=0;G.d.out=o.id;G.phase="elim";G.dl=Date.now()+T.elim*1e3;push();sfx(160,.4,"sawtooth",.06);return}
  nextRound();
}
function endGame(){G.phase="end";G.dl=0;push();sfx(1046,.3)}
function tick(){
  if(!G)return;
  if(NET.host&&G.phase!=="lobby"&&G.phase!=="end"&&G.dl&&Date.now()>=G.dl){
    if(G.phase==="intro")beginPlay();
    else if(G.phase==="play")resolve();
    else if(G.phase==="mid"){G.phase="play";const k=G.d.k;G.dl=Date.now()+(k==="auc"?T.auc:k==="min"?T.min:T.vault)*1e3;if(k==="vault")makePairs();push();scheduleBots()}
    else if(G.phase==="reveal")afterReveal();
    else if(G.phase==="elim")NET.solo&&G.d.out===ME.id?endGame():nextRound();
  }
  if(!NET.host&&!NET.solo&&G&&NET.lastSt&&Date.now()-NET.lastSt>12000&&G.phase!=="end"){NET.lastSt=0;toast("방장 연결이 끊겼어요");}
  updTimer();
}
setInterval(tick,250);
setInterval(()=>{if(NET.host&&!NET.solo&&G)send({k:"st",G,now:Date.now()});if(!NET.host&&!NET.solo&&NET.ch&&(!G||!G.players.some(p=>p.id===ME.id)))send({k:"hello",id:ME.id,nick:ME.nick})},2000);

/* ---------------- 컴퓨터 ---------------- */
function scheduleBots(){
  const d=G.d,dur=Math.max(1,G.dl-Date.now());
  for(const b of alive().filter(p=>p.bot)){
    const delay=dur*(.25+Math.random()*.6);
    setTimeout(()=>{if(!G||G.phase!=="play")return;
      if(d.k==="math"){let best=solveBest(d.nums,d.target,Math.round(30+500*(b.skill||.6)));if(best&&Math.random()>(b.skill||.6)*.9){const alt=solveBest(d.nums,d.target+(rnd(2)?1:-1)*(2+rnd(9)),60);if(alt)best=alt}if(best){const tok=toTokens(best.s,d.nums);if(tok)hostAct({id:b.id,t:"sub",tok,s:best.s.replace(/^\((.*)\)$/,"$1")})}}
      if(d.k==="auc"){const c=d.coins[b.id]||0,left=3-d.lot;let v=d.lot===2?c:Math.min(c,Math.round(c/left*(.5+Math.random())));if(Math.random()<.2)v=Math.min(c,v+1);hostAct({id:b.id,t:"bid",v})}
      if(d.k==="min"){hostAct({id:b.id,t:"pick",v:rnd(3)})}
      if(d.k==="vault"&&d.rest!==b.id){const prev=(d.hist[d.hist.length-1]||{out:[]}).out.find(o=>o.a===b.id||o.b===b.id);let st=Math.random()<.3;if(prev){const opp=prev.a===b.id?prev.cb:prev.ca;if(opp==="steal")st=Math.random()<.6}hostAct({id:b.id,t:"vc",v:st?"steal":"split"})}
    },delay);
  }
}
function toTokens(s,nums){ // "(3+(5×2))" → 토큰(카드 번호 맞추기)
  const used=new Set(),tok=[];let i=0;
  while(i<s.length){const c=s[i];if(/\d/.test(c)){let j=i;while(j<s.length&&/\d/.test(s[j]))j++;const v=+s.slice(i,j);const k=nums.findIndex((n,q)=>n===v&&!used.has(q));if(k<0)return null;used.add(k);tok.push({t:"n",v,i:k});i=j}else if("+-×÷".includes(c)){tok.push({t:"o",v:c});i++}else if(c==="("||c===")"){tok.push({t:c});i++}else i++}
  return tok;
}

/* ---------------- 화면 ---------------- */
let UI={tok:[],bid:null,pick:null,vc:null,chat:[],screen:"home"};
function seatsHTML(){return`<div class="seats">${G.players.map(p=>{const d=G.d||{},done=G.phase==="play"&&p.alive&&(d.sub&&d.sub[p.id]!=null);return`<div class="seat ${p.id===ME.id?"me":""} ${p.alive?"":"out"}"><div class="av" style="background:${p.col}">${esc(p.nick.slice(0,1))}${done?'<span class="ok">✓</span>':""}</div><span class="nm">${esc(p.nick)}</span><span class="ch">${p.chips}칩</span></div>`}).join("")}</div>`}
function topHTML(){const R=ROUNDS[G.ri]||{};return`<div class="top"><a href="/" aria-label="틈새 오락실로">‹ 오락실</a><span class="ttl">두뇌 서바이벌</span><span class="rd">${G.ri>=0&&G.phase!=="end"?`${G.ri+1}/${ROUNDS.length} 라운드<br>${esc(R.n)}`:""}</span></div>`}
function timerHTML(){return`<div class="timer"><i id="tbar"></i></div>`}
function updTimer(){const e=$("#tbar");if(!e||!G||!G.dl)return;const tot=(G.phase==="intro"?T.intro:G.phase==="play"?(G.d.k==="math"?T.math:G.d.k==="auc"?T.auc:G.d.k==="min"?T.min:T.vault):G.phase==="elim"?T.elim:7)*1e3;const left=Math.max(0,G.dl-now());e.style.transform=`scaleX(${Math.min(1,left/tot)})`;const s=$("#tsec");if(s)s.textContent=Math.ceil(left/1e3)+"초";const sec=Math.ceil(left/1e3);if(G.phase==="play"&&sec<=5&&sec>0&&updTimer.last!==sec){updTimer.last=sec;sfx(sec<=2?1200:900,.05,"square",.03)}}
const meP=()=>G&&G.players.find(p=>p.id===ME.id);
let lastKey="";
function render(){
  if(!G){renderHome();return}
  const key=G.phase+"|"+G.ri+"|"+(G.d&&(G.d.lot||G.d.q||G.d.r))+"|"+(G.d&&G.d.target);
  if(key!==lastKey){lastKey=key;UI.tok=[];UI.bid=null;UI.pick=null;UI.vc=null}
  const f=document.activeElement,keepChat=f&&f.id==="cin"?f.value:null;
  let h=topHTML();
  if(G.phase==="lobby")h+=lobbyHTML();
  else{h+=seatsHTML();h+=`<div class="panel">${phaseHTML()}</div>`}
  h+=chatHTML();
  app.innerHTML=h;bind();updTimer();
  if(keepChat!=null){const c=$("#cin");c.value=keepChat;c.focus()}
  const lg=$("#clog");if(lg)lg.scrollTop=lg.scrollHeight;
}
function lobbyHTML(){
  const seats=[];for(let i=0;i<6;i++){const p=G.players[i];seats.push(p?`<div class="ls"><div class="av" style="background:${p.col}">${esc(p.nick.slice(0,1))}</div><span class="nm">${esc(p.nick)}</span><small>${p.id===G.host?"방장":p.bot?"컴퓨터":"참가"}</small></div>`:`<div class="ls empty">빈자리</div>`)}
  const isHost=NET.host;
  return`${NET.solo?"":`<p class="note" style="margin-bottom:0">방 코드</p><div class="code">${esc(G.code)}</div><div class="row"><button class="btn" data-a="share">🔗 초대 링크 보내기</button></div>`}
  <div class="lobbyseats">${seats.join("")}</div>
  ${isHost?`<div class="row"><button class="btn" data-a="bots" ${G.players.length>=6?"disabled":""}>컴퓨터로 채우기</button><button class="btn pri" data-a="start" ${G.players.length<2&&!NET.solo?"":""}>시작하기</button></div><p class="note">2명 미만이면 컴퓨터가 함께해요 · 5라운드 약 10분 · 2·4라운드 뒤 꼴찌 탈락</p>`:`<p class="note">방장이 시작하기를 기다리는 중…</p>`}`;
}
function phaseHTML(){
  const R=ROUNDS[G.ri]||{},d=G.d||{},me=meP(),out=me&&!me.alive;
  if(G.phase==="intro")return`${timerHTML()}<div class="intro"><div class="no">ROUND ${G.ri+1}</div><h2>${R.ic} ${esc(R.n)}</h2><p>${esc(R.rule)}</p><p class="tip">${esc(R.tip)}</p></div>`;
  if(G.phase==="elim"){const o=G.players.find(p=>p.id===d.out)||{};return`${timerHTML()}<div class="elim"><p class="sub">칩이 가장 적은 사람이 떠나요</p><div class="av" style="background:${o.col}">${esc((o.nick||"?").slice(0,1))}</div><div class="big">${esc(o.nick)} 탈락</div><p class="sub">${o.id===ME.id?"아쉬워요! 끝까지 지켜보며 응원할 수 있어요":"살아남았어요! 다음 라운드로"}</p></div>`}
  if(G.phase==="end")return endHTML();
  if(d.k==="math")return mathHTML(R,d,out);
  if(d.k==="auc")return aucHTML(R,d,out);
  if(d.k==="min")return minHTML(R,d,out);
  if(d.k==="vault")return vaultHTML(R,d,out);
  return"";
}
function nameOf(id){const p=G.players.find(x=>x.id===id);return p?p.nick:"?"}
function colOf(id){const p=G.players.find(x=>x.id===id);return p?p.col:"#888"}
function mathHTML(R,d,out){
  if(G.phase==="reveal"){const rows=(d.res||[]).slice().sort((a,b)=>b.g-a.g||a.dist-b.dist);
    return`<p class="ph">${R.ic} 결과</p><div class="target"><small>목표</small><b>${d.target}</b></div><div class="res">${rows.map((r,i)=>`<div class="rr ${i===0&&r.g>0?"win":""}"><span class="dot" style="background:${colOf(r.id)}">${esc(nameOf(r.id).slice(0,1))}</span><span class="n">${esc(nameOf(r.id))}${r.fast?" ⚡":""}<br><small style="color:var(--mute);font-weight:400">${r.s?esc(r.s.s)+" = "+fmtV(r.s.v):"제출 안 함"}</small></span><span class="g">+${r.g}</span></div>`).join("")}</div>`}
  const mine=d.sub&&d.sub[ME.id],used=new Set(UI.tok.filter(t=>t.t==="n").map(t=>t.i)),v=evalExpr(UI.tok),str=UI.tok.map(t=>t.t==="n"?t.v:t.t==="o"?t.v:t.t).join(" ");
  return`${timerHTML()}<div class="target"><small>목표 수 · <span id="tsec"></span></small><b>${d.target}</b></div>
  ${out?`<p class="sub">탈락했어요. 다른 사람들이 푸는 걸 지켜봐요</p>`:`
  <div class="tiles">${d.nums.map((n,i)=>`<button class="tile" data-n="${i}" ${used.has(i)?"disabled":""}>${n}</button>`).join("")}</div>
  <div class="expr"><span>${esc(str)||'<span style="color:var(--mute);font-size:16px">카드와 기호를 눌러 식을 만드세요</span>'}</span><em class="${v==null&&UI.tok.length?"bad":""}">${UI.tok.length?(v==null?"식 미완성":"= "+fmtV(v)):""}</em></div>
  <div class="ops">${["+","-","×","÷","(",")"].map(o=>`<button class="op" data-o="${o}">${o==="-"?"−":o}</button>`).join("")}<button class="op" data-o="back" aria-label="지우기">⌫</button></div>
  <div class="row" style="margin-top:10px"><button class="btn" data-a="clr">다시</button><button class="btn pri" data-a="sub" ${v==null?"disabled":""}>제출</button></div>
  ${mine?`<p class="note">제출함: ${esc(mine.s)} = ${fmtV(mine.v)} · 시간 안엔 다시 내도 돼요</p>`:""}`}`;
}
function aucHTML(R,d,out){
  const coins=(d.coins||{})[ME.id]||0,pz=d.prizes||[2,3,5];
  const prz=`<div class="prize">${pz.map((p,i)=>`<span class="${i===d.lot&&G.phase!=="reveal"?"now":""}">${i+1}번 상품 ${p*R.x}칩</span>`).join("")}</div>`;
  const hist=(d.hist||[]).map((h,i)=>`<div class="rr"><span class="n">${i+1}번 상품 · ${h.w?`<b style="color:var(--gold)">${esc(nameOf(h.w))}</b> 낙찰 +${h.pr}칩`:"같은 값끼리 무효 · 낙찰 없음"}<br><small style="color:var(--mute);font-weight:400">${h.bids.map(b=>esc(nameOf(b.id))+" "+b.b).join(" · ")}</small></span></div>`).join("");
  if(G.phase==="reveal"||G.phase==="mid")return`<p class="ph">${R.ic} ${G.phase==="mid"?"공개!":"경매 결과"}</p>${prz}<div class="res">${hist}</div>${G.phase==="mid"?`<p class="note">곧 다음 상품…</p>`:""}`;
  const my=d.sub&&d.sub[ME.id];
  return`${timerHTML()}<p class="ph">${d.lot+1}번 상품 · ${pz[d.lot]*R.x}칩</p>${prz}<p class="sub">남은 동전 <b style="color:var(--gold)">${coins}</b>개 · <span id="tsec"></span> · 같은 값은 무효!</p>
  ${out?`<p class="sub">탈락했어요. 지켜보는 중</p>`:`<div class="bids">${Array.from({length:11},(_,i)=>`<button class="bid ${UI.bid===i||my===i&&UI.bid==null?"on":""}" data-b="${i}" ${i>coins?"disabled":""}>${i}</button>`).join("")}</div><button class="btn pri" data-a="bid" ${UI.bid==null?"disabled":""}>${my!=null?"다시 걸기":"몰래 걸기"}</button>${my!=null?`<p class="note">${my}개 걸었어요 · 남들은 몰라요</p>`:""}`}
  ${hist?`<div class="res">${hist}</div>`:""}`;
}
function minHTML(R,d,out){
  const q=d.qs?d.qs[Math.min(d.q,2)]:[];
  const hist=(d.hist||[]).map((h,i)=>`<div class="rr"><span class="n">${h.q.map((o,k)=>`${h.wins.includes(k)?"<b style='color:var(--gold)'>":""}${esc(o)} ${h.cnt[k]}명${h.wins.includes(k)?"</b>":""}`).join(" · ")}</span><span class="g">${h.wins.length?"+"+h.pts:"-"}</span></div>`).join("");
  if(G.phase==="reveal"||G.phase==="mid")return`<p class="ph">${R.ic} 공개!</p><p class="sub">가장 적은 쪽이 이겨요</p><div class="res">${hist}</div>`;
  const my=d.sub&&d.sub[ME.id];
  return`${timerHTML()}<p class="ph">질문 ${d.q+1} / 3</p><p class="sub">가장 적은 사람이 고를 쪽은? · <span id="tsec"></span></p>
  ${out?`<p class="sub">탈락했어요. 지켜보는 중</p>`:`<div class="choices">${q.map((o,k)=>`<button class="choice ${(UI.pick==null?my:UI.pick)===k?"on":""}" data-p="${k}">${esc(o)}<small>${(UI.pick==null?my:UI.pick)===k?"골랐어요":""}</small></button>`).join("")}</div>`}
  ${hist?`<div class="res">${hist}</div>`:""}`;
}
function vaultHTML(R,d,out){
  const hist=(d.hist||[]).map((h,i)=>`<div class="rr"><span class="n">${i+1}차 · ${h.out.map(o=>`${esc(nameOf(o.a))} ${o.ca==="steal"?"독차지":"나누기"}(+${o.ga}) vs ${esc(nameOf(o.b))} ${o.cb==="steal"?"독차지":"나누기"}(+${o.gb})`).join(" / ")}${h.rest?` · ${esc(nameOf(h.rest))} 쉼 +2`:""}</span></div>`).join("");
  if(G.phase==="reveal"||G.phase==="mid")return`<p class="ph">${R.ic} 금고가 열렸어요</p><div class="res">${hist}</div>${G.phase==="mid"?`<p class="note">짝을 바꿔 한 번 더…</p>`:""}`;
  const pair=(d.pairs||[]).find(p=>p.includes(ME.id)),opp=pair&&pair.find(x=>x!==ME.id),my=d.sub&&d.sub[ME.id],sel=UI.vc||my;
  return`${timerHTML()}<p class="ph">${d.r+1}차 금고</p><p class="sub"><span id="tsec"></span> · 채팅으로 약속해 보세요</p>
  ${out?`<p class="sub">탈락했어요. 지켜보는 중</p>`:d.rest===ME.id?`<p class="sub">이번엔 짝이 없어 쉬어요 · +2칩</p>`:`<div class="vs"><div class="av" style="background:${colOf(ME.id)}">${esc(nameOf(ME.id).slice(0,1))}</div><b>VS</b><div class="av" style="background:${colOf(opp)}">${esc(nameOf(opp).slice(0,1))}</div></div><p class="sub">상대: <b>${esc(nameOf(opp))}</b></p>
  <div class="vault"><button class="vbtn ${sel==="split"?"on":""}" data-v="split">🤝 나누기<small>둘 다 나누면 +3씩</small></button><button class="vbtn ${sel==="steal"?"on":""}" data-v="steal">😈 독차지<small>혼자면 +5 · 둘 다면 0</small></button></div>
  <table class="mtx"><tr><td></td><td>상대 나누기</td><td>상대 독차지</td></tr><tr><td>나 나누기</td><td>+3 / +3</td><td>0 / +5</td></tr><tr><td>나 독차지</td><td>+5 / 0</td><td>0 / 0</td></tr></table>`}
  ${hist?`<div class="res">${hist}</div>`:""}`;
}
function endHTML(){
  const r=G.players.slice().sort((a,b)=>(b.alive-a.alive)||(b.chips-a.chips));const w=r[0],mo=meP(),myRank=r.indexOf(mo)+1;
  return`<p class="ph">🏆 최종 결과</p><div class="elim"><div class="av" style="background:${w.col};animation:none">${esc(w.nick.slice(0,1))}</div><div class="big">${mo&&!mo.alive&&NET.solo?"탈락했어요":esc(w.nick)+" 우승!"}</div>${mo?`<p class="sub">내 순위 ${myRank}위 · ${mo.chips}칩</p>`:""}</div>
  <button class="btn" data-a="brag" style="margin:6px 0 10px">📣 결과 자랑하기</button><div class="res">${r.map((p,i)=>`<div class="rr ${i===0?"win":""}"><span class="dot" style="background:${p.col}">${i+1}</span><span class="n">${esc(p.nick)}${p.alive?"":" · 탈락"}</span><span class="g">${p.chips}칩</span></div>`).join("")}</div>
  ${NET.host?`<div class="row" style="margin-top:14px"><button class="btn pri" data-a="again">${NET.solo?"다시 도전":"한 판 더"}</button><button class="btn" data-a="home">나가기</button></div>`:`<div class="row" style="margin-top:14px"><button class="btn" data-a="home">나가기</button></div><p class="note">방장이 한 판 더를 누르면 다시 시작해요</p>`}`;
}
const QUICK=["좋아요 👍","나누기 할게요 🤝","믿어도 돼요","흠… 🤔","잘했어요 👏","한 판 더? 🔁"];
function chatHTML(){if(NET.solo||!G)return"";return`<div class="chat"><div class="log" id="clog">${UI.chat.map(c=>`<div><b style="color:${c.col}">${esc(c.n)}</b>${esc(c.s)}</div>`).join("")||'<div style="color:var(--mute)">방 채팅 · 이 방 사람만 봐요 · 저장 안 돼요</div>'}</div><div class="q">${QUICK.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div><form id="cf"><input id="cin" maxlength="60" autocomplete="off" placeholder="메시지"><button>보내기</button></form></div>`}
function addChat(c){if(!c||!c.s)return;UI.chat.push(c);UI.chat=UI.chat.slice(-40);const lg=$("#clog");if(lg){lg.insertAdjacentHTML("beforeend",`<div><b style="color:${esc(c.col)}">${esc(c.n)}</b>${esc(c.s)}</div>`);lg.scrollTop=lg.scrollHeight;const e=lg.querySelector('div[style*="mute"]');e&&e.remove()}sfx(900,.05)}
function sayChat(s){const p=meP();if(!p)return;act({t:"chat",s})}
function bind(){
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const i=+b.dataset.n;UI.tok.push({t:"n",v:G.d.nums[i],i});sfx(520,.04);render()});
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const o=b.dataset.o;if(o==="back")UI.tok.pop();else if(o==="("||o===")")UI.tok.push({t:o});else UI.tok.push({t:"o",v:o});sfx(420,.03);render()});
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{UI.bid=+b.dataset.b;render()});
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{UI.pick=+b.dataset.p;act({t:"pick",v:UI.pick});sfx(600,.05)});
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{UI.vc=b.dataset.v;act({t:"vc",v:UI.vc});sfx(600,.05)});
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>sayChat(b.dataset.q));
  const cf=$("#cf");cf&&(cf.onsubmit=e=>{e.preventDefault();const i=$("#cin");if(i.value.trim()){sayChat(i.value);i.value=""}});
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>doA(b.dataset.a));
}
function doA(a){
  if(a==="brag"){const r=G.players.slice().sort((a,b)=>(b.alive-a.alive)||(b.chips-a.chips)),me=meP(),k=r.indexOf(me)+1,t=`두뇌 서바이벌 ${G.players.length}명 중 ${k}위! (${me?me.chips:0}칩) 나랑 붙어 볼래요?`,url=location.origin+"/brain/";if(navigator.share)navigator.share({title:"두뇌 서바이벌",text:t,url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t+" "+url);toast("복사했어요")}}
  if(a==="clr"){UI.tok=[];render()}
  if(a==="sub"){const s=UI.tok.map(t=>t.t==="n"?t.v:t.t==="o"?t.v:t.t).join("");act({t:"sub",tok:UI.tok,s});toast("제출했어요");sfx(780,.08)}
  if(a==="bid"&&UI.bid!=null){act({t:"bid",v:UI.bid});toast(UI.bid+"개 걸었어요");sfx(700,.06)}
  if(a==="bots"&&NET.host){addBots(6-G.players.length);push()}
  if(a==="start"&&NET.host){startGame()}
  if(a==="again"&&NET.host){G.players.forEach(p=>Object.assign(p,{alive:1,chips:0,last:0}));G.ri=-1;if(NET.solo)startGame();else{G.phase="lobby";push()}}
  if(a==="home"){leave();location.href="/brain/"}
  if(a==="share"){const url=location.origin+"/brain/?r="+G.code,t="두뇌 서바이벌 같이 해요! 방 코드 "+G.code;if(navigator.share)navigator.share({title:"두뇌 서바이벌",text:t,url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t+" "+url);toast("링크를 복사했어요")}}
}
function leave(){if(!NET.solo&&NET.ch){send({k:"bye",id:ME.id});try{NET.sb.removeChannel(NET.ch)}catch(e){}}}
window.addEventListener("pagehide",leave);

/* ---------------- 첫 화면 ---------------- */
function renderHome(){
  const r=new URLSearchParams(location.search).get("r")||"";
  app.innerHTML=`<div class="top"><a href="/">‹ 오락실</a></div>
  <div class="hero"><h1>두뇌 서바이벌</h1><p>최대 6명 · 5라운드 · 라운드마다 꼴찌는 탈락</p></div>
  <div class="games">${ROUNDS.slice(0,4).map(R=>`<div class="gm"><i>${R.ic}</i><b>${esc(R.n)}</b><small>${esc(R.rule)}</small></div>`).join("")}</div>

  <div class="row" style="margin-top:10px"><input class="in" id="jc" maxlength="4" placeholder="방 코드 4자리" value="${esc(r.toUpperCase())}" autocapitalize="characters" style="text-transform:uppercase"><button class="btn" id="jn" style="max-width:120px">들어가기</button></div>
  <button class="btn gold" id="solo" style="margin-top:10px">혼자 하기 · 컴퓨터 5명과</button>
  <p class="note">방 채팅은 이 방 사람만 봐요 · 대화는 저장되지 않아요</p>
  <p class="foot"><a href="/">틈새 오락실</a> · 설치 없이 바로</p>`;
  const nk=$("#nk"),getNick=()=>{const n=cleanNick(nk.value);if(n.length<2){toast("이름을 2자 이상 적어 주세요");nk.focus();return null}ME.nick=n;lsSet("hanpan.me.nick",n);return n};
  $("#mk").onclick=async()=>{if(!getNick())return;const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[rnd(32)]).join("");NET.code=code;NET.host=true;$("#mk").disabled=true;try{await joinChannel(code)}catch(e){toast("연결하지 못했어요. 잠시 뒤 다시 해 주세요");$("#mk").disabled=false;return}G=newG();G.code=code;hostJoin(ME.id,ME.nick);history.replaceState(null,"","/brain/?r="+code)};
  $("#jn").onclick=async()=>{if(!getNick())return;const code=($("#jc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length!==4)return toast("방 코드 4자리를 넣어 주세요");NET.code=code;NET.host=false;$("#jn").disabled=true;try{await joinChannel(code)}catch(e){toast("연결하지 못했어요");$("#jn").disabled=false;return}send({k:"hello",id:ME.id,nick:ME.nick});toast("방을 찾는 중…");setTimeout(()=>{if(!G){toast("방을 찾지 못했어요. 코드를 확인해 주세요");$("#jn").disabled=false}},6000)};
  $("#solo").onclick=()=>{if(!getNick())return;NET.solo=true;NET.host=true;G=newG();G.players.push({id:ME.id,nick:ME.nick,bot:0,alive:1,chips:0,last:0,col:COLS[0]});addBots(5);startGame()};
}
render();
</script>
