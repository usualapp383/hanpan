t see)",ja:"ボールが来る場所を予想してゴールをタップ（相手には見えません）",zh:"预判球的方向并点击球门（对手看不到）"},"끝없이: 차기 · 막기를 번갈아 한 번도 안 놓치고 몇 번까지 이어 갈 수 있을까? · 대결: 5번씩 번갈아 차서 골을 더 많이 넣으면 승리 (동점이면 서든데스).":{en:"Endless: alternate kicking and saving without a single miss — how long can you go? · Match: take 5 kicks each; more goals wins (sudden death on a tie).",ja:"エンドレス：キックとセーブを交互に、一度も失敗せずに何回続けられる？· 対決：5本ずつ蹴ってゴールが多い方の勝ち（同点ならサドンデス）。",zh:"无尽：轮流射门和扑救，一次都不失误能坚持多久？· 对决：各踢5球，进球多者胜（平局则突然死亡）。"},"낮으면 정확도 ↓ · 교체해서 쉬게":{en:"Low = less accuracy · Swap to rest",ja:"低いと精度↓ · 交代して休ませよう",zh:"体力低精度↓ · 换人休息"},"노릴 곳 · 막을 곳":{en:"Aim spot · Dive spot",ja:"狙う場所 · 守る場所",zh:"瞄准位置 · 扑救位置"},"노릴 곳 옮기기":{en:"Move aim",ja:"狙いを動かす",zh:"移动瞄准"},"누르고 떼서 차기":{en:"Hold & release to kick",ja:"押して離して蹴る",zh:"按住松开射门"},"누적 골":{en:"Total goals",ja:"累計ゴール",zh:"累计进球"},"대포알 준호":{en:"Cannon Junho",ja:"大砲のジュノ",zh:"炮弹俊浩"},"마술사 하린":{en:"Magician Harin",ja:"魔術師ハリン",zh:"魔术师夏琳"},"막을 곳을 고르세요!":{en:"Pick your dive spot!",ja:"守る場所を選んで！",zh:"选择扑救位置！"},"막을 때: 공이 날아오는 바로 그 지점을 골문에서 누르면 골키퍼가 몸을 날려요.":{en:"Saving: tap the exact spot on the goal where the ball is heading and your keeper dives there.",ja:"セーブ：ボールが飛んでくるまさにその場所をゴールでタップすると、キーパーが飛びつきます。",zh:"扑救：在球门上点击球飞来的位置，门将就会扑过去。"},"모르는 사람과 바로 · 방 코드로 친구와":{en:"Strangers instantly · Friends by room code",ja:"知らない人とすぐ · ルームコードで友だちと",zh:"与陌生人即时对战 · 用房间码和朋友"},"모르는 사람과 바로 붙거나, 방 코드를 친구에게 보내 서로 다른 폰에서 한 판! 5번씩 번갈아 차고, 막을 곳은 상대 몰래 골라요. 방을 만든 사람이 먼저 차요.":{en:"Match up with someone instantly, or send a room code to a friend and play on separate phones! Take 5 kicks each, and pick your dive spot secretly. The room creator kicks first.",ja:"知らない人とすぐ対戦、またはルームコードを友だちに送って別々のスマホで一局！5本ずつ交互に蹴り、守る場所は相手に内緒で選びます。ルームを作った人が先に蹴ります。",zh:"可立即与陌生人对战，或把房间码发给朋友用各自的手机来一局！各踢5球，扑救位置要偷偷选。创建房间的人先踢。"},"바람 서아":{en:"Breeze Seoa",ja:"風のソア",zh:"清风瑞雅"},"번개 태오":{en:"Bolt Taeo",ja:"稲妻のテオ",zh:"闪电泰吾"},"불꽃 관통!":{en:"Blazed through!",ja:"炎が貫通！",zh:"火焰穿透！"},"불꽃 지후":{en:"Blaze Jihu",ja:"炎のジフ",zh:"火焰智厚"},"불꽃슛은 지고 있을 때나 서든데스 결정타로 아껴 두세요.":{en:"Save the Fire Shot for when you're behind or for a sudden-death finisher.",ja:"炎シュートは負けている時やサドンデスの決め手に取っておこう。",zh:"把火焰射门留到落后时或突然死亡的决胜时刻。"},"빠르고 강력 · 절반은 손을 뚫음":{en:"Fast and powerful · Burns through half the time",ja:"速くて強力 · 半分は手を貫通",zh:"又快又猛 · 一半几率穿透扑救"},"상대 기다리는 중":{en:"Waiting for opponent",ja:"相手を待っています",zh:"等待对手"},"상대가 고르는 중…":{en:"Opponent is choosing…",ja:"相手が選んでいます…",zh:"对手正在选择…"},"상대를 기다리는 중… 방 코드를 친구에게 보내세요":{en:"Waiting for an opponent… Send the room code to a friend",ja:"相手を待っています… ルームコードを友だちに送ってね",zh:"等待对手中… 把房间码发给朋友吧"},"선수 교체":{en:"Swap Player",ja:"選手交代",zh:"换人"},"선수단 8명: 선수마다 킥력(공 속도)과 정확도가 달라요. 🔄 버튼으로 언제든 교체! 같은 선수가 계속 차면 체력이 떨어져 정확도가 나빠지고, 쉬는 선수는 체력이 회복돼요.":{en:"8-player squad: each player has different kick power (ball speed) and accuracy. Swap anytime with 🔄! A player who keeps kicking loses stamina and accuracy, while resting players recover.",ja:"選手8人：選手ごとにキック力（ボールの速さ）と正確さが違います。🔄でいつでも交代！同じ選手が蹴り続けると体力が落ちて精度が下がり、休んでいる選手は回復します。",zh:"8人阵容：每名球员的脚力（球速）和精准度都不同。随时用🔄换人！同一球员连续踢会消耗体力、精准度下降，休息的球员会恢复体力。"},"아래 누르고 떼기":{en:"Hold below & release",ja:"下を押して離す",zh:"按住下方再松开"},"온라인 승부차기":{en:"Online Penalty Shootout",ja:"オンラインPK戦",zh:"在线点球大战"},"정확":{en:"ACC",ja:"正確",zh:"精准"},"정확도 높은 선수로 구석을, 킥력 센 선수로 정면 강슛을!":{en:"Use accurate players for the corners and powerful ones for blasts down the middle!",ja:"正確な選手で隅を、キック力の強い選手で正面に強シュートを！",zh:"精准球员打角落，脚力强的球员正面重炮！"},"정확한 킥":{en:"Accurate kick",ja:"正確なキック",zh:"精准射门"},"찰 때: 골문을 눌러 노릴 곳을 정하고, 아래를 누르고 있다가 힘 게이지가 초록 칸일 때 떼세요. 구석일수록 막기 어렵지만 빗나가기 쉬워요. 빨간 칸에서 떼면 넘어가거나 약해져요.":{en:"Kicking: tap the goal to choose your aim, then hold below and release when the power gauge is in the green. Corners are harder to save but easier to miss. Releasing in the red sends it over or makes it weak.",ja:"キック：ゴールをタップして狙いを決め、下を押し続けて力ゲージが緑のときに離そう。隅ほど止められにくいけど外れやすい。赤で離すと枠を越えたり弱くなったりします。",zh:"射门：点击球门选择瞄准点，然后按住下方，力量条在绿色区时松开。越靠角落越难扑但也越容易偏。在红色区松开会打飞或太轻。"},"체력":{en:"STA",ja:"体力",zh:"体力"},"체력 막대":{en:"Stamina bar",ja:"体力バー",zh:"体力条"},"체력이 반 아래로 떨어지면 바로 교체하세요.":{en:"Swap as soon as stamina drops below half.",ja:"体力が半分を切ったらすぐ交代しよう。",zh:"体力低于一半就马上换人。"},"칼날 민지":{en:"Blade Minji",ja:"刃のミンジ",zh:"利刃敏智"},"황금발 루카":{en:"Golden Luka",ja:"黄金の足ルカ",zh:"金足卢卡"},"힘 조절해서 차기":{en:"Control your power",ja:"力を調節して蹴る",zh:"控制力度射门"},"🌐 온라인 승부차기":{en:"🌐 Online Penalty Shootout",ja:"🌐 オンラインPK戦",zh:"🌐 在线点球大战"},"🌐 온라인 승부차기: 모르는 사람과 빠른 매칭하거나 방 코드로 친구와. 차는 쪽이 슛을 하는 동안 막는 쪽은 막을 곳을 상대 몰래 골라요.":{en:"🌐 Online Penalty Shootout: quick-match a stranger or play a friend with a room code. While the kicker shoots, the keeper secretly picks where to dive.",ja:"🌐 オンラインPK戦：知らない人とクイックマッチ、またはルームコードで友だちと。キッカーがシュートする間、キーパーは相手に内緒で守る場所を選びます。",zh:"🌐 在线点球大战：快速匹配陌生人或用房间码和朋友对战。射手射门时，门将偷偷选择扑救位置。"},"🎉 새 선수 합류:":{en:"🎉 New player joined:",ja:"🎉 新しい選手が加入：",zh:"🎉 新球员加入："},"🔄 선수 버튼":{en:"🔄 Player button",ja:"🔄 選手ボタン",zh:"🔄 球员按钮"},"🔥 버튼":{en:"🔥 Button",ja:"🔥 ボタン",zh:"🔥 按钮"},"🔥 불꽃슛 쓰기":{en:"🔥 Use Fire Shot",ja:"🔥 炎シュート",zh:"🔥 使用火焰射门"},"🔥 불꽃슛 준비 완료!":{en:"🔥 Fire Shot ready!",ja:"🔥 炎シュート準備OK！",zh:"🔥 火焰射门准备完毕！"},"🔥 불꽃슛: 골을 넣으면 +34%, 선방하면 +50% 게이지가 차요. 가득 차면 불꽃슛 버튼을 켜고 차세요. 아주 빠르고, 골키퍼 손에 맞아도 절반은 뚫고 들어가요. 상대 CPU도 가끔 불꽃슛을 써요!":{en:"🔥 Fire Shot: goals add +34% and saves add +50% to the meter. When it's full, turn on the Fire Shot button and kick. It's blazing fast, and half the time it burns right through the keeper's hands. The CPU uses it sometimes too!",ja:"🔥 炎シュート：ゴールで+34%、セーブで+50%ゲージがたまります。満タンになったら炎シュートボタンをオンにして蹴ろう。とても速く、キーパーの手に当たっても半分は貫通します。CPUもときどき使ってきます！",zh:"🔥 火焰射门：进球+34%，扑救+50%充能。充满后打开火焰射门按钮再射。速度极快，即使碰到门将的手也有一半几率穿透。CPU偶尔也会使用！"},"⚡ 90초! 짝 하나 +2초 · 한 판 깨면 +20초":{en:"⚡ 90 seconds! +2s per pair · +20s per board",ja:"⚡ 90秒！1組+2秒 · 1面クリアで+20秒",zh:"⚡ 90秒！每对+2秒 · 每清一盘+20秒"},"⚡ 고수 도전 ·":{en:"⚡ Expert Challenge ·",ja:"⚡ 達人チャレンジ ·",zh:"⚡ 高手挑战 ·"},"⚡ 고수 도전 · 판이 무너져요":{en:"⚡ Expert · The board collapses!",ja:"⚡ 達人チャレンジ · 盤が崩れる！",zh:"⚡ 高手挑战 · 棋盘会坍塌！"},"⚡ 고수 도전: 90초에서 시작해 짝 하나 +2초(3연속부터 +3초), 한 판 비우면 +20초. 판은 점점 커지고, 2판부터는 짝을 맞출 때마다 남은 패가 아래 · 왼쪽 · 위 · 오른쪽으로 무너져 내려요. 힌트 -10초, 섞기 -5초. 몇 쌍까지 맞출 수 있을까?":{en:"⚡ Expert Challenge: start with 90 seconds, +2s per pair (+3s from a 3-combo), +20s per cleared board. Boards keep getting bigger, and from board 2 the remaining tiles collapse down · left · up · right after every match. Hint -10s, shuffle -5s. How many pairs can you match?",ja:"⚡ 達人チャレンジ：90秒から始まり、1組+2秒（3連続から+3秒）、1面クリアで+20秒。盤はどんどん大きくなり、2面目からは組を消すたびに残りの牌が下 · 左 · 上 · 右に崩れます。ヒント-10秒、シャッフル-5秒。何組消せるかな？",zh:"⚡ 高手挑战：从90秒开始，每对+2秒（3连击起+3秒），每清一盘+20秒。棋盘越来越大，从第2盘起每次配对后剩余牌会向下 · 左 · 上 · 右坍塌。提示-10秒，洗牌-5秒。你能配多少对？"},"➡ 오른쪽으로 무너져요":{en:"➡ Collapsing right",ja:"➡ 右に崩れます",zh:"➡ 向右坍塌"},"⬅ 왼쪽으로 무너져요":{en:"⬅ Collapsing left",ja:"⬅ 左に崩れます",zh:"⬅ 向左坍塌"},"⬆ 위로 무너져요":{en:"⬆ Collapsing up",ja:"⬆ 上に崩れます",zh:"⬆ 向上坍塌"},"⬇ 아래로 무너져요":{en:"⬇ Collapsing down",ja:"⬇ 下に崩れます",zh:"⬇ 向下坍塌"},"무너짐":{en:"collapse",ja:"崩れ",zh:"坍塌"},"쌍":{en:" pairs",ja:"組",zh:"对"},"쌍 맞췄어요 ·":{en:"pairs matched ·",ja:"組そろえました ·",zh:"对已配对 ·"},"(대기실에서 영구 강화)":{en:"(spend it on permanent upgrades in the lobby)",ja:"（ロビーで永久強化）",zh:"（在大厅永久强化）"},"1분마다 금빛 정예 몬스터가 나와요. 잡으면 보물 상자 📦 — 열면 강화(진화 포함)를 하나 더 골라요.":{en:"A golden elite monster appears every minute. Defeat it for a treasure chest 📦 — open it to pick one more upgrade (evolutions included).",ja:"1分ごとに金色のエリートモンスターが出現。倒すと宝箱📦 — 開けると強化（進化含む）をもう1つ選べます。",zh:"每分钟出现金色精英怪物。击败后掉落宝箱📦 — 打开可再选一个强化（含进化）。"},"90초마다 몬스터 무리가 사방에서 몰려오고, 3분마다 왕관 쓴 보스가 나와요. 시간이 갈수록 돌 골렘 · 해골 궁수(화살을 쏨) · 왕슬라임(잡으면 셋으로 갈라짐)도 나와요.":{en:"Every 90 seconds a horde swarms in from all sides, and every 3 minutes a crowned boss appears. Over time Stone Golems · Skeleton Archers (they shoot arrows) · King Slimes (split into three when defeated) join in.",ja:"90秒ごとにモンスターの群れが四方から押し寄せ、3分ごとに王冠のボスが登場。時間がたつと石ゴーレム · 骸骨アーチャー（矢を撃つ）· キングスライム（倒すと3つに分裂）も出てきます。",zh:"每90秒怪物群从四面八方涌来，每3分钟出现戴王冠的首领。随着时间推移，还会出现石头魔像 · 骷髅弓手（会射箭）· 史莱姆王（被击败后分裂成三只）。"},"✨ 정예 몬스터 출현! 보물 상자를 떨궈요":{en:"✨ Elite monster! It drops a treasure chest",ja:"✨ エリート出現！宝箱を落とします",zh:"✨ 精英怪物出现！会掉落宝箱"},"✨ 진화!":{en:"✨ Evolved!",ja:"✨ 進化！",zh:"✨ 进化！"},"✨ 진화: 무기가 6레벨이 되고 짝꿍 강화를 하나라도 가지면 금빛 진화 카드가 나와요. 화살+집중 → 천둥 화살비 · 구슬+가벼운 발 → 은하 고리 · 번개+힘 → 천벌 · 불꽃 고리+튼튼한 몸 → 용암 대지 · 도끼+자석 → 회오리 도끼 · 단검+행운 → 천검 · 폭탄+범위 → 대폭발 · 얼음+갑옷 → 빙하 시대.":{en:"✨ Evolution: once a weapon reaches Lv 6 and you own at least one of its partner upgrades, a golden evolution card appears. Arrow+Focus → Thunder Arrow Storm · Orb+Light Feet → Galaxy Ring · Lightning+Power → Divine Wrath · Fire Ring+Tough Body → Lava Field · Axe+Magnet → Whirlwind Axes · Dagger+Luck → Thousand Blades · Bomb+Area → Big Bang · Ice+Armor → Ice Age.",ja:"✨ 進化：武器がLv6になり、相棒の強化を1つでも持っていると金色の進化カードが出ます。矢+集中 → 雷の矢の雨 · 玉+軽い足 → 銀河のリング · 雷+力 → 天罰 · 炎の輪+丈夫な体 → 溶岩の大地 · 斧+磁石 → つむじ風の斧 · 短剣+幸運 → 千本の剣 · 爆弾+範囲 → 大爆発 · 氷+鎧 → 氷河期。",zh:"✨ 进化：武器达到Lv6且拥有至少一个搭档强化时，会出现金色进化卡。箭+专注 → 雷霆箭雨 · 宝珠+轻盈步伐 → 银河环 · 闪电+力量 → 天罚 · 火环+强健体魄 → 熔岩大地 · 斧头+磁铁 → 旋风斧 · 匕首+幸运 → 千剑 · 炸弹+范围 → 大爆炸 · 冰+护甲 → 冰河时代。"},"갑옷":{en:"Armor",ja:"鎧",zh:"护甲"},"공격력 +6%":{en:"Attack +6%",ja:"攻撃力 +6%",zh:"攻击力 +6%"},"광역 공격 범위 +10%":{en:"Area attack size +10%",ja:"範囲攻撃の広さ +10%",zh:"范围攻击 +10%"},"구슬 6개 · 더 넓고 빠르게 · 피해 2배":{en:"6 orbs · Wider and faster · 2× damage",ja:"玉6個 · より広く速く · ダメージ2倍",zh:"6颗宝珠 · 更大更快 · 伤害2倍"},"금화가 400개 모이면 부활 1회를 꼭 사 두세요.":{en:"Once you have 400 gold, be sure to buy the one-time revive.",ja:"金貨が400枚たまったら、復活1回を必ず買っておこう。",zh:"攒够400金币一定要买一次复活。"},"금화로 해금":{en:"Unlock with gold",ja:"金貨で解放",zh:"用金币解锁"},"냉기 지대 2배 · 얼어붙은 적 피해 3배":{en:"Frost zone 2× · 3× damage to frozen enemies",ja:"冷気ゾーン2倍 · 凍った敵にダメージ3倍",zh:"冰冻区域2倍 · 对冻结敌人伤害3倍"},"단검":{en:"Dagger",ja:"短剣",zh:"匕首"},"단검 8방향 동시 투척 · 관통":{en:"Throws daggers in 8 directions at once · Piercing",ja:"短剣を8方向に同時投げ · 貫通",zh:"同时向8个方向投掷匕首 · 穿透"},"대폭발":{en:"Big Bang",ja:"大爆発",zh:"大爆炸"},"도끼 6자루가 사방으로":{en:"6 axes fly out in every direction",ja:"斧6本が四方へ",zh:"6把斧头飞向四面八方"},"레벨 업마다 카드 3장 중 하나를 골라요. 무기 8종 중 최대 5종까지, 각각 6레벨까지 강해져요.":{en:"Each level-up, pick 1 of 3 cards. Carry up to 5 of the 8 weapons, each upgradable to Lv 6.",ja:"レベルアップごとにカード3枚から1枚を選びます。武器8種のうち最大5種まで、それぞれLv6まで強化できます。",zh:"每次升级从3张卡中选1张。8种武器最多携带5种，每种最高强化到Lv6。"},"멀리서 화살 · 피하세요":{en:"Shoots arrows from afar · Dodge them",ja:"遠くから矢 · よけて",zh:"远程射箭 · 快躲开"},"몬스터가 떨군 🪙 금화는 판이 끝나도 남아요. 대기실에서 체력 · 공격력 · 이동 속도 · 자석 · 부활 · 경험치를 영구 강화하고, 시작 무기도 해금해요.":{en:"🪙 Gold dropped by monsters stays after the run. In the lobby, permanently upgrade HP · Attack · Speed · Magnet · Revive · XP, and unlock starting weapons.",ja:"モンスターが落とした🪙金貨はゲーム後も残ります。ロビーで体力 · 攻撃力 · 移動速度 · 磁石 · 復活 · 経験値を永久強化し、最初の武器も解放できます。",zh:"怪物掉落的🪙金币在游戏结束后也会保留。可在大厅永久强化体力 · 攻击力 · 移动速度 · 磁铁 · 复活 · 经验，并解锁初始武器。"},"받는 피해 -8%":{en:"Damage taken -8%",ja:"受けるダメージ -8%",zh:"受到伤害 -8%"},"발밑에 놓으면 잠시 뒤 크게 폭발":{en:"Dropped at your feet, then explodes big",ja:"足元に置くと少しして大爆発",zh:"放在脚下，片刻后大爆炸"},"범위":{en:"Area",ja:"範囲",zh:"范围"},"벼락 5줄기 · 맞은 자리 연쇄 폭발":{en:"5 lightning bolts · Chain explosions where they hit",ja:"雷5本 · 落ちた場所で連鎖爆発",zh:"5道闪电 · 落点连锁爆炸"},"보상:":{en:"Reward:",ja:"報酬：",zh:"奖励："},"부활 1회":{en:"1 Revive",ja:"復活1回",zh:"复活1次"},"불꽃 고리 범위 1.5배 · 피해 2배":{en:"Fire ring 1.5× size · 2× damage",ja:"炎の輪の範囲1.5倍 · ダメージ2倍",zh:"火环范围1.5倍 · 伤害2倍"},"빙하 시대":{en:"Ice Age",ja:"氷河期",zh:"冰河时代"},"새내기":{en:"Rookie",ja:"新人",zh:"新手"},"선택":{en:"Select",ja:"選択",zh:"选择"},"시작 무기":{en:"Starting weapon",ja:"最初の武器",zh:"初始武器"},"영구 강화에 써요":{en:"Used for permanent upgrades",ja:"永久強化に使います",zh:"用于永久强化"},"오락실 고수":{en:"Arcade Pro",ja:"ゲーセンの達人",zh:"街机高手"},"오락실 지배자":{en:"Arcade Ruler",ja:"ゲーセンの支配者",zh:"街机统治者"},"용암 대지":{en:"Lava Field",ja:"溶岩の大地",zh:"熔岩大地"},"움직이기만 하세요, 공격은 무기가 알아서! 레벨업마다 3장 중 1장을 골라 나만의 조합을 만들고, 무기를 금빛으로 진화시키세요. 모은 금화로 영구 강화까지.":{en:"Just move — your weapons attack on their own! Pick 1 of 3 cards each level-up to build your combo, evolve weapons into gold, and spend collected gold on permanent upgrades.",ja:"動くだけでOK、攻撃は武器におまかせ！レベルアップごとに3枚から1枚を選んで自分だけの組み合わせを作り、武器を金色に進化させよう。集めた金貨で永久強化も。",zh:"只管移动，武器会自动攻击！每次升级3选1打造专属组合，把武器进化成金色，还能用金币永久强化。"},"움직이는 방향으로 빠르게 연속 투척":{en:"Rapid throws in the direction you move",ja:"移動方向に素早く連続投げ",zh:"朝移动方向快速连续投掷"},"은하 고리":{en:"Galaxy Ring",ja:"銀河のリング",zh:"银河环"},"자석 범위 +15%":{en:"Magnet range +15%",ja ,ja:"メンコ返し",zh:"拍纸板"},"딴 딱지 중 가장 두꺼운 딱지로 싸워요 — 두꺼울수록 상대가 못 넘겨요":{en:"You play with the thickest ddakji you've won — thicker is harder to flip",ja:"勝ち取った中で一番厚いメンコで戦います — 厚いほど返されにくい",zh:"用赢来的最厚的纸板对战 — 越厚越难被翻"},"땅에 떨어지면 끝 · 15개부터 바람이 불어요":{en:"Game over if it hits the ground · Wind starts at 15",ja:"地面に落ちたら終わり · 15回から風が吹きます",zh:"落地就结束 · 15个后开始刮风"},"떨어지는 제기 밑을 눌러 발로 톡! 땅에 떨어뜨리지 않고 몇 번까지 찰 수 있을까요? 발에 가까울 때 차면 명중, 바람이 불면 제기가 흔들려요. 기록을 세우면 새 제기가 열려요.":{en:"Tap under the falling jegi to kick it! How many kicks can you keep it off the ground? Kick it close to the foot for a perfect hit; wind makes it sway. New records unlock new jegi.",ja:"落ちてくるチェギの下をタップして足でポン！地面に落とさず何回蹴れるかな？足の近くで蹴ると命中、風が吹くとチェギが揺れます。記録を更新すると新しいチェギが開きます。",zh:"点击下落毽子的下方用脚踢！不让它落地能踢几个？靠近脚时踢就是命中，起风时毽子会摇晃。创造纪录可解锁新毽子。"},"마지막 상대! 이기면 딱지왕":{en:"Final opponent! Win to become Ddakji King",ja:"最後の相手！勝てばメンコ王",zh:"最后的对手！赢了就是纸板王"},"먼저 넘기는 쪽이 이겨요":{en:"First to flip wins",ja:"先に返した方の勝ち",zh:"先翻过来的赢"},"먼저 상대 딱지를 넘기는 쪽이 이겨요 · 이기면 그 딱지를 가져와요":{en:"First to flip the other's ddakji wins · The winner takes that ddakji",ja:"先に相手のメンコを返した方の勝ち · 勝つとそのメンコをもらえます",zh:"先翻过对方纸板的赢 · 赢了就能拿走那张纸板"},"멀리 뛰어가기보다 제기 바로 밑에서 기다렸다 차는 게 명중이 많아요.":{en:"Waiting right under the jegi beats running far — you'll land more perfect hits.",ja:"遠くへ走るより、チェギの真下で待って蹴る方が命中が増えます。",zh:"与其跑远，不如在毽子正下方等着踢，命中更多。"},"명 꺾음 · 던진 횟수":{en:" beaten · Throws",ja:" 人に勝利 · 投げた回数",zh:"人被击败 · 投掷次数"},"못 넘기면 상대 차례 — 상대가 먼저 내 딱지를 넘기면 끝나요.":{en:"Miss and it's their turn — if they flip yours first, it's over.",ja:"返せなければ相手の番 — 相手が先に自分のメンコを返したら終わり。",zh:"没翻过来就轮到对方——对方先翻了我的纸板就结束。"},"문방구 형":{en:"Stationery-Shop Bro",ja:"文房具屋のお兄さん",zh:"文具店大哥"},"물방울":{en:"Polka dots",ja:"水玉",zh:"圆点"},"바람이 불면 제기가 흘러가는 쪽으로 한 발 먼저 가 있으세요.":{en:"When the wind blows, step ahead toward where the jegi drifts.",ja:"風が吹いたら、チェギが流れる方へ一歩先に動きましょう。",zh:"起风时，提前往毽子飘去的方向挪一步。"},"별 딱지":{en:"Star ddakji",ja:"星のメンコ",zh:"星星纸板"},"상대 딱지 두께":{en:"Rival thickness",ja:"相手のメンコの厚さ",zh:"对方纸板厚度"},"상대 딱지를 먼저 넘겨 이기고, 동네 고수 8명을 차례로 꺾으세요. 몇 연승까지 갈 수 있을까요?":{en:"Flip your rival's ddakji first to win, and beat all 8 neighborhood pros in a row. How long can your streak go?",ja:"相手のメンコを先に返して勝ち、近所の達人8人を順番に倒そう。何連勝できるかな？",zh:"先翻过对方纸板取胜，依次击败8位街坊高手。你能连胜多少场？"},"승":{en:"wins",ja:"勝",zh:"胜"},"아깝다! 들썩했어요":{en:"So close! It lifted",ja:"惜しい！浮きました",zh:"可惜！翘起来了"},"아이 옮기기":{en:"Move the kid",ja:"子どもを動かす",zh:"移动小孩"},"얇은 딱지":{en:"Thin ddakji",ja:"薄いメンコ",zh:"薄纸板"},"옆 동네 고수":{en:"Next-Town Pro",ja:"隣町の達人",zh:"邻村高手"},"왕관 딱지 · 가장 두꺼움":{en:"Crown ddakji · Thickest",ja:"王冠のメンコ · 一番厚い",zh:"王冠纸板 · 最厚"},"우리 반 반장":{en:"Class President",ja:"学級委員長",zh:"班长"},"움직이는 조준점을 눌러 칠 곳을 정하고, 힘 게이지를 눌러 탁! 진짜 딱지처럼 가운데를 치면 꿈쩍도 안 하고 모서리 가까이를 세게 쳐야 넘어가요. 동네 꼬마부터 전설의 딱지왕까지 8명을 꺾고 딴 딱지를 모으세요.":{en:"Tap the moving reticle to pick your spot, then tap the power gauge — slam! Just like real ddakji, the center won't budge; hit hard near the edge to flip it. Beat 8 rivals from the Little Kid to the Legendary Ddakji King and collect the ddakji you win.",ja:"動く照準をタップして狙いを決め、パワーゲージをタップしてバン！本物のメンコのように真ん中ではびくともせず、角の近くを強く打つと返ります。近所のちびっこから伝説のメンコ王まで8人を倒して、勝ち取ったメンコを集めよう。",zh:"点击移动的准星选位置，再点力度条——啪！和真的纸板一样，打中间纹丝不动，要用力打靠近边角处才能翻过来。从邻家小孩到传奇纸板王击败8人，收集赢来的纸板。"},"이기면 상대 딱지를 가져와요. 가장 두꺼운 딱지로 싸우니 상대가 넘기기 어려워져요.":{en:"Win and you take their ddakji. You play with your thickest one, so it gets harder for rivals to flip.",ja:"勝つと相手のメンコをもらえます。一番厚いメンコで戦うので、相手が返しにくくなります。",zh:"赢了就拿走对方的纸板。用最厚的纸板对战，对方更难翻过来。"},"전설의 딱지왕":{en:"Legendary Ddakji King",ja:"伝説のメンコ王",zh:"传奇纸板王"},"제기 밑에서 차기":{en:"Kick from under the jegi",ja:"チェギの下で蹴る",zh:"在毽子下方踢"},"제기 밑을 누르기":{en:"Tap under the jegi",ja:"チェギの下をタップ",zh:"点击毽子下方"},"제기 밑을 눌러 톡!":{en:"Tap under the jegi to kick!",ja:"チェギの下をタップしてポン！",zh:"点击毽子下方踢！"},"제기가 떨어지는 쪽을 누르면 달려가서 톡 차요":{en:"Tap where the jegi is falling to run over and kick",ja:"チェギが落ちる方をタップすると走っていって蹴ります",zh:"点击毽子落下的方向，小孩会跑过去踢"},"제기가 떨어지는 쪽을 누르면 아이가 달려가서 발로 톡 차요.":{en:"Tap where the jegi is falling and the kid runs over and kicks it.",ja:"チェギが落ちる方をタップすると、子どもが走っていって足で蹴ります。",zh:"点击毽子落下的方向，小孩会跑过去用脚踢。 "Draw the whole dot-and-line picture in one stroke without tracing any line twice. At the last stage of each chapter, draw a hanbok and the lady wears it.",ja:"点と線でできた絵を、同じ線を二度なぞらずに一筆ですべて描きましょう。各章の最後の段階で韓服を描くと、お嬢さんが着ます。",zh:"不重复经过同一条线,一笔画完由点和线组成的图。每章最后一关画出一套韩服,小姐就会穿上。"},"· '의견 보내기'로 닉네임과 기록한 게임 · 대략의 날짜를 알려 주시면 확인 뒤 10일 안에 지워 드려요(같은 닉네임이 여럿일 수 있어요).":{en:"· Send your nickname, the game and roughly when you played via 'Send feedback', and we'll verify and delete it within 10 days (several people may share a nickname).",ja:"· 「ご意見を送る」でニックネームと記録したゲーム・おおよその日付をお知らせいただければ、確認のうえ10日以内に削除します(同じニックネームが複数いる場合があります)。",zh:"· 通过「发送意见」告诉我们昵称、记录的游戏和大致日期,核实后10天内删除(可能有多人使用同一昵称)。"},"· 광고 없애기":{en:" · Remove ads",ja:" · 広告を消す",zh:" · 去除广告"},"· 전체 순위(닉네임 · 점수 · 나라), 이용 통계(이름 · 이메일 없이 기기 구분용 무작위 번호로 묶어요), 직접 보낸 의견, 로그인했다면 이메일과 기록 저장본.":{en:"· Global rankings (nickname · score · country), usage stats (grouped by a random device number, no name or email), feedback you send, and if logged in, your email and saved progress.",ja:"· 全体ランキング(ニックネーム・スコア・国)、利用統計(名前・メールなしで端末識別用のランダム番号でまとめます)、送ったご意見、ログインした場合はメールと記録の保存データ。",zh:"· 全球排名(昵称·分数·国家)、使用统计(不含姓名和邮箱,以随机设备编号归组)、你发送的意见,登录时还有邮箱和存档。"},"기록은 이 기기의 브라우저에 저장되고, 전체 순위에는 닉네임 · 점수 · 나라가 올라갑니다.":{en:"Your records are saved in this browser; global rankings show nickname · score · country.",ja:"記録はこの端末のブラウザに保存され、全体ランキングにはニックネーム・スコア・国が載ります。",zh:"记录保存在本设备的浏览器中,全球排名会显示昵称·分数·国家。"},"완벽한 정반대 — 서로의 빈칸을 채워 주는 조합":{en:"A perfect opposite — you fill in each other's blanks",ja:"完璧な正反対 — お互いの足りない部分を補い合うコンビ",zh:"完美的反面 — 互相填补空白的组合"},"완성!":{en:"Complete!",ja:"完成!",zh:"完成!"},"완전 정복! 금화 +":{en:"Total conquest! Gold +",ja:"完全制覇! ゴールド +",zh:"完全征服! 金币 +"},"왕국 정복 · 영토":{en:"Kingdom Conquest · Territory",ja:"王国征服 · 領土",zh:"王国征服 · 领土"},"왕국 정복 · 지도":{en:"Kingdom Conquest · Map",ja:"王国征服 · マップ",zh:"王国征服 · 地图"},"왕국 통일! 금화 +":{en:"Kingdom united! Gold +",ja:"王国統一! ゴールド +",zh:"王国统一! 金币 +"},"왕머리 축구 월드컵":{en:"Bobblehead Soccer World Cup",ja:"デカ頭サッカー ワールドカップ",zh:"大头足球世界杯"},"왕머리 축구 월드컵 ow King Slime",ja:"草原のキングスライム",zh:"草原史莱姆王"},"지역 보스":{en:"Area boss",ja:"地域ボス",zh:"区域Boss"},"90초마다 12초 숨 고르기 · 처치 목표를 채우면 지역 보스 등장 · 보스마다 공격이 달라요 (빨간 원 · 줄을 피하세요)":{en:"A 12s breather every 90s · hit the kill target and the area boss appears · each boss attacks differently (dodge red circles and lanes)",ja:"90秒ごとに12秒のひと休み · 撃破目標を満たすと地域ボス登場 · ボスごとに攻撃が違います(赤い円・帯を避けて)",zh:"每90秒喘口气12秒 · 达到击败目标后区域Boss登场 · 每个Boss攻击方式不同(躲开红圈和红带)"},"Lv6 · 진화 가능":{en:"Lv6 · can evolve",ja:"Lv6 · 進化できます",zh:"Lv6 · 可进化"},"★ 1단 진화":{en:"★ Evolved (1st)",ja:"★ 1段階進化",zh:"★ 一阶进化"},"경험치 +12% · 자석 +30% · 금화 +25% · 공격 -8%":{en:"XP +12% · magnet +30% · gold +25% · attack -8%",ja:"経験値 +12% · 磁石 +30% · 金貨 +25% · 攻撃 -8%",zh:"经验 +12% · 磁铁 +30% · 金币 +25% · 攻击 -8%"},"공격 +15% · 범위 +10% · 체력 -15":{en:"Attack +15% · area +10% · HP -15",ja:"攻撃 +15% · 範囲 +10% · 体力 -15",zh:"攻击 +15% · 范围 +10% · 体力 -15"},"균형형 · 특별한 약점 없음":{en:"Balanced · no real weakness",ja:"バランス型 · 弱点なし",zh:"均衡型 · 没有明显弱点"},"기사":{en:"Knight",ja:"騎士",zh:"骑士"},"대기실에서 캐릭터와 시작 무기를 고르고, 도감을 채워 보세요":{en:"Pick a character and starting weapon in the lobby, and fill your codex",ja:"待合室でキャラクターと初期武器を選び、図鑑を埋めてみよう",zh:"在大厅选择角色和初始武器,并收集图鉴"},"도감: 만난 무기 · 진화 · 지역 보스 · 몬스터가 기록돼요. 새로 채울 때마다 금화 5개.":{en:"Codex: weapons, evolutions, area bosses and monsters you meet are recorded. 5 gold for each new entry.",ja:"図鑑:出会った武器・進化・地域ボス・モンスターが記録されます。新しく埋めるたびに金貨5枚。",zh:"图鉴:记录遇到的武器、进化、区域Boss和怪物。每新增一项得5金币。"},"뛰어올라 내려찍기 · 체력이 반이 되면 둘로 갈라져요":{en:"Leaps and slams down · splits in two at half HP",ja:"跳び上がって叩きつけ · 体力が半分で二つに分裂",zh:"跃起砸地 · 体力减半时分裂成两个"},"레벨업 카드에서 만나요":{en:"Find it on level-up cards",ja:"レベルアップカードで出会えます",zh:"在升级卡中遇到"},"레벨업 카드에서 이 무기를 고르면 기록돼요":{en:"Pick this weapon on a level-up card to record it",ja:"レベルアップカードでこの武器を選ぶと記録されます",zh:"在升级卡中选择该武器即可记录"},"마법사":{en:"Wizard",ja:"魔法使い",zh:"魔法师"},"발밑에 불기둥 · 빨간 원에서 벗어나세요":{en:"Fire pillars underfoot · get out of the red circles",ja:"足元に火柱 · 赤い円から出よう",zh:"脚下喷火柱 · 快离开红圈"},"사방으로 얼음 탄막 · 맞으면 잠시 느려져요":{en:"Ice barrage in all directions · hits slow you briefly",ja:"四方に氷の弾幕 · 当たると少し遅くなります",zh:"向四周发射冰弹幕 · 被击中会短暂减速"},"새로 채울 때마다 🪙 +5 · 눌러서 진화법 보기":{en:"🪙 +5 per new entry · tap to see how to evolve",ja:"新しく埋めるたび 🪙 +5 · タップで進化方法",zh:"每新增一项 🪙 +5 · 点击查看进化方法"},"순간이동 후 영혼탄 · 유령을 불러내요":{en:"Teleports, fires soul shots · summons ghosts",ja:"瞬間移動して魂の弾 · 幽霊を呼び出します",zh:"瞬移后发射灵魂弹 · 召唤幽灵"},"쓰러뜨린 몬스터만큼 점수가 기록이에요.":{en:"Your score is the monsters you defeat.",ja:"倒したモンスターの分だけスコアになります。",zh:"击败的怪物越多,分数越高。"},"아직 못 만났어요":{en:"Not met yet",ja:"まだ出会っていません",zh:"尚未遇到"},"에서 처치 목표를 채우면 나와요":{en:": appears when you hit the kill target",ja:"で撃破目標を満たすと出現",zh:"中达到击败目标后出现"},"왕 슬라임이 갈라졌어요!":{en:"The King Slime split!",ja:"王スライムが分裂した!",zh:"史莱姆王分裂了!"},"용사":{en:"Hero",ja:"勇者",zh:"勇者"},"이동 +18% · 쿨타임 -6% · 체력 -25":{en:"Speed +18% · cooldown -6% · HP -25",ja:"移動 +18% · クールタイム -6% · 体力 -25",zh:"移速 +18% · 冷却 -6% · 体力 -25"},"잠시 멈춰 노려본 뒤 일직선 돌진":{en:"Pauses to glare, then charges in a straight line",ja:"一瞬止まって睨み、一直線に突進",zh:"停下瞪视后直线冲锋"},"지역 보스 다섯은 공격이 저마다 달라요 — 초원의 왕 슬라임은 뛰어올라 내려찍고, 모래 거인은 노려본 뒤 돌진하고, 얼음 군주는 탄막(맞으면 느려짐), 용암 마왕은 불기둥, 묘지의 망령왕은 순간이동해 영혼탄을 쏴요. 바닥에 빨간 원이나 띠가 보이면 그 밖으로 피하세요.":{en:"The five area bosses each attack differently — the Meadow King Slime leaps and slams, the Sand Giant glares then charges, the Ice Lord fires barrages (they slow you), the Lava Demon summons fire pillars, and the Graveyard Wraith King teleports and fires soul shots. When you see a red circle or lane on the ground, get out of it.",ja:"地域ボス5体は攻撃がそれぞれ違います — 草原の王スライムは跳んで叩きつけ、砂の巨人は睨んでから突進、氷の君主は弾幕(当たると遅くなる)、溶岩魔王は火柱、墓地の亡霊王は瞬間移動して魂の弾を撃ちます。地面に赤い円や帯が見えたら外へ避けましょう。",zh:"五个区域Boss攻击方式各不相同——草原史莱姆王跃起砸地,沙之巨人瞪视后冲锋,冰之君主发射弹幕(被击中会减速),熔岩魔王召唤火柱,墓地亡灵王瞬移后发射灵魂弹。地上出现红圈或红带时,赶快躲到外面。"},"처치 ✓":{en:"Defeated ✓",ja:"撃破 ✓",zh:"已击败 ✓"},"체력 +40 · 받는 피해 -10% · 이동 -8%":{en:"HP +40 · damage taken -10% · speed -8%",ja:"体力 +40 · 被ダメージ -10% · 移動 -8%",zh:"体力 +40 · 受到伤害 -10% · 移速 -8%"},"캐릭터 · 시작 능력이 달라요":{en:"Character · different starting stats",ja:"キャラクター · 初期能力が違います",zh:"角色 · 初始能力各不相同"},"캐릭터 다섯(용사 · 기사 · 닌자 · 마법사 · 행운아)은 시작 능력이 달라요. 누적 처치 수로 하나씩 열려요.":{en:"The five characters (Hero · Knight · Ninja · Wizard · Lucky) start with different stats. They unlock one by one with your total kills.",ja:"5人のキャラクター(勇者 · 騎士 · 忍者 · 魔法使い · 幸運児)は初期能力が違います。累計撃破数で1人ずつ解放されます。",zh:"五个角色(勇者 · 骑士 · 忍者 · 魔法师 · 幸运儿)初始能力不同。随累计击败数逐个解锁。"},"행운아":{en:"Lucky",ja:"幸運児",zh:"幸运儿"},"📖 도감 등록 · 🪙 +5":{en:"📖 Codex entry · 🪙 +5",ja:"📖 図鑑に登録 · 🪙 +5",zh:"📖 图鉴登记 · 🪙 +5"},"{0} · {1} · {2}… 스테이지는 보너스 스테이지: 적이 쏘지 않고 지나가기만 해요. 한 기당 {3}점, {4}기 전멸이면 {5}점.":{en:"{0} · {1} · {2}… Stages are Bonus Stages: enemies don't shoot, they just fly by. {3} pts each, {5} pts for wiping out all {4}.",ja:"{0} · {1} · {2}…ステージはボーナスステージ。敵は撃たず通り過ぎるだけ。1機{3}点、{4}機全滅で{5}点。",zh:"{0} · {1} · {2}…关卡为奖励关卡:敌人不会射击,只会飞过。每架{3}分,全灭{4}架得{5}分。"},"{0}번째 곤충이 나오면 가운데에 과일이 나옵니다. 먹으면 {1}점(ROUND마다 +{2} 최대 {3})과 함께 곤충이 잠시 멈춰요. 멈춰도 닿으면 위험.":{en:"When the {0}th bug appears, a fruit shows up in the center. Eat it for {1} pts (+{2} each ROUND, max {3}) and the bugs freeze briefly. Touching them is still deadly.",ja:"{0}番目の虫が出ると中央にフルーツが現れる。食べると{1}点(ROUNDごとに+{2}、最大{3})獲得し、虫が一時停止。止まっていても触れると危険。",zh:"第{0}只虫子出现时,中央会出现水果。吃掉得{1}分(每个ROUND +{2},最高{3}),虫子会暂时停住。停住时碰到仍然危险。"},"{0}번째 벌레가 나오면 가운데에 꿀단지가 생깁니다. 먹으면 보너스 점수와 함께 벌레가 잠시 멈추지만, 닿으면 여전히 위험해요.":{en:"When the {0}th bug appears, a honey pot spawns in the center. Eat it for bonus points and the bugs freeze briefly, but touching them is still deadly.",ja:"{0}番目の虫が出ると中央にハチミツ壺が現れる。食べるとボーナス点を獲得し、虫が一時停止。ただし触れると危険。",zh:"第{0}只虫子出现时,中央会出现蜂蜜罐。吃掉可得奖励分,虫子会暂时停住,但碰到仍然危险。"},"{0}판마다 · 적이 쏘지 않음 · {1}기 전멸 +{2}":{en:"Every {0} rounds · enemies don't shoot · wipe out {1} for +{2}",ja:"{0}回ごと · 敵は撃たない · {1}機全滅で+{2}",zh:"每{0}局 · 敌人不射击 · 全灭{1}架 +{2}"},"{0}판부터 드론이 깜빡이다 셋으로 변신: 셋 다 잡으면 큰 보너스 · 보너스 스테이지는 {1}기를 모두 맞히면 +{2}":{en:"From round {0}, drones blink then split into three: catch all three for a big bonus · In Bonus Stages, hit all {1} for +{2}",ja:"{0}回目からドローンが点滅して3機に変身:3機とも倒すと大ボーナス · ボーナスステージは{1}機すべて撃破で+{2}",zh:"从第{0}局起,无人机会闪烁并分裂为三:全部击落可得大量奖励 · 奖励关卡中击中全部{1}架 +{2}"},"{0} ~ {1} · 곤충 정지":{en:"{0} ~ {1} · Bugs frozen",ja:"{0} ~ {1} · 虫が停止",zh:"{0} ~ {1} · 虫子停住"},"BREAK 모으기 → 목숨 +{0}":{en:"Collect BREAK → Lives +{0}",ja:"BREAKを集める → ライフ+{0}",zh:"集齐BREAK → 生命 +{0}"},"BREAK 완성! 목숨 +{0}":{en:"BREAK complete! Lives +{0}",ja:"BREAK完成!ライフ+{0}",zh:"BREAK完成!生命 +{0}"},"POCKET 모으기 → +{0}":{en:"Collect POCKET → +{0}",ja:"POCKETを集める → +{0}",zh:"集齐POCKET → +{0}"},"POCKET 완성! +{0}":{en:"POCKET complete! +{0}",ja:"POCKET完成!+{0}",zh:"POCKET完成!+{0}"},"ROUND마다 곤충 종류(개미 · 사슴벌레 · 거미 · 애벌레)가 바뀌어요.":{en:"The bug type (ant · stag beetle · spider · caterpillar) changes every ROUND.",ja:"ROUNDごとに虫の種類(アリ · クワガタ · クモ · 毛虫)が変わる。",zh:"每个ROUND虫子种类(蚂蚁 · 锹甲 · 蜘蛛 · 毛毛虫)都会变化。"},"ROUND마다 바뀜":{en:"Changes every ROUND",ja:"ROUNDごとに変化",zh:"每个ROUND都会变"},"· {0}승 하기":{en:"· Win {0}",ja:"· {0}勝する",zh:"· 赢{0}局"},"가운데에 꿀단지 등장!":{en:"Honey pot appears in the center!",ja:"中央にハチミツ壺が出現!",zh:"中央出现蜂蜜罐!"},"걸리면 전투기를 빼앗김":{en:"Caught = fighter stolen",ja:"捕まると戦闘機を奪われる",zh:"被抓住就会被夺走战机"},"게 로봇":{en:"Crab Bot",ja:"クラブボット",zh:"螃蟹机器人"},"곤충은 평소엔 이리저리 헤매다가, 시간이 지나면 한 마리씩 몇 초 동안 곧장 쫓아와요.":{en:"Bugs normally wander around, but after a while they chase you in a straight line, one at a time, for a few seconds.",ja:"虫は普段はうろうろしているが、時間が経つと1匹ずつ数秒間まっすぐ追いかけてくる。",zh:"虫子平时四处游荡,过一段时间会一只一只直线追你几秒。"},"곤충을 피해 꽃 · 클로버 · 글자를 모두 먹으면 다음 ROUND로 넘어갑니다.":{en:"Dodge the bugs and eat every flower · clover · letter to move on to the next ROUND.",ja:"虫を避けて花 · クローバー · 文字をすべて食べると次のROUNDへ。",zh:"躲开虫子,吃光所有花 · 三叶草 · 字母,即可进入下一个ROUND。"},"곤충이 나오기 직전 경고음이 울려요. 가운데 근처에서 멀어지세요.":{en:"A warning sounds right before a bug appears. Move away from the center.",ja:"虫が出る直前に警告音が鳴る。中央付近から離れよう。",zh:"虫子出现前会响起警告音。快离开中央附近。"},"과일 {0}종":{en:"{0} fruits",ja:"フルーツ{0}種",zh:"{0}种水果"},"귤":{en:"Tangerine",ja:"みかん",zh:"橘子"},"급강하하는 적을 격추하면 가끔 캡슐: 연(연사) · 방(방패 {0}회) · 넓(넓은 탄) · 원반 모선의 자석 그물에 걸리면 전투기를 빼앗겨요. 그 모선이 급강하할 때 맞히면 되찾아 쌍발! 편대에 있을 때 잡으면 빼앗긴 전투기가 적이 돼요":{en:"Shoot down diving enemies for occasional capsules: R (rapid fire) · S (shield, {0} hits) · W (wide shot). If a Saucer Mothership's magnet net catches you, your fighter is stolen. Hit that mothership as it dives to get it back for a twin shot! Shoot it while it's in formation and the stolen fighter becomes an enemy.",ja:"急降下する敵を撃墜するとたまにカプセルが出る:連(連射) · 盾(シールド{0}回) · 広(広範囲弾)。原盤母艦のマグネットネットに捕まると戦闘機を奪われる。その母艦が急降下するときに撃てば取り戻して2連装に!編隊にいるときに倒すと、奪われた戦闘機が敵になる。",zh:"击落俯冲的敌人偶尔会掉落胶囊:连(连射) · 盾(护盾{0}次) · 广(宽弹)。被圆盘母舰的磁力网抓住,战机会被夺走。在该母舰俯冲时击中它即可夺回,变成双发!在编队中击落它,被夺走的战机会变成敌人。"},"깜빡이던 드론이 셋으로 갈라짐 · 하나 {0} · 셋 다 {1} / {2} / {3}":{en:"The blinking drone splits into three · one {0} · all three {1} / {2} / {3}",ja:"点滅していたドローンが3機に分裂 · 1機{0} · 3機とも{1} / {2} / {3}",zh:"闪烁的无人机分裂为三 · 单个{0} · 全部三个{1} / {2} / {3}"},"꽃 · 클로버 · 글자를 모두 먹으면 다음 ROUND":{en:"Eat every flower · clover · letter to reach the next ROUND",ja:"花 · クローバー · 文字をすべて食べると次のROUND",zh:"吃光所有花 · 三叶草 · 字母进入下一个ROUND"},"꿀단지":{en:"Honey Pot",ja:"ハチミツ壺",zh:"蜂蜜罐"},"꿀단지 +":{en:"Honey Pot +",ja:"ハチミツ壺 +",zh:"蜂蜜罐 +"},"나무 쪽문은 토리만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 벌레는 못 지나가요.":{en:"Only Tori can push through a wooden gate, and passing through turns it {0}° and changes the path. Bugs can't pass.",ja:"木戸を押して通れるのはトリだけ。通ると{0}°回転して道が変わる。虫は通れない。",zh:"木门只有托莉能推过去,通过后会转动{0}°,路线随之改变。虫子过不去。"},"나무 쪽문은 토리만 밀고 지나갈 수 있어요. 지나가면 {0}도 돌아가요":{en:"Only Tori can push through a wooden gate. Passing through turns it {0}°",ja:"木戸を押して通れるのはトリだけ。通ると{0}度回転する",zh:"木门只有托莉能推过去。通过后会转动{0}度"},"노란색일 때 먹은 글자는 BREAK(완성 시 목숨 +{0}), 빨간색일 때 먹은 글자는 POCKET(완성 시 +{1})에 들어가요.":{en:"Letters eaten while yellow go to BREAK (lives +{0} when complete); letters eaten while red go to POCKET (+{1} when complete).",ja:"黄色のときに食べた文字はBREAK(完成でライフ+{0})、赤のときに食べた文字はPOCKET(完成で+{1})に入る。",zh:"黄色时吃的字母归入BREAK(完成时生命 +{0}),红色时吃的字母归入POCKET(完成时 +{1})。"},"독버섯":{en:"Poison Mushroom",ja:"毒キノコ",zh:"毒蘑菇"},"독버섯 근처로 곤충을 유인하면 곤충이 독버섯을 밟고 돌아갑니다.":{en:"Lure a bug near a poison mushroom and it steps on it and turns back.",ja:"毒キノコの近くに虫をおびき寄せると、虫が毒キノコを踏んで引き返す。",zh:"把虫子引到毒蘑菇附近,虫子会踩到毒蘑菇后折返。"},"독버섯 근처로 벌레를 유인하면 벌레가 독버섯을 밟고 사라집니다.":{en:"Lure a bug near a poison mushroom and it steps on it and vanishes.",ja:"毒キノコの近くに虫をおびき寄せると、虫が毒キノコを踏んで消える。",zh:"把虫子引到毒蘑菇附近,虫子会踩到毒蘑菇后消失。"},"독버섯은 토리도 곤충도 밟으면 끝(곤충은 가운데로 돌아감).":{en:"Stepping on a poison mushroom ends it for Tori and bugs alike (bugs return to the center).",ja:"毒キノコはトリも虫も踏んだら終わり(虫は中央に戻る)。",zh:"托莉和虫子踩到毒蘑菇都会完蛋(虫子会回到中央)。"},"드론이 깜빡이기 시작하면 변신 신호! 갈라진 셋을 모두 잡을 준비를 하세요.":{en:"When a drone starts blinking, it's about to transform! Get ready to take down all three.",ja:"ドローンが点滅し始めたら変身の合図!分裂した3機をすべて倒す準備をしよう。",zh:"无人机开始闪烁就是变身信号!准备好击落分裂出的三架吧。"},"멜론":{en:"Melon",ja:"メロン",zh:"哈密瓜"},"모선을 편대에서 잡으면 빼앗긴 전투기가 덤벼요 · {0}":{en:"Shoot a mothership in formation and the stolen fighter attacks you · {0}",ja:"編隊にいる母艦を撃つと、奪われた戦闘機が襲いかかってくる · {0}",zh:"在编队中击落母舰,被夺走的战机会扑向你 · {0}"},"무화과":{en:"Fig",ja:"いちじく",zh:"无花果"},"미로 테두리를 따라 덩굴 시계가 한 바퀴 자랄 때마다 가운데에서 벌레가 한 마리씩 나옵니다 (최대 {0}마리).":{en:"Every time the vine clock grows once around the maze border, a bug emerges from the center (max {0}).",ja:"つるの時計が迷路の縁を一周するたびに、中央から虫が1匹出てくる(最大{0}匹)。",zh:"藤蔓时钟沿迷宫边缘长满一圈,中央就会出来一只虫子(最多{0}只)。"},"미로는 판마다 새로 만들어져요(좌우 대칭 · 쪽문 {0}개). 토리는 아래 가운데에서 출발합니다.":{en:"A new maze every round (left-right symmetric · {0} gates). Tori starts at the bottom center.",ja:"迷路は毎回新しく作られる(左右対称 · 木戸{0}個)。トリは下の中央からスタート。",zh:"迷宫每局都会重新生成(左右对称 · {0}个木门)。托莉从下方中央出发。"},"반딧불 시계":{en:"Firefly Clock",ja:"ホタルの時計",zh:"萤火虫时钟"},"밤 정원의 네온 도트 미로. 판마다 새 미로, 반딧불 시계가 한 바퀴 돌 때마다 곤충이 나와요. 쪽문으로 길을 막고, 색이 바뀌는 글자로 BREAK · POCKET을 완성하세요.":{en:"A neon dot maze in the night garden. New maze every round; a bug emerges each time the firefly clock goes around. Block paths with gates and complete BREAK · POCKET with the color-changing letters.",ja:"夜の庭のネオンドット迷路。毎回新しい迷路で、ホタルの時計が一周するたびに虫が出てくる。木戸で道を塞ぎ、色が変わる文字でBREAK · POCKETを完成させよう。",zh:"夜晚花园里的霓虹点阵迷宫。每局新迷宫,萤火虫时钟每转一圈就会出来一只虫子。用木门堵路,用变色字母拼出BREAK · POCKET。"},"벌레를 피해 정원 미로의 꽃 · 클로버 · 글자를 모두 먹으면 다음 미로로 넘어갑니다.":{en:"Dodge the bugs and eat every flower · clover · letter in the garden maze to move on to the next maze.",ja:"虫を避けて庭の迷路の花 · クローバー · 文字をすべて食べると次の迷路へ。",zh:"躲开虫子,吃光花园迷宫里所有的花 · 三叶草 · 字母,即可进入下一个迷宫。"},"변신 외계인 ({0}판부터)":{en:"Transforming Alien (from round {0})",ja:"変身エイリアン({0}回目から)",zh:"变身外星人(第{0}局起)"},"보너스 스테이지":{en:"Bonus Stage",ja:"ボーナスステージ",zh:"奖励关卡"},"보너스 스테이지는 적이 들어오는 길을 외우면 퍼펙트가 가능해요. 길 모양은 세 가지가 번갈아 나와요.":{en:"In Bonus Stages, memorize the enemies' entry paths for a Perfect. The three path shapes alternate.",ja:"ボーナスステージでは敵の進入ルートを覚えればパーフェクトも可能。ルートの形は3種類が交互に出る。",zh:"奖励关卡中记住敌人的进场路线就能拿到完美。路线有三种形状,交替出现。"},"보라 독버섯은 토리도, 벌레도 밟으면 끝. 벌레에 닿으면 목숨 −{0} (처음 {1}개).":{en:"Purple poison mushrooms end it for both Tori and bugs. Touching a bug costs lives −{0} (start with {1}).",ja:"紫の毒キノコはトリも虫も踏んだら終わり。虫に触れるとライフ−{0}(最初は{1}個)。",zh:"紫色毒蘑菇托莉和虫子踩到都会完蛋。碰到虫子生命 −{0}(初始{1}条)。"},"보라 독버섯은 피하고, 클로버는 점수 배율 ↑, 가운데 꿀단지를 먹으면 벌레가 얼어요":{en:"Avoid purple poison mushrooms, clovers raise the score multiplier ↑, and eating the center honey pot freezes the bugs",ja:"紫の毒キノコは避けよう。クローバーで得点倍率↑、中央のハチミツ壺を食べると虫が凍る",zh:"避开紫色毒蘑菇,三叶草提高得分倍率 ↑,吃掉中央蜂蜜罐能冻住虫子"},"블루베리":{en:"Blueberry",ja:"ブルーベリー",zh:"蓝莓"},"빨간 글자는 POCKET(완성 시 +{0}), 노란 글자는 BREAK(완성 시 목숨 +{1})에 켜집니다.":{en:"Red letters light up POCKET (+{0} when complete), yellow letters light up BREAK (lives +{1} when complete).",ja:"赤い文字はPOCKET(完成で+{0})、黄色い文字はBREAK(完成でライフ+{1})に点灯する。",zh:"红色字母点亮POCKET(完成时 +{0}),黄色字母点亮BREAK(完成时生命 +{1})。"},"빨강은 아주 잠깐이에요. 파란색 → 빨강으로 바뀌는 순간을 글자 바로 옆에서 기다리세요.":{en:"Red lasts only a moment. Wait right next to a letter for the instant it turns from blue to red.",ja:"赤はほんの一瞬。文字のすぐ横で、青から赤に変わる瞬間を待とう。",zh:"红色只持续一瞬间。守在字母旁边,等它从蓝变红的那一刻。"},"빼앗긴 전투기를 단 모선이 급강하할 때 맞히면 전투기를 되찾아 두 대가 나란히 쏘는 쌍발이 됩니다. 편대에 있을 때 맞히면 잃어요.":{en:"Hit a mothership carrying a stolen fighter as it dives to get your fighter back and fire side by side as a twin shot. Hit it while it's in formation and you lose it.",ja:"奪われた戦闘機を連れた母艦が急降下するときに撃つと戦闘機を取り戻し、2機並んで撃つ2連装になる。編隊にいるときに撃つと失う。",zh:"母舰带着被夺走的战机俯冲时击中它,就能夺回战机,两架并排射击成为双发。在编队中击中则会失去战机。"},"사과":{en:"Apple",ja:"りんご",zh:"苹果"},"석류":{en:"Pomegranate",ja:"ざくろ",zh:"石榴"},"성운 속 외계 편대를 쏘아 떨어뜨리는 우주 슈팅. 해파리 드론 · 게 로봇 · 원반 모선이 몰려오고, 모선이 자석 그물로 끌어간 전투기를 되찾으면 쌍발! 변신 외계인과 보너스 스테이지까지.":{en:"Space shooter where you shoot down alien squadrons in a nebula. Jelly Drones · Crab Bots · Saucer Motherships swarm in, and retrieve a fighter the mothership's magnet net took for a twin shot! Plus transforming aliens and Bonus Stages.",ja:"星雲の中で異星の編隊を撃ち落とす宇宙シューティング。ジェリードローン · クラブボット · 円盤母艦が押し寄せ、母艦がマグネットネットで連れ去った戦闘機を取り戻せば2連装に!変身エイリアンとボーナスステージも。",zh:"在星云中击落外星编队的太空射击游戏。水母无人机 · 螃蟹机器人 · 圆盘母舰蜂拥而来,夺回被母舰磁力网抓走的战机就能变成双发!还有变身外星人和奖励关卡。"},"스테이지가 시작되면 외계인 {0}기(원반 모선 {1} · 게 로봇 {2} · 해파리 드론 {3})가 무리 지어 날아와 편대를 짭니다. 날아오는 중에 맞히면 점수가 더 커요.":{en:"When a stage starts, {0} aliens (Saucer Mothership {1} · Crab Bot {2} · Jelly Drone {3}) swarm in and form a squadron. Hitting them while they fly in scores more.",ja:"ステージが始まると、エイリアン{0}機(円盤母艦{1} · クラブボット{2} · ジェリードローン{3})が群れで飛来して編隊を組む。飛来中に撃つと得点が高い。",zh:"关卡开始时,{0}架外星人(圆盘母舰{1} · 螃蟹机器人{2} · 水母无人机{3})成群飞来并组成编队。在飞来途中击中得分更高。"},"외계 편대 출격":{en:"Alien Squadron Sortie",ja:"異星編隊出撃",zh:"外星编队出击"},"외계 편대를 모두 격추하면 다음 스테이지. 최대한 높은 스테이지와 점수를 노리세요.":{en:"Shoot down the whole alien squadron to reach the next stage. Aim for the highest stage and score you can.",ja:"異星編隊をすべて撃墜すると次のステージへ。できるだけ高いステージとスコアを目指そう。",zh:"击落所有外星编队即可进入下一关。尽量冲击更高的关卡和分数吧。"},"원반 모선 ({0}번 맞혀야)":{en:"Saucer Mothership (hit {0} times)",ja:"円盤母艦({0}回命中で撃墜)",zh:"圆盘母舰(需击中{0}次)"},"원반 모선은 두 번 맞혀야 떨어져요(보라 → 빨강). 모선이 멈춰 자석 그물을 내리면 피하세요. 걸리면 전투기를 빼앗겨요.":{en:"A Saucer Mothership takes two hits to go down (purple → red). When it stops and lowers its magnet net, dodge it. If caught, your fighter is stolen.",ja:"円盤母艦は2回当てないと落ちない(紫→赤)。母艦が止まってマグネットネットを下ろしたら避けよう。捕まると戦闘機を奪われる。",zh:"圆盘母舰需要击中两次才会坠落(紫→红)。母舰停下并放下磁力网时要躲开。被抓住战机就会被夺走。"},"자두":{en:"Plum",ja:"すもも",zh:"李子"},"자석 그물":{en:"Magnet Net",ja:"マグネットネット",zh:"磁力网"},"자석 그물이 내려오면 옆으로 한 칸 이상 비키세요. 일부러 잡힌 뒤 구출하면 쌍발이 됩니다.":{en:"When a magnet net comes down, move at least one tile aside. Get caught on purpose and rescue your fighter for a twin shot.",ja:"マグネットネットが下りてきたら、横に1マス以上よけよう。わざと捕まってから救出すると2連装になる。",zh:"磁力网落下时,向旁边至少躲开一格。故意被抓再救回来,就能变成双发。"},"적이 몇 기 안 남으면 쉬지 않고 급강하해요. 끝까지 방심 금지.":{en:"When few enemies remain, they dive nonstop. Don't let your guard down until the end.",ja:"敵が残り少なくなると、休まず急降下してくる。最後まで油断禁物。",zh:"敌人所剩无几时会不停地俯冲。直到最后都不能大意。"},"정원 미로의 꽃을 모두 먹고, 나무 쪽문을 돌려 벌레 길을 막고, 클로버로 배율을 올리고, 글자로 BREAK · POCKET을 완성하세요.":{en:"Eat every flower in the garden maze, turn wooden gates to block the bugs' paths, raise your multiplier with clovers, and complete BREAK · POCKET with letters.",ja:"庭の迷路の花をすべて食べ、木戸を回して虫の道を塞ぎ、クローバーで倍率を上げ、文字でBREAK · POCKETを完成させよう。",zh:"吃光花园迷宫里所有的花,转动木门堵住虫子的路,用三叶草提高倍率,用字母拼出BREAK · POCKET。"},"주황 쪽문은 토리만 밀고 지나가요. 곤충 길을 막는 데 쓰세요":{en:"Only Tori can push through the orange gate. Use it to block the bugs' path",ja:"オレンジの木戸を押して通れるのはトリだけ。虫の道を塞ぐのに使おう",zh:"橙色木门只有托莉能推过去。用它来堵住虫子的路"},"쪽문은 토리만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 곤충에게는 벽이에요.":{en:"Only Tori can push through a gate, and passing through turns it {0}° and changes the path. Gates are walls to bugs.",ja:"木戸を押して通れるのはトリだけ。通ると{0}°回転して道が変わる。虫にとっては壁。",zh:"门只有托莉能推过去,通过后会转动{0}°,路线随之改变。对虫子来说门就是墙。"},"쫓아오는 곤충 앞에서 쪽문을 지나가면 문이 돌아가 길이 막혀요.":{en:"Pass through a gate in front of a chasing bug and the gate turns, blocking its path.",ja:"追ってくる虫の前で木戸を通ると、戸が回って道が塞がる。",zh:"在追来的虫子面前穿过木门,门会转动把路堵住。"},"쫓아오는 벌레 앞에서 쪽문을 지나가면 문이 돌아가 벌레 길이 막혀요.":{en:"Pass through a gate in front of a chasing bug and the gate turns, blocking the bug's path.",ja:"追ってくる虫の前で木戸を通ると、戸が回って虫の道が塞がる。",zh:"在追来的虫子面前穿过木门,门会转动堵住虫子的路。"},"클로버와 글자는 색이 바뀌는 순간을 기다렸다가 먹으세요.":{en:"Wait for the moment clovers and letters change color, then eat them.",ja:"クローバーと文字は、色が変わる瞬間を待ってから食べよう。",zh:"三叶草和字母要等颜色变化的瞬间再吃。"},"클로버와 글자는 평소 파란색이고 약 {0}초마다 빨강(아주 잠깐) → 노랑으로 바뀝니다. 파랑 {1} · 노랑 {2} · 빨강 {3}점 × 배율.":{en:"Clovers and letters are normally blue, and about every {0} sec they turn red (very briefly) → yellow. Blue {1} · yellow {2} · red {3} pts × multiplier.",ja:"クローバーと文字は普段は青で、約{0}秒ごとに赤(ごく一瞬)→黄色に変わる。青{1} · 黄{2} · 赤{3}点 × 倍率。",zh:"三叶草和字母平时是蓝色,约每{0}秒变为红色(极短)→黄色。蓝{1} · 黄{2} · 红{3}分 × 倍率。"},"클로버와 글자는 평소 파란색이고, 몇 초마다 노란색 → 빨간색으로 잠깐 바뀝니다.":{en:"Clovers and letters are normally blue, and every few seconds they briefly turn yellow → red.",ja:"クローバーと文字は普段は青で、数秒ごとに黄色→赤に一瞬変わる。",zh:"三叶草和字母平时是蓝色,每隔几秒会短暂变为黄色 → 红色。"},"키위":{en:"Kiwi",ja:"キウイ",zh:"猕猴桃"},"테두리의 반딧불이 한 바퀴 켜질 때마다(다음 바퀴엔 꺼질 때마다) 가운데에서 곤충이 {0}마리씩 나옵니다 (최대 {1}마리).":{en:"Each time the fireflies along the border light up once around (and go out once around on the next lap), {0} bugs emerge from the center (max {1}).",ja:"縁のホタルが一周点灯するたび(次の周では消灯するたび)、中央から虫が{0}匹ずつ出てくる(最大{1}匹)。",zh:"边缘的萤火虫每亮满一圈(下一圈则每熄灭一圈),中央就会出来{0}只虫子(最多{1}只)。"},"토리도 벌레도 밟으면 끝":{en:"Stepping on it ends it for both Tori and bugs",ja:"トリも虫も踏んだら終わり",zh:"托莉和虫子踩到都会完蛋"},"파란 클로버":{en:"Blue Clover",ja:"青いクローバー",zh:"蓝色三叶草"},"파란 클로버를 먹으면 이번 ROUND 배율이 ×{0} → ×{1} → ×{2}로 올라요.":{en:"Eat a blue clover to raise this ROUND's multiplier ×{0} → ×{1} → ×{2}.",ja:"青いクローバーを食べると、このROUNDの倍率が×{0}→×{1}→×{2}に上がる。",zh:"吃蓝色三叶草,本ROUND倍率会升至×{0} → ×{1} → ×{2}。"},"파란 클로버를 먹으면 이번 스테이지 점수 배율이 ×{0} → ×{1} → ×{2}로 올라요.":{en:"Eat a blue clover to raise this stage's score multiplier ×{0} → ×{1} → ×{2}.",ja:"青いクローバーを食べると、このステージの得点倍率が×{0}→×{1}→×{2}に上がる。",zh:"吃蓝色三叶草,本关得分倍率会升至×{0} → ×{1} → ×{2}。"},"판이 갈수록 늘어요":{en:"Grows with each round",ja:"回を重ねるごとに増える",zh:"随局数增加"},"편대 {0} · 비행 중 {1} · 호위 {2}기 {3} · {4}기 {5}":{en:"Squadron {0} · In flight {1} · Escorts {2} {3} · {4} {5}",ja:"編隊{0} · 飛行中{1} · 護衛{2}機{3} · {4}機{5}",zh:"编队{0} · 飞行中{1} · 护卫{2}架{3} · {4}架{5}"},"편대가 짜이면 하나씩, 모선은 게 로봇 호위와 함께 급강하하며 총을 쏩니다.":{en:"Once the squadron forms, they dive one by one, and motherships fire guns as they dive with Crab Bot escorts.",ja:"編隊が組まれると1機ずつ急降下し、母艦はクラブボットの護衛とともに急降下しながら銃を撃つ。",zh:"编队组成后,敌人会逐个俯冲,母舰带着螃蟹机器人护卫一边俯冲一边开火。"},"해파리 드론":{en:"Jelly Drone",ja:"ジェリードローン",zh:"水母无人机"},"해파리 드론과 원반 모선을 격파하고 전투기를 강화해 은하 끝까지":{en:"Destroy Jelly Drones and Saucer Motherships, power up your fighter, and fly to the edge of the galaxy",ja:"ジェリードローンと円盤母艦を撃破し、戦闘機を強化して銀河の果てまで",zh:"击破水母无人机和圆盘母舰,强化战机,飞向银河尽头"},"{0}번씩 번갈아 차고 막아서 골을 더 많이 넣으면 승리. 동점이면 한 번씩 서든데스.":{en:"Take turns kicking and saving {0} times each. Most goals wins. If tied, it's Sudden Death, one kick each.",ja:"{0}回ずつ交互に蹴って守り、ゴールが多い方が勝ち。同点ならサドンデスで1回ずつ。",zh:"轮流各踢和扑{0}次，进球多者获胜。平局则进入一次一球的突然死亡。"},"P 차기":{en:"P Kick",ja:"P キック",zh:"P 射门"},"P: 막을 곳을 몰래 누르세요 (":{en:"P: secretly tap where to block (",ja:"P：守る場所をこっそりタップ（",zh:"P：悄悄点击要扑的位置（"},"P는 잠깐 눈 감기)":{en:"P looks away briefly)",ja:"Pは少し目を閉じて）",zh:"P请先闭一下眼）"},"골 성공":{en:"Goal!",ja:"ゴール成功",zh:"进球成功"},"골대 가장자리를 맞으면 골대! · 골문 밖은 빗나감.":{en:"Hit the edge of the post and it's Post! · Outside the goal is a Miss.",ja:"ゴールポストの縁に当たるとポスト！ · ゴール外はミス。",zh:"击中门柱边缘算中柱！· 球门外算偏出。"},"골대!":{en:"Post!",ja:"ポスト！",zh:"中柱！"},"골문 누르기":{en:"Tap the goal",ja:"ゴールをタップ",zh:"点击球门"},"골키퍼 반대쪽으로 휘어 들어감":{en:"Curves in away from the keeper",ja:"キーパーの逆方向へ曲がって入る",zh:"向门将反方向弧线入网"},"골키퍼가 먼저 움직이면 반대쪽을 노리세요.":{en:"If the keeper moves first, aim the other way.",ja:"キーパーが先に動いたら逆側を狙おう。",zh:"门将先动的话，就瞄准另一边。"},"공에서 위로 밀기":{en:"Swipe up from the ball",ja:"ボールから上へスワイプ",zh:"从球上向上滑"},"공에서 위로 밀어 차기 · 빠르게 = 높게 · 휘게 밀면 휘어요":{en:"Swipe up from the ball to kick · Faster = higher · Curve your swipe to bend it",ja:"ボールから上へスワイプして蹴る · 速いほど高く · 曲げてスワイプするとカーブ",zh:"从球上向上滑动射门 · 越快越高 · 滑成弧线球就会拐弯"},"공이 올 곳을 골문에서 누르세요!":{en:"Tap the goal where the ball will go!",ja:"ボールが来る場所をゴールでタップ！",zh:"点击球门上球会去的位置！"},"구석 위":{en:"Top corner",ja:"上のコーナー",zh:"上角"},"낮게 구석으로 차면 가장 안전해요.":{en:"Kicking low into the corner is the safest.",ja:"低くコーナーへ蹴るのが一番安全。",zh:"低射死角最稳妥。"},"내가 찰 차례":{en:"My turn to kick",ja:"自分のキック番",zh:"轮到我射门"},"너무 일찍 누르면 상대가 반대쪽으로 차요 (Medium 이상).":{en:"Tap too early and the opponent kicks the other way (Medium and above).",ja:"早く押しすぎると相手が逆側へ蹴る（Medium以上）。",zh:"点得太早，对手会往另一边射（Medium及以上）。"},"둘이서 할 때는 막는 사람이 먼저 막을 곳을 몰래 누르고, 그다음에 차는 사람이 차요.":{en:"With two players, the keeper secretly taps where to block first, then the kicker kicks.",ja:"2人で遊ぶときは、守る人が先にこっそり守る場所をタップし、そのあと蹴る人が蹴ります。",zh:"双人游戏时，扑球的人先悄悄点击要扑的位置，然后射门的人再射。"},"막기 가장 어려운 곳 · 넘어갈 위험":{en:"Hardest to save · Risk of going over",ja:"一番止めにくい · 越える危険あり",zh:"最难扑救 · 有射飞的风险"},"막아라!":{en:"Save it!",ja:"止めろ！",zh:"扑出去！"},"막을 때: 공이 올 것 같은 곳을 골문에서 누르세요 · 너무 일찍 누르면 읽혀요":{en:"To save: tap where you think the ball will go in the goal · Tap too early and it gets read",ja:"守るとき：ボールが来そうな場所をゴールでタップ · 早すぎると読まれる",zh:"扑球时：点击球门上你觉得球会去的位置 · 点得太早会被看穿"},"막을 때는 상대가 차는 순간 공이 올 곳을 골문에서 누르면 골키퍼가 몸을 날려요.":{en:"To save, tap in the goal where the ball will land the moment the opponent kicks, and the keeper dives.",ja:"守るときは、相手が蹴る瞬間にボールが来る場所をゴールでタップすると、キーパーが飛びつきます。",zh:"扑球时，在对手射门的瞬间点击球会去的位置，门将就会飞身扑救。"},"막을 땐 상대가 공을 차는 순간까지 기다렸다가 누르세요.":{en:"When saving, wait until the opponent kicks the ball, then tap.",ja:"守るときは、相手がボールを蹴る瞬間まで待ってからタップ。",zh:"扑球时，等对手踢球的瞬间再点击。"},"몸 날려 막기":{en:"Dive to save",ja:"飛びついて守る",zh:"飞身扑救"},"미는 길이 한쪽으로 휘면 공도 그쪽으로 휘어 들어가요.":{en:"If your swipe path curves to one side, the ball curves that way too.",ja:"スワイプの軌道が片側に曲がると、ボールもそちらへ曲がって入ります。",zh:"滑动轨迹向一侧弯，球也会向那边拐弯入网。"},"밀다가 옆으로 휘면 공도 휘어요":{en:"If you swipe sideways, the ball curves",ja:"スワイプが横に曲がるとボールもカーブする",zh:"滑动时若向侧面拐，球也会拐弯"},"빗나감!":{en:"Miss!",ja:"ミス！",zh:"偏出！"},"서든데스!":{en:"Sudden Death!",ja:"サドンデス！",zh:"突然死亡！"},"선방!":{en:"Save!",ja:"セーブ！",zh:"扑救！"},"승부차기":{en:"Penalty Shootout",ja:"PK戦",zh:"点球大战"},"승부차기 승리!":{en:"Penalty Shootout win!",ja:"PK戦勝利！",zh:"点球大战获胜！"},"실축 · 선방 · 골대":{en:"Missed · Save · Post",ja:"ミス · セーブ · ポスト",zh:"射失 · 扑救 · 中柱"},"왕머리 선수들의 승부차기 대결. 밀어서 방향 · 세기 · 휘는 공을 정하고, 막을 때는 공이 올 곳을 눌러 몸을 날리세요. {0}번씩 차고 동점이면 서든데스!":{en:"A Penalty Shootout showdown between Bobblehead players. Swipe to set direction, power and curve; when saving, tap where the ball will land to dive. Kick {0} times each, and if tied, Sudden Death!",ja:"デカ頭選手たちのPK戦対決。スワイプで方向・強さ・カーブを決め、守るときはボールが来る場所をタップして飛びつこう。{0}回ずつ蹴って、同点ならサドンデス！",zh:"大头球员的点球大战对决。滑动决定方向、力度和弧线，扑球时点击球会去的位置飞身扑救。各踢{0}次，平局则进入突然死亡！"},"차기 (방향 · 높이 · 휘기)":{en:"Kick (direction · height · curve)",ja:"キック（方向 · 高さ · カーブ）",zh:"射门（方向 · 高度 · 弧线）"},"찰 때: 공에서 위로 밀기 · 옆으로 밀수록 구석, 빠르게 밀수록 높이 (너무 세면 넘어가요)":{en:"To kick: swipe up from the ball · The more sideways, the nearer the corner; the faster, the higher (too hard and it goes over)",ja:"蹴るとき：ボールから上へスワイプ · 横に傾けるほどコーナー、速いほど高く（強すぎると越える）",zh:"射门时：从球上向上滑 · 越偏向侧面越靠角，越快越高（太用力会射飞）"},"찰 때는 공에서 위로 밀어요. 옆으로 기울일수록 구석으로, 빠르게 밀수록 높이 날아가요. 너무 세게 밀면 가로대를 넘어가요.":{en:"To kick, swipe up from the ball. The more you tilt sideways, the nearer the corner; the faster you swipe, the higher it flies. Swipe too hard and it goes over the crossbar.",ja:"蹴るときはボールから上へスワイプ。横に傾けるほどコーナーへ、速くスワイプするほど高く飛びます。強すぎるとクロスバーを越えます。",zh:"射门时从球上向上滑。越偏向侧面越靠近死角，滑得越快飞得越高。太用力会越过横梁。"},"휘는 공":{en:"Curve ball",ja:"カーブボール",zh:"弧线球"},"+40 체력":{en:"+40 HP",ja:"HP+40",zh:"生命值+40"},"100m마다 점선이 있어요. 노란 줄은 내 최고 기록!":{en:"There's a dotted line every 100m. The yellow line is your best record!",ja:"100mごとに点線があるよ。黄色い線は自己ベスト！",zh:"每100m有一条虚线。黄线是你的最高纪录！"},"3분마다 등장":{en:"Appears every 3 min",ja:"3分ごとに出現",zh:"每3分钟出现"},"3분마다 보스 등장! 오래 버틸수록 높은 기록":{en:"A boss appears every 3 min! Survive longer for a higher record",ja:"3分ごとにボス出現！長く耐えるほど高記録",zh:"每3分钟出现Boss！坚持越久纪录越高"},"4:4 (골키퍼 1 + 수비 2 + 공격 1). 노란 고리(2P는 분홍 고리) 선수를 조종해요. 공에 가까운 선수로 자동으로 바뀌어요.":{en:"4v4 (1 goalkeeper + 2 defenders + 1 striker). Control the player with the yellow ring (pink ring for 2P). Control switches automatically to the player nearest the ball.",ja:"4対4（キーパー1＋DF2＋FW1）。黄色い輪（2Pはピンクの輪）の選手を操作。ボールに一番近い選手に自動で切り替わるよ。",zh:"4对4（门将1＋后卫2＋前锋1）。操控带黄色圆圈（2P为粉色圆圈）的球员。会自动切换到离球最近的球员。"},"90초마다 몬스터 무리가 사방에서 몰려오고, 3분마다 왕관 쓴 보스가 나와요.":{en:"Every 90s a monster horde swarms in from all sides, and every 3 min a crowned boss appears.",ja:"90秒ごとにモンスターの群れが四方から押し寄せ、3分ごとに王冠をかぶったボスが登場！",zh:"每90秒怪物群会从四面八方涌来，每3分钟会出现戴王冠的Boss。"},"9방향으로 차고, 공이 오는 바로 그 자리를 막아야 선방! 몇 번 연속 넣을까?":{en:"Shoot in 9 directions, and block right where the ball is headed to save it! How many in a row can you score?",ja:"9方向にシュート！ボールが来るその場所を止めればセーブ！何回連続で決められる？",zh:"可朝9个方向射门，在球飞来的位置精准扑救！能连续进几球？"},"⚠ 보스 등장!":{en:"⚠ Boss incoming!",ja:"⚠ ボス出現！",zh:"⚠ Boss来袭！"},"⚽ 미니 축구 4:4 — 친구랑 한 폰으로 둘이서":{en:"⚽ Mini Soccer 4v4 — two players on one phone with a friend",ja:"⚽ ミニサッカー4対4 — 友だちと1台のスマホで2人プレイ",zh:"⚽ 迷你足球4对4 — 和朋友一部手机双人对战"},"가까이 온 적을 계속 태움":{en:"Keeps burning nearby enemies",ja:"近づいた敵を燃やし続ける",zh:"持续灼烧靠近的敌人"},"가벼운 발":{en:"Light Feet",ja:"軽い足",zh:"轻盈步伐"},"가장 가까운 적에게 자동 발사":{en:"Auto-fires at the nearest enemy",ja:"一番近い敵に自動発射",zh:"自动射向最近的敌人"},"가장 작은 과일":{en:"Smallest fruit",ja:"一番小さいフルーツ",zh:"最小的水果"},"가장 큰 과일 ·":{en:"Biggest fruit ·",ja:"一番大きいフルーツ ·",zh:"最大的水果 ·"},"가장 큰 과일 · 둘을 합치면 보너스":{en:"Biggest fruit · Merge two for a bonus",ja:"一番大きいフルーツ · 2つ合わせるとボーナス",zh:"最大的水果 · 合成两个有奖励"},"가장 큰 과일:":{en:"Biggest fruit:",ja:"一番大きいフルーツ：",zh:"最大的水果："},"갈색 발판":{en:"Brown platform",ja:"茶色い足場",zh:"棕色平台"},"갈색 발판은 밟으면 부서져요. 하얀 구름 발판은 한 번 밟으면 사라지고, 파란 발판은 좌우로 움직여요.":{en:"Brown platforms break when you step on them. White cloud platforms vanish after one bounce, and blue platforms move side to side.",ja:"茶色い足場は踏むと壊れるよ。白い雲の足場は1回踏むと消えて、青い足場は左右に動くよ。",zh:"棕色平台踩上去会碎。白色云朵平台踩一次就会消失，蓝色平台会左右移动。"},"갈색 발판은 밟지 말고 지나쳐요.":{en:"Skip brown platforms—don't land on them.",ja:"茶色い足場は踏まずにスルーしよう。",zh:"别踩棕色平台，直接跳过。"},"강화 고르기":{en:"Choose an upgrade",ja:"強化を選ぶ",zh:"选择强化"},"같은 과일 두 개가 닿으면 합쳐져 다음 과일로":{en:"Two matching fruits merge into the next fruit when they touch",ja:"同じフルーツが2つ触れると合体して次のフルーツに",zh:"两个相同水果碰到就会合成下一种水果"},"같은 과일 두 개가 닿으면 합쳐져 한 단계 큰 과일이 돼요: 블루베리 → 체리 → 딸기 → 포도 → 귤 → 사과 → 배 → 복숭아 → 파인애플 → 멜론 → 수박.":{en:"Two matching fruits merge into a bigger fruit when they touch: Blueberry → Cherry → Strawberry → Grape → Tangerine → Apple → Pear → Peach → Pineapple → Melon → Watermelon.",ja:"同じフルーツが2つ触れると合体して1段階大きいフルーツに：ブルーベリー → さくらんぼ → いちご → ぶどう → みかん → りんご → 梨 → 桃 → パイナップル → メロン → スイカ。",zh:"两个相同水果碰到就会合成更大一级的水果：蓝莓 → 樱桃 → 草莓 → 葡萄 → 橘子 → 苹果 → 梨 → 桃子 → 菠萝 → 甜瓜 → 西瓜。"},"같은 과일을 합쳐 수박까지! 한 번 시작하면 멈출 수 없는 물리 퍼즐":{en:"Merge matching fruits all the way to a watermelon! A physics puzzle you can't put down",ja:"同じフルーツを合わせてスイカまで！始めたら止まらない物理パズル",zh:"合成相同水果直到西瓜！一玩就停不下来的物理益智游戏"},"같은 과일을 합쳐 점점 큰 과일을 만들고, 상자가 넘치기 전까지 최대한 높은 점수를 노리세요.":{en:"Merge matching fruits into bigger ones and aim for the highest score before the box overflows.",ja:"同じフルーツを合わせてどんどん大きくし、箱があふれる前にハイスコアを目指そう。",zh:"合成相同水果做出更大的水果，在箱子溢出前冲击最高分。"},"경험치 줍는 범위 +40%":{en:"Gem pickup range +40%",ja:"経験値の回収範囲 +40%",zh:"经验拾取范围 +40%"},"공 없을 때: 태클 · 선수 바꾸기 · 공에 가까운 선수로 자동 전환":{en:"Without the ball: Tackle · Switch player · Auto-switch to the player nearest the ball",ja:"ボールなし：タックル · 選手切り替え · ボールに近い選手へ自動切り替え",zh:"无球时：铲抢 · 切换球员 · 自动切换到离球最近的球员"},"공 있을 때: 패스 · 슛 (1P X·Z / 2P G·F) — 스틱 방향으로 차요":{en:"With the ball: Pass · Shoot (1P X·Z / 2P G·F) — kicks in the stick direction",ja:"ボールあり：パス · シュート（1P X·Z / 2P G·F）— スティックの方向に蹴るよ",zh:"持球时：传球 · 射门（1P X·Z / 2P G·F）— 朝摇杆方向踢"},"과일 합치기":{en:"Fruit Merge",ja:"フルーツ合体",zh:"水果合成"},"과일을 떨어뜨려 같은 과일끼리 닿게 하면 한 단계 큰 과일로 변해요. 블루베리에서 수박까지! 상자 위 선을 넘으면 끝.":{en:"Drop fruits so matching ones touch and they turn into a bigger fruit. From blueberry to watermelon! Cross the line above the box and it's over.",ja:"フルーツを落として同じもの同士をくっつけると1段階大きいフルーツに。ブルーベリーからスイカまで！箱の上の線を越えたら終了。",zh:"投下水果让相同的碰在一起，就会变成更大一级的水果。从蓝莓到西瓜！超过箱子上方的线就结束。"},"과일이 위쪽 빨간 선을 넘은 채로 오래 있으면 끝 · 수박 두 개를 합치면 큰 보너스":{en:"Game over if fruit stays above the red line too long · Merge two watermelons for a big bonus",ja:"フルーツが上の赤い線を越えたまま長くいると終了 · スイカ2つを合わせると大ボーナス",zh:"水果长时间超过上方红线即结束 · 合成两个西瓜有大奖励"},"과일이 위쪽 빨간 점선을 넘은 채로 잠깐 멈춰 있으면 끝.":{en:"Game over if fruit rests above the red dotted line at the top for a moment.",ja:"フルーツが上の赤い点線を越えたまま少し止まると終了。",zh:"水果超过上方红色虚线并停留片刻即结束。"},"구름 발판":{en:"Cloud platform",ja:"雲の足場",zh:"云朵平台"},"구름 점프":{en:"Cloud Jump",ja:"クラウドジャンプ",zh:"云朵跳跃"},"넘치면 끝":{en:"Game over if it overflows",ja:"あふれたら終了",zh:"溢出即结束"},"높이":{en:"Height",ja:"高さ",zh:"高度"},"높이 점프":{en:"High jump",ja:"ハイジャンプ",zh:"高跳"},"누른 채 끌기":{en:"Press & drag",ja:"押したままドラッグ",zh:"按住拖动"},"다음":{en:"Next",ja:"次へ",zh:"下一个"},"다음 과일을 보고 미리 자리를 비워 두세요.":{en:"Check the next fruit and make room for it in advance.",ja:"次のフルーツを見て、先に場所を空けておこう。",zh:"看好下一个水果，提前留出位置。"},"닭다리":{en:"Drumstick",ja:"骨付き肉",zh:"鸡腿"},"도끼 던지기":{en:"Axe Toss",ja:"斧投げ",zh:"飞斧"},"둘이서: 한 기기 왼쪽 절반은 1P(아래 팀), 오른쪽 절반은 2P(위 팀). 키보드는 1P 방향키·N·M, 2P WASD·G·F.":{en:"Two players: on one device, the left half is 1P (bottom team), the right half is 2P (top team). Keyboard: 1P arrow keys·N·M, 2P WASD·G·F.",ja:"2人プレイ：1台の画面の左半分は1P（下チーム）、右半分は2P（上チーム）。キーボードは1P 方向キー·N·M、2P WASD·G·F。",zh:"双人模式：同一设备左半边为1P（下方队伍），右半边为2P（上方队伍）。键盘：1P 方向键·N·M，2P WASD·G·F。"},"딱 맞추면 잘리지 않음":{en:"Land it exactly and nothing gets cut",ja:"ぴったり合わせると削れない",zh:"完美对齐就不会被切掉"},"딱 맞추면 퍼펙트! 연속 퍼펙트면 블록이 조금씩 커져요":{en:"Line it up exactly for a Perfect! Perfect streaks make the block grow little by little",ja:"ぴったりでパーフェクト！連続パーフェクトでブロックが少しずつ大きくなるよ",zh:"完美对齐就是Perfect！连续Perfect方块会慢慢变大"},"딱 맞추면 퍼펙트! 퍼펙트를 3번 이상 이어가면 블록이 조금씩 다시 커져요.":{en:"Line it up exactly for a Perfect! Keep a streak of 3+ Perfects and the block slowly grows back.",ja:"ぴったりでパーフェクト！3回以上パーフェクトを続けるとブロックが少しずつ大きく戻るよ。",zh:"完美对齐就是Perfect！连续3次以上Perfect，方块会慢慢变回大块。"},"떨어뜨리기":{en:"Drop",ja:"落とす",zh:"投下"},"떨어지는 중에 다음 발판 바로 위로 미리 가 있으세요.":{en:"While falling, move right above the next platform in advance.",ja:"落ちている間に、次の足場の真上へ先回りしよう。",zh:"下落时提前移动到下一个平台的正上方。"},"레벨 업!":{en:"Level up!",ja:"レベルアップ！",zh:"升级！"},"레벨 업마다 카드 3장 중 하나를 골라요. 무기는 최대 4종까지, 각각 6레벨까지 강해져요.":{en:"Each level up, pick one of 3 cards. Hold up to 4 weapons, each upgradable to Lv 6.",ja:"レベルアップごとに3枚のカードから1枚を選ぶよ。武器は最大4種類、それぞれLv6まで強化できるよ。",zh:"每次升级从3张卡中选1张。武器最多4种，每种可强化至6级。"},"레벨업하면 카드 3장 중 하나를 골라요":{en:"Level up to pick one of 3 cards",ja:"レベルアップで3枚のカードから1枚を選ぶ",zh:"升级后从3张卡中选1张"},"마리 밟기":{en:"stomped",ja:"匹踏みつけ",zh:"只踩踏"},"막을 때: 공이 날아오는 바로 그 지점을 정확히 누르기 · 손이 그 자리로 가요 · 미리 누르면 반대로 차요":{en:"To save: tap exactly where the ball is flying · The keeper's hands go there · Tap too early and you dive the wrong way",ja:"セーブ：ボールが飛んでくる地点を正確にタップ · 手がその場所へ · 早押しすると逆に飛ぶよ",zh:"扑救：精准点击球飞来的位置 · 手会扑向那里 · 点太早会扑反方向"},"막을 때는 공이 날아오는 바로 그 지점을 정확히 눌러야 해요. 골키퍼 손이 누른 자리로 가고, 빗나가면 못 막아요 (몸에 맞으면 막힘).":{en:"To save, tap exactly where the ball is flying. The keeper's hands go to the spot you tap—miss and it's a goal (a hit to the body still counts as a save).",ja:"セーブするには、ボールが飛んでくる地点を正確にタップしよう。キーパーの手はタップした場所へ動き、外れると止められないよ（体に当たればセーブ）。",zh:"扑救时要精准点击球飞来的位置。门将的手会扑向点击处，偏了就挡不住（打到身上也算扑出）。"},"멈춰 있지 말고 크게 원을 그리며 도세요.":{en:"Don't stand still—keep running in big circles.",ja:"止まらずに、大きく円を描いて回ろう。",zh:"别停下，绕大圈跑动。"},"모든 공격 쿨타임 -8%":{en:"All attack cooldowns -8%",ja:"全攻撃のクールタイム -8%",zh:"所有攻击冷却 -8%"},"몬스터 서바이벌":{en:"Monster Survival",ja:"モンスターサバイバル",zh:"怪物生存战"},"몬스터가 몰려온다!":{en:"Monsters are coming!",ja:"モンスターが押し寄せる！",zh:"怪物来袭！"},"몬스터에 닿아 있으면 체력이 줄어요. 체력이 0이 되면 끝.":{en:"Touching monsters drains your HP. Game over at 0 HP.",ja:"モンスターに触れているとHPが減るよ。HPが0になったら終了。",zh:"接触怪物会减少生命值。生命值归零即结束。"},"몰려오는 몬스터 사이에서 최대한 오래 살아남으세요.":{en:"Survive as long as you can amid the swarming monsters.",ja:"押し寄せるモンスターの中でできるだけ長く生き残ろう。",zh:"在蜂拥而至的怪物中尽可能久地存活。"},"몸 주위를 도는 빛 구슬":{en:"Glowing orbs circle around you",ja:"体のまわりを回る光の玉",zh:"绕身旋转的光球"},"무기는 저절로 공격해요. 적이 떨군 보석을 주우면 경험치":{en:"Weapons attack on their own. Pick up gems enemies drop for XP",ja:"武器は自動で攻撃。敵が落とした宝石を拾うと経験値",zh:"武器会自动攻击。捡起敌人掉落的宝石获得经验"},"무작위 적에게 벼락":{en:"Strikes random enemies with lightning",ja:"ランダムな敵に落雷",zh:"随机劈向敌人的闪电"},"밟았다! +20m 보너스":{en:"Stomped! +20m bonus",ja:"踏んだ！+20mボーナス",zh:"踩中！+20m奖励"},"밟으면 부서짐":{en:"Breaks when stepped on",ja:"踏むと壊れる",zh:"踩了会碎"},"버틴 시간이 기록이에요.":{en:"Your survival time is your record.",ja:"耐えた時間が記録になるよ。",zh:"存活时间就是你的纪录。"},"벌은 위에서 밟으면 물리치고 +20m 보너스. 옆이나 아래에서 부딪히면 끝.":{en:"Stomp bees from above to beat them for a +20m bonus. Bump into them from the side or below and it's over.",ja:"ハチは上から踏めば倒せて+20mボーナス。横や下からぶつかると終了。",zh:"从上方踩蜜蜂可击败它，获得+20m奖励。从侧面或下方撞到就结束。"},"벌은 위에서 밟으면 물리치고, 옆에서 부딪히면 끝":{en:"Stomp bees from above to beat them; bump into them from the side and it's over",ja:"ハチは上から踏めば倒せる。横からぶつかると終了",zh:"从上方踩蜜蜂可击败它，从侧面撞到就结束"},"병아리는 발판에 닿으면 저절로 튀어 올라요":{en:"The chick bounces automatically when it lands on a platform",ja:"ヒヨコは足場に触れると自動で跳ねるよ",zh:"小鸡碰到平台会自动弹起"},"병아리는 발판에 닿으면 저절로 튀어 올라요. 좌우만 움직이면 돼요.":{en:"The chick bounces automatically when it lands on a platform. Just move left and right.",ja:"ヒヨコは足場に触れると自動で跳ねるよ。左右に動かすだけでOK。",zh:"小鸡碰到平台会自动弹起。只需左右移动就好。"},"보석을 먹으러 몬스터 무리에 뛰어들지 마세요. 자석 강화가 도움돼요.":{en:"Don't dive into a monster horde to grab gems. The Magnet upgrade helps.",ja:"宝石を拾いにモンスターの群れへ飛び込まないで。磁石の強化が役立つよ。",zh:"别为了捡宝石冲进怪物群。磁铁强化很有用。"},"보스 처치!":{en:"Boss defeated!",ja:"ボス撃破！",zh:"击败Boss！"},"분":{en:"min",ja:"分",zh:"分"},"분홍 보석":{en:"Pink gem",ja:"ピンクの宝石",zh:"粉色宝石"},"불꽃 고리":{en:"Flame Ring",ja:"炎の輪",zh:"火焰环"},"블록 떨어뜨리기":{en:"Drop the block",ja:"ブロックを落とす",zh:"投下方块"},"블록이 끝까지 갔다 돌아올 때가 가장 느려 보여요. 리듬을 타세요.":{en:"The block looks slowest when it turns around at the edge. Find the rhythm.",ja:"ブロックは端で折り返すときが一番ゆっくりに見えるよ。リズムに乗ろう。",zh:"方块在边缘折返时看起来最慢。抓住节奏。"},"블록이 아래 블록을 완전히 벗어나면 끝.":{en:"Game over if the block misses the one below completely.",ja:"ブロックが下のブロックから完全に外れたら終了。",zh:"方块完全偏离下方方块即结束。"},"빨간 점선":{en:"Red dotted line",ja:"赤い点線",zh:"红色虚线"},"상자가 넘쳤어요!":{en:"The box overflowed!",ja:"箱があふれた！",zh:"箱子溢出了！"},"생존":{en:"Survived",ja:"生存",zh:"存活"},"생존 · 자동 공격":{en:"Survival · Auto-attack",ja:"サバイバル · 自動攻撃",zh:"生存 · 自动攻击"},"서바이벌":{en:"Survival",ja:"サバイバル",zh:"生存"},"수박 두 개를 합치면 둘 다 사라지며 큰 보너스!":{en:"Merge two watermelons and both vanish for a big bonus!",ja:"スイカを2つ合わせると両方消えて大ボーナス！",zh:"合成两个西瓜，两个都会消失并获得大奖励！"},"수박 둘! +100":{en:"Two watermelons! +100",ja:"スイカ2つ！+100",zh:"两个西瓜！+100"},"스틱":{en:"Stick",ja:"スティック",zh:"摇杆"},"스틱: 이동 (1P 방향키 · 2P WASD)":{en:"Stick: Move (1P arrow keys · 2P WASD)",ja:"スティック：移動（1P 方向キー · 2P WASD）",zh:"摇杆：移动（1P 方向键 · 2P WASD）"},"스프링을 밟으면 크게, 분홍 풍선을 잡으면 한동안 쭉 솟아올라요.":{en:"Springs launch you high, and grabbing a pink balloon lifts you way up for a while.",ja:"スプリングを踏むと大ジャンプ、ピンクの風船をつかむとしばらくぐんぐん上昇！",zh:"踩弹簧能高高跳起，抓住粉色气球能持续上升一阵子。"},"쌓은 블록 수 = 점수":{en:"Blocks stacked = score",ja:"積んだブロック数 = スコア",zh:"堆叠方块数 = 分数"},"쓰러진 몬스터가 떨군 보석을 주우면 경험치가 차요. 경험치 막대가 가득 차면 레벨 업!":{en:"Pick up gems dropped by defeated monsters to fill your XP. Fill the XP bar to level up!",ja:"倒したモンスターが落とした宝石を拾うと経験値がたまるよ。経験値バーが満タンになるとレベルアップ！",zh:"捡起被击败怪物掉落的宝石来积累经验。经验条满了就升级！"},"아래 블록에서 삐져나온 부분은 잘려 나가고, 남은 크기로 다음 블록이 나와요.":{en:"Any part hanging off the block below gets cut off, and the next block comes in at the remaining size.",ja:"下のブロックからはみ出た部分は削られ、残ったサイズで次のブロックが出てくるよ。",zh:"超出下方方块的部分会被切掉，下一个方块以剩余大小出现。"},"아래로 떨어져 화면 밖으로 나가면 끝.":{en:"Game over if you fall off the bottom of the screen.",ja:"下に落ちて画面の外に出たら終了。",zh:"掉出屏幕下方即结束。"},"어긋난 만큼 잘려 나가고 블록이 작아져요":{en:"The overhang gets cut and the block shrinks",ja:"ずれた分だけ削られてブロックが小さくなる",zh:"偏多少就切掉多少，方块会变小"},"오가는 블록을 딱 맞춰 쌓아 하늘까지! 삐져나온 부분은 잘려 나가고, 딱 맞추면 퍼펙트 콤보로 블록이 다시 커져요.":{en:"Stack the sliding blocks perfectly all the way to the sky! Overhangs get cut off, but Perfect combos make the block grow again.",ja:"行き来するブロックをぴったり積んで空まで！はみ出た部分は削られるけど、パーフェクトコンボでブロックがまた大きくなるよ。",zh:"把来回移动的方块精准堆叠直上云霄！超出部分会被切掉，Perfect连击能让方块重新变大。"},"움직이기":{en:"Move",ja:"移動",zh:"移动"},"움직이기만 하면 공격은 자동! 몰려오는 몬스터를 버티며 나만의 무기 조합을 완성하세요":{en:"Just move—attacks are automatic! Survive the swarming monsters and build your own weapon combo",ja:"動くだけで攻撃は自動！押し寄せるモンスターに耐えて自分だけの武器の組み合わせを完成させよう",zh:"只需移动，攻击全自动！抵御蜂拥而来的怪物，打造专属武器组合"},"움직이기만 하면 돼요. 무기는 저절로 공격해요.":{en:"Just move. Your weapons attack on their own.",ja:"動くだけでOK。武器は自動で攻撃するよ。",zh:"只需移动就好。武器会自动攻击。"},"움직이기만 하세요, 공격은 무기가 알아서! 몰려오는 몬스터를 버티며 레벨업마다 3장 중 1장을 골라 나만의 조합으로 강해지세요.":{en:"Just move—your weapons handle the attacking! Survive the monster swarm, pick 1 of 3 cards each level up, and power up with your own build.",ja:"動くだけ、攻撃は武器におまかせ！押し寄せるモンスターに耐えながら、レベルアップごとに3枚から1枚を選んで自分だけの組み合わせで強くなろう。",zh:"只管移动，攻击交给武器！抵御蜂拥而来的怪物，每次升级从3张卡中选1张，用专属组合变强。"},"위에서 내려다보는 4:4 아케이드 축구. 스틱으로 달리고 패스로 엮어 슛! 공이 없을 땐 태클로 뺏으세요. 2분 경기, 동점이면 골든골. 한 기기 둘이서도 돼요.":{en:"Top-down 4v4 arcade soccer. Run with the stick, link up passes, and shoot! Tackle to steal when you don't have the ball. 2-minute matches, golden goal if tied. Two players can share one device, too.",ja:"上から見下ろす4対4アーケードサッカー。スティックで走り、パスをつないでシュート！ボールがないときはタックルで奪おう。1試合2分、同点ならゴールデンゴール。1台で2人プレイもOK。",zh:"俯视视角4对4街机足球。用摇杆奔跑，传球配合射门！无球时用铲抢夺球。每场2分钟，平局则金球制胜。也支持同一设备双人对战。"},"위에서 밟기":{en:"Stomp from above",ja:"上から踏む",zh:"从上方踩"},"위치":{en:"Position",ja:"位置",zh:"位置"},"위치 정하기":{en:"Set position",ja:"位置を決める",zh:"选定位置"},"이동 (둘이서는 화면 왼쪽 1P · 오른쪽 2P)":{en:"Move (two players: 1P on the left side of the screen · 2P on the right)",ja:"移動（2人プレイは画面左が1P · 右が2P）",zh:"移动（双人时屏幕左侧1P · 右侧2P）"},"자석! 보석이 모두 날아와요":{en:"Magnet! All gems fly to you",ja:"磁石！宝石が全部飛んでくる",zh:"磁铁！宝石全部飞过来"},"작아졌을 땐 무리하지 말고 퍼펙트 연속으로 키우세요.":{en:"When the block gets small, play it safe and grow it back with Perfect streaks.",ja:"小さくなったら無理せず、連続パーフェクトで大きくしよう。",zh:"方块变小时别冒险，用连续Perfect把它变大。"},"작은 과일이 큰 과일 사이에 끼지 않게 조심.":{en:"Don't let small fruits get stuck between big ones.",ja:"小さいフルーツが大きいフルーツの間にはさまらないよう注意。",zh:"小心别让小水果卡在大水果之间。"},"좌우로 끌기":{en:"Drag left/right",ja:"左右にドラッグ",zh:"左右拖动"},"좌우로 오가는 블록을 딱 맞춰 떨어뜨려 탑을 최대한 높이 쌓으세요.":{en:"Drop the side-to-side sliding block right on target and build the tower as high as you can.",ja:"左右に動くブロックをぴったり落として、タワーをできるだけ高く積もう。",zh:"把左右移动的方块精准投下，尽可能把塔堆高。"},"좌우로 움직임":{en:"Moves side to side",ja:"左右に動く",zh:"左右移动"},"중간 크기":{en:"Medium size",ja:"中くらい",zh:"中等大小"},"지금 뜨는 새 게임":{en:"New & trending games",ja:"いま話題の新作ゲーム",zh:"热门新游戏"},"쭉 솟아오름":{en:"Shoots way up",ja:"ぐんぐん上昇",zh:"一飞冲天"},"첫 기록에 도전!":{en:"Set your first record!",ja:"初記録に挑戦！",zh:"挑战首个纪录！"},"체력 +40":{en:"HP +40",ja:"HP+40",zh:"生命值+40"},"체력 모두 회복":{en:"Fully restores HP",ja:"HP全回復",zh:"生命值全部恢复"},"초 생존 · 처치":{en:"s survived · Kills",ja:"秒生存 · 撃破",zh:"秒存活 · 击败"},"초록 발판":{en:"Green platform",ja:"緑の足場",zh:"绿色平台"},"초반엔 무기 종류를 늘리고, 중반부터는 한두 개를 끝까지 키우세요.":{en:"Early on, collect more weapon types; from midgame, max out one or two.",ja:"序盤は武器の種類を増やし、中盤からは1～2個を最大まで育てよう。",zh:"前期多拿几种武器，中期开始集中把一两种升满。"},"최대 체력 +20 · 체력 모두 회복":{en:"Max HP +20 · Fully restores HP",ja:"最大HP+20 · HP全回復",zh:"最大生命值+20 · 生命值全部恢复"},"층이 오를수록 블록이 빨라져요.":{en:"Blocks speed up as the tower gets taller.",ja:"高く積むほどブロックが速くなるよ。",zh:"塔越高，方块移动越快。"},"친구와 승부차기":{en:"Penalty shootout with a friend",ja:"友だちとPK戦",zh:"和朋友点球大战"},"카드 고르기":{en:"Choose a card",ja:"カードを選ぶ",zh:"选择卡牌"},"카드 누르기":{en:"Tap a card",ja:"カードをタップ",zh:"点击卡牌"},"큰 과일은 한쪽 구석에 모으세요.":{en:"Gather big fruits in one corner.",ja:"大きいフルーツは片方の隅に集めよう。",zh:"把大水果集中到一个角落。"},"클수록 점수가 많고, 연달아 합치면 콤보 보너스.":{en:"Bigger fruits score more, and back-to-back merges earn combo bonuses.",ja:"大きいほど高得点、続けて合わせるとコンボボーナス。",zh:"水果越大分数越高，连续合成有连击奖励。"},"타이밍 · 한 손":{en:"Timing · One hand",ja:"タイミング · 片手",zh:"时机 · 单手"},"탑 쌓기":{en:"Stack Tower",ja:"スタックタワー",zh:"堆塔"},"통통 튀는 병아리를 좌우로 움직여 발판을 밟고 최대한 높이 올라가세요.":{en:"Move the bouncy chick left and right to land on platforms and climb as high as you can.",ja:"ぴょんぴょん跳ねるヒヨコを左右に動かして足場を踏み、できるだけ高く登ろう。",zh:"左右移动蹦蹦跳跳的小鸡踩上平台，尽可能往高处爬。"},"통통 튀는 병아리를 좌우로 움직여 발판을 밟고 하늘 끝까지! 스프링·풍선을 타면 쭉 솟구치고, 부서지는 발판과 벌을 조심.":{en:"Move the bouncy chick left and right to land on platforms all the way to the sky! Ride springs and balloons to soar, and watch out for breaking platforms and bees.",ja:"ぴょんぴょん跳ねるヒヨコを左右に動かして足場を踏み、空の果てまで！スプリングや風船でぐんと上昇、壊れる足場とハチに注意。",zh:"左右移动蹦蹦跳跳的小鸡踩上平台，直冲天际！借助弹簧和气球一飞冲天，小心会碎的平台和蜜蜂。"},"통통 튀는 병아리와 하늘 끝까지! 스프링·풍선 타고 몇 m까지 갈 수 있을까?":{en:"To the top of the sky with a bouncy chick! How many meters can you go with springs and balloons?",ja:"ぴょんぴょんヒヨコと空の果てまで！スプリングと風船で何mまで行ける？",zh:"和蹦蹦跳跳的小鸡冲向天际！借助弹簧和气球能飞多少m？"},"튼튼한 몸":{en:"Sturdy Body",ja:"頑丈な体",zh:"强健体魄"},"파란 발판":{en:"Blue platform",ja:"青い足場",zh:"蓝色平台"},"파란 보석":{en:"Blue gem",ja:"青い宝石",zh:"蓝色宝石"},"포물선으로 날아가 모두 관통":{en:"Flies in an arc, piercing everything",ja:"放物線を描いて飛び、すべて貫通",zh:"呈抛物线飞出，贯穿一切"},"풍선 타고 슝!":{en:"Balloon ride, whoosh!",ja:"風船でびゅーん！",zh:"乘气球，嗖！"},"하나를 고르세요":{en:"Pick one",ja:"1つ選んでね",zh:"选一个吧"},"한 번 밟으면 사라짐":{en:"Vanishes after one step",ja:"1回踏むと消える",zh:"踩一次就消失"},"화면 누르기":{en:"Tap the screen",ja:"画面をタップ",zh:"点击屏幕"},"화면 아무 곳이나 누른 채 끌면 그쪽으로 움직여요 (방향키·WASD도 돼요)":{en:"Press and drag anywhere on the screen to move that way (arrow keys·WASD work too)",ja:"画面のどこでも押したままドラッグするとその方向に動くよ（方向キー·WASDもOK）",zh:"在屏幕任意位置按住拖动即可朝该方向移动（方向键·WASD也可以）"},"화면 옆으로 나가면 반대쪽에서 나와요":{en:"Go off one side of the screen and you come out the other",ja:"画面の横から出ると反対側から出てくるよ",zh:"从屏幕一侧出去会从另一侧出现"},"화면 왼쪽 끝으로 나가면 오른쪽에서, 오른쪽 끝으로 나가면 왼쪽에서 나와요.":{en:"Go off the left edge of the screen and you come out on the right, and vice versa.",ja:"画面の左端から出ると右から、右端から出ると左から出てくるよ。",zh:"从屏幕左边出去会从右边出现，从右边出去会从左边出现。"},"화면을 누르면 블록이 떨어져요 (스페이스)":{en:"Tap the screen to drop the block (Space)",ja:"画面をタップするとブロックが落ちるよ（スペース）",zh:"点击屏幕投下方块（空格键）"},"화면을 누르면 움직이던 블록이 그 자리에 떨어져요.":{en:"Tap the screen and the moving block drops right where it is.",ja:"画面をタップすると、動いていたブロックがその場に落ちるよ。",zh:"点击屏幕，移动中的方块会在当前位置落下。"},"화면을 누른 채 끌어서 움직여요 · 공격은 자동!":{en:"Press and drag on the screen to move · Attacks are automatic!",ja:"画面を押したままドラッグで移動 · 攻撃は自動！",zh:"按住屏幕拖动来移动 · 攻击全自动！"},"화면을 눌러 블록을 쌓으세요":{en:"Tap the screen to stack blocks",ja:"画面をタップしてブロックを積もう",zh:"点击屏幕堆叠方块"},"화면을 좌우로 끌거나 방향키로 움직여요":{en:"Drag left/right on the screen or use the arrow keys to move",ja:"画面を左右にドラッグするか方向キーで移動",zh:"左右拖动屏幕或用方向键移动"},"화면을 좌우로 끌어 떨어뜨릴 위치를 정하고, 손을 떼면 과일이 떨어져요.":{en:"Drag left/right on the screen to choose where to drop, then let go to drop the fruit.",ja:"画面を左右にドラッグして落とす位置を決め、指を離すとフルーツが落ちるよ。",zh:"左右拖动屏幕选择投放位置，松手水果就会落下。"},"화면을 좌우로 끌어 움직여요 · 방향키도 돼요":{en:"Drag left/right on the screen to move · Arrow keys work too",ja:"画面を左右にドラッグして移動 · 方向キーもOK",zh:"左右拖动屏幕来移动 · 也可用方向键"},"화면을 좌우로 끌어 위치를 정하고 떼면 떨어져요 (← → · 스페이스)":{en:"Drag left/right to set the position and release to drop (← → · Space)",ja:"画面を左右にドラッグして位置を決め、離すと落ちるよ（← → · スペース）",zh:"左右拖动选定位置，松手即落下（← → · 空格键）"},"화면의 보석을 모두 끌어옴":{en:"Pulls in every gem on the screen",ja:"画面上の宝石をすべて引き寄せる",zh:"吸取屏幕上所有宝石"},"회복":{en:"Heal",ja:"回復",zh:"恢复"},"회전 구슬":{en:"Orbiting Orbs",ja:"回転オーブ",zh:"环绕光球"},"🍉 과일 합치기 — 수박까지 만들 수 있을까?":{en:"🍉 Fruit Merge — can you make a watermelon?",ja:"🍉 フルーツ合体 — スイカまで作れるかな？",zh:"🍉 水果合成 — 你能合成出西瓜吗？"},"🏰 성 지키기 — 이번 주 최고 웨이브에 도전":{en:"🏰 Castle Keep — beat this week's best wave",ja:"🏰 キャッスルキープ — 今週の最高ウェーブに挑戦",zh:"🏰 守城 — 挑战本周最高波数"},"🐥 신작 구름 점프 — 100m 넘으면 고수":{en:"🐥 New: Cloud Jump — pass 100m and you're a pro",ja:"🐥 新作クラウドジャンプ — 100m超えたら上級者",zh:"🐥 新作云朵跳跃 — 超过100m就是高手"},"🗡️ 신작 몬스터 서바이벌 — 10분 버티면 전설":{en:"🗡️ New: Monster Survival — last 10 min to become a legend",ja:"🗡️ 新作モンスターサバイバル — 10分耐えたら伝説",zh:"🗡️ 新作怪物生存战 — 坚持10分钟就是传说"},"🥅 승부차기 — 몇 번 연속 넣을 수 있을까?":{en:"🥅 Penalty Shootout — how many in a row can you score?",ja:"🥅 PK戦 — 何回連続で決められる？",zh:"🥅 点球大战 — 你能连续进几球？"},"🧱 탑 쌓기 — 퍼펙트 10연속 해 보세요":{en:"🧱 Stack Tower — try for 10 Perfects in a row",ja:"🧱 スタックタワー — パーフェクト10連続に挑戦",zh:"🧱 堆塔 — 挑战连续10次Perfect"},"1 옆에 닫힌 칸이 하나뿐이면 그 칸이 지뢰예요.":{en:"If a 1 has only one closed cell next to it, that cell is a mine.",ja:"1の隣に閉じたマスが1つだけなら、そこが地雷です。",zh:"如果1旁边只有一个未翻开的格子，那里就是地雷。"},"128 이상":{en:"128+",ja:"128以上",zh:"128以上"},"2048 달성! 계속 가 볼까요?":{en:"2048 reached! Keep going?",ja:"2048達成! まだ続ける?",zh:"达成2048! 继续挑战吗?"},"2048을 만들어도 계속할 수 있어요":{en:"You can keep playing after making 2048",ja:"2048を作った後も続けられます",zh:"合成2048后还能继续玩"},"· 최단":{en:"· Best",ja:"· 最短",zh:"· 最短"},"⌫ 지우기":{en:"⌫ Erase",ja:"⌫ 消す",zh:"⌫ 擦除"},"⛏ 열기 모드 · 눌러서 깃발":{en:"⛏ Dig mode · tap for flag",ja:"⛏ 開くモード · タップで旗",zh:"⛏ 翻开模式 · 点击切换旗子"},"✏️ 메모":{en:"✏️ Notes",ja:"✏️ メモ",zh:"✏️ 笔记"},"✏️ 메모 켜짐":{en:"✏️ Notes on",ja:"✏️ メモ ON",zh:"✏️ 笔记已开启"},"가로줄·세로줄·굵은 3×3 칸마다 1부터 9까지 한 번씩만 들어가게 빈칸을 채우세요. 메모·힌트 지원, 실수 3번이면 끝. 풀면 바로 다음 문제!":{en:"Fill the blanks so each row, column and bold 3×3 box has 1 to 9 exactly once. Notes and hints available; 3 mistakes and it's over. Solve one and the next starts right away!",ja:"各行・各列・太線の3×3ブロックに1〜9が1回ずつ入るように空きマスを埋めよう。メモ・ヒント対応、ミス3回で終了。解けたらすぐ次の問題へ！",zh:"填满空格，使每行、每列和每个粗线3×3宫中1到9各出现一次。支持笔记和提示，失误3次结束。解开后立即进入下一题！"},"가로줄·세로줄·굵은 선 3×3 칸마다 1부터 9까지 숫자가 한 번씩만 들어가도록 빈칸을 모두 채우세요.":{en:"Fill every blank so that each row, column and bold 3×3 box contains the numbers 1 to 9 exactly once.",ja:"各行・各列・太線の3×3ブロックに1〜9の数字が1回ずつ入るように、空きマスをすべて埋めましょう。",zh:"填满所有空格，使每行、每列和每个粗线3×3宫中数字1到9各出现一次。"},"가장 큰 타일을 한쪽 구석에 고정하세요.":{en:"Keep your biggest tile locked in one corner.",ja:"一番大きいタイルを角に固定しよう。",zh:"把最大的方块固定在一个角落。"},"같은 숫자 강조":{en:"Highlight same numbers",ja:"同じ数字を強調",zh:"高亮相同数字"},"같은 숫자 두 개가 만나면 합쳐져 두 배가 돼요":{en:"Two matching numbers merge and double",ja:"同じ数字が2つぶつかると合体して2倍に",zh:"两个相同数字相遇会合并翻倍"},"같은 숫자 타일 두 개가 부딪히면 하나로 합쳐지고 숫자가 두 배가 돼요. 합친 숫자만큼 점수.":{en:"When two tiles with the same number collide, they merge into one and double. You score the merged value.",ja:"同じ数字のタイルが2つぶつかると1つに合体し、数字が2倍になります。合体した数字がそのまま得点に。",zh:"两个相同数字的方块相撞会合并为一个，数字翻倍。合并后的数字计入得分。"},"같은 줄·같은 칸에 이미 있는 숫자는 들어갈 수 없어요. 모든 문제는 답이 하나뿐이에요.":{en:"A number already in the same row, column or box can't go there. Every puzzle has exactly one solution.",ja:"同じ行・列・ブロックにすでにある数字は入れられません。どの問題も答えは1つだけです。",zh:"同一行、列或宫中已有的数字不能再填。每道题都只有唯一解。"},"검은 숫자":{en:"Black numbers",ja:"黒い数字",zh:"黑色数字"},"고른 숫자와 같은 칸":{en:"Cells with the selected number",ja:"選んだ数字と同じマス",zh:"与所选数字相同的格子"},"그 구석 쪽 두 방향 위주로만 밀고, 반대 방향은 아껴 두세요.":{en:"Swipe mostly in the two directions toward that corner, and save the opposite ones.",ja:"その角に向かう2方向を中心に動かし、逆方向はなるべく控えよう。",zh:"主要朝那个角落的两个方向滑动，尽量少用反方向。"},"깃발":{en:"Flag",ja:"旗",zh:"旗子"},"깃발 꽂기":{en:"Place flag",ja:"旗を立てる",zh:"插旗"},"꾹 누르거나(PC는 오른쪽 클릭) 깃발 모드로 지뢰에 깃발 꽂기":{en:"Long-press (right-click on PC) or use flag mode to flag mines",ja:"長押し（PCは右クリック）か旗モードで地雷に旗を立てる",zh:"长按（电脑右键）或用旗子模式给地雷插旗"},"꾹 누르기":{en:"Long press",ja:"長押し",zh:"长按"},"내가 채운 숫자":{en:"Numbers you filled",ja:"自分で入れた数字",zh:"你填的数字"},"다 채우면 점수를 받고 바로 다음 문제로. 빨리 풀수록 보너스, 실수·힌트는 감점.":{en:"Fill it in to score and jump straight to the next puzzle. Faster solves earn a bonus; mistakes and hints cost points.",ja:"全部埋めると得点を獲得してすぐ次の問題へ。早く解くほどボーナス、ミス・ヒントは減点。",zh:"填满即可得分并直接进入下一题。解得越快奖励越多，失误和提示会扣分。"},"더 못 움직여요":{en:"No more moves",ja:"もう動かせません",zh:"无法再移动"},"막히면 메모로 후보를 적고, 후보가 하나뿐인 칸을 찾으세요.":{en:"When stuck, jot candidates in notes and look for cells with only one candidate.",ja:"詰まったらメモで候補を書き、候補が1つだけのマスを探そう。",zh:"卡住时用笔记记下候选数，找只剩一个候选的格子。"},"메모":{en:"Notes",ja:"メモ",zh:"笔记"},"메모 모드로 후보 숫자를 작게 적어 둘 수 있어요":{en:"Use notes mode to jot down small candidate numbers",ja:"メモモードで候補の数字を小さく書き込めます",zh:"用笔记模式可以小字记下候选数字"},"메모 모드에서는 후보 숫자를 작게 적어 둘 수 있어요. 숫자를 맞히면 관련 메모가 자동으로 지워져요.":{en:"In notes mode you can jot down small candidate numbers. When you place a correct number, related notes clear automatically.",ja:"メモモードでは候補の数字を小さく書き込めます。正解の数字を入れると関連するメモは自動で消えます。",zh:"在笔记模式下可以小字记下候选数字。填对数字后，相关笔记会自动清除。"},"문제 완성":{en:"Puzzle solved",ja:"問題クリア",zh:"题目完成"},"밀 때마다 빈칸에 2나 4가 하나 생겨요":{en:"Each swipe adds a 2 or 4 to an empty cell",ja:"動かすたびに空きマスに2か4が1つ出ます",zh:"每次滑动都会在空格中出现一个2或4"},"번 밀기":{en:" moves",ja:"回スライド",zh:"次滑动"},"번째 문제":{en:"th puzzle",ja:"問目",zh:"题"},"번째 판":{en:"th board",ja:"面目",zh:"盘"},"벽 쪽 1-2-1 무늬는 양쪽 끝이 지뢰, 가운데는 안전.":{en:"A 1-2-1 pattern along a wall: both ends are mines, the middle is safe.",ja:"壁沿いの1-2-1パターンは両端が地雷、真ん中は安全。",zh:"靠墙的1-2-1图案：两端是地雷，中间安全。"},"빈칸을 누르고 아래 숫자를 눌러 채워요 (PC는 숫자키·방향키)":{en:"Tap a blank, then tap a number below (PC: number & arrow keys)",ja:"空きマスをタップして下の数字をタップ（PCは数字キー・矢印キー）",zh:"点击空格，再点下方数字填入（电脑可用数字键和方向键）"},"빈칸을 누른 뒤 아래 숫자 버튼을 눌러 채워요.":{en:"Tap a blank, then tap a number button below to fill it.",ja:"空きマスをタップしてから下の数字ボタンを押して埋めます。",zh:"点击空格后，按下方的数字按钮填入。"},"빛나는 큰 타일":{en:"Glowing big tiles",ja:"光る大きなタイル",zh:"发光的大方块"},"빨간 숫자":{en:"Red numbers",ja:"赤い数字",zh:"红色数字"},"새로 생기는 타일":{en:"New tiles",ja:"新しく出るタイル",zh:"新出现的方块"},"숫자 누르기":{en:"Tap a number",ja:"数字をタップ",zh:"点击数字"},"숫자 칸 누르기":{en:"Tap a number cell",ja:"数字マスをタップ",zh:"点击数字格"},"숫자 칸을 누르면 깃발 수가 맞을 때 주변을 한 번에 열어요":{en:"Tap a number cell to open its neighbors at once when the flag count matches",ja:"数字マスをタップすると、旗の数が合っていれば周りを一気に開けます",zh:"旗子数量相符时，点击数字格可一次翻开周围格子"},"숫자 타일을 밀어 같은 숫자끼리 합치며 2048 타일을 만들고, 최대한 높은 점수를 노리세요.":{en:"Slide number tiles to merge matching ones, build the 2048 tile and go for the highest score.",ja:"数字タイルを動かして同じ数字同士を合体させ、2048タイルを作って高得点を目指そう。",zh:"滑动数字方块合并相同数字，拼出2048方块，冲击最高分。"},"숫자 하나를 골라 9개 3×3 칸을 차례로 훑어 보세요.":{en:"Pick one number and scan the nine 3×3 boxes one by one.",ja:"数字を1つ選んで、9つの3×3ブロックを順番に見ていこう。",zh:"选定一个数字，依次检查九个3×3宫。"},"숫자 힌트로 지뢰 위치를 추리해, 지뢰를 밟지 않고 모든 안전한 칸을 여세요. 판을 깰수록 점수가 쌓여요.":{en:"Use the number clues to deduce where mines are and open every safe cell without hitting one. Clear more boards to stack up points.",ja:"数字のヒントから地雷の位置を推理し、地雷を踏まずに安全なマスをすべて開けよう。クリアするほど得点が積み上がります。",zh:"根据数字提示推理地雷位置，避开地雷翻开所有安全格。通关越多，得分越高。"},"숫자는 그 칸을 둘러싼 8칸 안에 있는 지뢰 개수예요. 0인 칸은 주변이 자동으로 열려요.":{en:"A number shows how many mines are in the 8 cells around it. Cells with 0 open their surroundings automatically.",ja:"数字はそのマスを囲む8マスにある地雷の数です。0のマスは周りが自動で開きます。",zh:"数字表示周围8格中的地雷数量。为0的格子会自动翻开周围。"},"숫자는 주변 8칸에 숨은 지뢰 개수예요. 추리해서 지뢰만 피해 모든 칸을 열면 클리어! 판을 깰수록 점수가 쌓이고, 빨리 깰수록 보너스.":{en:"Numbers show how many mines hide in the 8 surrounding cells. Deduce, dodge the mines and open every cell to clear! Each cleared board adds points, and faster clears earn a bonus.",ja:"数字は周囲8マスに隠れた地雷の数。推理して地雷だけを避け、すべてのマスを開ければクリア！クリアするほど得点が積み上がり、早いほどボーナス。",zh:"数字表示周围8格中藏着的地雷数。推理避开地雷，翻开所有格子即可通关！通关越多得分越高，越快奖励越多。"},"쉬움":{en:"Easy",ja:"かんたん",zh:"简单"},"스도쿠":{en:"Sudoku",ja:"ナンプレ",zh:"数独"},"실수":{en:"Mistakes",ja:"ミス",zh:"失误"},"실수 3번!":{en:"3 mistakes!",ja:"ミス3回！",zh:"失误3次！"},"아무 칸이나 눌러 시작 · 첫 칸은 안전해요":{en:"Tap any cell to start · the first cell is always safe",ja:"どこかのマスをタップしてスタート · 最初のマスは安全",zh:"点击任意格子开始 · 第一格一定安全"},"어려움":{en:"Hard",ja:"むずかしい",zh:"困难"},"열린 숫자 칸을 누르면, 주변 깃발 수가 숫자와 같을 때 나머지 주변 칸을 한 번에 열어요.":{en:"Tap an opened number cell: if the flags around it match the number, the rest of its neighbors open at once.",ja:"開いた数字マスをタップすると、周りの旗の数が数字と同じなら残りの周囲マスを一気に開けます。",zh:"点击已翻开的数字格，若周围旗子数与数字相同，其余周围格子会一次翻开。"},"열면 끝":{en:"Game over if opened",ja:"開けたら終わり",zh:"翻开就结束"},"완성! +":{en:"Solved! +",ja:"完成! +",zh:"完成! +"},"위·아래·옆으로 밀기":{en:"Swipe up, down or sideways",ja:"上・下・横に動かす",zh:"向上、下、左右滑动"},"주변 지뢰 1개":{en:"1 mine nearby",ja:"周りに地雷1個",zh:"周围有1颗雷"},"주변 지뢰 2개":{en:"2 mines nearby",ja:"周りに地雷2個",zh:"周围有2颗雷"},"주변 지뢰 3개":{en:"3 mines nearby",ja:"周りに地雷3個",zh:"周围有3颗雷"},"주변 한 번에 열기":{en:"Open neighbors at once",ja:"周りを一気に開ける",zh:"一次翻开周围"},"지뢰":{en:"Mine",ja:"地雷",zh:"地雷"},"지뢰 표시":{en:"Mark mine",ja:"地雷をマーク",zh:"标记地雷"},"지뢰라고 생각되는 칸은 꾹 누르거나(PC는 오른쪽 클릭) 깃발 모드에서 눌러 깃발을 꽂아요.":{en:"Long-press a cell you think is a mine (right-click on PC), or tap it in flag mode, to plant a flag.",ja:"地雷だと思うマスは長押し（PCは右クリック）するか、旗モードでタップして旗を立てます。",zh:"觉得是地雷的格子，长按（电脑右键）或在旗子模式下点击即可插旗。"},"지뢰를 열면 끝 · 판을 깨면 다음 판으로 계속":{en:"Open a mine and it's over · clear a board to move to the next",ja:"地雷を開けたら終了 · クリアすると次の面へ",zh:"翻到地雷就结束 · 通关后进入下一盘"},"지뢰를 열면 끝. 모든 안전한 칸을 열면 클리어하고 다음 판으로 넘어가요.":{en:"Open a mine and it's over. Open every safe cell to clear and move on to the next board.",ja:"地雷を開けたら終了。安全なマスをすべて開ければクリアして次の面へ進みます。",zh:"翻到地雷就结束。翻开所有安全格即可通关，进入下一盘。"},"지뢰찾기":{en:"Minesweeper",ja:"マインスイーパー",zh:"扫雷"},"지우기":{en:"Erase",ja:"消す",zh:"擦除"},"짧게 누르기":{en:"Tap",ja:"タップ",zh:"点击"},"채우기":{en:"Fill",ja:"埋める",zh:"填入"},"처음부터 있던 숫자":{en:"Starting numbers",ja:"最初からある数字",zh:"初始数字"},"최고 타일":{en:"Best tile",ja:"最高タイル",zh:"最大方块"},"최단":{en:"Best",ja:"最短",zh:"最短"},"최단 기록!":{en:"New best time!",ja:"最短記録！",zh:"最短纪录！"},"칸 고르기":{en:"Select a cell",ja:"マスを選ぶ",zh:"选择格子"},"칸 누르기":{en:"Tap a cell",ja:"マスをタップ",zh:"点击格子"},"칸 열기":{en:"Open a cell",ja:"マスを開ける",zh:"翻开格子"},"칸을 누르면 열려요. 첫 번째로 누른 칸과 그 주변은 항상 안전해요.":{en:"Tap a cell to open it. The first cell you tap and its neighbors are always safe.",ja:"マスをタップすると開きます。最初にタップしたマスとその周りは常に安全です。",zh:"点击格子即可翻开。第一次点击的格子及其周围一定安全。"},"칸을 누르면 열려요. 첫 칸은 항상 안전해요":{en:"Tap a cell to open it. The first cell is always safe",ja:"マスをタップすると開きます。最初のマスは常に安全",zh:"点击格子即可翻开。第一格一定安全"},"칸이 꽉 차고 합칠 것이 없으면 끝. 2048을 만든 뒤에도 계속할 수 있어요.":{en:"The game ends when the board is full and nothing can merge. You can keep going after making 2048.",ja:"マスが埋まって合体できなくなったら終了。2048を作った後も続けられます。",zh:"格子填满且无法合并时游戏结束。合成2048后还能继续玩。"},"큰 타일 옆줄을 꽉 채워 두면 갑자기 빈칸이 생기지 않아요.":{en:"Keep the row next to your big tile full so empty gaps don't suddenly appear.",ja:"大きいタイルの隣の列を埋めておけば、急に空きマスができません。",zh:"把大方块旁边那一行填满，就不会突然出现空格。"},"클리어! +":{en:"Cleared! +",ja:"クリア! +",zh:"通关! +"},"타일 움직이기":{en:"Move tiles",ja:"タイルを動かす",zh:"移动方块"},"틀린 숫자":{en:"Wrong numbers",ja:"間違った数字",zh:"错误数字"},"틀린 숫자는 빨갛게 표시되고 실수 1번":{en:"Wrong numbers turn red and count as 1 mistake",ja:"間違った数字は赤く表示され、ミス1回",zh:"错误数字显示为红色，计失误1次"},"틀린 숫자는 빨갛게 표시되고 실수 1번. 실수 3번이면 끝.":{en:"Wrong numbers turn red and count as 1 mistake. 3 mistakes and it's over.",ja:"間違った数字は赤く表示され、ミス1回。ミス3回で終了。",zh:"错误数字显示为红色，计失误1次。失误3次结束。"},"파란 숫자":{en:"Blue numbers",ja:"青い数字",zh:"蓝色数字"},"판마다 지뢰 수 × 10점, 빨리 깨면 보너스. 쉬움 8×10 · 보통 10×14 · 어려움 12×18.":{en:"Each board scores mines × 10, plus a bonus for clearing fast. Easy 8×10 · Normal 10×14 · Hard 12×18.",ja:"1面ごとに地雷数 × 10点、早くクリアするとボーナス。かんたん 8×10 · ふつう 10×14 · むずかしい 12×18。",zh:"每盘得分为地雷数 × 10，快速通关有奖励。简单 8×10 · 普通 10×14 · 困难 12×18。"},"퍼즐 · 숫자":{en:"Puzzle · Numbers",ja:"パズル · 数字",zh:"益智 · 数字"},"퍼즐 · 추리":{en:"Puzzle · Logic",ja:"パズル · 推理",zh:"益智 · 推理"},"한 번 밀 때 이미 합쳐진 타일은 다시 합쳐지지 않아요.":{en:"A tile that already merged won't merge again in the same swipe.",ja:"1回の操作ですでに合体したタイルは、もう一度合体しません。",zh:"同一次滑动中已合并的方块不会再次合并。"},"한 번 밀 때마다 빈칸에 2(가끔 4)가 하나 생겨요.":{en:"Each swipe adds a 2 (sometimes 4) to an empty cell.",ja:"1回動かすたびに空きマスに2（たまに4）が1つ出ます。",zh:"每次滑动都会在空格中出现一个2（偶尔是4）。"},"한 줄에 빈칸이 하나뿐인 곳부터 채우세요.":{en:"Start with rows that have only one blank.",ja:"空きマスが1つだけの列から埋めよう。",zh:"先填只剩一个空格的行或列。"},"화면을 밀면 모든 숫자가 그쪽으로 미끄러지고, 같은 숫자가 부딪히면 하나로 합쳐져요. 2 → 4 → 8 … 2048까지! 칸이 꽉 차서 못 움직이면 끝.":{en:"Swipe the screen and every number slides that way; matching numbers that collide merge into one. 2 → 4 → 8 … all the way to 2048! The game ends when the board is full and nothing can move.",ja:"画面をスワイプするとすべての数字がその方向に滑り、同じ数字がぶつかると1つに合体。2 → 4 → 8 … 2048まで！マスが埋まって動かせなくなったら終了。",zh:"滑动屏幕，所有数字都会滑向那一边，相同数字相撞就合并为一个。2 → 4 → 8 … 直到2048！格子填满无法移动时结束。"},"화면을 위·아래·옆으로 밀어 같은 숫자를 합쳐요":{en:"Swipe up, down or sideways to merge matching numbers",ja:"画面を上・下・横にスワイプして同じ数字を合体",zh:"向上 切换"},"벽에 닿은 공은 튕겨 나와요 (풋살 케이지). 골키퍼가 잡으면 동료에게 자동 패스.":{en:"The ball bounces off the walls (futsal cage). When a keeper catches it, they pass to a teammate automatically.",ja:"ボールは壁で跳ね返る（フットサルケージ）。キーパーが取ると味方へ自動パス。",zh:"球碰到墙会反弹（五人制笼式场地）。门将接球后自动传给队友。"},"상대 골키퍼":{en:"Opponent keeper",ja:"相手GK",zh:"对方门将"},"상대가 붙으면 바로 패스하세요. 드리블보다 빨라요.":{en:"When pressed, pass right away — it’s faster than dribbling.",ja:"寄せられたらすぐパス。ドリブルより速い。",zh:"被逼抢时立刻传球，比盘带更快。"},"슛 / 태클":{en:"Shoot / Tackle",ja:"シュート / タックル",zh:"射门 / 铲断"},"슛 · 태클":{en:"Shoot · Tackle",ja:"シュート · タックル",zh:"射门 · 铲断"},"왼쪽 스틱":{en:"Left stick",ja:"左スティック",zh:"左摇杆"},"왼쪽 스틱: 이동 (방향키)":{en:"Left stick: move (arrow keys)",ja:"左スティック：移動（矢印キー）",zh:"左摇杆：移动（方向键）"},"위에서 내려다보는 3:3 아케이드 축구. 스틱으로 달리고 패스로 엮어 슛! 공이 없을 땐 태클로 뺏으세요. 2분 경기, 동점이면 골든골.":{en:"Top-down 3v3 arcade soccer. Run with the stick, link passes and shoot! Tackle to win the ball back. 2-minute matches, golden goal if tied.",ja:"上から見下ろす3対3アーケードサッカー。スティックで走り、パスをつないでシュート！ボールがない時はタックル。2分間、同点ならゴールデンゴール。",zh:"俯视视角3对3街机足球。用摇杆奔跑、传球配合射门！无球时铲断抢球。2分钟一场，平局金球决胜。"},"이길수록 상대가 빨라지고 뺏기를 잘해요.":{en:"The more you win, the faster and better at stealing the opponents get.",ja:"勝つほど相手が速く、奪うのがうまくなる。",zh:"赢得越多，对手越快越会抢球。"},"주황 유니폼":{en:"Orange kit",ja:"オレンジのユニフォーム",zh:"橙色球衣"},"태클":{en:"Tackle",ja:"タックル",zh:"铲断"},"태클은 상대 앞에서 쓰세요. 빗나가면 잠깐 멈춰요.":{en:"Tackle in front of the opponent — if you miss, you’re briefly stuck.",ja:"タックルは相手の前で。外すと少し止まる。",zh:"在对手面前铲断，铲空会短暂停顿。"},"패스":{en:"Pass",ja:"パス",zh:"传球"},"패스 / 바꾸기":{en:"Pass / Switch",ja:"パス / 切替",zh:"传球 / 切换"},"패스 · 선수 바꾸기":{en:"Pass · Switch player",ja:"パス · 選手切替",zh:"传球 · 切换球员"},"보라 유니폼":{en:"Purple kit",ja:"紫のユニフォーム",zh:"紫色球衣"},"{0}분 {1}초 생존 · 처치 {2} · 레벨 {3}":{en:"Survived {0}m {1}s · Kills {2} · Level {3}",ja:"{0}分{1}秒生存 · 撃破 {2} · レベル {3}",zh:"存活{0}分{1}秒 · 击败 {2} · 等级 {3}"},"{0}m · 벌 {1}마리 밟기":{en:"{0}m · {1} bees stomped",ja:"{0}m · ハチ{1}匹ふみつけ",zh:"{0}m · 踩扁{1}只蜜蜂"},"{0}층 · 최고 퍼펙트 연속 {1}":{en:"Floor {0} · Best Perfect streak {1}",ja:"{0}階 · 最高パーフ
