운데에 과일이 나옵니다. 먹으면 {1}점(ROUND마다 +{2} 최대 {3})과 함께 곤충이 잠시 멈춰요. 멈춰도 닿으면 위험.": {"en": "When the {0}th bug appears, a fruit shows up in the center. Eat it for {1} pts (+{2} each ROUND, max {3}) and the bugs freeze briefly. Touching them is still deadly.", "ja": "{0}番目の虫が出ると中央にフルーツが現れる。食べると{1}点(ROUNDごとに+{2}、最大{3})獲得し、虫が一時停止。止まっていても触れると危険。", "zh": "第{0}只虫子出现时,中央会出现水果。吃掉得{1}分(每个ROUND +{2},最高{3}),虫子会暂时停住。停住时碰到仍然危险。"}, "{0}번째 벌레가 나오면 가운데에 꿀단지가 생깁니다. 먹으면 보너스 점수와 함께 벌레가 잠시 멈추지만, 닿으면 여전히 위험해요.": {"en": "When the {0}th bug appears, a honey pot spawns in the center. Eat it for bonus points and the bugs freeze briefly, but touching them is still deadly.", "ja": "{0}番目の虫が出ると中央にハチミツ壺が現れる。食べるとボーナス点を獲得し、虫が一時停止。ただし触れると危険。", "zh": "第{0}只虫子出现时,中央会出现蜂蜜罐。吃掉可得奖励分,虫子会暂时停住,但碰到仍然危险。"}, "{0}판마다 · 적이 쏘지 않음 · {1}기 전멸 +{2}": {"en": "Every {0} rounds · enemies don't shoot · wipe out {1} for +{2}", "ja": "{0}回ごと · 敵は撃たない · {1}機全滅で+{2}", "zh": "每{0}局 · 敌人不射击 · 全灭{1}架 +{2}"}, "{0}판부터 드론이 깜빡이다 셋으로 변신: 셋 다 잡으면 큰 보너스 · 보너스 스테이지는 {1}기를 모두 맞히면 +{2}": {"en": "From round {0}, drones blink then split into three: catch all three for a big bonus · In Bonus Stages, hit all {1} for +{2}", "ja": "{0}回目からドローンが点滅して3機に変身:3機とも倒すと大ボーナス · ボーナスステージは{1}機すべて撃破で+{2}", "zh": "从第{0}局起,无人机会闪烁并分裂为三:全部击落可得大量奖励 · 奖励关卡中击中全部{1}架 +{2}"}, "{0} ~ {1} · 곤충 정지": {"en": "{0} ~ {1} · Bugs frozen", "ja": "{0} ~ {1} · 虫が停止", "zh": "{0} ~ {1} · 虫子停住"}, "BREAK 모으기 → 목숨 +{0}": {"en": "Collect BREAK → Lives +{0}", "ja": "BREAKを集める → ライフ+{0}", "zh": "集齐BREAK → 生命 +{0}"}, "BREAK 완성! 목숨 +{0}": {"en": "BREAK complete! Lives +{0}", "ja": "BREAK完成!ライフ+{0}", "zh": "BREAK完成!生命 +{0}"}, "POCKET 모으기 → +{0}": {"en": "Collect POCKET → +{0}", "ja": "POCKETを集める → +{0}", "zh": "集齐POCKET → +{0}"}, "POCKET 완성! +{0}": {"en": "POCKET complete! +{0}", "ja": "POCKET完成!+{0}", "zh": "POCKET完成!+{0}"}, "ROUND마다 곤충 종류(개미 · 사슴벌레 · 거미 · 애벌레)가 바뀌어요.": {"en": "The bug type (ant · stag beetle · spider · caterpillar) changes every ROUND.", "ja": "ROUNDごとに虫の種類(アリ · クワガタ · クモ · 毛虫)が変わる。", "zh": "每个ROUND虫子种类(蚂蚁 · 锹甲 · 蜘蛛 · 毛毛虫)都会变化。"}, "ROUND마다 바뀜": {"en": "Changes every ROUND", "ja": "ROUNDごとに変化", "zh": "每个ROUND都会变"}, "· {0}승 하기": {"en": "· Win {0}", "ja": "· {0}勝する", "zh": "· 赢{0}局"}, "가운데에 꿀단지 등장!": {"en": "Honey pot appears in the center!", "ja": "中央にハチミツ壺が出現!", "zh": "中央出现蜂蜜罐!"}, "걸리면 전투기를 빼앗김": {"en": "Caught = fighter stolen", "ja": "捕まると戦闘機を奪われる", "zh": "被抓住就会被夺走战机"}, "게 로봇": {"en": "Crab Bot", "ja": "クラブボット", "zh": "螃蟹机器人"}, "곤충은 평소엔 이리저리 헤매다가, 시간이 지나면 한 마리씩 몇 초 동안 곧장 쫓아와요.": {"en": "Bugs normally wander around, but after a while they chase you in a straight line, one at a time, for a few seconds.", "ja": "虫は普段はうろうろしているが、時間が経つと1匹ずつ数秒間まっすぐ追いかけてくる。", "zh": "虫子平时四处游荡,过一段时间会一只一只直线追你几秒。"}, "곤충을 피해 꽃 · 클로버 · 글자를 모두 먹으면 다음 ROUND로 넘어갑니다.": {"en": "Dodge the bugs and eat every flower · clover · letter to move on to the next ROUND.", "ja": "虫を避けて花 · クローバー · 文字をすべて食べると次のROUNDへ。", "zh": "躲开虫子,吃光所有花 · 三叶草 · 字母,即可进入下一个ROUND。"}, "곤충이 나오기 직전 경고음이 울려요. 가운데 근처에서 멀어지세요.": {"en": "A warning sounds right before a bug appears. Move away from the center.", "ja": "虫が出る直前に警告音が鳴る。中央付近から離れよう。", "zh": "虫子出现前会响起警告音。快离开中央附近。"}, "과일 {0}종": {"en": "{0} fruits", "ja": "フルーツ{0}種", "zh": "{0}种水果"}, "귤": {"en": "Tangerine", "ja": "みかん", "zh": "橘子"}, "급강하하는 적을 격추하면 가끔 캡슐: 연(연사) · 방(방패 {0}회) · 넓(넓은 탄) · 원반 모선의 자석 그물에 걸리면 전투기를 빼앗겨요. 그 모선이 급강하할 때 맞히면 되찾아 쌍발! 편대에 있을 때 잡으면 빼앗긴 전투기가 적이 돼요": {"en": "Shoot down diving enemies for occasional capsules: R (rapid fire) · S (shield, {0} hits) · W (wide shot). If a Saucer Mothership's magnet net catches you, your fighter is stolen. Hit that mothership as it dives to get it back for a twin shot! Shoot it while it's in formation and the stolen fighter becomes an enemy.", "ja": "急降下する敵を撃墜するとたまにカプセルが出る:連(連射) · 盾(シールド{0}回) · 広(広範囲弾)。原盤母艦のマグネットネットに捕まると戦闘機を奪われる。その母艦が急降下するときに撃てば取り戻して2連装に!編隊にいるときに倒すと、奪われた戦闘機が敵になる。", "zh": "击落俯冲的敌人偶尔会掉落胶囊:连(连射) · 盾(护盾{0}次) · 广(宽弹)。被圆盘母舰的磁力网抓住,战机会被夺走。在该母舰俯冲时击中它即可夺回,变成双发!在编队中击落它,被夺走的战机会变成敌人。"}, "깜빡이던 드론이 셋으로 갈라짐 · 하나 {0} · 셋 다 {1} / {2} / {3}": {"en": "The blinking drone splits into three · one {0} · all three {1} / {2} / {3}", "ja": "点滅していたドローンが3機に分裂 · 1機{0} · 3機とも{1} / {2} / {3}", "zh": "闪烁的无人机分裂为三 · 单个{0} · 全部三个{1} / {2} / {3}"}, "꽃 · 클로버 · 글자를 모두 먹으면 다음 ROUND": {"en": "Eat every flower · clover · letter to reach the next ROUND", "ja": "花 · クローバー · 文字をすべて食べると次のROUND", "zh": "吃光所有花 · 三叶草 · 字母进入下一个ROUND"}, "꿀단지": {"en": "Honey Pot", "ja": "ハチミツ壺", "zh": "蜂蜜罐"}, "꿀단지 +": {"en": "Honey Pot +", "ja": "ハチミツ壺 +", "zh": "蜂蜜罐 +"}, "나무 쪽문은 토리만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 벌레는 못 지나가요.": {"en": "Only Tori can push through a wooden gate, and passing through turns it {0}° and changes the path. Bugs can't pass.", "ja": "木戸を押して通れるのはトリだけ。通ると{0}°回転して道が変わる。虫は通れない。", "zh": "木门只有托莉能推过去,通过后会转动{0}°,路线随之改变。虫子过不去。"}, "나무 쪽문은 토리만 밀고 지나갈 수 있어요. 지나가면 {0}도 돌아가요": {"en": "Only Tori can push through a wooden gate. Passing through turns it {0}°", "ja": "木戸を押して通れるのはトリだけ。通ると{0}度回転する", "zh": "木门只有托莉能推过去。通过后会转动{0}度"}, "노란색일 때 먹은 글자는 BREAK(완성 시 목숨 +{0}), 빨간색일 때 먹은 글자는 POCKET(완성 시 +{1})에 들어가요.": {"en": "Letters eaten while yellow go to BREAK (lives +{0} when complete); letters eaten while red go to POCKET (+{1} when complete).", "ja": "黄色のときに食べた文字はBREAK(完成でライフ+{0})、赤のときに食べた文字はPOCKET(完成で+{1})に入る。", "zh": "黄色时吃的字母归入BREAK(完成时生命 +{0}),红色时吃的字母归入POCKET(完成时 +{1})。"}, "독버섯": {"en": "Poison Mushroom", "ja": "毒キノコ", "zh": "毒蘑菇"}, "독버섯 근처로 곤충을 유인하면 곤충이 독버섯을 밟고 돌아갑니다.": {"en": "Lure a bug near a poison mushroom and it steps on it and turns back.", "ja": "毒キノコの近くに虫をおびき寄せると、虫が毒キノコを踏んで引き返す。", "zh": "把虫子引到毒蘑菇附近,虫子会踩到毒蘑菇后折返。"}, "독버섯 근처로 벌레를 유인하면 벌레가 독버섯을 밟고 사라집니다.": {"en": "Lure a bug near a poison mushroom and it steps on it and vanishes.", "ja": "毒キノコの近くに虫をおびき寄せると、虫が毒キノコを踏んで消える。", "zh": "把虫子引到毒蘑菇附近,虫子会踩到毒蘑菇后消失。"}, "독버섯은 토리도 곤충도 밟으면 끝(곤충은 가운데로 돌아감).": {"en": "Stepping on a poison mushroom ends it for Tori and bugs alike (bugs return to the center).", "ja": "毒キノコはトリも虫も踏んだら終わり(虫は中央に戻る)。", "zh": "托莉和虫子踩到毒蘑菇都会完蛋(虫子会回到中央)。"}, "드론이 깜빡이기 시작하면 변신 신호! 갈라진 셋을 모두 잡을 준비를 하세요.": {"en": "When a drone starts blinking, it's about to transform! Get ready to take down all three.", "ja": "ドローンが点滅し始めたら変身の合図!分裂した3機をすべて倒す準備をしよう。", "zh": "无人机开始闪烁就是变身信号!准备好击落分裂出的三架吧。"}, "멜론": {"en": "Melon", "ja": "メロン", "zh": "哈密瓜"}, "모선을 편대에서 잡으면 빼앗긴 전투기가 덤벼요 · {0}": {"en": "Shoot a mothership in formation and the stolen fighter attacks you · {0}", "ja": "編隊にいる母艦を撃つと、奪われた戦闘機が襲いかかってくる · {0}", "zh": "在编队中击落母舰,被夺走的战机会扑向你 · {0}"}, "무화과": {"en": "Fig", "ja": "いちじく", "zh": "无花果"}, "미로 테두리를 따라 덩굴 시계가 한 바퀴 자랄 때마다 가운데에서 벌레가 한 마리씩 나옵니다 (최대 {0}마리).": {"en": "Every time the vine clock grows once around the maze border, a bug emerges from the center (max {0}).", "ja": "つるの時計が迷路の縁を一周するたびに、中央から虫が1匹出てくる(最大{0}匹)。", "zh": "藤蔓时钟沿迷宫边缘长满一圈,中央就会出来一只虫子(最多{0}只)。"}, "미로는 판마다 새로 만들어져요(좌우 대칭 · 쪽문 {0}개). 토리는 아래 가운데에서 출발합니다.": {"en": "A new maze every round (left-right symmetric · {0} gates). Tori starts at the bottom center.", "ja": "迷路は毎回新しく作られる(左右対称 · 木戸{0}個)。トリは下の中央からスタート。", "zh": "迷宫每局都会重新生成(左右对称 · {0}个木门)。托莉从下方中央出发。"}, "반딧불 시계": {"en": "Firefly Clock", "ja": "ホタルの時計", "zh": "萤火虫时钟"}, "밤 정원의 네온 도트 미로. 판마다 새 미로, 반딧불 시계가 한 바퀴 돌 때마다 곤충이 나와요. 쪽문으로 길을 막고, 색이 바뀌는 글자로 BREAK · POCKET을 완성하세요.": {"en": "A neon dot maze in the night garden. New maze every round; a bug emerges each time the firefly clock goes around. Block paths with gates and complete BREAK · POCKET with the color-changing letters.", "ja": "夜の庭のネオンドット迷路。毎回新しい迷路で、ホタルの時計が一周するたびに虫が出てくる。木戸で道を塞ぎ、色が変わる文字でBREAK · POCKETを完成させよう。", "zh": "夜晚花园里的霓虹点阵迷宫。每局新迷宫,萤火虫时钟每转一圈就会出来一只虫子。用木门堵路,用变色字母拼出BREAK · POCKET。"}, "벌레를 피해 정원 미로의 꽃 · 클로버 · 글자를 모두 먹으면 다음 미로로 넘어갑니다.": {"en": "Dodge the bugs and eat every flower · clover · letter in the garden maze to move on to the next maze.", "ja": "虫を避けて庭の迷路の花 · クローバー · 文字をすべて食べると次の迷路へ。", "zh": "躲开虫子,吃光花园迷宫里所有的花 · 三叶草 · 字母,即可进入下一个迷宫。"}, "변신 외계인 ({0}판부터)": {"en": "Transforming Alien (from round {0})", "ja": "変身エイリアン({0}回目から)", "zh": "变身外星人(第{0}局起)"}, "보너스 스테이지": {"en": "Bonus Stage", "ja": "ボーナスステージ", "zh": "奖励关卡"}, "보너스 스테이지는 적이 들어오는 길을 외우면 퍼펙트가 가능해요. 길 모양은 세 가지가 번갈아 나와요.": {"en": "In Bonus Stages, memorize the enemies' entry paths for a Perfect. The three path shapes alternate.", "ja": "ボーナスステージでは敵の進入ルートを覚えればパーフェクトも可能。ルートの形は3種類が交互に出る。", "zh": "奖励关卡中记住敌人的进场路线就能拿到完美。路线有三种形状,交替出现。"}, "보라 독버섯은 토리도, 벌레도 밟으면 끝. 벌레에 닿으면 목숨 −{0} (처음 {1}개).": {"en": "Purple poison mushrooms end it for both Tori and bugs. Touching a bug costs lives −{0} (start with {1}).", "ja": "紫の毒キノコはトリも虫も踏んだら終わり。虫に触れるとライフ−{0}(最初は{1}個)。", "zh": "紫色毒蘑菇托莉和虫子踩到都会完蛋。碰到虫子生命 −{0}(初始{1}条)。"}, "보라 독버섯은 피하고, 클로버는 점수 배율 ↑, 가운데 꿀단지를 먹으면 벌레가 얼어요": {"en": "Avoid purple poison mushrooms, clovers raise the score multiplier ↑, and eating the center honey pot freezes the bugs", "ja": "紫の毒キノコは避けよう。クローバーで得点倍率↑、中央のハチミツ壺を食べると虫が凍る", "zh": "避开紫色毒蘑菇,三叶草提高得分倍率 ↑,吃掉中央蜂蜜罐能冻住虫子"}, "블루베리": {"en": "Blueberry", "ja": "ブルーベリー", "zh": "蓝莓"}, "빨간 글자는 POCKET(완성 시 +{0}), 노란 글자는 BREAK(완성 시 목숨 +{1})에 켜집니다.": {"en": "Red letters light up POCKET (+{0} when complete), yellow letters light up BREAK (lives +{1} when complete).", "ja": "赤い文字はPOCKET(完成で+{0})、黄色い文字はBREAK(完成でライフ+{1})に点灯する。", "zh": "红色字母点亮POCKET(完成时 +{0}),黄色字母点亮BREAK(完成时生命 +{1})。"}, "빨강은 아주 잠깐이에요. 파란색 → 빨강으로 바뀌는 순간을 글자 바로 옆에서 기다리세요.": {"en": "Red lasts only a moment. Wait right next to a letter for the instant it turns from blue to red.", "ja": "赤はほんの一瞬。文字のすぐ横で、青から赤に変わる瞬間を待とう。", "zh": "红色只持续一瞬间。守在字母旁边,等它从蓝变红的那一刻。"}, "빼앗긴 전투기를 단 모선이 급강하할 때 맞히면 전투기를 되찾아 두 대가 나란히 쏘는 쌍발이 됩니다. 편대에 있을 때 맞히면 잃어요.": {"en": "Hit a mothership carrying a stolen fighter as it dives to get your fighter back and fire side by side as a twin shot. Hit it while it's in formation and you lose it.", "ja": "奪われた戦闘機を連れた母艦が急降下するときに撃つと戦闘機を取り戻し、2機並んで撃つ2連装になる。編隊にいるときに撃つと失う。", "zh": "母舰带着被夺走的战机俯冲时击中它,就能夺回战机,两架并排射击成为双发。在编队中击中则会失去战机。"}, "사과": {"en": "Apple", "ja": "りんご", "zh": "苹果"}, "석류": {"en": "Pomegranate", "ja": "ざくろ", "zh": "石榴"}, "성운 속 외계 편대를 쏘아 떨어뜨리는 우주 슈팅. 해파리 드론 · 게 로봇 · 원반 모선이 몰려오고, 모선이 자석 그물로 끌어간 전투기를 되찾으면 쌍발! 변신 외계인과 보너스 스테이지까지.": {"en": "Space shooter where you shoot down alien squadrons in a nebula. Jelly Drones · Crab Bots · Saucer Motherships swarm in, and retrieve a fighter the mothership's magnet net took for a twin shot! Plus transforming aliens and Bonus Stages.", "ja": "星雲の中で異星の編隊を撃ち落とす宇宙シューティング。ジェリードローン · クラブボット · 円盤母艦が押し寄せ、母艦がマグネットネットで連れ去った戦闘機を取り戻せば2連装に!変身エイリアンとボーナスステージも。", "zh": "在星云中击落外星编队的太空射击游戏。水母无人机 · 螃蟹机器人 · 圆盘母舰蜂拥而来,夺回被母舰磁力网抓走的战机就能变成双发!还有变身外星人和奖励关卡。"}, "스테이지가 시작되면 외계인 {0}기(원반 모선 {1} · 게 로봇 {2} · 해파리 드론 {3})가 무리 지어 날아와 편대를 짭니다. 날아오는 중에 맞히면 점수가 더 커요.": {"en": "When a stage starts, {0} aliens (Saucer Mothership {1} · Crab Bot {2} · Jelly Drone {3}) swarm in and form a squadron. Hitting them while they fly in scores more.", "ja": "ステージが始まると、エイリアン{0}機(円盤母艦{1} · クラブボット{2} · ジェリードローン{3})が群れで飛来して編隊を組む。飛来中に撃つと得点が高い。", "zh": "关卡开始时,{0}架外星人(圆盘母舰{1} · 螃蟹机器人{2} · 水母无人机{3})成群飞来并组成编队。在飞来途中击中得分更高。"}, "외계 편대 출격": {"en": "Alien Squadron Sortie", "ja": "異星編隊出撃", "zh": "外星编队出击"}, "외계 편대를 모두 격추하면 다음 스테이지. 최대한 높은 스테이지와 점수를 노리세요.": {"en": "Shoot down the whole alien squadron to reach the next stage. Aim for the highest stage and score you can.", "ja": "異星編隊をすべて撃墜すると次のステージへ。できるだけ高いステージとスコアを目指そう。", "zh": "击落所有外星编队即可进入下一关。尽量冲击更高的关卡和分数吧。"}, "원반 모선 ({0}번 맞혀야)": {"en": "Saucer Mothership (hit {0} times)", "ja": "円盤母艦({0}回命中で撃墜)", "zh": "圆盘母舰(需击中{0}次)"}, "원반 모선은 두 번 맞혀야 떨어져요(보라 → 빨강). 모선이 멈춰 자석 그물을 내리면 피하세요. 걸리면 전투기를 빼앗겨요.": {"en": "A Saucer Mothership takes two hits to go down (purple → red). When it stops and lowers its magnet net, dodge it. If caught, your fighter is stolen.", "ja": "円盤母艦は2回当てないと落ちない(紫→赤)。母艦が止まってマグネットネットを下ろしたら避けよう。捕まると戦闘機を奪われる。", "zh": "圆盘母舰需要击中两次才会坠落(紫→红)。母舰停下并放下磁力网时要躲开。被抓住战机就会被夺走。"}, "자두": {"en": "Plum", "ja": "すもも", "zh": "李子"}, "자석 그물": {"en": "Magnet Net", "ja": "マグネットネット", "zh": "磁力网"}, "자석 그물이 내려오면 옆으로 한 칸 이상 비키세요. 일부러 잡힌 뒤 구출하면 쌍발이 됩니다.": {"en": "When a magnet net comes down, move at least one tile aside. Get caught on purpose and rescue your fighter for a twin shot.", "ja": "マグネットネットが下りてきたら、横に1マス以上よけよう。わざと捕まってから救出すると2連装になる。", "zh": "磁力网落下时,向旁边至少躲开一格。故意被抓再救回来,就能变成双发。"}, "적이 몇 기 안 남으면 쉬지 않고 급강하해요. 끝까지 방심 금지.": {"en": "When few enemies remain, they dive nonstop. Don't let your guard down until the end.", "ja": "敵が残り少なくなると、休まず急降下してくる。最後まで油断禁物。", "zh": "敌人所剩无几时会不停地俯冲。直到最后都不能大意。"}, "정원 미로의 꽃을 모두 먹고, 나무 쪽문을 돌려 벌레 길을 막고, 클로버로 배율을 올리고, 글자로 BREAK · POCKET을 완성하세요.": {"en": "Eat every flower in the garden maze, turn wooden gates to block the bugs' paths, raise your multiplier with clovers, and complete BREAK · POCKET with letters.", "ja": "庭の迷路の花をすべて食べ、木戸を回して虫の道を塞ぎ、クローバーで倍率を上げ、文字でBREAK · POCKETを完成させよう。", "zh": "吃光花园迷宫里所有的花,转动木门堵住虫子的路,用三叶草提高倍率,用字母拼出BREAK · POCKET。"}, "주황 쪽문은 토리만 밀고 지나가요. 곤충 길을 막는 데 쓰세요": {"en": "Only Tori can push through the orange gate. Use it to block the bugs' path", "ja": "オレンジの木戸を押して通れるのはトリだけ。虫の道を塞ぐのに使おう", "zh": "橙色木门只有托莉能推过去。用它来堵住虫子的路"}, "쪽문은 토리만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 곤충에게는 벽이에요.": {"en": "Only Tori can push through a gate, and passing through turns it {0}° and changes the path. Gates are walls to bugs.", "ja": "木戸を押して通れるのはトリだけ。通ると{0}°回転して道が変わる。虫にとっては壁。", "zh": "门只有托莉能推过去,通过后会转动{0}°,路线随之改变。对虫子来说门就是墙。"}, "쫓아오는 곤충 앞에서 쪽문을 지나가면 문이 돌아가 길이 막혀요.": {"en": "Pass through a gate in front of a chasing bug and the gate turns, blocking its path.", "ja": "追ってくる虫の前で木戸を通ると、戸が回って道が塞がる。", "zh": "在追来的虫子面前穿过木门,门会转动把路堵住。"}, "쫓아오는 벌레 앞에서 쪽문을 지나가면 문이 돌아가 벌레 길이 막혀요.": {"en": "Pass through a gate in front of a chasing bug and the gate turns, blocking the bug's path.", "ja": "追ってくる虫の前で木戸を通ると、戸が回って虫の道が塞がる。", "zh": "在追来的虫子面前穿过木门,门会转动堵住虫子的路。"}, "클로버와 글자는 색이 바뀌는 순간을 기다렸다가 먹으세요.": {"en": "Wait for the moment clovers and letters change color, then eat them.", "ja": "クローバーと文字は、色が変わる瞬間を待ってから食べよう。", "zh": "三叶草和字母要等颜色变化的瞬间再吃。"}, "클로버와 글자는 평소 파란색이고 약 {0}초마다 빨강(아주 잠깐) → 노랑으로 바뀝니다. 파랑 {1} · 노랑 {2} · 빨강 {3}점 × 배율.": {"en": "Clovers and letters are normally blue, and about every {0} sec they turn red (very briefly) → yellow. Blue {1} · yellow {2} · red {3} pts × multiplier.", "ja": "クローバーと文字は普段は青で、約{0}秒ごとに赤(ごく一瞬)→黄色に変わる。青{1} · 黄{2} · 赤{3}点 × 倍率。", "zh": "三叶草和字母平时是蓝色,约每{0}秒变为红色(极短)→黄色。蓝{1} · 黄{2} · 红{3}分 × 倍率。"}, "클로버와 글자는 평소 파란색이고, 몇 초마다 노란색 → 빨간색으로 잠깐 바뀝니다.": {"en": "Clovers and letters are normally blue, and every few seconds they briefly turn yellow → red.", "ja": "クローバーと文字は普段は青で、数秒ごとに黄色→赤に一瞬変わる。", "zh": "三叶草和字母平时是蓝色,每隔几秒会短暂变为黄色 → 红色。"}, "키위": {"en": "Kiwi", "ja": "キウイ", "zh": "猕猴桃"}, "테두리의 반딧불이 한 바퀴 켜질 때마다(다음 바퀴엔 꺼질 때마다) 가운데에서 곤충이 {0}마리씩 나옵니다 (최대 {1}마리).": {"en": "Each time the fireflies along the border light up once around (and go out once around on the next lap), {0} bugs emerge from the center (max {1}).", "ja": "縁のホタルが一周点灯するたび(次の周では消灯するたび)、中央から虫が{0}匹ずつ出てくる(最大{1}匹)。", "zh": "边缘的萤火虫每亮满一圈(下一圈则每熄灭一圈),中央就会出来{0}只虫子(最多{1}只)。"}, "토리도 벌레도 밟으면 끝": {"en": "Stepping on it ends it for both Tori and bugs", "ja": "トリも虫も踏んだら終わり", "zh": "托莉和虫子踩到都会完蛋"}, "파란 클로버": {"en": "Blue Clover", "ja": "青いクローバー", "zh": "蓝色三叶草"}, "파란 클로버를 먹으면 이번 ROUND 배율이 ×{0} → ×{1} → ×{2}로 올라요.": {"en": "Eat a blue clover to raise this ROUND's multiplier ×{0} → ×{1} → ×{2}.", "ja": "青いクローバーを食べると、このROUNDの倍率が×{0}→×{1}→×{2}に上がる。", "zh": "吃蓝色三叶草,本ROUND倍率会升至×{0} → ×{1} → ×{2}。"}, "파란 클로버를 먹으면 이번 스테이지 점수 배율이 ×{0} → ×{1} → ×{2}로 올라요.": {"en": "Eat a blue clover to raise this stage's score multiplier ×{0} → ×{1} → ×{2}.", "ja": "青いクローバーを食べると、このステージの得点倍率が×{0}→×{1}→×{2}に上がる。", "zh": "吃蓝色三叶草,本关得分倍率会升至×{0} → ×{1} → ×{2}。"}, "판이 갈수록 늘어요": {"en": "Grows with each round", "ja": "回を重ねるごとに増える", "zh": "随局数增加"}, "편대 {0} · 비행 중 {1} · 호위 {2}기 {3} · {4}기 {5}": {"en": "Squadron {0} · In flight {1} · Escorts {2} {3} · {4} {5}", "ja": "編隊{0} · 飛行中{1} · 護衛{2}機{3} · {4}機{5}", "zh": "编队{0} · 飞行中{1} · 护卫{2}架{3} · {4}架{5}"}, "편대가 짜이면 하나씩, 모선은 게 로봇 호위와 함께 급강하하며 총을 쏩니다.": {"en": "Once the squadron forms, they dive one by one, and motherships fire guns as they dive with Crab Bot escorts.", "ja": "編隊が組まれると1機ずつ急降下し、母艦はクラブボットの護衛とともに急降下しながら銃を撃つ。", "zh": "编队组成后,敌人会逐个俯冲,母舰带着螃蟹机器人护卫一边俯冲一边开火。"}, "해파리 드론": {"en": "Jelly Drone", "ja": "ジェリードローン", "zh": "水母无人机"}, "해파리 드론과 원반 모선을 격파하고 전투기를 강화해 은하 끝까지": {"en": "Destroy Jelly Drones and Saucer Motherships, power up your fighter, and fly to the edge of the galaxy", "ja": "ジェリードローンと円盤母艦を撃破し、戦闘機を強化して銀河の果てまで", "zh": "击破水母无人机和圆盘母舰,强化战机,飞向银河尽头"}, "{0}번씩 번갈아 차고 막아서 골을 더 많이 넣으면 승리. 동점이면 한 번씩 서든데스.": {"en": "Take turns kicking and saving {0} times each. Most goals wins. If tied, it's Sudden Death, one kick each.", "ja": "{0}回ずつ交互に蹴って守り、ゴールが多い方が勝ち。同点ならサドンデスで1回ずつ。", "zh": "轮流各踢和扑{0}次，进球多者获胜。平局则进入一次一球的突然死亡。"}, "P 차기": {"en": "P Kick", "ja": "P キック", "zh": "P 射门"}, "P: 막을 곳을 몰래 누르세요 (": {"en": "P: secretly tap where to block (", "ja": "P：守る場所をこっそりタップ（", "zh": "P：悄悄点击要扑的位置（"}, "P는 잠깐 눈 감기)": {"en": "P looks away briefly)", "ja": "Pは少し目を閉じて）", "zh": "P请先闭一下眼）"}, "골 성공": {"en": "Goal!", "ja": "ゴール成功", "zh": "进球成功"}, "골대 가장자리를 맞으면 골대! · 골문 밖은 빗나감.": {"en": "Hit the edge of the post and it's Post! · Outside the goal is a Miss.", "ja": "ゴールポストの縁に当たるとポスト！ · ゴール外はミス。", "zh": "击中门柱边缘算中柱！· 球门外算偏出。"}, "골대!": {"en": "Post!", "ja": "ポスト！", "zh": "中柱！"}, "골문 누르기": {"en": "Tap the goal", "ja": "ゴールをタップ", "zh": "点击球门"}, "골키퍼 반대쪽으로 휘어 들어감": {"en": "Curves in away from the keeper", "ja": "キーパーの逆方向へ曲がって入る", "zh": "向门将反方向弧线入网"}, "골키퍼가 먼저 움직이면 반대쪽을 노리세요.": {"en": "If the keeper moves first, aim the other way.", "ja": "キーパーが先に動いたら逆側を狙おう。", "zh": "门将先动的话，就瞄准另一边。"}, "공에서 위로 밀기": {"en": "Swipe up from the ball", "ja": "ボールから上へスワイプ", "zh": "从球上向上滑"}, "공에서 위로 밀어 차기 · 빠르게 = 높게 · 휘게 밀면 휘어요": {"en": "Swipe up from the ball to kick · Faster = higher · Curve your swipe to bend it", "ja": "ボールから上へスワイプして蹴る · 速いほど高く · 曲げてスワイプするとカーブ", "zh": "从球上向上滑动射门 · 越快越高 · 滑成弧线球就会拐弯"}, "공이 올 곳을 골문에서 누르세요!": {"en": "Tap the goal where the ball will go!", "ja": "ボールが来る場所をゴールでタップ！", "zh": "点击球门上球会去的位置！"}, "구석 위": {"en": "Top corner", "ja": "上のコーナー", "zh": "上角"}, "낮게 구석으로 차면 가장 안전해요.": {"en": "Kicking low into the corner is the safest.", "ja": "低くコーナーへ蹴るのが一番安全。", "zh": "低射死角最稳妥。"}, "내가 찰 차례": {"en": "My turn to kick", "ja": "自分のキック番", "zh": "轮到我射门"}, "너무 일찍 누르면 상대가 반대쪽으로 차요 (Medium 이상).": {"en": "Tap too early and the opponent kicks the other way (Medium and above).", "ja": "早く押しすぎると相手が逆側へ蹴る（Medium以上）。", "zh": "点得太早，对手会往另一边射（Medium及以上）。"}, "둘이서 할 때는 막는 사람이 먼저 막을 곳을 몰래 누르고, 그다음에 차는 사람이 차요.": {"en": "With two players, the keeper secretly taps where to block first, then the kicker kicks.", "ja": "2人で遊ぶときは、守る人が先にこっそり守る場所をタップし、そのあと蹴る人が蹴ります。", "zh": "双人游戏时，扑球的人先悄悄点击要扑的位置，然后射门的人再射。"}, "막기 가장 어려운 곳 · 넘어갈 위험": {"en": "Hardest to save · Risk of going over", "ja": "一番止めにくい · 越える危険あり", "zh": "最难扑救 · 有射飞的风险"}, "막아라!": {"en": "Save it!", "ja": "止めろ！", "zh": "扑出去！"}, "막을 때: 공이 올 것 같은 곳을 골문에서 누르세요 · 너무 일찍 누르면 읽혀요": {"en": "To save: tap where you think the ball will go in the goal · Tap too early and it gets read", "ja": "守るとき：ボールが来そうな場所をゴールでタップ · 早すぎると読まれる", "zh": "扑球时：点击球门上你觉得球会去的位置 · 点得太早会被看穿"}, "막을 때는 상대가 차는 순간 공이 올 곳을 골문에서 누르면 골키퍼가 몸을 날려요.": {"en": "To save, tap in the goal where the ball will land the moment the opponent kicks, and the keeper dives.", "ja": "守るときは、相手が蹴る瞬間にボールが来る場所をゴールでタップすると、キーパーが飛びつきます。", "zh": "扑球时，在对手射门的瞬间点击球会去的位置，门将就会飞身扑救。"}, "막을 땐 상대가 공을 차는 순간까지 기다렸다가 누르세요.": {"en": "When saving, wait until the opponent kicks the ball, then tap.", "ja": "守るときは、相手がボールを蹴る瞬間まで待ってからタップ。", "zh": "扑球时，等对手踢球的瞬间再点击。"}, "몸 날려 막기": {"en": "Dive to save", "ja": "飛びついて守る", "zh": "飞身扑救"}, "미는 길이 한쪽으로 휘면 공도 그쪽으로 휘어 들어가요.": {"en": "If your swipe path curves to one side, the ball curves that way too.", "ja": "スワイプの軌道が片側に曲がると、ボールもそちらへ曲がって入ります。", "zh": "滑动轨迹向一侧弯，球也会向那边拐弯入网。"}, "밀다가 옆으로 휘면 공도 휘어요": {"en": "If you swipe sideways, the ball curves", "ja": "スワイプが横に曲がるとボールもカーブする", "zh": "滑动时若向侧面拐，球也会拐弯"}, "빗나감!": {"en": "Miss!", "ja": "ミス！", "zh": "偏出！"}, "서든데스!": {"en": "Sudden Death!", "ja": "サドンデス！", "zh": "突然死亡！"}, "선방!": {"en": "Save!", "ja": "セーブ！", "zh": "扑救！"}, "승부차기": {"en": "Penalty Shootout", "ja": "PK戦", "zh": "点球大战"}, "승부차기 승리!": {"en": "Penalty Shootout win!", "ja": "PK戦勝利！", "zh": "点球大战获胜！"}, "실축 · 선방 · 골대": {"en": "Missed · Save · Post", "ja": "ミス · セーブ · ポスト", "zh": "射失 · 扑救 · 中柱"}, "왕머리 선수들의 승부차기 대결. 밀어서 방향 · 세기 · 휘는 공을 정하고, 막을 때는 공이 올 곳을 눌러 몸을 날리세요. {0}번씩 차고 동점이면 서든데스!": {"en": "A Penalty Shootout showdown between Bobblehead players. Swipe to set direction, power and curve; when saving, tap where the ball will land to dive. Kick {0} times each, and if tied, Sudden Death!", "ja": "デカ頭選手たちのPK戦対決。スワイプで方向・強さ・カーブを決め、守るときはボールが来る場所をタップして飛びつこう。{0}回ずつ蹴って、同点ならサドンデス！", "zh": "大头球员的点球大战对决。滑动决定方向、力度和弧线，扑球时点击球会去的位置飞身扑救。各踢{0}次，平局则进入突然死亡！"}, "차기 (방향 · 높이 · 휘기)": {"en": "Kick (direction · height · curve)", "ja": "キック（方向 · 高さ · カーブ）", "zh": "射门（方向 · 高度 · 弧线）"}, "찰 때: 공에서 위로 밀기 · 옆으로 밀수록 구석, 빠르게 밀수록 높이 (너무 세면 넘어가요)": {"en": "To kick: swipe up from the ball · The more sideways, the nearer the corner; the faster, the higher (too hard and it goes over)", "ja": "蹴るとき：ボールから上へスワイプ · 横に傾けるほどコーナー、速いほど高く（強すぎると越える）", "zh": "射门时：从球上向上滑 · 越偏向侧面越靠角，越快越高（太用力会射飞）"}, "찰 때는 공에서 위로 밀어요. 옆으로 기울일수록 구석으로, 빠르게 밀수록 높이 날아가요. 너무 세게 밀면 가로대를 넘어가요.": {"en": "To kick, swipe up from the ball. The more you tilt sideways, the nearer the corner; the faster you swipe, the higher it flies. Swipe too hard and it goes over the crossbar.", "ja": "蹴るときはボールから上へスワイプ。横に傾けるほどコーナーへ、速くスワイプするほど高く飛びます。強すぎるとクロスバーを越えます。", "zh": "射门时从球上向上滑。越偏向侧面越靠近死角，滑得越快飞得越高。太用力会越过横梁。"}, "휘는 공": {"en": "Curve ball", "ja": "カーブボール", "zh": "弧线球"}, "+40 체력": {"en": "+40 HP", "ja": "HP+40", "zh": "生命值+40"}, "100m마다 점선이 있어요. 노란 줄은 내 최고 기록!": {"en": "There's a dotted line every 100m. The yellow line is your best record!", "ja": "100mごとに点線があるよ。黄色い線は自己ベスト！", "zh": "每100m有一条虚线。黄线是你的最高纪录！"}, "3분마다 등장": {"en": "Appears every 3 min", "ja": "3分ごとに出現", "zh": "每3分钟出现"}, "3분마다 보스 등장! 오래 버틸수록 높은 기록": {"en": "A boss appears every 3 min! Survive longer for a higher record", "ja": "3分ごとにボス出現！長く耐えるほど高記録", "zh": "每3分钟出现Boss！坚持越久纪录越高"}, "4:4 (골키퍼 1 + 수비 2 + 공격 1). 노란 고리(2P는 분홍 고리) 선수를 조종해요. 공에 가까운 선수로 자동으로 바뀌어요.": {"en": "4v4 (1 goalkeeper + 2 defenders + 1 striker). Control the player with the yellow ring (pink ring for 2P). Control switches automatically to the player nearest the ball.", "ja": "4対4（キーパー1＋DF2＋FW1）。黄色い輪（2Pはピンクの輪）の選手を操作。ボールに一番近い選手に自動で切り替わるよ。", "zh": "4对4（门将1＋后卫2＋前锋1）。操控带黄色圆圈（2P为粉色圆圈）的球员。会自动切换到离球最近的球员。"}, "90초마다 몬스터 무리가 사방에서 몰려오고, 3분마다 왕관 쓴 보스가 나와요.": {"en": "Every 90s a monster horde swarms in from all sides, and every 3 min a crowned boss appears.", "ja": "90秒ごとにモンスターの群れが四方から押し寄せ、3分ごとに王冠をかぶったボスが登場！", "zh": "每90秒怪物群会从四面八方涌来，每3分钟会出现戴王冠的Boss。"}, "9방향으로 차고, 공이 오는 바로 그 자리를 막아야 선방! 몇 번 연속 넣을까?": {"en": "Shoot in 9 directions, and block right where the ball is headed to save it! How many in a row can you score?", "ja": "9方向にシュート！ボールが来るその場所を止めればセーブ！何回連続で決められる？", "zh": "可朝9个方向射门，在球飞来的位置精准扑救！能连续进几球？"}, "⚠ 보스 등장!": {"en": "⚠ Boss incoming!", "ja": "⚠ ボス出現！", "zh": "⚠ Boss来袭！"}, "⚽ 미니 축구 4:4 — 친구랑 한 폰으로 둘이서": {"en": "⚽ Mini Soccer 4v4 — two players on one phone with a friend", "ja": "⚽ ミニサッカー4対4 — 友だちと1台のスマホで2人プレイ", "zh": "⚽ 迷你足球4对4 — 和朋友一部手机双人对战"}, "가까이 온 적을 계속 태움": {"en": "Keeps burning nearby enemies", "ja": "近づいた敵を燃やし続ける", "zh": "持续灼烧靠近的敌人"}, "가벼운 발": {"en": "Light Feet", "ja": "軽い足", "zh": "轻盈步伐"}, "가장 가까운 적에게 자동 발사": {"en": "Auto-fires at the nearest enemy", "ja": "一番近い敵に自動発射", "zh": "自动射向最近的敌人"}, "가장 작은 과일": {"en": "Smallest fruit", "ja": "一番小さいフルーツ", "zh": "最小的水果"}, "가장 큰 과일 ·": {"en": "Biggest fruit ·", "ja": "一番大きいフルーツ ·", "zh": "最大的水果 ·"}, "가장 큰 과일 · 둘을 합치면 보너스": {"en": "Biggest fruit · Merge two for a bonus", "ja": "一番大きいフルーツ · 2つ合わせるとボーナス", "zh": "最大的水果 · 合成两个有奖励"}, "가장 큰 과일:": {"en": "Biggest fruit:", "ja": "一番大きいフルーツ：", "zh": "最大的水果："}, "갈색 발판": {"en": "Brown platform", "ja": "茶色い足場", "zh": "棕色平台"}, "갈색 발판은 밟으면 부서져요. 하얀 구름 발판은 한 번 밟으면 사라지고, 파란 발판은 좌우로 움직여요.": {"en": "Brown platforms break when you step on them. White cloud platforms vanish after one bounce, and blue platforms move side to side.", "ja": "茶色い足場は踏むと壊れるよ。白い雲の足場は1回踏むと消えて、青い足場は左右に動くよ。", "zh": "棕色平台踩上去会碎。白色云朵平台踩一次就会消失，蓝色平台会左右移动。"}, "갈색 발판은 밟지 말고 지나쳐요.": {"en": "Skip brown platforms—don't land on them.", "ja": "茶色い足場は踏まずにスルーしよう。", "zh": "别踩棕色平台，直接跳过。"}, "강화 고르기": {"en": "Choose an upgrade", "ja": "強化を選ぶ", "zh": "选择强化"}, "같은 과일 두 개가 닿으면 합쳐져 다음 과일로": {"en": "Two matching fruits merge into the next fruit when they touch", "ja": "同じフルーツが2つ触れると合体して次のフルーツに", "zh": "两个相同水果碰到就会合成下一种水果"}, "같은 과일 두 개가 닿으면 합쳐져 한 단계 큰 과일이 돼요: 블루베리 → 체리 → 딸기 → 포도 → 귤 → 사과 → 배 → 복숭아 → 파인애플 → 멜론 → 수박.": {"en": "Two matching fruits merge into a bigger fruit when they touch: Blueberry → Cherry → Strawberry → Grape → Tangerine → Apple → Pear → Peach → Pineapple → Melon → Watermelon.", "ja": "同じフルーツが2つ触れると合体して1段階大きいフルーツに：ブルーベリー → さくらんぼ → いちご → ぶどう → みかん → りんご → 梨 → 桃 → パイナップル → メロン → スイカ。", "zh": "两个相同水果碰到就会合成更大一级的水果：蓝莓 → 樱桃 → 草莓 → 葡萄 → 橘子 → 苹果 → 梨 → 桃子 → 菠萝 → 甜瓜 → 西瓜。"}, "같은 과일을 합쳐 수박까지! 한 번 시작하면 멈출 수 없는 물리 퍼즐": {"en": "Merge matching fruits all the way to a watermelon! A physics puzzle you can't put down", "ja": "同じフルーツを合わせてスイカまで！始めたら止まらない物理パズル", "zh": "合成相同水果直到西瓜！一玩就停不下来的物理益智游戏"}, "같은 과일을 합쳐 점점 큰 과일을 만들고, 상자가 넘치기 전까지 최대한 높은 점수를 노리세요.": {"en": "Merge matching fruits into bigger ones and aim for the highest score before the box overflows.", "ja": "同じフルーツを合わせてどんどん大きくし、箱があふれる前にハイスコアを目指そう。", "zh": "合成相同水果做出更大的水果，在箱子溢出前冲击最高分。"}, "경험치 줍는 범위 +40%": {"en": "Gem pickup range +40%", "ja": "経験値の回収範囲 +40%", "zh": "经验拾取范围 +40%"}, "공 없을 때: 태클 · 선수 바꾸기 · 공에 가까운 선수로 자동 전환": {"en": "Without the ball: Tackle · Switch player · Auto-switch to the player nearest the ball", "ja": "ボールなし：タックル · 選手切り替え · ボールに近い選手へ自動切り替え", "zh": "无球时：铲抢 · 切换球员 · 自动切换到离球最近的球员"}, "공 있을 때: 패스 · 슛 (1P X·Z / 2P G·F) — 스틱 방향으로 차요": {"en": "With the ball: Pass · Shoot (1P X·Z / 2P G·F) — kicks in the stick direction", "ja": "ボールあり：パス · シュート（1P X·Z / 2P G·F）— スティックの方向に蹴るよ", "zh": "持球时：传球 · 射门（1P X·Z / 2P G·F）— 朝摇杆方向踢"}, "과일 합치기": {"en": "Fruit Merge", "ja": "フルーツ合体", "zh": "水果合成"}, "과일을 떨어뜨려 같은 과일끼리 닿게 하면 한 단계 큰 과일로 변해요. 블루베리에서 수박까지! 상자 위 선을 넘으면 끝.": {"en": "Drop fruits so matching ones touch and they turn into a bigger fruit. From blueberry to watermelon! Cross the line above the box and it's over.", "ja": "フルーツを落として同じもの同士をくっつけると1段階大きいフルーツに。ブルーベリーからスイカまで！箱の上の線を越えたら終了。", "zh": "投下水果让相同的碰在一起，就会变成更大一级的水果。从蓝莓到西瓜！超过箱子上方的线就结束。"}, "과일이 위쪽 빨간 선을 넘은 채로 오래 있으면 끝 · 수박 두 개를 합치면 큰 보너스": {"en": "Game over if fruit stays above the red line too long · Merge two watermelons for a big bonus", "ja": "フルーツが上の赤い線を越えたまま長くいると終了 · スイカ2つを合わせると大ボーナス", "zh": "水果长时间超过上方红线即结束 · 合成两个西瓜有大奖励"}, "과일이 위쪽 빨간 점선을 넘은 채로 잠깐 멈춰 있으면 끝.": {"en": "Game over if fruit rests above the red dotted line at the top for a moment.", "ja": "フルーツが上の赤い点線を越えたまま少し止まると終了。", "zh": "水果超过上方红色虚线并停留片刻即结束。"}, "구름 발판": {"en": "Cloud platform", "ja": "雲の足場", "zh": "云朵平台"}, "구름 점프": {"en": "Cloud Jump", "ja": "クラウドジャンプ", "zh": "云朵跳跃"}, "넘치면 끝": {"en": "Game over if it overflows", "ja": "あふれたら終了", "zh": "溢出即结束"}, "높이": {"en": "Height", "ja": "高さ", "zh": "高度"}, "높이 점프": {"en": "High jump", "ja": "ハイジャンプ", "zh": "高跳"}, "누른 채 끌기": {"en": "Press & drag", "ja": "押したままドラッグ", "zh": "按住拖动"}, "다음": {"en": "Next", "ja": "次", "zh": "下一个"}, "다음 과일을 보고 미리 자리를 비워 두세요.": {"en": "Check the next fruit and make room for it in advance.", "ja": "次のフルーツを見て、先に場所を空けておこう。", "zh": "看好下一个水果，提前留出位置。"}, "닭다리": {"en": "Drumstick", "ja": "骨付き肉", "zh": "鸡腿"}, "도끼 던지기": {"en": "Axe Toss", "ja": "斧投げ", "zh": "飞斧"}, "둘이서: 한 기기 왼쪽 절반은 1P(아래 팀), 오른쪽 절반은 2P(위 팀). 키보드는 1P 방향키·N·M, 2P WASD·G·F.": {"en": "Two players: on one device, the left half is 1P (bottom team), the right half is 2P (top team). Keyboard: 1P arrow keys·N·M, 2P WASD·G·F.", "ja": "2人プレイ：1台の画面の左半分は1P（下チーム）、右半分は2P（上チーム）。キーボードは1P 方向キー·N·M、2P WASD·G·F。", "zh": "双人模式：同一设备左半边为1P（下方队伍），右半边为2P（上方队伍）。键盘：1P 方向键·N·M，2P WASD·G·F。"}, "딱 맞추면 잘리지 않음": {"en": "Land it exactly and nothing gets cut", "ja": "ぴったり合わせると削れない", "zh": "完美对齐就不会被切掉"}, "딱 맞추면 퍼펙트! 연속 퍼펙트면 블록이 조금씩 커져요": {"en": "Line it up exactly for a Perfect! Perfect streaks make the block grow little by little", "ja": "ぴったりでパーフェクト！連続パーフェクトでブロックが少しずつ大きくなるよ", "zh": "完美对齐就是Perfect！连续Perfect方块会慢慢变大"}, "딱 맞추면 퍼펙트! 퍼펙트를 3번 이상 이어가면 블록이 조금씩 다시 커져요.": {"en": "Line it up exactly for a Perfect! Keep a streak of 3+ Perfects and the block slowly grows back.", "ja": "ぴったりでパーフェクト！3回以上パーフェクトを続けるとブロックが少しずつ大きく戻るよ。", "zh": "完美对齐就是Perfect！连续3次以上Perfect，方块会慢慢变回大块。"}, "떨어뜨리기": {"en": "Drop", "ja": "落とす", "zh": "投下"}, "떨어지는 중에 다음 발판 바로 위로 미리 가 있으세요.": {"en": "While falling, move right above the next platform in advance.", "ja": "落ちている間に、次の足場の真上へ先回りしよう。", "zh": "下落时提前移动到下一个平台的正上方。"}, "레벨 업!": {"en": "Level up!", "ja": "レベルアップ！", "zh": "升级！"}, "레벨 업마다 카드 3장 중 하나를 골라요. 무기는 최대 4종까지, 각각 6레벨까지 강해져요.": {"en": "Each level up, pick one of 3 cards. Hold up to 4 weapons, each upgradable to Lv 6.", "ja": "レベルアップごとに3枚のカードから1枚を選ぶよ。武器は最大4種類、それぞれLv6まで強化できるよ。", "zh": "每次升级从3张卡中选1张。武器最多4种，每种可强化至6级。"}, "레벨업하면 카드 3장 중 하나를 골라요": {"en": "Level up to pick one of 3 cards", "ja": "レベルアップで3枚のカードから1枚を選ぶ", "zh": "升级后从3张卡中选1张"}, "마리 밟기": {"en": "stomped", "ja": "匹踏みつけ", "zh": "只踩踏"}, "막을 때: 공이 날아오는 바로 그 지점을 정확히 누르기 · 손이 그 자리로 가요 · 미리 누르면 반대로 차요": {"en": "To save: tap exactly where the ball is flying · The keeper's hands go there · Tap too early and you dive the wrong way", "ja": "セーブ：ボールが飛んでくる地点を正確にタップ · 手がその場所へ · 早押しすると逆に飛ぶよ", "zh": "扑救：精准点击球飞来的位置 · 手会扑向那里 · 点太早会扑反方向"}, "막을 때는 공이 날아오는 바로 그 지점을 정확히 눌러야 해요. 골키퍼 손이 누른 자리로 가고, 빗나가면 못 막아요 (몸에 맞으면 막힘).": {"en": "To save, tap exactly where the ball is flying. The keeper's hands go to the spot you tap—miss and it's a goal (a hit to the body still counts as a save).", "ja": "セーブするには、ボールが飛んでくる地点を正確にタップしよう。キーパーの手はタップした場所へ動き、外れると止められないよ（体に当たればセーブ）。", "zh": "扑救时要精准点击球飞来的位置。门将的手会扑向点击处，偏了就挡不住（打到身上也算扑出）。"}, "멈춰 있지 말고 크게 원을 그리며 도세요.": {"en": "Don't stand still—keep running in big circles.", "ja": "止まらずに、大きく円を描いて回ろう。", "zh": "别停下，绕大圈跑动。"}, "모든 공격 쿨타임 -8%": {"en": "All attack cooldowns -8%", "ja": "全攻撃のクールタイム -8%", "zh": "所有攻击冷却 -8%"}, "몬스터 서바이벌": {"en": "Monster Survival", "ja": "モンスターサバイバル", "zh": "怪物生存战"}, "몬스터가 몰려온다!": {"en": "Monsters are coming!", "ja": "モンスターが押し寄せる！", "zh": "怪物来袭！"}, "몬스터에 닿아 있으면 체력이 줄어요. 체력이 0이 되면 끝.": {"en": "Touching monsters drains your HP. Game over at 0 HP.", "ja": "モンスターに触れているとHPが減るよ。HPが0になったら終了。", "zh": "接触怪物会减少生命值。生命值归零即结束。"}, "몰려오는 몬스터 사이에서 최대한 오래 살아남으세요.": {"en": "Survive as long as you can amid the swarming monsters.", "ja": "押し寄せるモンスターの中でできるだけ長く生き残ろう。", "zh": "在蜂拥而至的怪物中尽可能久地存活。"}, "몸 주위를 도는 빛 구슬": {"en": "Glowing orbs circle around you", "ja": "体のまわりを回る光の玉", "zh": "绕身旋转的光球"}, "무기는 저절로 공격해요. 적이 떨군 보석을 주우면 경험치": {"en": "Weapons attack on their own. Pick up gems enemies drop for XP", "ja": "武器は自動で攻撃。敵が落とした宝石を拾うと経験値", "zh": "武器会自动攻击。捡起敌人掉落的宝石获得经验"}, "무작위 적에게 벼락": {"en": "Strikes random enemies with lightning", "ja": "ランダムな敵に落雷", "zh": "随机劈向敌人的闪电"}, "밟았다! +20m 보너스": {"en": "Stomped! +20m bonus", "ja": "踏んだ！+20mボーナス", "zh": "踩中！+20m奖励"}, "밟으면 부서짐": {"en": "Breaks when stepped on", "ja": "踏むと壊れる", "zh": "踩了会碎"}, "버틴 시간이 기록이에요.": {"en": "Your survival time is your record.", "ja": "耐えた時間が記録になるよ。", "zh": "存活时间就是你的纪录。"}, "벌은 위에서 밟으면 물리치고 +20m 보너스. 옆이나 아래에서 부딪히면 끝.": {"en": "Stomp bees from above to beat them for a +20m bonus. Bump into them from the side or below and it's over.", "ja": "ハチは上から踏めば倒せて+20mボーナス。横や下からぶつかると終了。", "zh": "从上方踩蜜蜂可击败它，获得+20m奖励。从侧面或下方撞到就结束。"}, "벌은 위에서 밟으면 물리치고, 옆에서 부딪히면 끝": {"en": "Stomp bees from above to beat them; bump into them from the side and it's over", "ja": "ハチは上から踏めば倒せる。横からぶつかると終了", "zh": "从上方踩蜜蜂可击败它，从侧面撞到就结束"}, "병아리는 발판에 닿으면 저절로 튀어 올라요": {"en": "The chick bounces automatically when it lands on a platform", "ja": "ヒヨコは足場に触れると自動で跳ねるよ", "zh": "小鸡碰到平台会自动弹起"}, "병아리는 발판에 닿으면 저절로 튀어 올라요. 좌우만 움직이면 돼요.": {"en": "The chick bounces automatically when it lands on a platform. Just move left and right.", "ja": "ヒヨコは足場に触れると自動で跳ねるよ。左右に動かすだけでOK。", "zh": "小鸡碰到平台会自动弹起。只需左右移动就好。"}, "보석을 먹으러 몬스터 무리에 뛰어들지 마세요. 자석 강화가 도움돼요.": {"en": "Don't dive into a monster horde to grab gems. The Magnet upgrade helps.", "ja": "宝石を拾いにモンスターの群れへ飛び込まないで。磁石の強化が役立つよ。", "zh": "别为了捡宝石冲进怪物群。磁铁强化很有用。"}, "보스 처치!": {"en": "Boss defeated!", "ja": "ボス撃破！", "zh": "击败Boss！"}, "분": {"en": "min", "ja": "分", "zh": "分"}, "분홍 보석": {"en": "Pink gem", "ja": "ピンクの宝石", "zh": "粉色宝石"}, "불꽃 고리": {"en": "Flame Ring", "ja": "炎の輪", "zh": "火焰环"}, "블록 떨어뜨리기": {"en": "Drop the block", "ja": "ブロックを落とす", "zh": "投下方块"}, "블록이 끝까지 갔다 돌아올 때가 가장 느려 보여요. 리듬을 타세요.": {"en": "The block looks slowest when it turns around at the edge. Find the rhythm.", "ja": "ブロックは端で折り返すときが一番ゆっくりに見えるよ。リズムに乗ろう。", "zh": "方块在边缘折返时看起来最慢。抓住节奏。"}, "블록이 아래 블록을 완전히 벗어나면 끝.": {"en": "Game over if the block misses the one below completely.", "ja": "ブロックが下のブロックから完全に外れたら終了。", "zh": "方块完全偏离下方方块即结束。"}, "빨간 점선": {"en": "Red dotted line", "ja": "赤い点線", "zh": "红色虚线"}, "상자가 넘쳤어요!": {"en": "The box overflowed!", "ja": "箱があふれた！", "zh": "箱子溢出了！"}, "생존": {"en": "Survived", "ja": "生存", "zh": "存活"}, "생존 · 자동 공격": {"en": "Survival · Auto-attack", "ja": "サバイバル · 自動攻撃", "zh": "生存 · 自动攻击"}, "서바이벌": {"en": "Survival", "ja": "サバイバル", "zh": "生存"}, "수박 두 개를 합치면 둘 다 사라지며 큰 보너스!": {"en": "Merge two watermelons and both vanish for a big bonus!", "ja": "スイカを2つ合わせると両方消えて大ボーナス！", "zh": "合成两个西瓜，两个都会消失并获得大奖励！"}, "수박 둘! +100": {"en": "Two watermelons! +100", "ja": "スイカ2つ！+100", "zh": "两个西瓜！+100"}, "스틱": {"en": "Stick", "ja": "スティック", "zh": "摇杆"}, "스틱: 이동 (1P 방향키 · 2P WASD)": {"en": "Stick: Move (1P arrow keys · 2P WASD)", "ja": "スティック：移動（1P 方向キー · 2P WASD）", "zh": "摇杆：移动（1P 方向键 · 2P WASD）"}, "스프링을 밟으면 크게, 분홍 풍선을 잡으면 한동안 쭉 솟아올라요.": {"en": "Springs launch you high, and grabbing a pink balloon lifts you way up for a while.", "ja": "スプリングを踏むと大ジャンプ、ピンクの風船をつかむとしばらくぐんぐん上昇！", "zh": "踩弹簧能高高跳起，抓住粉色气球能持续上升一阵子。"}, "쌓은 블록 수 = 점수": {"en": "Blocks stacked = score", "ja": "積んだブロック数 = スコア", "zh": "堆叠方块数 = 分数"}, "쓰러진 몬스터가 떨군 보석을 주우면 경험치가 차요. 경험치 막대가 가득 차면 레벨 업!": {"en": "Pick up gems dropped by defeated monsters to fill your XP. Fill the XP bar to level up!", "ja": "倒したモンスターが落とした宝石を拾うと経験値がたまるよ。経験値バーが満タンになるとレベルアップ！", "zh": "捡起被击败怪物掉落的宝石来积累经验。经验条满了就升级！"}, "아래 블록에서 삐져나온 부분은 잘려 나가고, 남은 크기로 다음 블록이 나와요.": {"en": "Any part hanging off the block below gets cut off, and the next block comes in at the remaining size.", "ja": "下のブロックからはみ出た部分は削られ、残ったサイズで次のブロックが出てくるよ。", "zh": "超出下方方块的部分会被切掉，下一个方块以剩余大小出现。"}, "아래로 떨어져 화면 밖으로 나가면 끝.": {"en": "Game over if you fall off the bottom of the screen.", "ja": "下に落ちて画面の外に出たら終了。", "zh": "掉出屏幕下方即结束。"}, "어긋난 만큼 잘려 나가고 블록이 작아져요": {"en": "The overhang gets cut and the block shrinks", "ja": "ずれた分だけ削られてブロックが小さくなる", "zh": "偏多少就切掉多少，方块会变小"}, "오가는 블록을 딱 맞춰 쌓아 하늘까지! 삐져나온 부분은 잘려 나가고, 딱 맞추면 퍼펙트 콤보로 블록이 다시 커져요.": {"en": "Stack the sliding blocks perfectly all the way to the sky! Overhangs get cut off, but Perfect combos make the block grow again.", "ja": "行き来するブロックをぴったり積んで空まで！はみ出た部分は削られるけど、パーフェクトコンボでブロックがまた大きくなるよ。", "zh": "把来回移动的方块精准堆叠直上云霄！超出部分会被切掉，Perfect连击能让方块重新变大。"}, "움직이기": {"en": "Move", "ja": "移動", "zh": "移动"}, "움직이기만 하면 공격은 자동! 몰려오는 몬스터를 버티며 나만의 무기 조합을 완성하세요": {"en": "Just move—attacks are automatic! Survive the swarming monsters and build your own weapon combo", "ja": "動くだけで攻撃は自動！押し寄せるモンスターに耐えて自分だけの武器の組み合わせを完成させよう", "zh": "只需移动，攻击全自动！抵御蜂拥而来的怪物，打造专属武器组合"}, "움직이기만 하면 돼요. 무기는 저절로 공격해요.": {"en": "Just move. Your weapons attack on their own.", "ja": "動くだけでOK。武器は自動で攻撃するよ。", "zh": "只需移动就好。武器会自动攻击。"}, "움직이기만 하세요, 공격은 무기가 알아서! 몰려오는 몬스터를 버티며 레벨업마다 3장 중 1장을 골라 나만의 조합으로 강해지세요.": {"en": "Just move—your weapons handle the attacking! Survive the monster swarm, pick 1 of 3 cards each level up, and power up with your own build.", "ja": "動くだけ、攻撃は武器におまかせ！押し寄せるモンスターに耐えながら、レベルアップごとに3枚から1枚を選んで自分だけの組み合わせで強くなろう。", "zh": "只管移动，攻击交给武器！抵御蜂拥而来的怪物，每次升级从3张卡中选1张，用专属组合变强。"}, "위에서 내려다보는 4:4 아케이드 축구. 스틱으로 달리고 패스로 엮어 슛! 공이 없을 땐 태클로 뺏으세요. 2분 경기, 동점이면 골든골. 한 기기 둘이서도 돼요.": {"en": "Top-down 4v4 arcade soccer. Run with the stick, link up passes, and shoot! Tackle to steal when you don't have the ball. 2-minute matches, golden goal if tied. Two players can share one device, too.", "ja": "上から見下ろす4対4アーケードサッカー。スティックで走り、パスをつないでシュート！ボールがないときはタックルで奪おう。1試合2分、同点ならゴールデンゴール。1台で2人プレイもOK。", "zh": "俯视视角4对4街机足球。用摇杆奔跑，传球配合射门！无球时用铲抢夺球。每场2分钟，平局则金球制胜。也支持同一设备双人对战。"}, "위에서 밟기": {"en": "Stomp from above", "ja": "上から踏む", "zh": "从上方踩"}, "위치": {"en": "Position", "ja": "位置", "zh": "位置"}, "위치 정하기": {"en": "Set position", "ja": "位置を決める", "zh": "选定位置"}, "이동 (둘이서는 화면 왼쪽 1P · 오른쪽 2P)": {"en": "Move (two players: 1P on the left side of the screen · 2P on the right)", "ja": "移動（2人プレイは画面左が1P · 右が2P）", "zh": "移动（双人时屏幕左侧1P · 右侧2P）"}, "자석! 보석이 모두 날아와요": {"en": "Magnet! All gems fly to you", "ja": "磁石！宝石が全部飛んでくる", "zh": "磁铁！宝石全部飞过来"}, "작아졌을 땐 무리하지 말고 퍼펙트 연속으로 키우세요.": {"en": "When the block gets small, play it safe and grow it back with Perfect streaks.", "ja": "小さくなったら無理せず、連続パーフェクトで大きくしよう。", "zh": "方块变小时别冒险，用连续Perfect把它变大。"}, "작은 과일이 큰 과일 사이에 끼지 않게 조심.": {"en": "Don't let small fruits get stuck between big ones.", "ja": "小さいフルーツが大きいフルーツの間にはさまらないよう注意。", "zh": "小心别让小水果卡在大水果之间。"}, "좌우로 끌기": {"en": "Drag left/right", "ja": "左右にドラッグ", "zh": "左右拖动"}, "좌우로 오가는 블록을 딱 맞춰 떨어뜨려 탑을 최대한 높이 쌓으세요.": {"en": "Drop the side-to-side sliding block right on target and build the tower as high as you can.", "ja": "左右に動くブロックをぴったり落として、タワーをできるだけ高く積もう。", "zh": "把左右移动的方块精准投下，尽可能把塔堆高。"}, "좌우로 움직임": {"en": "Moves side to side", "ja": "左右に動く", "zh": "左右移动"}, "중간 크기": {"en": "Medium size", "ja": "中くらい", "zh": "中等大小"}, "지금 뜨는 새 게임": {"en": "New & trending games", "ja": "いま話題の新作ゲーム", "zh": "热门新游戏"}, "쭉 솟아오름": {"en": "Shoots way up", "ja": "ぐんぐん上昇", "zh": "一飞冲天"}, "첫 기록에 도전!": {"en": "Set your first record!", "ja": "初記録に挑戦！", "zh": "挑战首个纪录！"}, "체력 +40": {"en": "HP +40", "ja": "HP+40", "zh": "生命值+40"}, "체력 모두 회복": {"en": "Fully restores HP", "ja": "HP全回復", "zh": "生命值全部恢复"}, "초 생존 · 처치": {"en": "s survived · Kills", "ja": "秒生存 · 撃破", "zh": "秒存活 · 击败"}, "초록 발판": {"en": "Green platform", "ja": "緑の足場", "zh": "绿色平台"}, "초반엔 무기 종류를 늘리고, 중반부터는 한두 개를 끝까지 키우세요.": {"en": "Early on, collect more weapon types; from midgame, max out one or two.", "ja": "序盤は武器の種類を増やし、中盤からは1～2個を最大まで育てよう。", "zh": "前期多拿几种武器，中期开始集中把一两种升满。"}, "최대 체력 +20 · 체력 모두 회복": {"en": "Max HP +20 · Fully restores HP", "ja": "最大HP+20 · HP全回復", "zh": "最大生命值+20 · 生命值全部恢复"}, "층이 오를수록 블록이 빨라져요.": {"en": "Blocks speed up as the tower gets taller.", "ja": "高く積むほどブロックが速くなるよ。", "zh": "塔越高，方块移动越快。"}, "친구와 승부차기": {"en": "Penalty shootout with a friend", "ja": "友だちとPK戦", "zh": "和朋友点球大战"}, "카드 고르기": {"en": "Choose a card", "ja": "カードを選ぶ", "zh": "选择卡牌"}, "카드 누르기": {"en": "Tap a card", "ja": "カードをタップ", "zh": "点击卡牌"}, "큰 과일은 한쪽 구석에 모으세요.": {"en": "Gather big fruits in one corner.", "ja": "大きいフルーツは片方の隅に集めよう。", "zh": "把大水果集中到一个角落。"}, "클수록 점수가 많고, 연달아 합치면 콤보 보너스.": {"en": "Bigger fruits score more, and back-to-back merges earn combo bonuses.", "ja": "大きいほど高得点、続けて合わせるとコンボボーナス。", "zh": "水果越大分数越高，连续合成有连击奖励。"}, "타이밍 · 한 손": {"en": "Timing · One hand", "ja": "タイミング · 片手", "zh": "时机 · 单手"}, "탑 쌓기": {"en": "Stack Tower", "ja": "スタックタワー", "zh": "堆塔"}, "통통 튀는 병아리를 좌우로 움직여 발판을 밟고 최대한 높이 올라가세요.": {"en": "Move the bouncy chick left and right to land on platforms and climb as high as you can.", "ja": "ぴょんぴょん跳ねるヒヨコを左右に動かして足場を踏み、できるだけ高く登ろう。", "zh": "左右移动蹦蹦跳跳的小鸡踩上平台，尽可能往高处爬。"}, "통통 튀는 병아리를 좌우로 움직여 발판을 밟고 하늘 끝까지! 스프링·풍선을 타면 쭉 솟구치고, 부서지는 발판과 벌을 조심.": {"en": "Move the bouncy chick left and right to land on platforms all the way to the sky! Ride springs and balloons to soar, and watch out for breaking platforms and bees.", "ja": "ぴょんぴょん跳ねるヒヨコを左右に動かして足場を踏み、空の果てまで！スプリングや風船でぐんと上昇、壊れる足場とハチに注意。", "zh": "左右移动蹦蹦跳跳的小鸡踩上平台，直冲天际！借助弹簧和气球一飞冲天，小心会碎的平台和蜜蜂。"}, "통통 튀는 병아리와 하늘 끝까지! 스프링·풍선 타고 몇 m까지 갈 수 있을까?": {"en": "To the top of the sky with a bouncy chick! How many meters can you go with springs and balloons?", "ja": "ぴょんぴょんヒヨコと空の果てまで！スプリングと風船で何mまで行ける？", "zh": "和蹦蹦跳跳的小鸡冲向天际！借助弹簧和气球能飞多少m？"}, "튼튼한 몸": {"en": "Sturdy Body", "ja": "頑丈な体", "zh": "强健体魄"}, "파란 발판": {"en": "Blue platform", "ja": "青い足場", "zh": "蓝色平台"}, "파란 보석": {"en": "Blue gem", "ja": "青い宝石", "zh": "蓝色宝石"}, "포물선으로 날아가 모두 관통": {"en": "Flies in an arc, piercing everything", "ja": "放物線を描いて飛び、すべて貫通", "zh": "呈抛物线飞出，贯穿一切"}, "풍선 타고 슝!": {"en": "Balloon ride, whoosh!", "ja": "風船でびゅーん！", "zh": "乘气球，嗖！"}, "하나를 고르세요": {"en": "Pick one", "ja": "1つ選んでね", "zh": "选一个吧"}, "한 번 밟으면 사라짐": {"en": "Vanishes after one step", "ja": "1回踏むと消える", "zh": "踩一次就消失"}, "화면 누르기": {"en": "Tap the screen", "ja": "画面をタップ", "zh": "点击屏幕"}, "화면 아무 곳이나 누른 채 끌면 그쪽으로 움직여요 (방향키·WASD도 돼요)": {"en": "Press and drag anywhere on the screen to move that way (arrow keys·WASD work too)", "ja": "画面のどこでも押したままドラッグするとその方向に動くよ（方向キー·WASDもOK）", "zh": "在屏幕任意位置按住拖动即可朝该方向移动（方向键·WASD也可以）"}, "화면 옆으로 나가면 반대쪽에서 나와요": {"en": "Go off one side of the screen and you come out the other", "ja": "画面の横から出ると反対側から出てくるよ", "zh": "从屏幕一侧出去会从另一侧出现"}, "화면 왼쪽 끝으로 나가면 오른쪽에서, 오른쪽 끝으로 나가면 왼쪽에서 나와요.": {"en": "Go off the left edge of the screen and you come out on the right, and vice versa.", "ja": "画面の左端から出ると右から、右端から出ると左から出てくるよ。", "zh": "从屏幕左边出去会从右边出现，从右边出去会从左边出现。"}, "화면을 누르면 블록이 떨어져요 (스페이스)": {"en": "Tap the screen to drop the block (Space)", "ja": "画面をタップするとブロックが落ちるよ（スペース）", "zh": "点击屏幕投下方块（空格键）"}, "화면을 누르면 움직이던 블록이 그 자리에 떨어져요.": {"en": "Tap the screen and the moving block drops right where it is.", "ja": "画面をタップすると、動いていたブロックがその場に落ちるよ。", "zh": "点击屏幕，移动中的方块会在当前位置落下。"}, "화면을 누른 채 끌어서 움직여요 · 공격은 자동!": {"en": "Press and drag on the screen to move · Attacks are automatic!", "ja": "画面を押したままドラッグで移動 · 攻撃は自動！", "zh": "按住屏幕拖动来移动 · 攻击全自动！"}, "화면을 눌러 블록을 쌓으세요": {"en": "Tap the screen to stack blocks", "ja": "画面をタップしてブロックを積もう", "zh": "点击屏幕堆叠方块"}, "화면을 좌우로 끌거나 방향키로 움직여요": {"en": "Drag left/right on the screen or use the arrow keys to move", "ja": "画面を左右にドラッグするか方向キーで移動", "zh": "左右拖动屏幕或用方向键移动"}, "화면을 좌우로 끌어 떨어뜨릴 위치를 정하고, 손을 떼면 과일이 떨어져요.": {"en": "Drag left/right on the screen to choose where to drop, then let go to drop the fruit.", "ja": "画面を左右にドラッグして落とす位置を決め、指を離すとフルーツが落ちるよ。", "zh": "左右拖动屏幕选择投放位置，松手水果就会落下。 oal, then dive to stop incoming shots. How many in a row can you go without a miss? The keeper and kicker get tougher as you go.", "ja": "ゴールの隅を狙って蹴り、飛んでくるボールに飛びついて止めよう。一度もミスせずに何回続けられる？成功するほどキーパーとキッカーが強くなる。", "zh": "瞄准球门各个角落射门，看准来球飞身扑救。不失误能连续多少次？越成功门将和射手越强。"}, "공이 갈 곳을 골문에서 누르세요!": {"en": "Tap where the ball is going!", "ja": "ボールが行く場所をタップ！", "zh": "点击球将飞去的位置！"}, "구석일수록 막기 어렵지만 빗나가기 쉬워요 · 게이지가 빨간 칸이면 넘어가요": {"en": "Corners are harder to save but easier to miss · Red on the gauge = over the bar", "ja": "隅ほど止めにくいが外しやすい · ゲージが赤だと枠の上", "zh": "越靠角越难扑也越易偏 · 力量条在红区会踢飞"}, "끝없는 승부차기 · 한 번 놓치면 끝": {"en": "Endless shootout · one miss and it’s over", "ja": "エンドレスPK戦 · 一度ミスで終了", "zh": "无尽点球 · 失误一次即结束"}, "끝없이": {"en": "Endless", "ja": "エンドレス", "zh": "无尽"}, "끝없이 · 연속 기록 (오늘의 한판도 이 모드)": {"en": "Endless · streak record (Daily Round uses this too)", "ja": "エンドレス · 連続記録（今日の一戦もこのモード）", "zh": "无尽 · 连续纪录（今日一局也用此模式）"}, "노리고 차기!": {"en": "Aim and shoot!", "ja": "狙ってシュート！", "zh": "瞄准射门！"}, "둘이서": {"en": "2 players", "ja": "2人で", "zh": "双人"}, "막을 때: 상대가 찬 공을 보고 공이 갈 곳을 골문에서 누르기 · 미리 누르면 반대로 차요": {"en": "Saving: watch the shot and tap where it’s going · Tap too early and they’ll shoot the other way", "ja": "守る時：蹴られたボールを見て行き先をタップ · 早く押すと逆を狙われる", "zh": "扑救：看准射门点击落点 · 提前点击对方会踢向另一边"}, "승부차기 끝": {"en": "Shootout over", "ja": "PK戦終了", "zh": "点球结束"}, "완벽한 킥!": {"en": "Perfect kick!", "ja": "完璧なキック！", "zh": "完美射门！"}, "좋은 킥": {"en": "Good kick", "ja": "いいキック", "zh": "好球"}, "차기 · 막기를 번갈아": {"en": "Taking turns shooting · saving", "ja": "キックとセーブを交互に", "zh": "射门与扑救交替"}, "찰 때: 골문을 눌러 노릴 곳 정하기 (왼쪽 위 · 오른쪽 아래 …) → 아래를 누르고 있다가 초록 칸에서 떼기": {"en": "Shooting: tap the goal to aim (top left · bottom right …) → hold below and release in the green", "ja": "蹴る時：ゴールをタップして狙う（左上 · 右下 …）→ 下を長押しして緑で離す", "zh": "射门：点击球门选定位置（左上 · 右下 …）→ 按住下方在绿区松开"}, "초록 칸에서 떼세요!": {"en": "Release in the green!", "ja": "緑で離して！", "zh": "在绿区松开！"}, "한 기기에서 둘이서": {"en": "2 players on one device", "ja": "1台で2人", "zh": "一台设备双人"}, "{0}번 연속 성공!": {"en": "{0} in a row!", "ja": "{0}回連続成功！", "zh": "连续成功{0}次！"}, "차기 · 막기를 번갈아 {0}번 연속 성공": {"en": "{0} in a row, shooting and saving", "ja": "キックとセーブで{0}回連続成功", "zh": "射门扑救交替连续成功{0}次"}, "{0}연속!": {"en": "{0} in a row!", "ja": "{0}連続！", "zh": "{0}连！"}, "{0}번 연속": {"en": "{0} in a row", "ja": "{0}回連続", "zh": "连续{0}次"}, "상대 레벨 {0}%": {"en": "Opponent level {0}%", "ja": "相手レベル {0}%", "zh": "对手等级 {0}%"}, "연속 성공": {"en": "Streak", "ja": "連続成功", "zh": "连续成功"}, "동 {0}번": {"en": "Bronze {0}", "ja": "銅 {0}回", "zh": "铜 {0}次"}, "은 {0}번": {"en": "Silver {0}", "ja": "銀 {0}回", "zh": "银 {0}次"}, "금 {0}번": {"en": "Gold {0}", "ja": "金 {0}回", "zh": "金 {0}次"}, "축구 · 연속 기록": {"en": "Soccer · Streak", "ja": "サッカー · 連続記録", "zh": "足球 · 连续纪录"}, "2분 동안 상대보다 골을 더 많이 넣으면 승리. 동점이면 먼저 넣는 쪽이 이기는 골든골.": {"en": "Score more than your opponent in 2 minutes. If tied, the next goal wins (golden goal).", "ja": "2分間で相手より多く得点すれば勝ち。同点なら先に決めた方が勝つゴールデンゴール。", "zh": "2分钟内进球多者获胜。平局则进入金球制，先进球者胜。"}, "3:3 (골키퍼 1 + 필드 2). 노란 고리가 있는 선수를 내가 조종해요. 공에 가까운 선수로 자동으로 바뀌어요.": {"en": "3v3 (1 keeper + 2 outfield). You control the player with the yellow ring; it switches automatically to whoever is nearest the ball.", "ja": "3対3（GK1＋フィールド2）。黄色いリングの選手を操作。ボールに近い選手に自動で切り替わる。", "zh": "3对3（门将1+场上2）。你控制带黄圈的球员，会自动切换到离球最近的球员。"}, "골든골": {"en": "Golden goal", "ja": "ゴールデンゴール", "zh": "金球"}, "골든골!": {"en": "Golden goal!", "ja": "ゴールデンゴール！", "zh": "金球！"}, "골키퍼 정면보다 골문 구석으로 스틱을 기울여 차세요.": {"en": "Tilt the stick toward a corner instead of shooting straight at the keeper.", "ja": "キーパー正面ではなくスティックを傾けて隅を狙おう。", "zh": "别对着门将，推动摇杆射向角落。"}, "공 없을 때: 태클 (Z) · 선수 바꾸기 (X) · 공에 가까운 선수로 자동 전환": {"en": "Without the ball: tackle (Z) · switch player (X) · auto-switches to the nearest player", "ja": "ボールなし：タックル（Z）· 選手切替（X）· ボールに近い選手へ自動切替", "zh": "无球时：铲断（Z）· 切换球员（X）· 自动切换到离球最近的球员"}, "공 있을 때 슛 · 없을 때 슬라이딩 태클": {"en": "Shoot with the ball · slide tackle without it", "ja": "ボールありでシュート · なしでスライディング", "zh": "有球射门 · 无球铲断"}, "공 있을 때 패스 · 없을 때 선수 바꾸기": {"en": "Pass with the ball · switch player without it", "ja": "ボールありでパス · なしで選手切替", "zh": "有球传球 · 无球切换球员"}, "공 있을 때: 패스 (X) · 슛 (Z) — 스틱 방향으로 차요": {"en": "With the ball: pass (X) · shoot (Z) — kicks toward the stick direction", "ja": "ボールあり：パス（X）· シュート（Z）— スティックの方向へ", "zh": "有球时：传球（X）· 射门（Z）— 朝摇杆方向"}, "공을 가지면 달리면서 드리블. 패스는 스틱 방향에 있는 동료에게, 슛은 상대 골문 쪽으로 (스틱으로 방향 조절).": {"en": "Run with the ball to dribble. Passes go to the teammate in the stick direction; shots go toward the goal (steer with the stick).", "ja": "ボールを持つと走りながらドリブル。パスはスティック方向の味方へ、シュートは相手ゴールへ（スティックで方向調整）。", "zh": "持球奔跑即可盘带。传球给摇杆方向的队友，射门朝对方球门（用摇杆调整方向）。"}, "공이 없을 땐 태클(슬라이딩)로 공을 뺏고, 바꾸기로 다른 선수를 조종해요.": {"en": "Without the ball, slide-tackle to win it back and use Switch to control another player.", "ja": "ボールがない時はスライディングで奪い、切替で別の選手を操作。", "zh": "无球时用铲断抢球，用切换控制其他球员。"}, "내 골키퍼": {"en": "My keeper", "ja": "自分のGK", "zh": "我方门将"}, "내가 조종하는 선수": {"en": "Player you control", "ja": "操作中の選手", "zh": "你控制的球员"}, "노란 고리": {"en": "Yellow ring", "ja": "黄色いリング", "zh": "黄圈"}, "동점이면 먼저 넣는 쪽 승리": {"en": "If tied, next goal wins", "ja": "同点なら先に決めた方が勝ち", "zh": "平局则先进球者胜"}, "미니 축구": {"en": "Mini Soccer", "ja": "ミニサッカー", "zh": "迷你足球"}, "바꾸기": {"en": "Switch", "ja": "切替", "zh": "切换"}, "벽에 닿은 공은 튕겨 나와요 (풋살 케이지). 골키퍼가 잡으면 동료에게 자동 패스.": {"en": "The ball bounces off the walls (futsal cage). When a keeper catches it, they pass to a teammate automatically.", "ja": "ボールは壁で跳ね返る（フットサルケージ）。キーパーが取ると味方へ自動パス。", "zh": "球碰到墙会反弹（五人制笼式场地）。门将接球后自动传给队友。"}, "상대 골키퍼": {"en": "Opponent keeper", "ja": "相手GK", "zh": "对方门将"}, "상대가 붙으면 바로 패스하세요. 드리블보다 빨라요.": {"en": "When pressed, pass right away — it’s faster than dribbling.", "ja": "寄せられたらすぐパス。ドリブルより速い。", "zh": "被逼抢时立刻传球，比盘带更快。"}, "슛 / 태클": {"en": "Shoot / Tackle", "ja": "シュート / タックル", "zh": "射门 / 铲断"}, "슛 · 태클": {"en": "Shoot · Tackle", "ja": "シュート · タックル", "zh": "射门 · 铲断"}, "왼쪽 스틱": {"en": "Left stick", "ja": "左スティック", "zh": "左摇杆"}, "왼쪽 스틱: 이동 (방향키)": {"en": "Left stick: move (arrow keys)", "ja": "左スティック：移動（矢印キー）", "zh": "左摇杆：移动（方向键）"}, "위에서 내려다보는 3:3 아케이드 축구. 스틱으로 달리고 패스로 엮어 슛! 공이 없을 땐 태클로 뺏으세요. 2분 경기, 동점이면 골든골.": {"en": "Top-down 3v3 arcade soccer. Run with the stick, link passes and shoot! Tackle to win the ball back. 2-minute matches, golden goal if tied.", "ja": "上から見下ろす3対3アーケードサッカー。スティックで走り、パスをつないでシュート！ボールがない時はタックル。2分間、同点ならゴールデンゴール。", "zh": "俯视视角3对3街机足球。用摇杆奔跑、传球配合射门！无球时铲断抢球。2分钟一场，平局金球决胜。"}, "이길수록 상대가 빨라지고 뺏기를 잘해요.": {"en": "The more you win, the faster and better at stealing the opponents get.", "ja": "勝つほど相手が速く、奪うのがうまくなる。", "zh": "赢得越多，对手越快越会抢球。"}, "주황 유니폼": {"en": "Orange kit", "ja": "オレンジのユニフォーム", "zh": "橙色球衣"}, "태클": {"en": "Tackle", "ja": "タックル", "zh": "铲断"}, "태클은 상대 앞에서 쓰세요. 빗나가면 잠깐 멈춰요.": {"en": "Tackle in front of the opponent — if you miss, you’re briefly stuck.", "ja": "タックルは相手の前で。外すと少し止まる。", "zh": "在对手面前铲断，铲空会短暂停顿。"}, "패스": {"en": "Pass", "ja": "パス", "zh": "传球"}, "패스 / 바꾸기": {"en": "Pass / Switch", "ja": "パス / 切替", "zh": "传球 / 切换"}, "패스 · 선수 바꾸기": {"en": "Pass · Switch player", "ja": "パス · 選手切替", "zh": "传球 · 切换球员"}, "보라 유니폼": {"en": "Purple kit", "ja": "紫のユニフォーム", "zh": "紫色球衣"}, "{0}분 {1}초 생존 · 처치 {2} · 레벨 {3}": {"en": "Survived {0}m {1}s · Kills {2} · Level {3}", "ja": "{0}分{1}秒生存 · 撃破 {2} · レベル {3}", "zh": "存活{0}分{1}秒 · 击败 {2} · 等级 {3}"}, "{0}m · 벌 {1}마리 밟기": {"en": "{0}m · {1} bees stomped", "ja": "{0}m · ハチ{1}匹ふみつけ", "zh": "{0}m · 踩扁{1}只蜜蜂"}, "{0}층 · 최고 퍼펙트 연속 {1}": {"en": "Floor {0} · Best Perfect streak {1}", "ja": "{0}階 · 最高パーフェクト連続 {1}", "zh": "{0}层 · 最高完美连击 {1}"}, "{0}층": {"en": "{0} floors", "ja": "{0}階", "zh": "{0}层"}, "{0}m": {"en": "{0}m", "ja": "{0}m", "zh": "{0}m"}, "내 최고 {0}m": {"en": "My best {0}m", "ja": "自己ベスト {0}m", "zh": "我的最高 {0}m"}, "퍼펙트 {0}연속": {"en": "Perfect ×{0}", "ja": "パーフェクト{0}連続", "zh": "完美{0}连"}, "퍼펙트 ×{0}": {"en": "Perfect ×{0}", "ja": "パーフェクト ×{0}", "zh": "完美 ×{0}"}, "내 최고 {0}층": {"en": "My best: {0} floors", "ja": "自己ベスト {0}階", "zh": "我的最高 {0}层"}, "내 최고 {0}초": {"en": "My best: {0}s", "ja": "自己ベスト {0}秒", "zh": "我的最高 {0}秒"}, "스프링!": a": "スラッシュ · 爽快", "zh": "切切 · 爽快"}, "베면 끝 (60초는 -10)": {"en": "Game over if sliced (60s: -10)", "ja": "切ると終了 (60秒モードは-10)", "zh": "切到就结束 (60秒模式 -10)"}, "손가락을 떼지 말고 계속 그어도 돼요.": {"en": "You can keep swiping without lifting your finger.", "ja": "指を離さずになぞり続けてもOK。", "zh": "不松手一直划也可以。"}, "시간 끝!": {"en": "Time's up!", "ja": "タイムアップ!", "zh": "时间到!"}, "시간 느리게": {"en": "Slows time", "ja": "時間がゆっくり", "zh": "时间变慢"}, "쓱 긋기": {"en": "Swipe", "ja": "スッとなぞる", "zh": "划动"}, "얼음! 시간이 느려져요": {"en": "Ice! Time slows down", "ja": "アイス! 時間がゆっくりに", "zh": "冰冻! 时间变慢"}, "클래식: 과일을 3개 놓치거나 폭탄을 베면 끝": {"en": "Classic: Miss 3 fruits or slice a bomb and it's over", "ja": "クラシック: フルーツを3個逃すか爆弾を切ると終了", "zh": "经典: 漏掉3个水果或切到炸弹就结束"}, "클래식: 과일을 바닥으로 3개 놓치거나 폭탄을 베면 끝.": {"en": "Classic: Let 3 fruits fall or slice a bomb and it's over.", "ja": "クラシック: フルーツを3個下に落とすか爆弾を切ると終了。", "zh": "经典: 让3个水果掉下去或切到炸弹就结束。"}, "튀어 오르는 과일을 손가락으로 그어 썰고, 폭탄은 피해서 최고 점수를 노리세요.": {"en": "Swipe to slice the flying fruit, dodge the bombs, and go for a high score.", "ja": "飛び上がるフルーツを指でなぞって切り、爆弾を避けてハイスコアを狙おう。", "zh": "划动切开飞起的水果，避开炸弹，冲击最高分。"}, "튀어 오르는 과일을 손가락으로 쓱 그어 썰어요! 한 번에 여러 개 썰면 콤보, 폭탄은 절대 건드리지 마세요.": {"en": "Swipe to slice the flying fruit! Slice several at once for a combo, and never touch the bombs.", "ja": "飛び上がるフルーツを指でスッと切ろう! 一度に何個も切るとコンボ、爆弾には絶対触れないで。", "zh": "手指一划切开飞起的水果! 一次切多个就是连击，千万别碰炸弹。"}, "튀어 오르는 과일을 손가락으로 쓱! 한 번에 여러 개 썰면 콤보, 폭탄은 조심": {"en": "Swipe the flying fruit! Slice several at once for combos, watch the bombs", "ja": "飛び上がるフルーツを指でスッと! 一度に何個も切ればコンボ、爆弾に注意", "zh": "手指一划切水果! 一次多切就是连击，小心炸弹"}, "파란 얼음 과일은 시간이 느려지고, 금색 별 과일은 과일 폭풍!": {"en": "Blue ice fruit slows time, golden star fruit brings a Fruit Storm!", "ja": "青い氷フルーツで時間がゆっくり、金色の星フルーツでフルーツストーム!", "zh": "蓝色冰冻水果让时间变慢，金色星星水果带来水果风暴!"}, "파란 얼음 과일을 썰면 4초 동안 시간이 느려져요.": {"en": "Slice a blue ice fruit to slow time for 4 seconds.", "ja": "青い氷フルーツを切ると4秒間時間がゆっくりに。", "zh": "切开蓝色冰冻水果，时间会变慢4秒。"}, "폭탄 옆 과일은 폭탄을 피해 휘어지게 그으세요.": {"en": "For fruit next to a bomb, curve your swipe arou const HAN=/[가-힣]/, TRC=new Map();
function trSeg(x){ const t=x.trim(); if(!t||!HAN.test(t)) return x; if(EX[t]!=null) return x.replace(t,EX[t]); for(const[re,f]of RX){ const m=t.match(re); if(m) return x.replace(t,typeof f==='function'?f(...m):t.replace(re,f)); } return x; }
function tr(s){ if(LANG!=='en'||typeof s!=='string'||!HAN.test(s)) return s; let r=TRC.get(s); if(r!==undefined) return r; r=EX[s]!=null?EX[s]:trSeg(s); if(HAN.test(r)&&s.includes(' · ')) r=s.split(' · ').map(trSeg).join(' · '); if(TRC.size>3000) TRC.clear(); TRC.set(s,r); return r; }
{ const CP=CanvasRenderingContext2D.prototype, F=CP.fillText, S=CP.strokeText, M=CP.measureText;
  CP.fillText=function(s,...a){ return F.call(this,tr(s),...a); }; CP.strokeText=function(s,...a){ return S.call(this,tr(s),...a); }; CP.measureText=function(s){ return M.call(this,tr(s)); }; }

const Ads={kind:'none',last:0,pl:null,busy:false,sdk:null,
  async init(){ const to=(pr,ms)=>Promise.race([Promise.resolve(pr).then(()=>'ok'),new Promise(r=>setTimeout(()=>r('to'),ms))]); try{ if(CFG.portal==='crazygames'&&window.CrazyGames&&window.CrazyGames.SDK){ if(await to(window.CrazyGames.SDK.init(),5000)!=='ok') throw 0; this.sdk=window.CrazyGames.SDK; this.kind=this.sdk.environment==='disabled'?'none':'cg'; if(this.kind==='cg'&&this.sdk.data) store.be=this.sdk.data; }
      else if(CFG.portal==='poki'&&window.PokiSDK){ if(await to(window.PokiSDK.init(),5000)!=='ok') throw 0; this.kind='poki'; }
      else if(CFG.portal==='sim') this.kind='sim'; }catch(e){ this.kind=CFG.portal==='poki'?'poki':'none'; } },
  get on(){ return this.kind!=='none'; },
  loaded(){ try{ if(this.kind==='cg') this.sdk.game.loadingStop(); else if(this.kind==='poki') PokiSDK.gameLoadingFinished(); }catch(e){} },
  play(on){ on=!!on; if(on===this.pl) return; this.pl=on; try{ if(this.kind==='cg') on?this.sdk.game.gameplayStart():this.sdk.game.gameplayStop(); else if(this.kind==='poki') on?PokiSDK.gameplayStart():PokiSDK.gameplayStop(); }catch(e){} },
  happy(){ try{ if(this.kind==='cg') this.sdk.game.happytime(); }catch(e){} },
  hold(){ this.busy=true; this._m=muted; muted=true; BGM.stop(); },
  release(){ this.busy=false; muted=this._m; last=performance.now(); if(running&&!paused&&!DEMO) BGM.start('castle'); },
  show(type){ return new Promise(res=>{ if(!this.on||this.busy) return res(false); if(type==='midgame'&&Date.now()-this.last<180000) return res(false);
    this.play(false); this.hold(); let done=false; const fin=ok=>{ if(done) return; done=true; this.last=Date.now(); this.release(); res(ok); };
    try{ if(this.kind==='cg'){ const st=()=>{}, ok=()=>fin(true), er=()=>fin(false); this.sdk.ad.requestAd(type,{adStarted:st,onAdStarted:st,adFinished:ok,onAdFinished:ok,adError:er,onAdError:er}); }
      else if(this.kind==='poki'){ (type==='rewarded'?PokiSDK.rewardedBreak(()=>{}):PokiSDK.commercialBreak(()=>{}).then(()=>true)).then(r=>fin(type==='rewarded'?!!r:true)).catch(()=>fin(false)); }
      else this.sim(type).then(fin); }catch(e){ fin(false); } }); },
  midgame(){ return this.show('midgame'); }, reward(){ return this.show('rewarded'); },
  sim(type){ return new Promise(res=>{ const el=$('#adSim'); el.hidden=false; let n=type==='rewarded'?4:3; const tick=()=>{ el.innerHTML=`<b>${T('광고 자리','Ad break')}</b><div>${T('테스트 표시예요. 포털에 올리면 여기서 실제 광고가 나와요.','Test placeholder. On the portal a real ad plays here.')}</div><div class="disp" style="font-size:28px">${n}</div>`; if(n--<=0){ el.hidden=true; res(true); } else setTimeout(tick,1000); }; tick(); }); } };

  get(){ const d=dayNo(); if(!this.s) this.s=store.get('mis',null); if(!this.s||this.s.day!==d){ const r=mulberry32(d*7919+13), pool=MPOOL.slice(); const list=[]; while(list.length<3){ const m=pool.splice(Math.floor(r()*pool.length),1)[0]; const ti=Math.floor(r()*m.n.length); list.push({k:m.k,n:m.n[ti],r:m.r+ti*2,max:m.max||0}); } this.s={day:d,list,p:{},got:[0,0,0]}; store.set('mis',this.s); } return this.s; },

  add(k,v){ if(DEMO||!running) return; const s=this.get(); let ch=false; s.list.forEach((m,i)=>{ if(m.k!==k||s.got[i]) return; s.p[k]=m.max?Math.max(s.p[k]||0,v):(s.p[k]||0)+v; ch=true; if(s.p[k]>=m.n){ s.got[i]=1; META.crowns+=m.r; saveMeta(); toast(T(`임무 완료! 왕관 +${m.r}`,`Mission complete! +${m.r} crowns`)); sfx(1046,.3,'triangle',.06,300); Ads.happy(); } }); if(ch) store.set('mis',s); },

let QDPR=2, qEma=16, qBad=0, qGood=0, qLast=0;
function qTick(t){ const raw=qLast?t-qLast:16; qLast=t; if(!((running&&!paused)||DEMO)||raw<=0||raw>250) return; qEma=qEma*.94+raw*.06; const dev=window.devicePixelRatio||1;
  if(qEma>40&&!window.__qlite&&++qBad>20){ window.__qlite=true; if(QDPR>1.5){ QDPR=1.5; resize(); } qBad=0; qGood=0; qEma=20; }
  if(qEma>24){ if(++qBad>30){ if(Math.min(QDPR,dev)>1.25){ QDPR=Math.max(1.25,Math.min(QDPR,dev)-.35); resize(); } else window.__qlite=true; qBad=0; qGood=0; qEma=16; } } else qBad=Math.max(0,qBad-2);
  if(qEma<18){ if(++qGood>720&&window.__qlite){ window.__qlite=false; qGood=0; } else if(qGood>720&&QDPR<2&&QDPR<dev){ QDPR=Math.min(2,QDPR+.25); qGood=0; resize(); } } else qGood=0; }
function resize(){ DPR=Math.min(window.devicePixelRatio||1,QDPR); W=Math.max(240,innerWidth); H=Math.max(320,innerHeight); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }

{ const st=Castle.start, sh=Castle.shoot, nw=Castle.nextWave;

    if(fresh&&!DEMO){ this.maxHp+=lvOf('wall')*15; this.hp=this.maxHp; this.gold+=lvOf('gold')*25; } };
  Castle.shoot=function(v){ if(this.reload<=0&&running) tutShots++; return sh.call(this,v); };
  Castle.nextWave=function(){ if(tut&&!DEMO&&this.wave>=1){ tut=false; store.set('tutDone',true); } return nw.call(this); };
  Castle.revive=function(){ const self=this; Ads.reward().then(ok=>{ running=true; paused=false;
    if(ok){ self.revived=1; self.hp=Math.round(self.maxHp*.5); self.sent=false; self.state='play'; for(const e of self.en) if(!e.dead&&!e.C.boss) e.x=Math.min(self.WX+1,e.x+3); for(const G of self.guards){ G.dead=false; G.hp=G.max; } FX.text('부활!',W/2,H*.3,'#FFE14A',32); FX.confetti(30); sfx(784,.4,'triangle',.07,500); BGM.start('castle'); }

  if(!Ads.busy&&((running&&!paused)||DEMO)){ if(FX.freezeT>0) FX.freezeT-=dt; else { try{ Castle.update(dt); }catch(err){ loopErr(err); } if(DEMO) demoTick(); } FX.update(dt); }
  ctx.setTransform(DPR,0,0,DPR,0,0); if(FX.shakeT>0){ const a=FX.shakeA*Math.min(1,FX.shakeT/.12); ctx.translate((Math.random()-.5)*2*a,(Math.random()-.5)*2*a); }
  usePal(true); try{ Castle.render(ctx); }catch(err){ loopErr(err); } ctx.setTransform(DPR,0,0,DPR,0,0); FX.render(ctx);
  if(running&&!DEMO&&!Castle.cover&&Castle.state==='play'){ ctx.font=`700 12px ${NUM}`; ctx.textAlign='right'; ctx.textBaseline='top'; ctx.lineJoin='round'; ctx.lineWidth=3.2; ctx.strokeStyle='rgba(30,20,12,.8)'; ctx.strokeText(`점수 ${score.toLocaleString()}`,W-52,46); ctx.fillStyle='#FFFFFF'; ctx.fillText(`점수 ${score.toLocaleString()}`,W-52,46); }
  if(running&&!DEMO&&tut&&Castle.state==='play'&&Castle.wave===1&&tutShots<3) drawHand(ctx,t/1000);
  Ads.play(running&&!paused&&!DEMO&&Castle.state==='play');
  if(running&&!DEMO&&prevState==='play'&&Castle.state==='shop'){ if(tut) Castle.shopMsg='빈 층을 눌러 영웅을 고용하고, 웨이브를 시작하세요'; if(Castle.wave>=5&&Castle.wave%5===0&&!noAds()) setTimeout(()=>Ads.midgame(),1200); }
  prevState=Castle.state; crateTick(); const pb=!(running&&!DEMO&&!paused&&(Castle.state==='play'||Castle.state==='map')&&Castle.info==null); if(pauseB.hidden!==pb) pauseB.hidden=pb; }
function drawHand(g,t){ const sx=W*.66, sy=H*.57, k=(t%1.8)/1.8, e=k<.7?k/.7:1, x=sx-e*70, y=sy+e*55;
  g.save(); g.globalAlpha=k>.85?(1-k)/.15:1; g.strokeStyle='rgba(42,28,20,.6)'; g.setLineDash([5,6]); g.lineWidth=3; g.beginPath(); g.moveTo(sx,sy); g.lineTo(x,y); g.stroke(); g.setLineDash([]);
  g.fillStyle='#fff'; g.strokeStyle='#2A1C14'; g.lineWidth=2.5; g.beginPath(); g.arc(x,y,16,0,7); g.fill(); g.stroke(); g.fillStyle='#FFB23A'; g.beginPath(); g.arc(x,y,7,0,7); g.fill();

  <div class="stack" style="margin-top:12px"><button class="btn pri" data-act="duel-again">${T('같은 판 다시','Rematch, same map')}</button><button class="btn" data-act="duel-new">${T('새 판으로','New map')}</button><button class="btn ghost" data-act="titleAd">${T('첫 화면으로','Main menu')}</button></div>`); }
function playDuel(){ DEMO=false; FX.clear(); hideOv(); api.resumeData=null; Castle.duelCfg={seed:DUEL.seed,waves:6}; runBest=store.get('castle.bestWave',0); tutShots=0; Castle.bossK=0; Castle.clock=0; Castle.start(); running=true; paused=false; last=performance.now(); BGM.start('castle'); sfx(520,.08,'triangle',.05,200); }
function showTitle(){ if(!DEMO) demoStart(); pauseB.hidden=true; Ads.play(false); const sv=saveGet('castle'), best=store.get('castle.bestWave',0), md=MIS.done();
  showOv(`<div class="cL"><div class="logo">${LOGO}<small>HERO DEFENSE</small><h1>${T('성 지키기<span>영웅전</span>','Castle Keep<span>Heroes</span>')}</h1></div>
  <p class="tag">${T('몰려오는 적을 활로 막고, 영웅을 키워 6개 마을을 지켜내세요.<em>중간에 나가도 그 웨이브부터 이어서!</em>','Hold back the horde with your bow, raise heroes and defend six villages.<em>Leave anytime — continue from the same wave!</em>')}</p>
  <div class="how">
    <div class="step">${SV1}<div><b><span class="n">1</span>${T('당겨서 쏘기','Pull & shoot')}</b><p>${T('누른 채 뒤로 끌었다 놓으면 발사. 머리는 2배!','Hold, drag back, release. Headshots deal 2×!')}</p></div></div>
    <div class="step">${SV2}<div><b><span class="n">2</span>${T('영웅 키우기','Raise heroes')}</b><p>${T('웨이브 사이에 층을 쌓고 영웅 고용. Lv3·6에 진화!','Between waves, add floors and hire. Evolve at Lv3 & 6!')}</p></div></div>
    <div class="step">${SV3}<div><b><span class="n">3</span>${T('각성 한 방','Awaken')}</b><p>${T('적을 쓰러뜨려 게이지 100% → 8초 황금 연사','Fill the gauge, then 8s of golden rapid fire')}</p></div></div>
  </div>
  <div class="counter"><span class="chip">${T('철갑 기사 → <b>마법</b>','Iron Knight → <b>magic</b>')}</span><span class="chip">${T('하늘 적 → 대포 <b>✕</b>','Flyers → cannon <b>✕</b>')}</span><span class="chip">${T('유령 → <b>마법</b>','Ghost → <b>magic</b>')}</span><span class="chip">${T('트롤 → <b>불</b>로 재생 차단','Troll → <b>fire</b> stops regen')}</span><span class="chip">${T('성문 누르기 → <b>기사단 돌격</b>','Tap the gate → <b>Knight Charge</b>')}</span><span class="chip">${T('영웅 누르기 → <b>전직표</b>','Tap a hero → <b>job tree</b>')}</span></div></div>
  <div class="cR"><div class="tiles"><div class="tile"><b>${best||'—'}</b><span>${T('최고 웨이브','Best wave')}</span></div><div class="tile"><b>${META.crowns}</b><span>${T('보유 왕관','Crowns')}</span></div><div class="tile"><b>${md}/3</b><span>${T('오늘의 임무','Daily')}</span></div></div><div class="sect">${T('난이도','DIFFICULTY')}</div>${diffSeg()}${vilChips()}
  <div class="stack sticky">${sv&&sv.data?`<button class="btn go" data-act="resume"><span>${T('이어하기','Continue')} ▶</span><small>${T(`웨이브 ${sv.data.wave+1}부터`,`From wave ${sv.data.wave+1}`)} · ${['Easy','Medium','Hard','Super Hard'][sv.d||0]}</small></button>`:''}
    <button class="btn pri" data-act="play">${sv&&sv.data?T('새로 시작','New game'):T('플레이','Play')} <small>${['Easy','Medium','Hard','Super Hard'][selDiff]}${best?T(` · 최고 웨이브 ${best}`,` · best wave ${best}`):''}</small></button></div>
    <div class="row2" style="margin-top:10px"><button class="btn mini" data-act="forge">${CROWN}<span>${T('대장간','Forge')}</span><span class="badge">${CROWN}${META.crowns}</span></button><button class="btn mini" data-act="missions"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 4.5M3.5 12l1.5 1.5 2.5-3"/></svg><span>${T('오늘의 임무','Daily')}</span><span class="badge">${md}/3</span></button></div>
    <button class="btn go" data-act="cmap" style="margin-top:10px"><span>${T('왕국 정복 · 지도','Conquest map')}</span><small>${T(`땅따먹기 · 점령 ${cOwned().length}/18 · 땅마다 영구 보너스`,`Claim lands · ${cOwned().length}/18 owned · permanent bonuses`)}</small></button>
    <button class="btn" data-act="duel" style="margin-top:10px"><span>${T('친구와 점수 대결','Score battle with friends')}</span><small>${T('같은 판 6웨이브 · 한 폰으로 돌아가며','Same map · 6 waves · pass the device')}</small></button>
  <div class="foot"><button class="pill" data-act="snd">${muted?SND_OFF:SND_ON}${muted?T('소리 꺼짐','Sound off'):T('소리 켜짐','Sound on')}</button><button class="pill" data-act="lang">${LANG==='en'?'한국어':'English'}</button><button class="pill${CDN?'':' on'}" data-act="cdn">${CDN?T('밤낮 바뀜','Day/night on'):T('항상 낮','Always day')}</button><button class="pill${window.__calm?' on':''}" data-act="calm">${window.__calm?T('번쩍임 줄임','Calm flashes on'):T('번쩍임 보통','Flashes normal')}</button></div>
  <p class="legal">${T('기록과 왕관은 이 기기에 저장돼요.','Progress and crowns are saved on this device.')}</p></div>`,'tl'); }
function showForge(back){ const rows=FORGE.map(f=>{ const l=lvOf(f.k), c=FCOST[l], [n,d]=T(f.ko,f.en), max=l>=5, can=!max&&META.crowns>=c;
    return `<div class="up"><div class="ic" style="background:${f.col}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1C14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICS[f.k]}</svg></div><div><b>${n}</b><p>${d} · ${T('지금','now')} ${f.v(l)?(f.k==='hero'?'−':'+')+f.v(l):0}${f.k==='wall'||f.k==='gold'?'':'%'}</p><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>
      <button class="buy" data-act="buy" data-k="${f.k}" ${can?'':'disabled'}>${max?'MAX':CROWN+c}</button></div>`; }).join('');
  showOv(`<div class="hd"><h2>${T('대장간','The Forge')}</h2><span class="badge" style="font-size:15px;padding:4px 12px">${CROWN}${META.crowns}</span></div>
  <p class="lead" style="text-align:left;margin:0 0 12px">${T('판이 끝날 때 받는 왕관으로 영구 강화를 해요. 강화는 다음 판부터 계속 남아요.','Spend the crowns you earn after each run on permanent upgrades. They carry into every future run.')}</p>${rows}
  <div class="stack" style="margin-top:10px"><button class="btn" data-act="${back||'title'}">${T('돌아가기','Back')}</button></div>`); }
function showMissions(back){ const s=MIS.get(); const rows=s.list.map((m,i)=>{ const p=Math.min(m.n,s.p[m.k]||0), dn=s.got[i];
    return `<div class="mis ${dn?'done':''}"><div class="t"><span>${dn?'✓ ':''}${esc(MIS.text(m))}</span><span class="badge">${CROWN}${m.r}</span></div><div class="bar"><i style="width:${p/m.n*100}%"></i></div><small>${p} / ${m.n}${dn?T(' · 완료',' · done'):''}</small></div>`; }).join('');
  showOv(`<div class="hd"><h2>${T('오늘의 임무','Daily Missions')}</h2><span class="badge">${MIS.done()}/3</span></div>${rows}
  <p class="lead">${T('매일 자정에 새 임무 3개가 열려요. 여러 판에 걸쳐 쌓여요.','Three new missions every day. Progress adds up across runs.')}</p>
  <div class="stack"><button class="btn" data-act="${back||'title'}">${T('돌아가기','Back')}</button></div>`); }
let choice=null;
function showChoice(title,opts,cb,lead){ choice={opts,cb}; pauseB.hidden=true; Ads.play(false);
  showOv(`<h2 style="text-align:center;font-size:26px;margin-bottom:10px">${esc(tr(title))}</h2>${lead?`<p class="lead">${esc(tr(lead))}</p>`:''}${opts.map((o,i)=>`<button class="btn opt ${i===0?(o.ad?'ad':'pri'):''}" style="${i===0&&!o.ad?'font:700 16px Noto Sans KR':''}" data-act="opt" data-i="${i}"><span>${esc(tr(o.t))}</span>${o.d?`<small>${esc(tr(o.d))}</small>`:''}</button>`).join('')}`); }
function pause(){ if(!running||paused) return; paused=true; BGM.stop(); Ads.play(false);
  showOv(`<h2 style="text-align:center;font-size:30px;margin-bottom:6px">${T('잠깐 멈춤','Paused')}</h2><p class="lead">${T(`웨이브 ${Castle.wave} · 점수 ${score.toLocaleString()}`,`Wave ${Castle.wave} · Score ${score.toLocaleString()}`)}</p>
  <div class="stack"><button class="btn pri" data-act="resumeP">${T('계속하기','Resume')}</button><div class="row2"><button class="btn mini" data-act="missionsP">${T('오늘의 임무','Daily')} <span class="badge">${MIS.done()}/3</span></button><button class="btn mini" data-act="snd">${muted?SND_OFF:SND_ON}${muted?T('소리 꺼짐','Sound off'):T('소리 켜짐','Sound on')}</button></div>
  <button class="btn" data-act="lang">${LANG==='en'?'한국어로 보기':'Switch to English'}</button><button class="btn ghost" data-act="quit">${T('첫 화면으로 (이 웨이브부터 저장돼요)','Main menu (saved from this wave)')}</button></div>`); }
function resume(){ hideOv(); paused=false; last=performance.now(); pauseB.hidden=false; BGM.start('castle'); }
function play(fromSave){ const sv=saveGet('castle'); DEMO=false; FX.clear(); hideOv();
  if(fromSave&&sv&&sv.data){ api.diff=sv.d||0; api.resumeData=sv.data; } else { saveClear('castle'); api.diff=selDiff; api.resumeData=null; }
  runBest=store.get('castle.bestWave',0); tutShots=0; Castle.bossK=0; Castle.clock=0; Castle.start(); MIS.add('play',0);
  if(tut&&!fromSave){ Castle.floors[0]={k:'archer',lv:0}; Castle.nextWave(); }
  running=true; paused=false; last=performance.now(); pauseB.hidden=false; BGM.start('castle'); sfx(520,.08,'triangle',.05,200); }
let lastRun=null;
function onOver(info){ if(Castle.duel&&DUEL){ BGM.stop(); Ads.play(false); pauseB.hidden=true; crateB.hidden=true; DUEL.scores[DUEL.idx]=score; DUEL.idx++; if(DUEL.idx<DUEL.names.length) showDuelTurn(); else Ads.midgame().then(showDuelResult); return; } BGM.stop(); Ads.play(false); pauseB.hidden=true; crateB.hidden=true; const c=Castle, d=Math.min(3,api.diff);
  const base=c.wave+Math.floor(c.kills/25)+(c.bossK||0)*3, cr=Math.max(1,Math.round(base*[1,1.25,1.6,2][d])); META.crowns+=cr; saveMeta();
  running=true; MIS.add('play',1); MIS.add('wave',c.wave); running=false; const nb=c.wave>runBest&&runBest>0; if(nb) Ads.happy();
  lastRun={info,cr,doubled:false,wave:c.wave,kills:c.kills,heads:c.heads,boss:c.bossK||0,nb,win:!!info.title}; showResults(); }
function showResults(){ const r=lastRun;
  showOv(`<h2 style="text-align:center;font-size:28px">${esc(r.win?tr(r.info.title):T('성이 무너졌어요','The castle fell'))}</h2>${r.nb?`<span class="newb">${T('최고 기록!','New best!')}</span>`:''}
  <div class="big">${r.wave}<small>${T('도달한 웨이브','wave reached')}</small></div>
  <p class="note">${T(`처치 ${r.kills} · 헤드샷 ${r.heads} · 보스 ${r.boss} · 점수 ${score.toLocaleString()}`,`Kills ${r.kills} · Headshots ${r.heads} · Bosses ${r.boss} · Score ${score.toLocaleString()}`)}</p>
  <div class="earn">${CROWN.replace(/16/g,'26')}+${r.cr}<small>${T(`왕관 · 보유 ${META.crowns}`,`crowns · total ${META.crowns}`)}</small></div>
  <div class="stack" style="margin-top:12px">${Ads.on&&!r.doubled?`<button class="btn ad" data-act="dbl"><span>${T(`광고 보고 왕관 2배 (+${r.cr})`,`Watch an ad: double crowns (+${r.cr})`)}</span></button>`:''}
    <button class="btn pri" data-act="again">${T('다시 도전','Play again')}</button>
    <div class="row2"><button class="btn mini" data-act="forgeR">${CROWN}${T('대장간','Forge')}</button><button class="btn mini" data-act="missionsR">${T('오늘의 임무','Daily')} <span class="badge">${MIS.done()}/3</span></button></div>
    <button class="btn ghost" data-act="titleAd">${T('첫 화면으로','Main menu')}</button></div>`); }

ov.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; sfx(700,.04,'triangle',.03);
  if(a==='diff'){ selDiff=+b.dataset.d; store.set('diff',selDiff); showTitle(); }
  else if(a==='play') play(false); else if(a==='resume') play(true);
  else if(a==='forge'||a==='forgeR') showForge(a==='forgeR'?'res':'title'); else if(a==='missions'||a==='missionsR') showMissions(a==='missionsR'?'res':'title'); else if(a==='missionsP') showMissions('pauseBack');
  else if(a==='title') showTitle(); else if(a==='res') showResults(); else if(a==='pauseBack'){ paused=false; pause(); }
  else if(a==='buy'){ const k=b.dataset.k, l=lvOf(k), c=FCOST[l]; if(l<5&&META.crowns>=c){ META.crowns-=c; META.lv[k]=l+1; saveMeta(); sfx(988,.25,'triangle',.06,400); FX.confetti(20); } showForge(ov.querySelector('[data-act="title"]')?'title':'res'); }
  else if(a==='snd'){ muted=!muted; store.set('muted',muted); if(muted) BGM.stop(); paused&&running?(paused=false,pause()):showTitle(); }
  else if(a==='lang'){ LANG=LANG==='en'?'ko':'en'; store.set('lang',LANG); applyLang(); paused&&running?(paused=false,pause()):showTitle(); }
  else if(a==='resumeP') resume();
  else if(a==='quit'){ running=false; paused=false; BGM.stop(); showTitle(); }
  else if(a==='opt'){ const o=choice.opts[+b.dataset.i], cb=choice.cb; choice=null; hideOv(); paused=false; last=performance.now(); pauseB.hidden=false; cb(o); }
  else if(a==='dbl'){ Ads.reward().then(ok=>{ if(ok&&!lastRun.doubled){ lastRun.doubled=true; META.crowns+=lastRun.cr; lastRun.cr*=2; saveMeta(); toast(T('왕관 2배!','Crowns doubled!')); } else if(!ok) toast(T('광고를 불러오지 못했어요','The ad could not load')); showResults(); }); }
  else if(a==='again'){ Ads.midgame().then(()=>play(false)); }
  else if(a==='titleAd'){ Ads.midgame().then(showTitle); }
  else if(a==='cdn'){ CDN=CDN?0:1; store.set('castle.dn',CDN); showTitle(); }
  else if(a==='calm'){ window.__calm=!window.__calm; store.set('calm',window.__calm?1:0); showTitle(); }
  else if(a==='vil'){ store.set('castle.vil',+b.dataset.v); showTitle(); }
  else if(a==='duel') showDuelSetup();
  else if(a==='cmap'){ DEMO=false; FX.clear(); hideOv(); api.resumeData=null; Castle.mapCfg=true; Castle.clock=0; Castle.start(); running=true; paused=false; last=performance.now(); BGM.start('castle'); }
  else if(a==='duel-go'){ const names=[]; for(let i=0;i<4;i++){ const el=document.getElementById('dn'+i), v=el?el.value.trim().slice(0,8):''; if(v) names.push(v); else if(i<2) names.push(el.placeholder); } DUEL={seed:1000+Math.floor(Math.random()*899000),names,scores:[],idx:0}; showDuelTurn(); }
  else if(a==='duel-play') playDuel();
  else if(a==='duel-again'){ DUEL.scores=[]; DUEL.idx=0; showDuelTurn(); }
  else if(a==='duel-new'){ DUEL.seed=1000+Math.floor(Math.random()*899000); DUEL.scores=[]; DUEL.idx=0; showDuelTurn(); } });
pauseB.addEventListener('click',()=>pause());
function crateTick(){ const c=Castle, show=running&&!paused&&!DEMO&&!Ads.busy&&c.state==='shop'&&c.pick==null&&Ads.on&&c.wave>=2&&c.wave%2===0&&c._crate!==c.wave&&c.shopLock()>=1;
  if(show===!crateB.hidden) return; crateB.hidden=!show; if(!show) return; const g=c.goBtn(), room=g.y+g.h+58<H;
  crateB.innerHTML=`${GIFT}<span>${T('보급 상자','Supply crate')}${room?` <small>· ${T('광고 보고 금화와 아이템','ad: gold + items')}</small>`:''}</span>`;
  Object.assign(crateB.style,room?{left:'50%',top:(g.y+g.h+12)+'px',transform:'translateX(-50%)'}:{left:'10px',top:'10px',transform:'none'}); }
crateB.addEventListener('click',()=>{ crateB.hidden=true; Ads.reward().then(ok=>{ if(!ok){ toast(T('광고를 불러오지 못했어요','The ad could not load')); return; } const c=Castle; c._crate=c.wave; for(const k in c.pu) c.pu[k]=Math.min(9,c.pu[k]+1); const g=60+c.wave*6; c.gold+=g; toast(T(`보급 도착! 금화 +${g} · 아이템 4종 +1`,`Supplies! +${g} gold · +1 of every item`)); sfx(880,.25,'triangle',.06,400); FX.confetti(25); }); });

/* 시작 */
(async()=>{ await Ads.init(); META=Object.assign({crowns:0,lv:{}},store.get('meta',{})); muted=store.get('muted',false); LANG=store.get('lang',null)||LANG; tut=!store.get('tutDone',false); { const d=store.get('diff',null); if(d!=null) selDiff=d; }
  applyLang(); const go=()=>{ Ads.loaded(); if(CFG.autoFirst&&tut&&!saveGet('castle')){ selDiff=0; play(false); } else showTitle(); };
  if(document.fonts&&document.fonts.ready) Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]).then(go); else go(); })();
if(location.hash==='#test') window.__t={Castle,api,FX,MIS,get META(){return META},Ads,play,showTitle,showForge,showMissions,pause,get running(){return running},get paused(){return paused},get DEMO(){return DEMO},setLang(l){LANG=l;applyLang();}};

})();
</script>
