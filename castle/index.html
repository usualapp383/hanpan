<style>
:root{--ink:#2A1C14;--paper:#FFF9EF;--paper2:#F4EADA;--line:#E3D3B8;--mute:#7A6A58;--gold:#F2B630;--gold2:#D9921A;--mint:#3DBE8A;--coral:#E2584A;--sky:#4A8FE0;--shadow:0 10px 30px rgba(60,35,10,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#F7F2E8;overflow:hidden;font-family:"Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
.ib{position:absolute;width:40px;height:40px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#pauseB{right:8px;top:52px}
#crateB{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:2px solid var(--ink);background:linear-gradient(#FFE58A,#F2B630);box-shadow:0 3px 0 var(--ink);font:700 13px "Noto Sans KR";color:var(--ink);cursor:pointer;animation:bob 1.6s ease-in-out infinite}
#crateB small{font-weight:500;opacity:.75}
@keyframes bob{50%{transform:translateY(-3px)}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,26,12,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#ov[hidden],[hidden]{display:none!important}
.card{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink),var(--shadow);padding:22px 20px 18px;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.wide{max-width:560px}
h1,h2,.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.2px}
.logo{text-align:center;margin:-2px 0 6px}
.logo .crest{width:64px;height:64px;margin:0 auto 4px;display:block}
.logo small{display:block;font:700 11px "Chakra Petch",sans-serif;letter-spacing:4px;color:var(--gold2)}
.logo h1{font-size:40px;line-height:1.05;color:var(--ink);text-shadow:0 3px 0 #F2D27A}
.logo h1 span{display:block;font-size:22px;color:var(--gold2);text-shadow:none;margin-top:2px}
.tag{text-align:center;color:var(--mute);font-size:14px;line-height:1.55;margin:4px 6px 14px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;font:700 16px "Noto Sans KR";color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn small{font-weight:500;font-size:12px;opacity:.75;margin-top:1px}
.btn.pri{background:linear-gradient(#FFD45E,#F2B630);font:400 24px "Black Han Sans","Noto Sans KR";padding:14px}
.btn.pri small{font:500 12px "Noto Sans KR"}
.btn.go{background:linear-gradient(#6FD89F,#3DBE8A)}
.btn.ad{background:linear-gradient(#9CC8FF,#5A9CF0)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--mute);font-weight:500;font-size:14px;padding:8px}
.stack{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;font-size:14px}
.mini svg{flex:none}
.badge{display:inline-flex;align-items:center;gap:3px;background:var(--ink);color:#FFE58A;border-radius:999px;padding:1px 8px 1px 6px;font:700 12px "Chakra Petch","Noto Sans KR"}
.sect{font:700 12px "Noto Sans KR";color:var(--gold2);letter-spacing:1px;margin:16px 2px 8px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:8px 6px 9px;text-align:center}
.step svg{width:100%;height:auto;display:block;border-radius:10px;background:#DFF1FF}
.step b{display:block;font-size:13px;margin:6px 0 2px}
.step p{font-size:11.5px;line-height:1.45;color:var(--mute)}
.step .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#FFE58A;font:700 11px "Chakra Petch";margin-right:3px;vertical-align:1px}
.counter{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink)}
.chip b{color:var(--coral)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:8px 2px;font:700 13px "Chakra Petch","Noto Sans KR";color:var(--mute);cursor:pointer;position:relative}
.seg button.on{background:var(--ink);color:#FFE58A}
.seg button i{position:absolute;top:1px;right:4px;font-style:normal;font-size:10px;color:var(--mint)}
.seghint{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 12px}
.foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 12px "Noto Sans KR";color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill.on{border-color:var(--ink)}
.stat{font:600 12px "Noto Sans KR";color:var(--mute)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd h2{font-size:26px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);background:#fff;border-radius:16px;margin-bottom:8px}
.up .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.up b{font-size:14px}
.up p{font-size:12px;color:var(--mute);line-height:1.4}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--gold)}
.buy{border:2px solid var(--ink);border-radius:12px;background:linear-gradient(#FFD45E,#F2B630);box-shadow:0 3px 0 var(--ink);padding:7px 10px;font:700 13px "Chakra Petch","Noto Sans KR";cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.buy[disabled]{background:var(--paper2);color:var(--mute);box-shadow:none;border-color:var(--line);cursor:default}
.mis{padding:12px;border:2px solid var(--line);background:#fff;border-radius:16px;margin-bottom:8px}
.mis.done{border-color:var(--mint);background:#F1FBF5}
.mis .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--paper2);margin-top:8px;overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD45E,#F2B630)}
.mis.done .bar i{background:var(--mint)}
.mis small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.big{font:400 64px "Black Han Sans";text-align:center;line-height:1;color:var(--ink);text-shadow:0 4px 0 #F2D27A}
.big small{display:block;font:700 13px "Noto Sans KR";color:var(--mute);text-shadow:none;margin-top:6px}
.note{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 12px}
.earn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#FFE58A;border-radius:18px;padding:12px;font:400 26px "Black Han Sans";margin-bottom:6px}
.earn small{font:500 12px "Noto Sans KR";color:#E8D9B8}
.newb{display:block;width:max-content;margin:0 auto 8px;background:var(--coral);color:#fff;border-radius:999px;padding:3px 12px;font:700 12px "Noto Sans KR"}
.opt{text-align:left;align-items:flex-start;margin-bottom:10px}
.lead{font-size:13px;color:var(--mute);text-align:center;margin:-4px 0 14px;line-height:1.5}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-160%);opacity:0;background:var(--ink);color:#FFE58A;border-radius:999px;padding:9px 16px;font:700 13px "Noto Sans KR";transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap;z-index:9}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#adSim{position:absolute;inset:0;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;font:500 14px "Noto Sans KR";text-align:center;padding:24px}
#adSim b{font:400 30px "Black Han Sans";color:#fff}
@media (max-width:480px){.card{padding:18px 16px 16px}.logo .crest{width:50px;height:50px}.logo h1{font-size:34px}.logo h1 span{font-size:19px}.tag{font-size:13.5px;margin-bottom:12px}
 .how{grid-template-columns:1fr;gap:7px}.step{display:grid;grid-template-columns:104px 1fr;gap:12px;text-align:left;align-items:center;padding:7px 10px 7px 7px}.step b{margin:0 0 3px;font-size:14px}.step p{font-size:12.5px}}
.tag em{display:block;font-style:normal;font-size:12.5px;color:var(--gold2);font-weight:700;margin-top:4px}
.sticky{position:sticky;bottom:-18px;margin:0 -6px -18px;padding:12px 6px 18px;background:linear-gradient(rgba(255,249,239,0),var(--paper) 22%)}
.seg button{white-space:nowrap}
@media (max-width:400px){.seg button{font-size:11.5px}}
.mini{flex-direction:row;white-space:nowrap}
@media (max-width:400px){.mini{font-size:13px;gap:6px;padding:10px 6px}}
.cR,.cL{display:contents}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.tile{background:var(--paper2);border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}.tile b{display:block;font:700 20px 'Chakra Petch','Noto Sans KR'}.tile span{font-size:11px;color:var(--mute)}
@media (min-width:760px) and (min-height:520px){.card.tl{max-width:820px;display:grid;grid-template-columns:1.1fr 1fr;gap:6px 26px;padding:24px 26px 20px}
 .tl .cL{display:block;grid-column:1;grid-row:1/4}.tl .cR{grid-column:2;display:flex;flex-direction:column;justify-content:center}
 .tl .how{grid-template-columns:1fr;gap:8px}.tl .step{display:grid;grid-template-columns:118px 1fr;gap:12px;text-align:left;align-items:center;padding:7px 12px 7px 7px}.tl .step b{margin:0 0 3px;font-size:15px}.tl .step p{font-size:12.5px}
 .tl .sticky{position:static;margin:0;padding:0;background:none}.tl .sect{margin-top:4px}}
.vch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}.vch button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-width:0}.vch button.on{border-color:var(--ink);background:#FFF3C4}.vch i{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink)}.vch span{display:grid;min-width:0}.vch b{font-size:12.5px;line-height:1.2}.vch small{font-size:10.5px;color:var(--mute);line-height:1.25}
.fld{display:grid;gap:4px;font:700 12px "Noto Sans KR";color:var(--mute)}.fld input{font:500 15px "Noto Sans KR";padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}.fld input:focus{outline:none;border-color:var(--ink)}
.drk{display:grid;gap:8px;margin:6px 0}.drk div{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px}.drk div.win{border-color:var(--gold);background:#FFF3C4}.drk i{font:700 14px "Chakra Petch";font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper2)}.drk div.win i{background:var(--gold)}.drk b{font-size:15px;min-width:0;overflow-wrap:anywhere}.drk span{font:700 17px "Chakra Petch"}
.legal{font-size:10.5px;color:#A8977F;text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>

  <div id="ov" hidden></div>

:"下の{0}つのピースを盤面にドラッグ。ピースを1回タップすると{1}°ずつ回るよ。",zh:"把下方{0}个方块拖到棋盘上。点一下方块旋转{1}°。"},"가로 한 줄이나 세로 한 줄을 꽉 채우면 사라지며 점수를 얻어요.":{en:"Fill a full row or column to clear it and score.",ja:"横1列か縦1列をぴったり埋めると消えてスコアゲット。",zh:"填满一整行或一整列即可消除得分。"},"타임어택에서는 시간이 계속 줄어듭니다. 줄을 지우면 시간이 충전돼요 (한 줄 +{0}초, 콤보마다 +{1}초).":{en:"In Time Attack the clock keeps ticking. Clearing lines refills it (+{0}s per line, +{1}s per combo).",ja:"タイムアタックでは時間がどんどん減る。列を消すと時間がチャージされるよ (1列 +{0}秒、コンボごとに +{1}秒)。",zh:"限时挑战中时间不断减少，消行可充值时间（每行 +{0}秒，每次连击 +{1}秒）。"},"점수가 높아질수록 시간이 더 빨리 줄어요. 시간이 {0}이 되거나, 남은 조각을 어떻게 돌려도 놓을 수 없으면 끝.":{en:"The higher your score, the faster time drains. Game over at {0}, or when no piece fits however you rotate it.",ja:"スコアが上がるほど時間が速く減る。時間が{0}になるか、残りのピースをどう回しても置けなくなったら終了。",zh:"分数越高时间减得越快。时间归{0}，或剩余方块怎么转都放不下时结束。"},"판 크기({0}×{1} · {2}×{3})와 모드(타임어택 · 느긋하게)를 고를 수 있고, 기록은 따로 저장돼요.":{en:"Pick a board size ({0}×{1} · {2}×{3}) and mode (Time Attack · Relaxed); records are saved separately.",ja:"盤面サイズ({0}×{1} · {2}×{3})とモード(タイムアタック · のんびり)を選べて、記録は別々に保存されるよ。",zh:"可选择棋盘大小（{0}×{1} · {2}×{3}）和模式（限时挑战 · 悠闲），记录分开保存。"},"★ 보석이 박힌 칸을 줄로 지우면 +{0}점, 타임어택은 +{1}초.":{en:"★ Clear a gem cell in a line for +{0} pts, or +{1}s in Time Attack.",ja:"★ ジェム入りマスを列で消すと +{0}点、タイムアタックでは +{1}秒。",zh:"★ 消除嵌有宝石的格子 +{0}分，限时挑战 +{1}秒。"},"💣 폭탄 조각(점수 {0} 이후 가끔)은 아무 칸에나 놓을 수 있고 주변 {1}×{2}을 한 번에 날려요. 꽉 막혔을 때 구원투수!":{en:"💣 Bomb pieces (sometimes, after {0} pts) can go on any cell and blast the surrounding {1}×{2} at once. A lifesaver when you're stuck!",ja:"💣 爆弾ピース(スコア{0}以降にときどき)はどのマスにも置けて、周囲{1}×{2}を一気に吹き飛ばす。詰んだ時の救世主!",zh:"💣 炸弹方块（{0}分后偶尔出现）可放在任意格，一次炸掉周围{1}×{2}。卡住时的救星！"},"{0}점마다 단계가 오르고 타임어택 시간이 가득 차요.":{en:"Every {0} pts you level up and the Time Attack clock refills.",ja:"{0}点ごとに段階が上がり、タイムアタックの時間が満タンに。",zh:"每{0}分升一级，限时挑战时间回满。"},"여러 줄 한 번에":{en:"Multi-line Clear",ja:"複数列を同時に",zh:"一次消多行"},"점수와 충전 시간이 크게 뛰어요":{en:"Big jump in score and time refill",ja:"スコアとチャージ時間が大きくアップ",zh:"分数和充值时间大幅提升"},"콤보":{en:"Combo",ja:"コンボ",zh:"连击"},"{0}번 안에 또 지우면 콤보 유 } · 赤{3}点 × 倍率。",zh:"心和字母平时为蓝色，约每{0}秒变红（极短）→ 黄色。蓝{1} · 黄{2} · 红{3}分 × 倍率。"},"파란 하트를 먹으면 이번 PART 배율이 ×{0} → ×{1} → ×{2}로 올라요.":{en:"Eat a blue heart to raise this PART's multiplier ×{0} → ×{1} → ×{2}.",ja:"青いハートを食べるとこのPARTの倍率が ×{0} → ×{1} → ×{2} に上がる。",zh:"吃到蓝心，本PART倍率升为 ×{0} → ×{1} → ×{2}。"},"빨간 글자는 SPECIAL(완성 시 +{0}), 노란 글자는 EXTRA(완성 시 목숨 +{1})에 켜집니다. 판마다 글자 {2}개: A 또는 E 하나, SPECIAL 전용 하나, EXTRA 전용 하나.":{en:"Red letters light up SPECIAL (complete for +{0}); yellow ones light up EXTRA (complete for +{1} life). {2} letters per board: one A or E, one SPECIAL-only, one EXTRA-only.",ja:"赤い文字はSPECIAL(完成で +{0})、黄色い文字はEXTRA(完成で残機 +{1})に点灯。1面ごとに文字{2}個: AかEが1つ、SPECIAL専用1つ、EXTRA専用1つ。",zh:"红色字母点亮SPECIAL（集齐 +{0}），黄色字母点亮EXTRA（集齐命 +{1}）。每局{2}个字母：A或E一个、SPECIAL专用一个、EXTRA专用一个。"},"{0}번째 곤충이 나오면 가운데에 채소가 나옵니다. 먹으면 {1}점(PART마다 +{2} 최대 {3})과 함께 곤충이 {4}초 멈춰요. 멈춰도 닿으면 위험.":{en:"When insect #{0} appears, a veggie pops up in the center. Eat it for {1} pts (+{2} per PART, max {3}) and insects freeze for {4}s. Frozen ones are still deadly.",ja:"{0}匹目の昆虫が出ると真ん中に野菜が出る。食べると{1}点(PARTごとに +{2}、最大{3})とともに昆虫が{4}秒止まる。止まっていても触れると危険。",zh:"第{0}只昆虫出现时，中央会出现蔬菜。吃掉得{1}分（每PART +{2}，最高{3}），昆虫暂停{4}秒。暂停时碰到仍危险。"},"해골은 PART {0}에 {1}개, 이후 최대 {2}개까지 늘어요. 무당벌레도 곤충도 밟으면 끝(곤충은 상자로 돌아감).":{en:"PART {0} has {1} skull(s), growing to up to {2}. Ladybug or insect, step on one and it's over (insects return to the box).",ja:"ドクロはPART {0}で{1}個、その後最大{2}個まで増える。てんとう虫も昆虫も踏んだら終わり(昆虫は箱に戻る)。",zh:"骷髅在PART {0}有{1}个，之后最多增至{2}个。瓢虫和昆虫踩到都完蛋（昆虫会回到箱子）。"},"PART {0}~{1}은 판마다 곤충 종류가 하나씩 바뀌고, {2}부터는 네 종류가 섞여 나와요.":{en:"In PART {0}–{1}, the insect type changes each board; from {2} on, all four types mix.",ja:"PART {0}~{1}は面ごとに昆虫の種類が1つずつ変わり、{2}からは4種類が混ざって出てくる。",zh:"PART {0}~{1}每局昆虫种类各换一种，从{2}开始四种混合出现。"},"{0}점 · 배율 ↑":{en:"{0} pts · Multiplier ↑",ja:"{0}点 · 倍率 ↑",zh:"{0}分 · 倍率 ↑"},"{0}점 · SPECIAL":{en:"{0} pts · SPECIAL",ja:"{0}点 · SPECIAL",zh:"{0}分 · SPECIAL"},"{0}점 · EXTRA":{en:"{0} pts · EXTRA",ja:"{0}点 · EXTRA",zh:"{0}分 · EXTRA"},"테두리 시계":{en:" ja:"ボス虫は2回当てないと落ちない(緑 → 青)。ボスが止まって光線を出したらよけよう。捕まると自機を奪われるよ。",zh:"虫王要打两次才会掉落（绿 → 蓝）。虫王停下发射光束时要躲开，被抓到战机就会被夺走。"},"빼앗긴 전투기를 단 대장이 급강하할 때 맞히면 전투기를 되찾아 두 대가 나란히 쏘는 쌍발이 됩니다. 편대에 있을 때 맞히면 잃어요.":{en:"Hit a boss carrying your captured fighter while it dives to rescue it and fire dual side by side. Hit it in formation and the fighter is lost.",ja:"奪われた自機を連れたボスが急降下する時に当てると自機を取り戻し、2機並んで撃つダブルに。編隊にいる時に当てると失うよ。",zh:"在带着被夺战机的虫王俯冲时击中它，就能夺回战机，两架并排双发。在编队中击中则会失去。"},"화면에 내 총알은 한 번에 {0}발(쌍발은 {1}쌍)까지만. 헛쏘면 다음 발이 늦어져요.":{en:"Only {0} shots on screen at once ({1} pairs in dual). Missing delays your next shot.",ja:"画面上の自弾は一度に{0}発(ダブルは{1}組)まで。外すと次の弾が遅れるよ。",zh:"屏幕上同时最多{0}发子弹（双发为{1}对）。打空会延迟下一发。"},"네 스테이지마다({0} · {1} · {2}…) 도전 스테이지: 적이 쏘지 않고 지나가기만 해요. 한 마리당 {3}점, {4}마리 전멸이면 {5}점.":{en:"Every 4th stage ({0} · {1} · {2}…) is a challenge stage: enemies just fly by without shooting. {3} pts each, {4} for wiping out all {5}.",ja:"4ステージごと({0} · {1} · {2}…)にチャレンジステージ: 敵は撃たずに通り過ぎるだけ。1匹{3}点、{4}匹全滅で{5}点。",zh:"每4关（{0} · {1} · {2}…）为挑战关：敌人只飞过不开火。每只{3}分，{4}只全灭{5}分。"},"{0}점과 {1}점마다 전투기 +{2}":{en:"+{2} fighter at {0} and {1} pts",ja:"{0}点と{1}点で自機 +{2}",zh:"{0}分和{1}分时战机 +{2}"},"벌":{en:"Bee",ja:"ハチ",zh:"蜜蜂"},"편대 {0} · 비행 중 {1}":{en:"Formation {0} · Flying {1}",ja:"編隊 {0} · 飛行中 {1}",zh:"编队 {0} · 飞行中 {1}"},"나비":{en:"Butterfly",ja:"チョウ",zh:"蝴蝶"},"대장 ({0}번 맞혀야)":{en:"Boss ({0} hits)",ja:"ボス ({0}回当てる)",zh:"虫王（需击中{0}次）"},"편대 {0} · 비행 중 {1} · 호위 {2}마리 {3} · {4}마리 {5}":{en:"Formation {0} · Flying {1} · {2} escort {3} · {4} escorts {5}",ja:"編隊 {0} · 飛行中 {1} · 護衛{2}匹 {3} · {4}匹 {5}",zh:"编队 {0} · 飞行中 {1} · 护卫{2}只 {3} · {4}只 {5}"},"광선":{en:"Beam",ja:"光線",zh:"光束"},"잡히면 전투기를 빼앗김":{en:"Get caught and lose your fighter",ja:"捕まると自機を奪われる",zh:"被抓到会失去战机"},"쌍발":{en:"Dual Fighter",ja:"ダブル",zh:"双发"},"빼앗긴 전투기를 구출하면 두 배 화력":{en:"Rescue your captured fighter for double firepower",ja:"奪われた自機を救出して火力2倍",zh:"救回被夺战机，火力翻倍"},"변신 벌레 ({0}판부터)":{en:"Morphing Bug (from stage {0})",ja:"変身虫 ({0}面から)",zh:"变身虫（第{0}关起）"},"깜빡이던 벌이 셋으로 갈라짐 · 하나 {0} · 셋 다 tand on logs or turtles, and you drift with them. Fall in or get swept off-screen and it's over.",ja:"上の川({0}列)では丸太かカメの背中にしか立てず、乗ると一緒に流される。水に落ちたり画面外に押し出されたら終わり。",zh:"上方河流（{0}行）只能站在木头或乌龟背上，并随之漂流。掉进水里或被推出屏幕就结束。"},"일부 거북은 물속으로 잠수합니다. 깜빡이면 곧 들어가요.":{en:"Some turtles dive underwater. When they blink, they're about to go under.",ja:"一部のカメは水中に潜る。点滅したらもうすぐ潜るよ。",zh:"有些乌龟会潜入水中，一闪烁就快潜下去了。"},"맨 위 연못 칸에 정확히 들어가면 {0}점 + 남은 시간 {1}초마다 {2}점. 이미 찬 칸이나 칸 사이 풀숲에 뛰면 끝.":{en:"Land right in a top pond slot for {0} pts + {2} pts per {1}s left. Jumping into a filled slot or the bushes between ends it.",ja:"一番上の池マスにぴったり入ると{0}点 + 残り時間{1}秒ごとに{2}点。埋まったマスやマスの間の草むらに跳ぶと終わり。",zh:"准确跳进顶部池塘格得{0}分 + 剩余时间每{1}秒{2}分。跳进已占格子或格间草丛就结束。"},"연못에 파리가 보일 때 들어가면 +{0} {1}판부터는 악어가 입을 벌린 칸이 생겨요.":{en:"Enter a pond with a fly for +{0}. From round {1}, some slots have open-jawed gators.",ja:"池にハエが見える時に入ると +{0}。{1}面からはワニが口を開けたマスが出てくる。",zh:"池塘里有苍蝇时跳进去 +{0}。第{1}局起会出现鳄鱼张嘴的格子。"},"다섯 칸을 모두 채우면 +{0}점, 다음 판은 더 빠르고 붐벼요. 한 마리당 {1}초, {2}점에 개구리 +{3}":{en:"Fill all five slots for +{0} pts; the next round is faster and busier. {1}s per frog, +{3} frog at {2} pts",ja:"5マス全部埋めると +{0}点、次の面はもっと速くて混雑。1匹あたり{1}秒、{2}点でカエル +{3}",zh:"填满五格 +{0}分，下一局更快更拥挤。每只{1}秒，{2}分时青蛙 +{3}"},"한 칸 전진":{en:"Hop forward",ja:"1マス前進",zh:"前进一格"},"{0}점":{en:"{0} pts",ja:"{0}点",zh:"{0}分"},"연못 도착":{en:"Reach the pond",ja:"池に到着",zh:"到达池塘"},"{0} + 남은 반초당 {1}":{en:"{0} + {1} per half-second left",ja:"{0} + 残り0.5秒ごとに{1}",zh:"{0} + 剩余每半秒{1}"},"파리":{en:"Fly",ja:"ハエ",zh:"苍蝇"},"다섯 칸 완성":{en:"All five filled",ja:"5マス完成",zh:"五格全满"},"+{0} · 다음 판":{en:"+{0} · Next round",ja:"+{0} · 次の面",zh:"+{0} · 下一局"},"통나무":{en:"Log",ja:"丸太",zh:"木头"},"올라타면 함께 이동":{en:"Ride along",ja:"乗ると一緒に移動",zh:"站上去一起移动"},"거북":{en:"Turtle",ja:"カメ",zh:"乌龟"},"깜빡이면 곧 잠수":{en:"Blinking = diving soon",ja:"点滅したらもうすぐ潜る",zh:"闪烁即将潜水"},"악어 ({0}판~)":{en:"Gator (round {0}+)",ja:"ワニ ({0}面〜)",zh:"鳄鱼（第{0}局起）"},"그 칸에 들어가면 끝":{en:"Enter that slot and it's over",ja:"そのマスに入ると終わり",zh:"跳进那格就结束"},"시간":{en:"Time",ja:"時間",zh:"时间"}," oming Leaf · Beam.",ja:"スマホを傾けるかドラッグして黄色いてんとう虫を動かし、迫る虫の群れをかわそう。花アイテムで反撃タイム!巨大花 · シールド · 追尾リーフ · ビーム。",zh:"倾斜或拖动手机，操控黄色瓢虫躲避追来的虫群。吃到花朵道具就能反击！巨型花 · 护盾 · 追踪叶 · 光线。"},"쫓아오는 벌레 떼를 최대한 오래 피하며 점수를 모으세요. 한 번 닿으면 끝(Easy는 목숨 {0}개).":{en:"Dodge the chasing swarm as long as you can and rack up points. One touch and it's over (Easy: {0} lives).",ja:"迫る虫の群れをできるだけ長くかわしてスコアを稼ごう。一度でも触れたら終わり(Easyはライフ{0})。",zh:"尽可能久地躲避追来的虫群并收集分数。碰到一次就结束（Easy有{0}条命）。"},"무당벌레는 화면을 끌거나 방향키로, 또는 폰을 기울여서 움직여요 (시작 화면에서 조작 방식 선택). 기울이기는 시작할 때 폰 자세가 기준이에요.":{en:"Move the ladybug by dragging, arrow keys, or tilting your phone (pick on the start screen). Tilt uses your phone's starting position as center.",ja:"てんとう虫はドラッグ、方向キー、またはスマホの傾きで動かせます(スタート画面で選択)。傾きは開始時のスマホの向きが基準です。",zh:"瓢虫可通过拖动屏幕、方向键或倾斜手机来移动（在开始界面选择）。倾斜以开始时的手机姿势为基准。"},"빨간 벌레는 계속 쫓아오고, 시간이 갈수록 더 많고 빨라져요. 줄지어 구불구불 내려오는 벌레 떼도 나와요.":{en:"Red bugs keep chasing you, getting more numerous and faster over time. Swarms also wiggle down in lines.",ja:"赤い虫はずっと追ってきて、時間とともに数もスピードも増します。列になってくねくね降りてくる群れも出現。",zh:"红虫会一直追你，随着时间越来越多、越来越快。还会有排成一列蜿蜒而下的虫群。"},"뚱벌은 크고 느리지만 세 번 맞혀야 쓰러져요. 파란 소용돌이는 근처의 무당벌레와 벌레를 빨아들여요.":{en:"Fat bugs are big and slow but take three hits. Blue whirlpools suck in nearby ladybugs and bugs.",ja:"デブ虫は大きくて遅いけど、3回当てないと倒れません。青い渦は近くのてんとう虫と虫を吸い込みます。",zh:"胖虫又大又慢，但要打三次才会倒下。蓝色漩涡会吸入附近的瓢虫和虫子。"},"나에게는 무기가 없어요. 떠내려오는 꽃 방울을 먹어야 반격할 수 있어요.":{en:"You have no weapon. Eat the floating flower bubbles to fight back.",ja:"あなたに武器はありません。流れてくる花の玉を食べると反撃できます。",zh:"你没有武器。吃到飘来的花朵泡泡才能反击。"},"버틴 {0}초마다 {1}점, 벌레 {2}점, 뚱벌 {3}점, 별 방울 {4}점.":{en:"{1} pts every {0}s survived, bug {2}, fat bug {3}, star bubble {4}.",ja:"{0}秒耐えるごとに{1}点、虫{2}点、デブ虫{3}点、星の玉{4}点。",zh:"每坚持{0}秒得{1}分，虫子{2}分，胖虫{3}分，星星泡泡{4}分。"},"빨간 꽃":{en:"Red Flower",ja:"赤い花",zh:"红花"},"{0}초 동안 거대 꽃으로 변신 · 닿는 적 모두 파괴":{en:"Become a giant flower for {0}s · destroys all enemies it touches",ja:"{0}秒間巨大花に変身 · 触れた敵を全滅",zh:"变成巨型花{0}秒 · 碰到的敌人全部消灭"},"흰 데이지":{en:"White Daisy",ja:"白いデイジー",zh:"白雏菊"},"{0}초 보호막 · 적을 튕겨 내고 잠시 얼림":{en:"{0}s shiel 石让战场化为火海！"},"철갑 기사 →":{en:"Armored Knight →",ja:"鉄甲騎士 →",zh:"铁甲骑士 →"},"마법":{en:"Magic",ja:"魔法",zh:"魔法"},"하늘 적 → 대포":{en:"Air foes → Cannon",ja:"空の敵 → 大砲",zh:"空中敌人 → 大炮"},"유령 →":{en:"Ghost →",ja:"幽霊 →",zh:"幽灵 →"},"트롤 →":{en:"Troll →",ja:"トロール →",zh:"巨魔 →"},"불":{en:"Fire",ja:"火",zh:"火"},"로 재생 차단":{en:" stops regen",ja:"で再生を阻止",zh:"可阻止再生"},"성문 누르기 →":{en:"Tap the gate →",ja:"城門をタップ →",zh:"点击城门 →"},"기사단 돌격":{en:"Knight Charge",ja:"騎士団突撃",zh:"骑士团冲锋"},"영웅 누르기 →":{en:"Tap a hero →",ja:"英雄をタップ →",zh:"点击英雄 →"},"전직표":{en:"Class Tree",ja:"転職表",zh:"转职表"},"끝없이 몰려오는 웨이브를 막으며 최대한 높은 웨이브까지 버티세요. 성벽이 무너지면 끝.":{en:"Hold off endless Waves and survive to the highest Wave you can. If the wall falls, it's over.",ja:"次々と押し寄せるウェーブを防ぎ、できるだけ高いウェーブまで耐えよう。城壁が崩れたら終わり。",zh:"抵挡源源不断的波次，尽可能坚持到更高的波数。城墙倒塌就结束。"},"화면을 누른 채 뒤로 끌었다 놓으면 내 화살. 머리를 맞히면 두 배.":{en:"Hold, drag back and release to fire your arrow. Headshots deal double.",ja:"画面を押したまま後ろに引いて離すと自分の矢を発射。頭に当てると2倍。",zh:"按住屏幕向后拖再松开即可射出你的箭。爆头伤害翻倍。"},"웨이브 사이 정비: 층을 올리면 영웅 자리가 생겨요. 빈 층을 눌러 영웅을 고용하고, 영웅 칸을 누르면 강화.":{en:"Between Waves: add floors to make room for heroes. Tap an empty floor to hire a hero, tap a hero slot to upgrade.",ja:"ウェーブの合間に準備:階を増やすと英雄の席ができます。空き階をタップで英雄を雇用、英雄枠をタップで強化。",zh:"波次间整备：加盖楼层可增加英雄位置。点击空楼层雇佣英雄，点击英雄栏位进行强化。"},"물리(궁수·대포·내 화살)는 철갑 기사에게 약하고, 마법(불·얼음·번개)은 잘 통해요.":{en:"Physical (archers·cannons·your arrows) is weak vs Armored Knights; magic (fire·ice·lightning) works well.",ja:"物理(弓兵・大砲・自分の矢)は鉄甲騎士に弱く、魔法(火・氷・雷)がよく効きます。",zh:"物理攻击（弓箭手·大炮·你的箭）对铁甲骑士效果差，魔法（火·冰·雷）则很有效。"},"방패병은 정면 화살을 막아요. 위에서 내리꽂거나 광역 공격으로.":{en:"Shieldmen block arrows from the front. Hit them from above or with area attacks.",ja:"盾兵は正面の矢を防ぎます。上から撃ち下ろすか範囲攻撃で。",zh:"盾兵会挡住正面的箭。从上方射击或用范围攻击。"},"대포는 하늘의 적(박쥐·용)을 못 맞혀요. 주술사는 주변 적을 회복시키니 먼저 처치!":{en:"Cannons can't hit air enemies (bats·dragons). Shamans heal nearby foes, so take them out first!",ja:"大砲は空の敵(コウモリ・ドラゴン)に当たりません。呪術師は周りの敵を回復するので先に倒そう!",zh:"大炮打不到空中敌人（蝙蝠·龙）。巫师会治疗周围敌人，要优先消灭！"},"{0}웨이브마다 보스(거인 · 용 · 해골 왕 · 거대 골렘). 체력이 반 아래로 떨어지면 화가 나서 빨라져요.":{en:"A boss every {0} Waves (Giant · Dragon · Skeleton King · Giant Golem). Below half HP, they get angry and faster.",ja:"{0}ウェーブごとにボス(巨人 · ドラゴン · 骸骨王 · 巨大ゴーレム)。体力が半分を切ると怒って速くなります。",zh:"每{0}波出现Boss（巨人 · 巨龙 · 骷髅王 · 巨型魔像）。血量低于一半时会发怒加速。"},"새 적: 적 궁수는 멀리서 쏘고, 폭탄병은 닿으면 터져요. 트롤은 불에 타는 동안만 재생이 멈추고, 골렘은 부서지면 갈라져요. 흑마법사의 보호막은 한 번 막아 주고, 유령이 흐릿할 땐 물리 화살이 통과해요.":{en:"New foes: enemy archers shoot from afar, bombers explode on contact. Trolls stop regenerating only while burning, golems split when broken. Dark mage shields block one hit, and physical arrows pass through faded ghosts.",ja:"新しい敵:敵弓兵は遠くから撃ち、爆弾兵は触れると爆発。トロールは燃えている間だけ再生が止まり、ゴーレムは壊れると分裂。黒魔術師のシールドは一度だけ防ぎ、幽霊が薄いときは物理の矢がすり抜けます。",zh:"新敌人：敌方弓手远程射击，炸弹兵碰到就爆炸。巨魔只有在燃烧时才停止再生，魔像被打碎后会分裂。黑魔法师的护盾能挡一次攻击，幽灵变淡时物理箭会穿透过去。"},"영웅을 Lv{0} · Lv{1}까지 강화하면 진화! 궁수는 화살이 늘고, 대포는 쌍포, 마법은 범위가 커져요.":{en:"Upgrade heroes to Lv{0} · Lv{1} to evolve! Archers get more arrows, cannons go double, magic gets wider range.",ja:"英雄をLv{0} · Lv{1}まで強化すると進化!弓兵は矢が増え、大砲は二連装、魔法は範囲が広がります。",zh:"把英雄强化到Lv{0} · Lv{1}即可进化！弓箭手箭数增加，大炮变双管，魔法范围变大。"},"적을 쓰러뜨리면 각성 게이지가 차요. {0}%에서 「각성」을 누르면 {1}초간 황금 화살이 쉴 새 없이 나가요.":{en:"Defeating enemies fills the Awakening gauge. At {0}%, tap 「Awaken」 for {1}s of nonstop golden arrows.",ja:"敵を倒すと覚醒ゲージがたまります。{0}%で「覚醒」を押すと{1}秒間黄金の矢が撃ち放題。",zh:"击败敌人会积攒觉醒能量。达到{0}%时点「觉醒」，{1}秒内黄金箭连发不停。"},"성문을 누르면 기사단이 말을 타고 돌격해 적을 밀어내요. 성벽 위 끓는 기름 가마솥은 성 앞 적에게 자동으로 쏟아져요.":{en:"Tap the gate and the knights charge on horseback to push enemies back. Boiling oil cauldrons on the wall pour automatically on foes at the gate.",ja:"城門をタップすると騎士団が馬で突撃し敵を押し返します。城壁の煮えたぎる油の大釜は城前の敵に自動で降り注ぎます。",zh:"点击城门，骑士团会骑马冲锋击退敌人。城墙上的沸油大锅会自动倾倒在城前的敌人身上。"},"성 창문의 영웅을 누르면 전직표가 열려요: {0}차 → {1}차(Lv{2}) → {3}차(Lv{4}) 모습과 능력을 볼 수 있어요.":{en:"Tap a hero in the castle window to open the class tree: see looks and skills for tier {0} → tier {1} (Lv{2}) → tier {3} (Lv{4}).",ja:"城の窓の英雄をタップすると転職表が開きます:{0}次 → {1}次(Lv{2}) → {3}次(Lv{4})の見た目と能力を確認できます。",zh:"点击城堡窗口里的英雄可打开转职表：查看{0}转 → {1}转（Lv{2}） → {3}转（Lv{4}）的外观与能力。"},"마을마다 나오는 적과 보스가 달라요. 새 전장 시작 때 이번 마을의 적을 알려 줘요.":{en:"Each village has different enemies and bosses. When a new battlefield starts, you'll see who's coming.",ja:"村ごとに出てくる敵とボスが違います。新しい戦場の開始時に、その村の敵をお知らせします。",zh:"每个村庄的敌人和Boss都不同。新战场开始时会提示本村的敌人。"},"아이템(불·다발·화살비·천둥)은 적이 가끔 떨어뜨리는 구슬, 보스, {0}웨이브마다 보급, 보너스 풍선 사격의 금 풍선에서 얻어요. 종류마다 최대 {1}개.":{en:"Items (fire·volley·arrow rain·thunder) come from orbs enemies sometimes drop, bosses, supplies every {0} Waves, and gold balloons in the bonus balloon round. Max {1} of each.",ja:"アイテム(火・束矢・矢の雨・雷)は、敵がたまに落とす玉、ボス、{0}ウェーブごとの補給、ボーナス風船射撃の金風船から入手。種類ごとに最大{1}個。",zh:"道具（火·齐射·箭雨·雷电）可从敌人偶尔掉落的宝珠、Boss、每{0}波的补给、奖励气球射击中的金气球获得。每种最多{1}个。"},"보스를 잡은 다음 웨이브는 보너스 풍선 사격! 영웅은 쉬고 직접 쏴서 금화와 아이템을 모아요.":{en:"The Wave after a boss is a bonus balloon round! Heroes rest while you shoot to collect Gold and items.",ja:"ボスを倒した次のウェーブはボーナス風船射撃!英雄は休み、自分で撃ってゴールドとアイテムを集めよう。",zh:"击败Boss后的下一波是奖励气球射击！英雄休息，由你亲自射击收集金币和道具。"},"왕국 정복: 지도에서 이웃한 땅을 하나씩 점령해요. 점령한 땅마다 모든 모드의 시작 금화와 성벽이 늘어나요.":{en:"Conquer the Kingdom: capture neighboring lands on the map one by one. Each land boosts starting Gold and wall strength in all modes.",ja:"王国征服:地図上の隣接する土地を一つずつ占領。占領した土地ごとに全モードの開始ゴールドと城壁が増えます。",zh:"征服王国：在地图上逐一占领相邻的领地。每占领一块，所有模式的初始金币和城墙都会提升。"},"성이 무너지면 그 웨이브 시작 직전으로 돌아가 다시 할 수 있어요 (시범 기간이라 횟수 제한 없음). 나갔다 들어오는 건 언제든 자유 (웨이브 시작 직전부터 이어져요). 일시정지에서 「지금 기록 남기기」로 점수를 바로 기록할 수 있어요.":{en:"If the castle falls, you can retry from just before that Wave (unlimited during the trial). Leave and return anytime (resumes from just before the Wave). Use 「Save Score Now」 in pause to record your score right away.",ja:"城が崩れたら、そのウェーブ開始直前に戻ってやり直せます(試験期間中は回数無制限)。出入りはいつでも自由(ウェーブ開始直前から再開)。一時停止の「今すぐ記録」でスコアをすぐ記録できます。",zh:"城堡被攻破后，可回到该波开始前重新挑战（试玩期间不限次数）。随时可以退出再进入（从该波开始前继续）。在暂停菜单点「立即记录」可马上保存分数。"},"궁수":{en:"Archer",ja:"弓兵",zh:"弓箭手"},"빠른 단일 · 물리":{en:"Fast single · Physical",ja:"高速単体 · 物理",zh:"快速单体 · 物理"},"불 마법사":{en:"Fire Mage",ja:"炎の魔法使い",zh:"火焰法师"},"광역 · 마법":{en:"Area · Magic",ja:"範囲 · 魔法",zh:"范围 · 手"},"{0}D 격투 · {1}P/{2}P · Medium":{en:"{0}D Fighting · {1}P/{2}P · Medium",ja:"{0}D格闘 · {1}P/{2}P · Medium",zh:"{0}D格斗 · {1}P/{2}P · Medium"},"· {0}별":{en:"· {0} stars",ja:"· 星{0}",zh:"· {0}星"},"풀을 심어 동물을 먹이고, 달걀·우유·양털을 주워 빵·치즈·옷감으로 가공해 트럭으로 팔아요. 곰이 오면 연타로 가둬요! 빨리 목표를 채울수록 별이 많아요.":{en:"Plant grass to feed animals, collect eggs·milk·wool, make bread·cheese·cloth, and sell by truck. Tap fast to trap bears! Hit goals fast for more stars.",ja:"草を植えて動物にエサをやり、卵・牛乳・羊毛を拾ってパン・チーズ・布に加工し、トラックで売ろう。クマが来たら連打で閉じ込めて!早く目標を達成するほど星が増えます。",zh:"种草喂动物，捡鸡蛋·牛奶·羊毛，加工成面包·奶酪·布料，再用卡车卖掉。熊来了就连点关起来！越快完成目标星星越多。"},"단계마다 정해진 목표(달걀 몇 개, 빵 몇 개, 금화 얼마)를 채우면 성공. 빨리 채울수록 별이 많아요 ({0}단계 · 별 {1}개).":{en:"Hit each stage's goals (eggs, bread, Gold) to clear. Faster means more stars ({0} stages · {1} stars).",ja:"ステージごとの目標(卵何個、パン何個、ゴールドいくら)を達成でクリア。早いほど星が増えます({0}ステージ · 星{1}個)。",zh:"完成每关的目标（几个鸡蛋、几个面包、多少金币）即过关。越快星星越多（{0}关 · {1}颗星）。"},"빈 풀밭을 누르면 풀이 자라요. 우물 물 {0}칸이 들어요. 물이 떨어지면 우물을 눌러 다시 퍼 올리세요.":{en:"Tap empty grassland to grow grass. Uses {0} well water. When water runs out, tap the well to draw more.",ja:"空いた草地をタップすると草が生えます。井戸の水を{0}マス使います。水がなくなったら井戸をタップしてくみ直そう。",zh:"点击空草地就能长草，消耗{0}格井水。水用完了就点水井重新打水。"},"배고픈 동물(머리 위 노랑·빨강 점)은 풀을 찾아 먹어요. 너무 오래 굶으면 떠나요.":{en:"Hungry animals (yellow·red dot overhead) look for grass to eat. Starve too long and they leave.",ja:"お腹がすいた動物(頭上の黄・赤の点)は草を探して食べます。長く空腹だと去ってしまいます。",zh:"饥饿的动物（头顶黄·红点）会找草吃。饿太久就会离开。"},"동물이 떨어뜨린 달걀·우유·양털을 눌러 창고에 담아요. 오래 두면 사라져요 (깜빡이면 곧 사라짐).":{en:"Tap eggs·milk·wool that animals drop to store them. Leave them too long and they vanish (blinking = soon gone).",ja:"動物が落とした卵・牛乳・羊毛をタップして倉庫へ。放っておくと消えます(点滅したらもうすぐ消える)。",zh:"点击动物掉落的鸡蛋·牛奶·羊毛放进仓库。放太久会消失（闪烁表示快消失了）。"},"공방(빵집·치즈 공방·베틀)을 지으면 재료를 더 비싼 물건으로 가공해요.":{en:"Build workshops (bakery·cheese shop·loom) to turn goods into pricier items.",ja:"工房(パン屋・チーズ工房・機織り)を建てると材料をもっと高い品に加工できます。",zh:"建造工坊（面包房·奶酪坊·织布机）就能把原料加工成更值钱的商品。"},"트럭을 누르면 창고 물건을 모두 싣고 시장에 가서 금화로 바꿔 와요.":{en:"Tap the truck to load everything in storage and sell it at market for Gold.",ja:"トラックをタップすると倉庫の品を全部積んで市場でゴールドに換えてきます。",zh:"点击卡车，会装上仓库所有货物去市场换成金币。"},"곰이 오면 동물을 노려요. 여러 번 눌러 우리에 가두고, 우리째 팔 수 있어요.":{en:"Bears go after your animals. Tap repeatedly to cage them, then sell them, cage and all.",ja:"クマが来ると動物を狙います。何度もタップして檻に閉じ込め、檻ごと売れます。",zh:"熊来了会盯上动物。连点多次把它关进笼子，还能连笼一起卖掉。"},"달걀 · 우유 · 양털":{en:"Eggs · Milk · Wool",ja:"卵 · 牛乳 · 羊毛",zh:"鸡蛋 · 牛奶 · 羊毛"},"닭 · 소 · 양이 생산":{en:"From chickens · cows · sheep",ja:"ニワトリ · ウシ · ヒツジが生産",zh:"鸡 · 牛 · 羊产出"},"빵 · 치즈 · 옷감":{en:"Bread · Cheese · Cloth",ja:"パン · チーズ · 布",zh:"面包 · 奶酪 · 布料"},"공방에서 가공 · 비싸게 팔림":{en:"Made in workshops · Sell high",ja:"工房で加工 · 高く売れる",zh:"工坊加工 · 卖价高"},"우물":{en:"Well",ja:"井戸",zh:"水井"},"풀 {0}번 = 물 {1}칸":{en:"{0} grass = {1} water",ja:"草{0}回 = 水{1}マス",zh:"草{0}次 = 水{1}格"},"곰":{en:"Bear",ja:"クマ",zh:"熊"},"여러 번 눌러 가두기":{en:"Tap repeatedly to cage",ja:"何度もタップで閉じ込め",zh:"连点关进笼子"},"농장으로 가기":{en:"Go to Farm",ja:"農場へ",zh:"前往农场"},"{0}단계 · 단계마다 별 {1}개":{en:"{0} stages · {1} stars each",ja:"{0}ステージ · 各ステージ星{1}個",zh:"{0}关 · 每关{1}颗星"},"농장 경영 · 시간 도전 · Medium":{en:"Farm Sim · Time Challenge · Medium",ja:"農場経営 · タイムチャレンジ · Medium",zh:"农场经营 · 限时挑战 · Medium"},"순위":{en:"Rank",ja:"順位",zh:"排名"},"· {0}번 {1}위":{en:"· {0} times #{1}",ja:"· {0}回 {1}位",zh:"· {0}次第{1}名"},"내 카트 · 코인 {0}":{en:"My Kart · Coins {0}",ja:"マイカート · コイン{0}",zh:"我的卡丁车 · 金币{0}"},"꼬마 카트":{en:"Mini Kart",ja:"ミニカート",zh:"迷你卡丁车"},"번개호":{en:"Thunderbolt",ja:"イナズマ号",zh:"闪电号"},"코인 {0}":{en:"Coins {0}",ja:"コイン{0}",zh:"金币{0}"},"꿀벌호":{en:"Bumblebee",ja:"ミツバチ号",zh:"蜜蜂号"},"초록 질주":{en:"Green Dash",ja:"グリーンダッシュ",zh:"绿色疾驰"},"보라 유성":{en:"Purple Meteor",ja:"パープルメテオ",zh:"紫色流星"},"황금 왕관":{en:"Gold Crown",ja:"ゴールドクラウン",zh:"黄金王冠"},"꼬마 카트: 속도 {0} · 가속 {1} · 핸들 {2} · 드리프트 {3}":{en:"Mini Kart: Speed {0} · Accel {1} · Handling {2} · Drift {3}",ja:"ミニカート:スピード{0} · 加速{1} · ハンドル{2} · ドリフト{3}",zh:"迷你卡丁车：速度{0} · 加速{1} · 操控{2} · 漂移{3}"},"레이스 모드":{en:"Race Mode",ja:"レースモード",zh:"比赛模式"},"한 판 레이스":{en:"Single Race",ja:"シングルレース",zh:"单场比赛"},"한 판":{en:"Single",ja:"1レース",zh:"单场"},"그랑프리 ({0}트랙)":{en:"Grand Prix ({0} tracks)",ja:"グランプリ({0}トラック)",zh:"大奖赛（{0}条赛道）"},"트랙":{en:"Track",ja:"トラック",zh:"赛道"},"햇살 시티":{en:"Sunny City",ja:"サニーシティ",zh:"阳光城"},"숲속 계곡":{en:"Forest Valley",ja:"森の渓谷",zh:"森林溪谷"},"노을 해안":{en:"Sunset Coast",ja:"夕焼け海岸",zh:"晚霞海岸"},"아이템 상자를 먹고 물풍선·미사일·바나나로 견제! 드리프트를 길게 할수록 불꽃이 파랑→주황→보라로 바뀌며 더 센 가속. 코인을 모아 더 빠른 카트를 사세요.":{en:"Grab item boxes and harass rivals with water balloons·missiles·bananas! Longer Drifts turn sparks blue→orange→purple for bigger boosts. Collect coins for faster karts.",ja:"アイテムボックスを取って水風船・ミサイル・バナナで妨害!ドリフトが長いほど火花が青→オレンジ→紫に変わり加速アップ。コインを集めて速いカートを買おう。",zh:"吃道具箱，用水球·导弹·香蕉干扰对手！漂移越久火花由蓝→橙→紫，加速越猛。收集金币买更快的卡丁车。"},"CPU 카트 {0}대와 {1}바퀴 아이템전. {2}위를 노리고 코인을 모아 더 좋은 카트를 사세요.":{en:"Item race vs {0} CPU karts over {1} laps. Aim for #{2} and earn coins for better karts.",ja:"CPUカート{0}台と{1}周のアイテム戦。{2}位を目指し、コインを集めていいカートを買おう。",zh:"与{0}辆电脑卡丁车进行{1}圈道具赛。冲击第{2}名，攒金币买更好的车。"},"자동으로 달려요. 도로 밖 풀밭에서는 느려져요.":{en:"Driving is automatic. You slow down on grass off the road.",ja:"自動で走ります。コース外の草地では遅くなります。",zh:"自动行驶。驶出路面到草地会减速。"},"드리프트 버튼을 누른 채 꺾으면 미끄러져요. 같은 방향으로 더 꺾으면 크게, 반대로 꺾으면 작게 돌아요.":{en:"Hold the Drift button while steering to slide. Steer more the same way for a wide turn, the opposite way for a tight one.",ja:"ドリフトボタンを押したまま曲がると滑ります。同じ方向にさらに切ると大きく、逆に切ると小さく回ります。",zh:"按住漂移键转向即可滑行。同方向多打方向转大弯，反方向打则转小弯。"},"길게 미끄러질수록 불꽃이 하양 → 파랑 → 주황 → 보라. 손을 떼는 순간 그 색만큼 가속!":{en:"The longer you slide, sparks go white → blue → orange → purple. Release for a boost matching the color!",ja:"長く滑るほど火花が白 → 青 → オレンジ → 紫に。離した瞬間その色に応じて加速!",zh:"滑行越久火花由白 → 蓝 → 橙 → 紫。松手瞬间按颜色加速！"},"드리프트를 끝내자마자 드리프트 버튼을 한 번 더 톡: 순간 부스터.":{en:"Tap Drift once more right as the Drift ends: instant boost.",ja:"ドリフト終了直後にもう一度ドリフトボタンをタップ:瞬間ブースト。",zh:"漂移结束后立刻再点一次漂移键：瞬间加速。"},"게이지가 차면 부스터 {0}개(최대 {1}개). 부스터 중엔 앞 차를 밀어낼 수 있어요.":{en:"Full gauge = {0} boost (max {1}). While boosting you can shove cars ahead.",ja:"ゲージが満タンでブースト{0}個(最大{1}個)。ブースト中は前の車を押しのけられます。",zh:"能量满了获得{0}个加速（最多{1}个）。加速时可以撞开前车。"},"? 상자: 땅에서 스매시를 누르면 몸을 날려 받아냅니다. {2}·{3}·{4}점제 선택.":{en:"Bouncy {0}:{1} volleyball. Use direction + Smash to aim spikes; Smash on the ground to dive for the ball. Play to {2}·{3}·{4}.",ja:"ぽんぽん弾む{0}:{1}バレー。方向+スマッシュで強打の向きを選び、地上でスマッシュを押すと飛び込んでレシーブ。{2}・{3}・{4}点制から選択。",zh:"弹来弹去的{0}:{1}排球。方向+扣球选择扣杀方向，在地面按扣球可飞身救球。可选{2}·{3}·{4}分制。"},"공을 상대 코트 바닥에 떨어뜨려 정한 점수({0} · {1} · {2}점)를 먼저 따세요.":{en:"Land the ball on your rival's court and reach the set score ({0} · {1} · {2} pts) first.",ja:"ボールを相手コートに落とし、決めた点数({0} · {1} · {2}点)を先に取ろう。",zh:"把球打落在对方场地，先拿到设定分数（{0} · {1} · {2}分）。"},"공이 내 코트 바닥에 닿으면 상대가 {0}점. 점수를 딴 쪽이 다음 서브를 넣어요.":{en:"If the ball hits your floor, your rival scores {0}. The scorer serves next.",ja:"ボールが自分のコートに落ちると相手に{0}点。得点した側が次にサーブします。",zh:"球落在己方场地，对方得{0}分。得分方发下一球。"},"머리·몸에 맞은 공은 맞은 위치에서 먼 쪽으로 튕겨 나갑니다. 가장자리에 맞힐수록 멀리 가요.":{en:"Balls bounce off your head·body away from the contact point. Hit closer to the edge to send it farther.",ja:"頭・体に当たったボールは当たった位置から遠い方へはね返ります。端で当てるほど遠くへ飛びます。",zh:"打在头·身上的球会朝远离接触点的方向弹出。越靠边缘击中飞得越远。"},"▲(위 방향)로 점프하고, 공중에서 스매시: 누르고 있는 방향에 따라 강타 방향이 바뀝니다.":{en:"Jump with ▲ (up), then Smash in the air: the direction you hold changes the spike angle.",ja:"▲(上)でジャンプし、空中でスマッシュ:押している方向で強打の向きが変わります。",zh:"按▲（上）跳起，空中扣球：按住的方向决定扣杀方向。"},"땅에서 방향키와 스매시를 함께 누르면 그쪽으로 몸을 날려(다이빙) 먼 공을 받아냅니다. 착지 후 잠깐 누워 있어요.":{en:"On the ground, press a direction and Smash together to dive that way for far balls. You'll lie down briefly after landing.",ja:"地上で方向キーとスマッシュを同時に押すとその方向に飛び込み(ダイビング)遠いボールを拾います。着地後は少し倒れたまま。",zh:"在地面同时按方向键和扣球，会向该方向飞扑（鱼跃）救远球。落地后会短暂躺下。"},"공이 바닥에 떨어지는 순간 잠깐 슬로 모션이 걸려요.":{en:"Slow motion kicks in briefly when the ball hits the floor.",ja:"ボールが床に落ちる瞬間、少しスローモーションになります。",zh:"球落地的瞬间会短暂慢动作。"},"스매시만":{en:"Smash only",ja:"スマッシュのみ",zh:"仅扣球"},"수평 강스파이크":{en:"Flat power spike",ja:"水平の強スパイク",zh:"水平重扣"},"앞 + 스매시":{en:"Fwd + Smash",ja:"前 + スマッシュ",zh:"前 + 扣球"},"쭉 뻗는 직선 강타":{en:"Long straight spike",ja:"まっすぐ伸びる強打",zh:"笔直长扣"},"▼ + 스매시":{en:"▼ + Smash",ja:"▼ + スマッシュ",zh:"▼ + 扣球"},"수직 내려찍기":{e ab → straight → roundhouse combo; press kick after jab · straight to go straight to the roundhouse.",ja:"パンチとキックのボタンは別々。パンチ連打でジャブ → ストレート → 回し蹴りの{0}段コンボ、ジャブ · ストレートの後にキックを押すとすぐ回し蹴りへ。",zh:"拳和脚按键分开。连按拳打出刺拳 → 直拳 → 回旋踢{0}段连招，刺拳 · 直拳后按踢可直接接回旋踢。"},"방향과 공격을 조합하면 기술이 바뀝니다 (아래 기술표 참고).":{en:"Combine direction and attack to change moves (see the move list below).",ja:"方向と攻撃の組み合わせで技が変わります(下の技表を参照)。",zh:"方向与攻击组合可改变招式（参考下方招式表）。"},"가위바위보 상성: 때리기 → 잡기를 이기고, 잡기 → 막기 · 반격기를 이기고, 반격기 → 때리기를 이겨요. 상대 습관을 읽으세요.":{en:"RPS matchups: Strikes → beat Throws, Throws → beat Blocks · Counters, Counters → beat Strikes. Read your rival's habits.",ja:"じゃんけん相性:打撃 → 投げに勝ち、投げ → ガード · 返し技に勝ち、返し技 → 打撃に勝つ。相手のクセを読もう。",zh:"石头剪刀布克制：打击 → 克投技，投技 → 克防御 · 反击技，反击技 → 克打击。读懂对手的习惯。"},"상대 반대쪽으로 방향을 누르고 있으면 막기(피해 {0}% 감소). 다리 쓸기는 앉아서 막아야 하고, 내려찍기는 서서 막아야 해요.":{en:"Hold away from the rival to block ({0}% less damage). Block leg sweeps crouching and slams standing.",ja:"相手と反対方向を押し続けるとガード(ダメージ{0}%減)。足払いはしゃがんで、叩きつけは立ってガード。",zh:"按住远离对手的方向即可防御（伤害减少{0}%）。扫腿要蹲下防，下劈要站着防。"},"▼로 앉으면 장풍이 머리 위로 지나갑니다.":{en:"Crouch with ▼ and Air Blasts pass overhead.",ja:"▼でしゃがむと掌風が頭上を通過します。",zh:"按▼蹲下，掌风会从头顶掠过。"},"때리거나 맞으면 기 게이지가 차고, 절반 이상이면 특수(장풍)를 쏠 수 있어요. {0}초가 지나면 체력이 많은 쪽이 승리.":{en:"Hitting or getting hit fills the Ki gauge; at half or more, fire your special (Air Blast). After {0}s, the one with more HP wins.",ja:"攻撃したりされたりすると気ゲージがたまり、半分以上で特殊技(掌風)が撃てます。{0}秒経つと体力の多い方が勝ち。",zh:"攻击或被打都会积攒气槽，过半即可发出特技（掌风）。{0}秒后体力多的一方获胜。"},"앞 + 주먹 (붙어서)":{en:"Fwd + Punch (close)",ja:"前 + パンチ(密着)",zh:"前 + 拳（贴身）"},"잡기 · 막기와 반격기를 뚫고 뒤로 던짐 (때리기엔 짐)":{en:"Throw · Beats blocks and counters, tosses behind (loses to strikes)",ja:"投げ · ガードと返し技を崩して後ろへ投げる(打撃に負ける)",zh:"投技 · 破防御和反击技向后摔（输给打击）"},"뒤 + 주먹":{en:"Back + Punch",ja:"後ろ + パンチ",zh:"后 + 拳"},"반격기 · {0}초 안에 맞으면 받아치기 (잡기엔 짐)":{en:"Counter · Hit within {0}s to strike back (loses to throws)",ja:"返し技 · {0}秒以内に攻撃されると反撃(投げに負ける)",zh:"反击技 · {0}秒内被打就反击（输给投技）"},"점프 + 주먹":{en:"Jump + Punch",ja:"ジャンプ + パンチ",zh:"跳 + 拳"},"어퍼컷 · 공중의 상대를 rn it around with {0} power-ups! Two players can share one phone.",ja:"角度を決めて長押しで力をためて投げよう。風を読み、チャンス{0}種で逆転!2人でスマホ1台でも対戦OK。",zh:"调好角度，按住蓄力后投掷。读懂风向，用{0}种机会道具逆转！两人用一部手机也能对战。"},"번갈아 던져서 상대 체력을 먼저 {0}으로 만들면 승리. CPU를 이기면 연승이 쌓여요.":{en:"Take turns throwing; drop the rival's HP to {0} first to win. Beat the CPU to build a win streak.",ja:"交互に投げて、先に相手の体力を{0}にしたら勝ち。CPUに勝つと連勝が積み上がります。",zh:"轮流投掷，先把对手体力打到{0}即获胜。战胜电脑可累积连胜。"},"화면을 누르고 있으면 힘이 차올라요. 누른 채 손가락을 움직이면 그 방향으로 각도가 바뀌고, 떼는 순간 던집니다.":{en:"Hold the screen to build power. Move your finger while holding to change the angle, and release to throw.",ja:"画面を押し続けると力がたまります。押したまま指を動かすとその方向に角度が変わり、離した瞬間に投げます。",zh:"按住屏幕蓄力。按住时移动手指可调整角度，松手即投掷。"},"바람이 돌을 밀어요. 맞바람이면 더 세게, 뒷바람이면 약하게. 보라 표시는 지난번 힘과 각도예요.":{en:"Wind pushes the stone. Throw harder into headwind, softer with tailwind. The purple mark shows your last power and angle.",ja:"風が石を押します。向かい風なら強く、追い風なら弱く。紫の印は前回の力と角度です。",zh:"风会推动石头。逆风要用力，顺风要轻投。紫色标记是上次的力度和角度。"},"머리에 맞으면 {0}배. 바닥에 떨어져도 가까우면 살짝 스쳐서 피해가 들어가요.":{en:"Headshots deal ×{0}. Landing close still grazes for some damage.",ja:"頭に当たると{0}倍。地面に落ちても近ければかすってダメージが入ります。",zh:"命中头部{0}倍伤害。落地时离得近也能擦伤造成伤害。"},"가운데 언덕이 있는 판은 높게 던져서 넘기세요.":{en:"On maps with a hill in the middle, throw high to clear it.",ja:"真ん中に丘があるマップでは高く投げて越えよう。",zh:"中间有山丘的地图要高抛越过。"},"×{0} 두 번 던지기":{en:"×{0} Double Throw",ja:"×{0} 2回投げ",zh:"×{0} 投两次"},"이번 턴에 한 번 더":{en:"One more this turn",ja:"このターンもう一回",zh:"本回合再投一次"},"왕돌":{en:"Big Rock",ja:"大岩",zh:"巨石"},"피해 {0}배, 크기도 큼":{en:"{0}× damage, bigger too",ja:"ダメージ{0}倍、サイズも大",zh:"伤害{0}倍，体积也大"},"반창고":{en:"Bandage",ja:"ばんそうこう",zh:"创可贴"},"체력 {0} 회복":{en:"Restore {0} HP",ja:"体力{0}回復",zh:"恢复{0}体力"},"고양이 던지기":{en:"Cat Toss",ja:"ネコ投げ",zh:"扔猫咪"},"튕기며 넓게 피해":{en:"Bounces for wide damage",ja:"跳ねて広範囲ダメージ",zh:"弹跳造成大范围伤害"},"턴제 · {0}P/{1}P · Medium":{en:"Turn-based · {0}P/{1}P · Medium",ja:"ターン制 · {0}P/{1}P · Medium",zh:"回合制 · {0}P/{1}P · Medium"},"{0}색 · 천장 {1}초":{en:"{0} colors · ceiling {1}s",ja:"{0}色 · 天井{1}秒",zh:"{0}色 · 顶部{1}秒"},"같은 색 방울 {0}개 이상을 붙여 터뜨리고, 매달린 방울을 통째로 떨어뜨리세요. 벽에 튕겨 쏘는 각도가 실력!":{en:"Match {0}+ bubbles of the same color to pop them, and drop hanging ones all at once. Bank shots off walls show your skill!",ja:"同じ色のバブルを{0}個以上つなげて割り、ぶら下がったバブルをまとめて落とそう。壁バウンドの角度が腕の見せどころ!",zh:"将{0}个以上同色泡泡连在一起消除，让悬挂的泡泡整片掉落。借墙反弹的角度最考验技术！"},"같은 색 방울을 {0}개 이상 붙여 터뜨려 판을 비우세요. 아래 빨간 선에 닿으면 끝.":{en:"Match {0}+ same-color bubbles to clear the board. Touch the red line below and it's over.",ja:"同じ色のバブルを{0}個以上つなげて割り、盤面を空にしよう。下の赤い線に届いたら終わり。",zh:"将{0}个以上同色泡泡连起来消除，清空棋盘。碰到下方红线就结束。"},"끌어서 조준, 떼면 발사. 벽에 맞으면 튕겨 나가요 (점선은 두 번 튕김까지 보여 줘요).":{en:"Drag to aim, release to shoot. Bubbles bounce off walls (dotted line shows up to two bounces).",ja:"ドラッグで狙って、離して発射。壁に当たると跳ね返るよ(点線は2回バウンドまで表示)。",zh:"拖动瞄准，松开发射。碰到墙会反弹（虚线最多显示两次反弹）。"},"터진 방울 아래에 매달려 있던 방울은 우수수 떨어지고 점수 {0}배.":{en:"Bubbles hanging below popped ones fall off for {0}× points.",ja:"割れたバブルの下にぶら下がっていたバブルはまとめて落ちて、得点{0}倍。",zh:"被消除泡泡下方悬挂的泡泡会纷纷掉落，得分{0}倍。"},"연속으로 터뜨리면 콤보 배율이 최대 ×{0}까지 올라가요.":{en:"Pop in a row to raise the combo multiplier up to ×{0}.",ja:"連続で割るとコンボ倍率が最大×{0}まで上がるよ。",zh:"连续消除可使连击倍率最高升至×{0}。"},"헛쏘기가 쌓이면(왼쪽 위 점) 천장이 한 줄 내려와요.":{en:"Too many misses (dots, top left) and the ceiling drops a row.",ja:"ミスショットがたまると(左上の点)天井が1段下がるよ。",zh:"空射累积（左上圆点）后，顶部会下降一行。"},"오른쪽 아래 다음 방울을 누르면 지금 방울과 바꿀 수 있어요.":{en:"Tap the next bubble (bottom right) to swap it with the current one.",ja:"右下の次のバブルをタップすると今のバブルと交換できるよ。",zh:"点击右下角的下一个泡泡，可与当前泡泡交换。"},"무지개 방울":{en:"Rainbow Bubble",ja:"レインボーバブル",zh:"彩虹泡泡"},"어떤 색과도 붙어요":{en:"Matches any color",ja:"どの色ともくっつく",zh:"可与任意颜色相连"},"폭탄 방울":{en:"Bomb Bubble",ja:"爆弾バブル",zh:"炸弹泡泡"},"주변을 한 번에 터뜨려요":{en:"Pops everything nearby",ja:"周りをまとめて割る",zh:"一次消除周围一圈"},"판 클리어":{en:"Board Clear",ja:"盤面クリア",zh:"清空棋盘"},"레벨 × {0}점":{en:"Level × {0} pts",ja:"レベル × {0}点",zh:"等级 × {0}分"},"퍼즐 · 조준 · Medium":{en:"Puzzle · Aim · Medium",ja:"パズル · エイム · Medium",zh:"益智 · 瞄准 · Medium"},"격파":{en:"K.O.",ja:"撃破",zh:"击破"},"태풍 · 균형형 · 장풍과 승천권":{en:"Typhoon · Balanced · Fireball & Rising Uppercut",ja:"タイフーン · バランス型 · 掌風と昇天拳",zh:"台风 · 均衡型 · 掌风与升天拳"},"태풍":{en:"Typhoon",ja:"タイフーン",zh:"台风"},"바위":{en:"Boulder",ja:"ボルダー",zh:"巨岩"},"바람":{en:"Gale",ja:"ゲイル",zh:"疾风"},"번개 · 빠름 · 연속 발차기":{en:"Bolt · Fast · Rapid Kicks",ja:"ボルト · 速い · 連続キック",zh:"闪电 · 迅捷 · 连环踢"},"↓↘→ + 주먹 같은 커맨드로 필살기! 뒤로 누르면 막기, 콤보를 이어 상대를 하나씩 꺾는 아케이드. 필살 버튼만 눌러도 기술이 나가요.":{en:"Pull off specials with commands like ↓↘→ + Punch! Hold back to block, chain combos and beat foes one by one in this arcade brawler. Just tap the Special button to pull off moves too.",ja:"↓↘→ + パンチなどのコマンドで必殺技!後ろ入力でガード、コンボをつないで相手を一人ずつ倒すアーケード。必殺ボタンだけでも技が出るよ。",zh:"用↓↘→ + 拳等指令放必杀技！按后方向防御，连段击败一个个对手的街机格斗。只按必杀键也能出招。"},"아케이드: 상대 {0}명(마지막은 그림자 태풍)을 차례로 {1}판 {2}선승으로 꺾으면 챔피언. 둘이서 모드는 한 판 승부.":{en:"Arcade: Beat {0} foes in a row (the last is Shadow Typhoon), best of {1}, first to {2} wins, to become champion. 2P mode is a single match.",ja:"アーケード:相手{0}人(最後はシャドウタイフーン)を順に{1}本{2}先取で倒せばチャンピオン。2人モードは一本勝負。",zh:"街机模式：依次击败{0}名对手（最后是暗影台风），{1}局{2}胜即成冠军。双人模式一局定胜负。"},"상대 반대쪽으로 누르고 있으면 막기. 다리 걸기는 앉아서 막고, 점프 공격은 서서 막아야 해요.":{en:"Hold away from the foe to block. Crouch-block sweeps, stand-block jump attacks.",ja:"相手と逆方向を押し続けるとガード。足払いはしゃがみガード、ジャンプ攻撃は立ちガードで。",zh:"按住远离对手的方向即可防御。扫腿要蹲防，跳跃攻击要站防。"},"주먹 → 주먹 → 발로 {0}단 콤보. 맞히는 중에 필살기를 누르면 이어져요(캔슬).":{en:"Punch → Punch → Kick for a {0}-hit combo. Hit Special mid-combo to chain it (cancel).",ja:"パンチ → パンチ → キックで{0}段コンボ。ヒット中に必殺技を押すとつながるよ(キャンセル)。",zh:"拳 → 拳 → 踢，{0}段连击。命中时按必杀可接上（取消）。"},"붙어서 앞+주먹은 잡아 던지기(막아도 소용없음).":{en:"Up close, Forward + Punch is a throw (can't be blocked).",ja:"密着して前+パンチで投げ(ガード不能)。",zh:"贴身时前+拳为投技（无法防御）。"},"때리고 맞으면 아래 게이지가 차요. 가득 차면 필살 버튼으로 초필살!":{en:"Hitting and getting hit fills the gauge below. When full, hit Special for a Super!",ja:"攻撃したり受けたりすると下のゲージがたまる。満タンで必殺ボタンを押すと超必殺!",zh:"攻击和受击都会积攒下方能量槽。满了按必杀键放超必杀！"},"커맨드가 어려우면 필살 버튼만: 방향 없이=첫째 기술, 위=둘째, 뒤=셋째.":{en:"Commands too hard? Just use Special: no direction = 1st move, Up = 2nd, Back = 3rd.",ja:"コマンドが難しければ必殺ボタンだけで:方向なし=1つ目、上=2つ目、後ろ=3つ目。",zh:"指令太难就只按必杀键：无方向=第一招，上=第二招，后=第三招。"},"↓↘→ + 주먹":{en:"↓↘→ + Punch",ja:"↓↘→ + パンチ",zh:"↓↘→ + 拳"},"첫째 필살 (장풍 · 기공탄 · 돌진 · 표창)":{en:"1st Special (Fireball · Ki Blast · Rush · Shuriken)",ja:"1つ目の必殺 (掌風 · 気功弾 · 突進 · 手裏剣)",zh:"第一必杀 (掌风 · 气功弹 · 突进 · 飞镖)"},"→↓↘ + 주먹":{en:"→↓↘ + Punch",ja:"→↓↘ + パンチ",zh:"→↓↘ + 拳"},"둘째 필살 (승천권 · 올려차기 · 몸통 누르기 · 순간이동)":{en:"2nd Special (Rising Uppercut · Launch Kick · Body Slam · Teleport)",ja:"2つ目の必殺 (昇天拳 · 蹴り上げ · のしかかり · 瞬間移動)",zh:"第二必杀 (升天拳 · 上踢 · 泰山压顶 · 瞬移)"},"↓↙← + 발":{en:"↓↙← + Kick",ja:"↓↙← + キック",zh:"↓↙← + 踢"},"셋째 필살 (회오리발 · 번개발 · 메치기 · 급강하)":{en:"3rd Special (Whirlwind Kick · Lightning Kick · Suplex · Dive)",ja:"3つ目の必殺 (旋風脚 · 稲妻脚 · 投げ落とし · 急降下)",zh:"第三必杀 (旋风腿 · 闪电腿 · 摔投 · 俯冲)"},"↓↘→↓↘→ + 주먹":{en:"↓↘→↓↘→ + Punch",ja:"↓↘→↓↘→ + パンチ",zh:"↓↘→↓↘→ + 拳"},"초필살 (게이지 가득일 때)":{en:"Super (when gauge is full)",ja:"超必殺 (ゲージ満タン時)",zh:"超必杀 (能量槽满时)"},"캐릭터":{en:"Characters",ja:"キャラクター",zh:"角色"},"태풍 균형 · 번개 빠름 · 바위 힘 · 바람 날쌤":{en:"Typhoon balanced · Bolt fast · Boulder strong · Gale agile",ja:"タイフーン バランス · ボルト 速い · ボルダー パワー · ゲイル 身軽",zh:"台风均衡 · 闪电迅捷 · 巨岩力量 · 疾风灵巧"},"🗺 원정 {0}단계":{en:"🗺 Campaign Stage {0}",ja:"🗺 遠征 ステージ{0}",zh:"🗺 远征 第{0}关"},"내 탱크":{en:"My Tank",ja:"マイ戦車",zh:"我的坦克"},"번개호 · 균형형 · 특수: 삼연발":{en:"Thunder · Balanced · Special: Triple Shot",ja:"サンダー号 · バランス型 · 特殊:3連射",zh:"雷电号 · 均衡型 · 特殊：三连发"},"바위호":{en:"Rock",ja:"ロック号",zh:"岩石号"},"깃털호":{en:"Feather",ja:"フェザー号",zh:"羽毛号"},"불꽃호":{en:"Blaze",ja:"ブレイズ号",zh:"火焰号"},"CPU 상대 수 ({0}P)":{en:"CPU opponents ({0}P)",ja:"CPU相手の数 ({0}P)",zh:"CPU对手数 ({0}P)"},"{0}대{1} 맞대결":{en:"{0} vs {1}",ja:"{0}対{1}",zh:"{0}对{1}"},"CPU {0}대":{en:"{0} CPUs",ja:"CPU {0}台",zh:"CPU {0}台"},"{0}P 탱크 (둘이서)":{en:"{0}P Tank (2P)",ja:"{0}P 戦車 (2人で)",zh:"{0}P 坦克 (双人)"},"바위호 · 튼튼함 · 체력 {0} · 특수: 땅 꺼트리기":{en:"Rock · Sturdy · {0} HP · Special: Ground Collapse",ja:"ロック号 · 頑丈 · 体力{0} · 特殊:地面崩し",zh:"岩石号 · 坚固 · 体力{0} · 特殊：地面塌陷"},"각도를 잡고 힘을 모아 쏘면 땅이 움푹 파여요! 바람을 읽고, 연료로 자리를 옮기고, 탱크마다 다른 특수탄으로 상대를 구덩이에 빠뜨리세요.":{en:"Set your angle, charge power and fire to blast craters! Read the wind, use fuel to move, and drop foes into pits with each tank's special shell.",ja:"角度を決めてパワーをためて撃つと地面がえぐれる!風を読み、燃料で移動し、戦車ごとの特殊弾で相手を穴に落とそう。",zh:"调好角度、蓄力发射，地面会被炸出坑！看准风向，用燃料移动，用每辆坦克独有的特殊弹把对手打进坑里。"},"번갈아 포탄을 쏴서 상대 탱크를 먼저 쓰러뜨리거나 물에 빠뜨리면 승리. CPU를 이기면 연승이 쌓여요.":{en:"Take turns firing shells. Destroy the enemy tank or sink it in water first to win. Beat the CPU to build a win streak.",ja:"交互に砲弾を撃って、先に相手の戦車を倒すか水に落とせば勝ち。CPUに勝つと連勝が積み上がるよ。",zh:"轮流发射炮弹，先击毁对手坦克或让它掉进水里就赢。战胜CPU可累积连胜。"},"◀ ▶로 움직이면 연료가 줄어요(매 턴 절반 충전). 가파른 비탈은 못 올라가요.":{en:"Moving with ◀ ▶ uses fuel (half refills each turn). Can't climb steep slopes.",ja:"◀ ▶で動くと燃料が減る(毎ターン半分回復)。急な坂は登れないよ。",zh:"用◀ ▶移动会消耗燃料（每回合回复一半）。陡坡上不去。"},"▲ ▼ 또는 화면을 끌어서 각도. 「발사」를 누르고 있으면 힘이 {0}→{1}→{2}으로 오르내려요. 주황 선은 지난번 힘.":{en:'▲ ▼ or drag the screen to aim. Hold "Fire" and power swings {0}→{1}→{2}. Orange line = last power.',ja:"▲ ▼ または画面ドラッグで角度。「発射」を長押しするとパワーが{0}→{1}→{2}と上下するよ。オレンジの線は前回のパワー。",zh:"▲ ▼或拖动屏幕调角度。按住「发射」力度会在{0}→{1}→{2}间往返。橙线是上次力度。"},"포탄이 떨어진 자리는 땅이 파여요. 밑의 땅이 사라지면 탱크가 떨어지고, 높이 떨어지면 피해, 물까지 떨어지면 끝!":{en:"Shells dig craters where they land. Lose the ground below and your tank falls — big drops hurt, and falling into water ends it!",ja:"砲弾が落ちた場所は地面がえぐれる。足元の地面がなくなると戦車が落下、高く落ちるとダメージ、水まで落ちたら終わり!",zh:"炮弹落点会炸出坑。脚下地面没了坦克就会掉落，摔得高会受伤，掉进水里就完蛋！"},"바람은 매 턴 바뀌어요. 깃털호는 바람을 절반만 받아요.":{en:"Wind changes every turn. Feather takes only half the wind.",ja:"風は毎ターン変わるよ。フェザー号は風の影響が半分。",zh:"风向每回合都会变。羽毛号只受一半风力影响。"},"번개호 · 삼연발":{en:"Thunder · Triple Shot",ja:"サンダー号 · 3連射",zh:"雷电号 · 三连发"},"작은 포탄 {0}발이 부채꼴로":{en:"{0} small shells in a fan",ja:"小さな砲弾{0}発が扇状に",zh:"{0}发小炮弹呈扇形射出"},"바위호 · 땅 꺼트리기":{en:"Rock · Ground Collapse",ja:"ロック号 · 地面崩し",zh:"岩石号 · 地面塌陷"},"큰 구덩이로 상대를 떨어뜨려요":{en:"Drops foes into a huge crater",ja:"大きな穴で相手を落とす",zh:"用大坑让对手掉下去"},"깃털호 · 통통탄":{en:"Feather · Bounce Shell",ja:"フェザー号 · ポンポン弾",zh:"羽毛号 · 弹弹弹"},"두 번 튕긴 뒤 크게 터져요":{en:"Bounces twice, then blows up big",ja:"2回跳ねてから大爆発",zh:"弹两次后大爆炸"},"불꽃호 · 불비":{en:"Blaze · Fire Rain",ja:"ブレイズ号 · 火の雨",zh:"火焰号 · 火雨"},"꼭대기에서 불덩이 {0}개로":{en:"{0} fireballs from the peak",ja:"頂点から火の玉{0}個",zh:"在最高点洒下{0}个火球"},"두 번 쏘기 · 체력 {0} 회복 (한 판에 하나씩)":{en:"Double Shot · Restore {0} HP (one each per match)",ja:"2回撃ち · 体力{0}回復 (1戦に1つずつ)",zh:"双发 · 恢复{0}体力 (每局各一次)"},"정비소 · 부품 {0}":{en:"Garage · Parts {0}",ja:"整備工場 · パーツ{0}",zh:"修理厂 · 零件{0}"},"칭호 신병 · 영구 강화":{en:"Title: Rookie · Permanent upgrades",ja:"称号 新兵 · 永久強化",zh:"称号 新兵 · 永久强化"},"턴제 포격 · {0}P/{1}P · Medium":{en:"Turn-based artillery · {0}P/{1}P · Medium",ja:"ターン制砲撃 · {0}P/{1}P · Medium",zh:"回合制炮击 · {0}P/{1}P · Medium"},"동네 말썽꾼들을 혼내 주며 앞으로! 주먹 {0}단 콤보, 붙잡아 던지기, 쓰레기통 집어 던지기, 분노 폭발까지. 구역마다 몰려오는 녀석들을 다 쓰러뜨려야 지나갈 수 있어요.":{en:"Teach the neighborhood troublemakers a lesson and push forward! {0}-hit punch combos, grabs and throws, trash can tosses, even Rage mode. Beat every gang in each zone to move on.",ja:"近所の悪ガキを懲らしめながら前進!パンチ{0}段コンボ、つかみ投げ、ゴミ箱投げ、怒り爆発まで。エリアごとに押し寄せる連中を全員倒せば先へ進めるよ。",zh:"教训街区里的捣蛋鬼，一路向前！{0}段拳连击、抓投、扔垃圾桶，还有怒气爆发。打倒每个区域涌来的家伙才能通过。"},"구역마다 몰려오는 동네 말썽꾼들을 모두 쓰러뜨리고 앞으로! {0}개 동네의 대장을 꺾으면 골목 평정.":{en:"Beat all the troublemakers swarming each zone and push on! Defeat the bosses of {0} neighborhoods to rule the alleys.",ja:"エリアごとに押し寄せる悪ガキを全員倒して前進!{0}つの町の大将を倒せば路地を制覇。",zh:"打倒每个区域涌来的捣蛋鬼，继续前进！击败{0}个街区的老大即可称霸小巷。"},"구역에 들어가면 화면이 잠겨요. 적을 다 쓰러뜨리면 「GO ▶」가 떠요.":{en:'Entering a zone locks the screen. Beat every enemy and "GO ▶" appears.',ja:"エリアに入ると画面がロックされる。敵を全員倒すと「GO ▶」が出るよ。",zh:"进入区域后画面锁定。打倒全部敌人会出现「GO ▶」。"},"주먹 {0}번 = {1}단 콤보(마지막에 넘어뜨림). 점프 중 주먹 = 날아차기. 적이 없을 때 「들기」 = 밀어내기.":{en:'Punch {0}× = {1}-hit combo (last hit knocks down). Punch mid-jump = flying kick. "Grab" with no enemy near = shove.',ja:"パンチ{0}回 = {1}段コンボ(最後でダウン)。ジャンプ中パンチ = 飛び蹴り。敵がいない時の「つかむ」= 押し出し。",zh:"拳{0}次 = {1}段连击（最后一击击倒）。跳跃中出拳 = 飞踢。无敌人时「抓取」= 推开。"},"비틀거리거나 체력이 반 남은 꼬마 옆에서 「들기」 = 붙잡기 → 주먹으로 무릎치기, 「들기」 한 번 더 = 던지기(다른 적까지 쓰러뜨려요).":{en:'Next to a dazed or half-HP Kid, "Grab" = hold → Punch for knee strikes, "Grab" again = throw (knocks down other foes too).',ja:"ふらついているか体力半分のチビの横で「つかむ」= つかみ → パンチで膝蹴り、もう一度「つかむ」= 投げ(他の敵も倒せる)。",zh:"在摇晃或剩半血的小鬼旁「抓取」= 抓住 → 出拳膝撞，再按「抓取」= 投掷（还能撞倒其他敌人）。"},"쓰레기통 · 타이어 · 물풍선 상자를 집어 던질 수 있어요. 물풍선은 맞은 적을 어지럽게 해요.":{en:"You can pick up and throw trash cans, tires and water balloon crates. Water balloons make foes dizzy.",ja:"ゴミ箱 · タイヤ · 水風船の箱を持ち上げて投げられるよ。水風船は当たった敵を目まわしにする。",zh:"可以举起垃圾桶 · 轮胎 · 水气球箱扔出去。水气球会让被砸中的敌人头晕。"},"때리고 맞으면 분노가 차요. 가득 차면 「분노」로 {0}초 동안 두 배로 세지고, 들기 = 회전 공격.":{en:'Hitting and getting hit fills Rage. When full, "Rage" doubles your power for {0}s, and Grab = spin attack.',ja:"攻撃したり受けたりすると怒りがたまる。満タンで「怒り」を押すと{0}秒間パワー2倍、つかむ = 回転攻撃。",zh:"攻击和受击都会积攒怒气。满了按「怒气」{0}秒内力量翻倍，抓取 = 旋转攻击。"},"꼬마":{en:"Kid",ja:"チビ",zh:"小鬼"},"약하지만 여럿이 와요 · 붙잡을 수 있어요":{en:"Weak but come in groups · Can be grabbed",ja:"弱いけど群れで来る · つかめる",zh:"弱但成群而来 · 可抓取"},"덩치":{en:"Bruiser",ja:"デカブツ",zh:"大块头"},"잘 안 밀려요 · 콤보 마지막 타로 넘어뜨리세요":{en:"Hard to push · Knock down with combo finisher",ja:"押されにくい · コンボの最後でダウンさせよう",zh:"不容易被击退 · 用连击最后一击打倒"},"새총":{en:"Slingshot",ja:"パチンコ",zh:"弹弓手"},"멀리서 돌을 쏴요 · 먼저 처리":{en:"Shoots rocks from afar · Take out first",ja:"遠くから石を撃つ · 先に倒そう",zh:"远程射石子 · 优先解决"},"날쌘이":{en:"Speedy",ja:"すばしっこ",zh:"飞毛腿"},"빨라요":{en:"Fast",ja:"速い",zh:"速度快"},"동네 대장":{en:"Block Boss",ja:"町の大将",zh:"街区老大"},"돌진에 주의! 옆줄로 피하세요":{en:"Watch the charge! Dodge to another lane",ja:"突進に注意!横のラインへよけよう",zh:"小心冲撞！换到旁边那条线躲开"},"출동하기":{en:"Let's Go",ja:"出動",zh:"出动"},"동네 {0}곳 · 대장 {1}명 · 끝없는 회차 · 스테이지마다 보상":{en:"{0} neighborhoods · {1} bosses · Endless loops · Rewards every stage",ja:"町{0}か所 · 大将{1}人 · エンドレス周回 · ステージごとに報酬",zh:"{0}个街区 · {1}名老大 · 无限轮回 · 每关都有奖励"},"문방구 · 용돈 {0}":{en:"Corner Shop · Allowance {0}",ja:"駄菓子屋 · おこづかい{0}",zh:"文具店 · 零花钱{0}"},"칭호 동네 꼬마 · 영구 강화":{en:"Title: Street Kid · Permanent upgrades",ja:"称号 町のチビ · 永久強化",zh:"称号 街头小鬼 · 永久强化"},"횡스크롤 난투 · 한판 · Medium":{en:"Side-scrolling brawler · Single run · Medium",ja:"横スクロール乱闘 · 一発勝負 · Medium",zh:"横版乱斗 · 一局 · Medium"},"한 줄로 묶인 도도와 토토! 왼쪽 화면은 도도, 오른쪽 화면은 토토. 혼자 두 손으로, 또는 친구와 한 폰으로 호흡을 맞춰 절벽을 건너요. 떨어진 친구는 버티고 서서 끌어올리세요.":{en:"Dodo and Toto, tied by one rope! Left side is Dodo, right side is Toto. Play solo with two hands or with a friend on one phone and cross the cliffs in sync. If your buddy falls, hold steady and pull them up.",ja:"1本のロープでつながったドドとトト!画面左はドド、右はトト。1人で両手で、または友達と1台のスマホで息を合わせて崖を渡ろう。落ちた相棒は踏ん張って引き上げて。",zh:"被一根绳子拴在一起的多多和托托！左半屏是多多，右半屏是托托。一个人用双手，或和朋友共用一部手机，配合默契跨越悬崖。伙伴掉下去就稳住把他拉上来。"},"한 줄로 묶인 도도와 토토를 함께 깃발까지! {0}단계를 건너면 완주.":{en:"Get Dodo and Toto, tied by one rope, to the flag together! Clear {0} stages to finish.",ja:"1本のロープでつながったドドとトトを一緒に旗まで!{0}ステージ渡ればクリア。",zh:"带着拴在一起的多多和托托一起到达旗帜！通过{0}关即完成。"},"왼쪽 화면 = 도도, 오른쪽 화면 = 토토. 혼자라면 두 엄지로, 둘이라면 한 폰을 나눠 잡아요.":{en:"Left side = Dodo, right side = Toto. Solo, use two thumbs; with two, share one phone.",ja:"画面左 = ドド、右 = トト。1人なら両手の親指で、2人なら1台のスマホを分けて持とう。",zh:"左半屏 = 多多，右半屏 = 托托。一个人就用两个拇指，两个人就分握一部手机。"},"누르고 있으면 앞으로 걷고, 톡 치면 점프. 누른 채 왼쪽으로 끌면 뒤로 걸어요.":{en:"Hold to walk forward, tap to jump. Hold and drag left to walk back.",ja:"長押しで前に歩き、タップでジャンプ。押したまま左にドラッグで後ろ歩き。",zh:"按住向前走，轻点跳跃。按住向左拖动则后退。"},"줄은 일정 길이 이상 늘어나지 않아요. 절벽 너머로 먼저 뛴 친구가 떨어지면 줄에 매달려요.":{en:"The rope only stretches so far. If one jumps past a cliff and falls, they dangle from the rope.",ja:"ロープは一定以上伸びないよ。先に崖を飛び越えた相棒が落ちるとロープにぶら下がる。",zh:"绳子不会超过一定长度。先跳过悬崖的伙伴掉下去会吊在绳子上。"},"매달린 친구는 누르고 있으면 줄을 타고 올라와요(영차!). 매달린 채 톡 치면 흔들어 뛰어올라요.":{en:"A dangling buddy climbs the rope by holding (heave-ho!). Tap while hanging to swing up.",ja:"ぶら下がった相棒は長押しでロープを登る(よいしょ!)。ぶら下がったままタップで揺らして飛び上がる。",zh:"吊着的伙伴按住就能顺绳往上爬（嘿哟！）。吊着时轻点会荡起来跳上去。"},"가만히 선 쪽은 단단히 버티지만, 걷고 있으면 같이 끌려가요. 둘 다 물에 빠지면 목숨 {0}개가 줄어요.":{en:"Standing still holds firm, but walking gets you dragged along. If both fall in the water, you lose {0} lives.",ja:"止まっている方はしっかり踏ん張るけど、歩いていると一緒に引きずられる。2人とも水に落ちると残機{0}つ減るよ。",zh:"站着不动的一方会稳稳撑住，走动时则会被一起拖走。两人都掉水里会失去{0}条命。"},"{0}단계부터 위아래로 움직이는 발판이 나와요. 빨리 도착할수록 별과 점수가 많아요.":{en:"From stage {0}, moving platforms go up and down. Arrive faster for more stars and points.",ja:"ステージ{0}から上下に動く足場が登場。早く着くほど星とスコアが増えるよ。",zh:"从第{0}关开始出现 gi — collect 10 patches to complete a whole bojagi.",ja:"8章 × 10ステージ。ステージをクリアするたびにその章のポジャギが1枚ずつ色づき、10枚集めるとポジャギが1枚完成。",zh:"8章 × 10关。每通过一关，该章的拼布包袱布就会染上一块，集齐10块即可完成一整幅拼布包袱布。"},"· 조각보":{en:"· Bojagi",ja:"· ポジャギ",zh:"· 拼布包袱布"},"· 채움":{en:"· Filled",ja:"· 塗り",zh:"· 填充"},"← 조각보":{en:"← Bojagi",ja:"← ポジャギ",zh:"← 拼布包袱布"},"가까운 단추끼리 먼저 잇고, 먼 단추는 빈 곳을 돌아가게 하세요.":{en:"Connect nearby buttons first, and route distant ones around the empty space.",ja:"近いボタン同士を先につなぎ、遠いボタンは空いた所を回り込ませましょう。",zh:"先连近处的纽扣，远处的纽扣绕着空位走。"},"같은 색 단추 두 개를 실로 잇고, 판의 모든 칸을 실로 빈틈없이 채우세요.":{en:"Connect each pair of same-colored buttons with thread, and fill every cell on the board with no gaps.",ja:"同じ色のボタン2つを糸でつなぎ、盤面のすべてのマスを糸ですき間なく埋めましょう。",zh:"用线连接两颗同色纽扣，并把棋盘上的所有格子填满，不留空隙。"},"같은 색 단추끼리 실로 이어 주세요. 실은 서로 겹칠 수 없고, 판의 모든 칸을 빈틈없이 채워야 성공! 한 단계를 깰 때마다 조각보가 한 조각씩 물들어요.":{en:"Connect same-colored buttons with thread. Threads can't overlap, and you win by filling every cell on the board with no gaps! Each stage you clear dyes one patch of the bojagi.",ja:"同じ色のボタン同士を糸でつなぎましょう。糸は重ねられず、盤面のすべてのマスをすき間なく埋めたらクリア！ステージをクリアするたびにポジャギが1枚ずつ色づきます。",zh:"用线把同色纽扣连起来。线不能交叉重叠，把棋盘所有格子填满就成功！每通过一关，拼布包袱布就会染上一块。"},"같은 색 단추끼리 실로 잇고 빈칸 없이 채우기! 깰 때마다 조각보가 한 조각씩 물들어요":{en:"Connect same-colored buttons with thread and leave no empty cells! Each clear dyes one patch of the bojagi",ja:"同じ色のボタン同士を糸でつなぎ、空きマスなく埋めよう！クリアするたびにポジャギが1枚ずつ色づきます",zh:"用线连接同色纽扣，不留空格！每次通关，拼布包袱布就染上一块"},"같은 색 단추끼리 잇고, 모든 칸을 채우면 성공":{en:"Connect same-colored buttons and fill every cell to win",ja:"同じ色のボタン同士をつなぎ、全マスを埋めたらクリア",zh:"连接同色纽扣并填满所有格子即可过关"},"같은 색끼리 잇기":{en:"Match the colors",ja:"同じ色同士をつなぐ",zh:"连接同色"},"거기서부터 다시":{en:"Redraw from there",ja:"そこからやり直し",zh:"从这里重画"},"겹치면 끊겨요":{en:"Crossing cuts threads",ja:"重なると切れます",zh:"交叉会剪断"},"궁중 조각보":{en:"Royal Court Bojagi",ja:"宮中ポジャギ",zh:"宫廷拼布包袱布"},"노을 조각보":{en:"Sunset Bojagi",ja:"夕焼けポジャギ",zh:"晚霞拼布包袱布"},"다른 실 위로 지나가면 그 실이 끊겨요":{en:"Crossing another thread cuts that thread",ja:"他の糸の上を通ると、その糸が切れます",zh:"从其他线上经过会把那条线剪断"},"다음은":{en:"Next up is",ja:"次は  실력!":{en:"Leave hedgehogs alone and they'll duck back down. Holding back is a skill too!",ja:"ハリネズミは放っておけば勝手に引っ込みます。我慢も実力！",zh:"刺猬不管它就会自己缩回去。忍住也是实力！"},"고슴도치를 때리면 -30점 · 시계 두더지는 +5초":{en:"Hitting a hedgehog: -30 pts · Clock mole: +5 sec",ja:"ハリネズミを叩くと-30点 · 時計モグラは+5秒",zh:"打到刺猬-30分 · 时钟地鼠+5秒"},"구멍에서 쏙쏙 튀어나오는 두더지를 뿅망치로 팡! 60초 동안 최대한 많이 잡으세요. 황금 두더지는 큰 점수, 헬멧 두더지는 두 번, 고슴도치는 절대 때리면 안 돼요.":{en:"Bonk the moles popping out of their holes with your squeaky hammer! Catch as many as you can in 60 seconds. Golden moles are worth big points, helmet moles take two hits, and never hit the hedgehog.",ja:"穴からひょこっと出てくるモグラをピコピコハンマーでポン！60秒間でできるだけたくさん叩こう。金のモグラは高得点、ヘルメットモグラは2回、ハリネズミは絶対に叩いちゃダメ。",zh:"用玩具锤砸从洞里冒出来的地鼠！60秒内尽量多抓。金地鼠分数高，头盔地鼠要打两次，刺猬千万别打。"},"구멍에서 튀어나온 두더지를 누르면 뿅망치로 잡아요. 기본 10점.":{en:"Tap a mole that pops out to bonk it with the hammer. 10 pts each.",ja:"飛び出したモグラをタップするとハンマーで叩きます。基本10点。",zh:"点击冒出的地鼠就能用锤子打中。基础10分。"},"구멍이 늘었어요!":{en:"More holes!",ja:"穴が増えた！",zh:"洞变多了！"},"끝!":{en:"Time's up!",ja:"終了！",zh:"结束！"},"나가기":{en:"Go home",ja:"ゴール",zh:"出局"},"나온 결과가 여기에 모여요":{en:"Your throws collect here",ja:"出た結果がここに集まります",zh:"掷出的结果会在这里"},"나온 결과를 고르고 움직일 말을 누르세요":{en:"Pick a result and tap the piece to move",ja:"出た結果を選んで動かすコマをタップ",zh:"选择结果后点击要移动的棋子"},"내 말이 있는 칸에 멈추면 업고 함께 움직여요. 상대 말이 있는 칸에 멈추면 잡아서 집으로 돌려보내고 한 번 더 던져요.":{en:"Land on your own piece to stack them and move together. Land on an opponent's piece to capture it, send it back home, and throw again.",ja:"自分のコマがいるマスに止まると重ねて一緒に動きます。相手のコマがいるマスに止まると捕まえてスタートに戻し、もう一度投げます。",zh:"停在自己棋子所在的格子就叠在一起走。停在对手棋子所在的格子就吃掉它、送回起点，并再掷一次。"},"내 차례":{en:"Your turn",ja:"あなたの番",zh:"轮到你"},"내 차례! 윷을 던지세요":{en:"Your turn! Throw the sticks",ja:"あなたの番！ユッを投げよう",zh:"轮到你！掷尤棍吧"},"내가 먼저! 윷을 던지세요":{en:"You go first! Throw the sticks",ja:"あなたが先攻！ユッを投げよう",zh:"你先来！掷尤棍吧"},"달 말":{en:"Moon pieces",ja:"月のコマ",zh:"月亮棋子"},"더 빨라져요!":{en:"Getting faster!",ja:"スピードアップ！",zh:"越来越快！"},"도":{en:"Do",ja:"ト",zh:"道"},"도 · 개 · 걸 · 윷 · 모! 윷을 던져 말 네 개를 먼저 한 바퀴 돌려 내보내면 승리. 모서리에 멈추면 지름길, 내 말끼리 업고 가고, 상대 말을 잡으면 한 번 더!":{en:"Do · Gae · Geol · Yut · Mo! Throw the sticks and be the first to bring all 4 pieces around the board and home. Stop on a corner for a shortcut, stack your own pieces, and capture to throw again!",ja:"ト · ケ · コル · ユッ · モ！ユッを投げて、4つのコマを先に一周させてゴールさせたら勝ち。角に止まれば近道、自分のコマは重ねて進み、相手を捕まえたらもう一回！",zh:"道 · 介 · 杰 · 尤 · 模！掷尤棍，先让4枚棋子绕一圈出局就赢。停在角上走近路，自己的棋子能叠着走，吃掉对手还能再掷一次！"},"도!":{en:"Do!",ja:"ト！",zh:"道！"},"동 나감!":{en:" home!",ja:"つゴール！",zh:"枚出局！"},"두 번 때려야 해요":{en:"Takes two hits",ja:"2回叩く必要あり",zh:"要打两次"},"두더지":{en:"Mole",ja:"モグラ",zh:"地鼠"},"두더지 누르기":{en:"Tap a mole",ja:"モグラをタップ",zh:"点击地鼠"},"두더지 팡팡":{en:"Mole Bonk",ja:"モグラたたき",zh:"打地鼠"},"두더지를 팡! 고슴도치는 조심!":{en:"Bonk the moles! Watch out for hedgehogs!",ja:"モグラをポン！ハリネズミに注意！",zh:"砸地鼠！小心刺猬！"},"뒷모":{en:"Dwit-mo",ja:"ティンモ",zh:"后模"},"땅!":{en:"Clang!",ja:"カーン！",zh:"铛！"},"때리면 -30점 · 콤보 끊김":{en:"Hit it: -30 pts · Combo breaks",ja:"叩くと-30点 · コンボ途切れ",zh:"打到-30分 · 连击中断"},"마우스":{en:"Mouse",ja:"マウス",zh:"鼠标"},"말 수":{en:"Pieces",ja:"コマの数",zh:"棋子数"},"말 옮기기":{en:"Move a piece",ja:"コマを動かす",zh:"移动棋子"},"말판을 눌러도 던져져요":{en:"You can also tap the board to throw",ja:"盤をタップしても投げられます",zh:"点击棋盘也能掷"},"모":{en:"Mo",ja:"モ",zh:"模"},"모! 한 번 더 던져요":{en:"Mo! Throw again",ja:"モ！もう一回投げよう",zh:"模！再掷一次"},"모!!":{en:"Mo!!",ja:"モ！！",zh:"模！！"},"모서리(모 · 뒷모)나 가운데 방에 딱 멈추면 다음엔 지름길 대각선으로 가요.":{en:"Stop exactly on a corner (Mo · Dwit-mo) or the center (Bang) and your next move takes the diagonal shortcut.",ja:"角（モ · ティンモ）か真ん中のパンにぴったり止まると、次は近道の斜めを進みます。",zh:"正好停在角上（模 · 后模）或中央的房，下次就走斜线近路。"},"모서리나 가운데 방에 딱 멈추면 지름길로 가요":{en:"Stop exactly on a corner or the center to take a shortcut",ja:"角か真ん中にぴったり止まると近道へ",zh:"正好停在角上或中央就走近路"},"모서리에 멈추면 지름길! 걸·윷으로 모서리를 노려 보세요.":{en:"Stopping on a corner means a shortcut! Aim for corners with Geol or Yut.",ja:"角に止まれば近道！コル・ユッで角を狙ってみよう。",zh:"停在角上就能走近路！用杰·尤瞄准角落吧。"},"반사신경 · 60초":{en:"Reflexes · 60 sec",ja:"反射神経 · 60秒",zh:"反应力 · 60秒"},"반짝이는 말 누르기":{en:"Tap a glowing piece",ja:"光っているコマをタップ",zh:"点击发光的棋子"},"반짝이는 말을 누르세요":{en:"Tap a glowing piece",ja:"光っているコマをタップしてね",zh:"请点击发光的棋子"},"방! 지름길":{en:"Center! Shortcut",ja:"真ん中！近道",zh:"中央！近路"},"배 (평평한 면)":{en:"Flat side",ja:"平らな面",zh:"平面"},"빽도":{en:"Back-do",ja:"バックト",zh:"后道"},"빽도 없음":{en:"No Back-do",ja:"バックトなし",zh:"无后道"},"빽도 있음":{en:"With Back-do",ja:"バックトあり",zh:"有后道"},"빽도 표시":{en:"Back-do mark",ja:"バックトの印",zh:"后道标记"},"빽도!":{en:"Back-do!",ja:"バックト！",zh:"后道！"},"빽도: 빨간 점 표시가 있는 윷 하나만 엎어지면 뒤로 한 칸. 참먹이를 지나야 나가요.":{en:"Back-do: if only the stick with the red dot lands flat side up, move back one space. A piece must pass the start corner to go home.",ja:"バックト：赤い点の印があるユッだけが平らな面を上にしたら1マス戻ります。スタート地点を通り過ぎるとゴール。",zh:"后道：只有带红点标记的那根尤棍平面朝上时，后退一格。棋子要越过起点才能出局。"},"뿅망치로 두더지 팡! 황금 두더지는 대박, 고슴도치는 조심. 60초 동안 몇 마리?":{en:"Bonk moles with a squeaky hammer! Golden moles score big, watch out for hedgehogs. How many in 60 seconds?",ja:"ピコピコハンマーでモグラをポン！金のモグラは大当たり、ハリネズミに注意。60秒で何匹？",zh:"用玩具锤砸地鼠！金地鼠是大奖，小心刺猬。60秒能打几只？"},"뿅망치로 팡":{en:"Bonk with the hammer",ja:"ハンマーでポン",zh:"用锤子砸"},"상대 말 바로 뒤 1~3칸은 잡히기 쉬워요. 개 · 걸이 가장 잘 나와요.":{en:"1–3 spaces right in front of an opponent is easy to capture. Gae and Geol come up most often.",ja:"相手のコマのすぐ先1〜3マスは捕まりやすいです。ケ · コルが一番よく出ます。",zh:"对手棋子前方1~3格最容易被吃。介 · 杰出现得最多。"},"상대가 생각하는 중···":{en:"Opponent is thinking···",ja:"相手が考え中···",zh:"对手思考中···"},"새 말 출발":{en:"Start a new piece",ja:"新しいコマを出す",zh:"派出新棋子"},"수 · 잡은 말":{en:" moves · Captures",ja:" 手 · 捕まえたコマ",zh:" 步 · 吃子"},"시계 두더지":{en:"Clock mole",ja:"時計モグラ",zh:"时钟地鼠"},"쓸 결과 고르기":{en:"Pick the result to use",ja:"使う結果を選ぶ",zh:"选择要用的结果"},"업었다!":{en:"Stacked!",ja:"重ねた！",zh:"叠上了！"},"업으면 빠르지만 한꺼번에 잡힐 수도 있어요.":{en:"Stacking is fast, but they can all be captured at once.",ja:"重ねると速いけど、まとめて捕まることも。",zh:"叠着走很快，但也可能被一起吃掉。"},"없음":{en:"Off",ja:"なし",zh:"无"},"여기 눌러 새 말 출발":{en:"Tap here to start a new piece",ja:"ここをタップで新しいコマ",zh:"点这里派出新棋子"},"연속으로 잡으면 콤보 · 콤보 15면 피버 타임(점수 2배)":{en:"Consecutive hits build a combo · Combo 15 = Fever Time (2× points)",ja:"連続で叩くとコンボ · コンボ15でフィーバータイム（得点2倍）",zh:"连续打中形成连击 · 连击15进入狂热时间（分数×2）"},"연속으로 잡으면 콤보가 쌓이고 점수가 최대 2배까지 올라요. 놓치거나 헛치면 콤보가 끊겨요.":{en:"Consecutive hits build a combo, raising points up to 2×. Missing a mole or swinging at nothing breaks the combo.",ja:"連続で叩くとコンボがたまり、得点が最大2倍に。逃したり空振りするとコンボが途切れます。",zh:"连续打中会累积连击，分数最高翻倍。漏掉或打空会中断连击。"},"움직일 말이 없어 차례가 넘어가요":{en:"No piece can move, so the turn passes",ja:"動かせるコマがないので番が移ります",zh:"没有可移动的棋子，轮到对方"},"움직일 수 없는 결과는 넘어가요":{en:"Results that can't be used are skipped",ja:"使えない結果は飛ばします",zh:"无法使用的结果会被跳过"},"윷":{en:"Yut",ja:"ユッ",zh:"尤"},"윷 · 모가 나오거나 상대 말을 잡으면 한 번 더 던져요":{en:"Throw again on Yut · Mo or when you capture",ja:"ユッ · モが出るか、相手のコマを捕まえたらもう一回",zh:"掷出尤 · 模或吃掉对手棋子就再掷一次"},"윷 던져 도 · 개 · 걸 · 윷 · 모! 지름길 · 업기 · 잡기까지 정식 규칙 그대로. CPU랑, 친구랑 한 판":{en:"Throw for Do · Gae · Geol · Yut · Mo! Shortcuts, stacking and capturing—the full traditional rules. Play the CPU or a friend",ja:"ユッを投げてト · ケ · コル · ユッ · モ！近道 · 重ね · 捕獲まで正式ルールそのまま。CPUとも友だちとも",zh:"掷尤棍得道 · 介 · 杰 · 尤 · 模！近路 · 叠子 · 吃子全按传统规则。和CPU或朋友来一局"},"윷 던지기":{en:"Throw!",ja:"ユッを投げる",zh:"掷尤棍"},"윷 던지기 누르기":{en:"Tap Throw",ja:"投げるボタンをタップ",zh:"点击掷尤棍"},"윷 던지기 버튼을 눌러 윷을 던져요":{en:"Tap the Throw button to throw the sticks",ja:"投げるボタンでユッを投げます",zh:"点击掷尤棍按钮来掷"},"윷! 한 번 더 던져요":{en:"Yut! Throw again",ja:"ユッ！もう一回投げよう",zh:"尤！再掷一次"},"윷!!":{en:"Yut!!",ja:"ユッ！！",zh:"尤！！"},"윷가락 4개 중 평평한 면(배)이 1개면 도(1칸) · 2개 개(2칸) · 3개 걸(3칸) · 4개 윷(4칸) · 하나도 없으면 모(5칸).":{en:"Of the 4 sticks: 1 flat side up = Do (1) · 2 = Gae (2) · 3 = Geol (3) · 4 = Yut (4) · none = Mo (5).",ja:"4本のユッのうち平らな面が1本ならト（1マス）· 2本ケ（2マス）· 3本コル（3マス）· 4本ユッ（4マス）· 0本ならモ（5マス）。",zh:"4根尤棍中平面朝上1根为道（1格）· 2根介（2格）· 3根杰（3格）· 4根尤（4格）· 一根都没有为模（5格）。"},"윷놀이":{en:"Yut Nori",ja:"ユンノリ",zh:"尤茨游戏"},"윷을 던져 내 말을 모두 먼저 한 바퀴 돌려 참먹이 밖으로 내보내면 승리.":{en:"Throw the sticks and be the first to bring all your pieces around the board and out past the start corner.",ja:"ユッを投げて、自分のコマを全部先に一周させてスタート地点の外へ出したら勝ち。",zh:"掷尤棍，先让自己所有棋子绕一圈并越过起点出局就赢。"},"윷이나 모가 나오면 한 번 더 던져요. 나온 결과를 모아 원하는 순서대로 써요.":{en:"Yut or Mo lets you throw again. Collect your results and use them in any order.",ja:"ユッかモが出たらもう一回。出た結果をためて好きな順番で使えます。",zh:"掷出尤或模就再掷一次。把结果攒起来，按想要的顺序使用。"},"이것만 엎어지면 뒤로":{en:"Only this one flat = back",ja:"これだけ表なら後ろへ",zh:"只有它平面朝上就后退"},"있음 · 표시한 윷 하나만 엎어지면 뒤로 한 칸":{en:"On · If only the marked stick lands flat, move back one",ja:"あり · 印のユッだけが表なら1マス戻る",zh:"开启 · 只有带标记的尤棍平面朝上时后退一格"},"잡았다! 한 번 더":{en:"Captured! Throw again",ja:"捕まえた！もう一回",zh:"吃掉了！再掷一次"},"잡은 수":{en:"Caught",ja:"叩いた数",zh:"打中数"},"전통 놀이":{en:"Traditional game",ja:"伝統あそび",zh:"传统游戏"},"전통 놀이 · 1P/2P":{en:"Traditional · 1P/2P",ja:"伝統あそび · 1P/2P",zh:"传统游戏 · 1P/2P"},"지름길!":{en:"Shortcut!",ja:"近道！",zh:"近路！"},"찌모":{en:"Jji-mo",ja:"チモ",zh:"底模"},"참먹이 · 출발":{en:"Start · Home",ja:"スタート · ゴール",zh:"起点 · 终点"},"칸":{en:" sp",ja:" マス",zh:" 格"},"콤보 15마다 6초 동안 피버 타임 — 점수 2배, 두더지가 더 자주 나와요.":{en:"Every 15-hit combo triggers 6 seconds of Fever Time — 2× points and moles pop up more often.",ja:"コンボ15ごとに6秒間のフィーバータイム — 得点2倍、モグラがもっと出てきます。",zh:"每15连击触发6秒狂热时间 — 分数×2，地鼠出现得更频繁。"},"콤보를 길게 이어 피버를 자주 켜는 게 고득점의 비결이에요.":{en:"The secret to a high score is keeping long combos to trigger Fever often.",ja:"コンボを長くつないでフィーバーを何度も出すのが高得点のコツ。",zh:"保持长连击、频繁触发狂热是高分的秘诀。"},"클릭해서 때리기":{en:"Click to bonk",ja:"クリックで叩く",zh:"点击敲打"},"튀어나온 두더지를 눌러 잡아요":{en:"Tap the moles that pop out",ja:"飛び出したモグラをタップして叩こう",zh:"点击冒出来的地鼠"},"한 동 나감!":{en:"One piece home!",ja:"1つゴール！",zh:"一枚出局！"},"해 말":{en:"Sun pieces",ja:"太陽のコマ",zh:"太阳棋子"},"헬멧 두더지":{en:"Helmet mole",ja:"ヘルメットモグラ",zh:"头盔地鼠"},"황금 두더지":{en:"Golden mole",ja:"金のモグラ",zh:"金地鼠"},"황금 두더지 +50 · 헬멧 두더지는 두 번 때리기":{en:"Golden mole +50 · Helmet mole takes two hits",ja:"金のモグラ+50 · ヘルメットモグラは2回叩く",zh:"金地鼠+50 · 头盔地鼠要打两次"},"황금 두더지는 금방 숨으니 보이면 먼저 잡으세요.":{en:"Golden moles hide fast, so hit them first when you see one.",ja:"金のモグラはすぐ隠れるので、見えたら最優先で叩こう。",zh:"金地鼠很快就躲起来，看到就先打。"},"🎲 윷놀이 — 모 나오면 한 번 더! 친구랑 한 판?":{en:"🎲 Yut Nori — Roll a Mo and go again! Play a friend?",ja:"🎲 ユンノリ — モが出たらもう一回！友だちと一局？",zh:"🎲 尤茨游戏 — 掷出模再来一次！和朋友来一局？"},"🔨 두더지 팡팡 — 60초 동안 몇 마리 잡을 수 있을까?":{en:"🔨 Mole Bonk — How many can you bonk in 60 seconds?",ja:"🔨 モグラたたき — 60秒で何匹叩ける？",zh:"🔨 打地鼠 — 60秒能打几只？"},"2000점 · 잠깐 붙잡았다 쏴 줘요":{en:"2000 pts · Holds the ball, then fires it out",ja:"2000点 · 少し捕まえてから打ち出す",zh:"2000分 · 先吸住再弹出"},"3개 모두 → 멀티볼":{en:"All 3 → Multiball",ja:"3つ全部 → マルチボール",zh:"全部3个 → 多球"},"· 멀티볼":{en:"· Multiball",ja:"· マルチボール",zh:"· 多球"},"공 지킴이!":{en:"Ball saved!",ja:"ボールセーブ！",zh:"护球！"},"공을 떨어뜨리지 않고 오래 살려 범퍼 · 과녁 · 구멍을 맞혀 최고 점수를 노리세요.":{en:"Keep the ball in play and hit bumpers, targets and the hole for a high score.",ja:"ボールを落とさずに粘って、バンパー · ターゲット · 穴を狙ってハイスコアを目指そう。",zh:"别让球掉下去，击中弹射柱 · 靶子 · 球洞，冲击最高分。"},"구멍":{en:"Hole",ja:"穴",zh:"球洞"},"구멍 쏙! +2000":{en:"In the hole! +2000",ja:"穴にイン！+2000",zh:"进洞！+2000"},"금색 칸에서 떼면 명중 · 너무 약하거나 세면 낙!":{en:"Release in the gold zone for a perfect throw · Too weak or too strong = out!",ja:"金色で離すと命中 · 弱すぎ・強すぎは場外！",zh:"在金色区松手即完美 · 太轻或太重会出界！"},"꾹 눌러 발사":{en:"Hold to launch",ja:"長押しで発射",zh:"按住发射"},"꾹 눌렀다 떼서 던지기":{en:"Hold, then release to throw",ja:"長押しして離して投げる",zh:"按住再松开来掷"},"낙! 멍석 밖으로 나갔어요":{en:"Out! The sticks left the mat",ja:"場外！ござの外に出ました",zh:"出界！尤棍掉出垫子了"},"너무 세요!":{en:"Too strong!",ja:"強すぎ！",zh:"太重了！"},"너무 약해요":{en:"Too weak",ja:"弱すぎ",zh:"太轻了"},"넓어진 별빛 놀이공원 테이블! 플리퍼 3개로 공을 지키며 범퍼 · 과녁 · 구멍을 노리세요. 위쪽 별 3개를 모두 켜면 공 두 개가 동시에 도는 멀티볼, 과녁 4개를 모두 넘기면 점수 배수 UP. 공은 3개.":{en:"A wider Starlight Park table! Defend with 3 flippers and aim for bumpers, targets and the hole. Light all 3 top stars for Multiball with two balls at once, and knock down all 4 targets to raise your multiplier. 3 balls.",ja:"広くなった星空遊園地テーブル！3つのフリッパーでボールを守り、バンパー · ターゲット · 穴を狙おう。上の星3つを全部点灯すると2球同時のマルチボール、ターゲット4つを全部倒すと倍率UP。ボールは3個。",zh:"更宽的星光乐园球台！用3个挡板守住球，瞄准弹射柱 · 靶子 · 球洞。点亮上方全部3颗星开启双球同时滚动的多球模式，击倒全部4个靶子提升倍数。共3个球。"},"멀티볼 ×2 ·":{en:"Multiball ×2 ·",ja:"マルチボール ×2 ·",zh:"多球 ×2 ·"},"멀티볼 끝":{en:"Multiball over",ja:"マルチボール終了",zh:"多球结束"},"멀티볼 땐 아래로 더 가까운 공부터 막으세요.":{en:"During Multiball, save the ball closest to the bottom first.",ja:"マルチボール中は下に近いボールから守ろう。",zh:"多球时先挡离底部更近的球。"},"멀티볼! 공 두 개를 지켜라":{en:"Multiball! Keep both balls alive",ja:"マルチボール！2球を守れ",zh:"多球！守住两个球"},"명중 던지기!":{en:"Perfect throw!",ja:"命中投げ！",zh:"完美一掷！"},"범퍼 100점 · 슬링샷 50점 · 과녁 500점 · 위쪽 별 300점 · 오른쪽 위 구멍 2000점. 점수에 배수가 곱해져요.":{en:"Bumper 100 · Slingshot 50 · Drop target 500 · Top star 300 · Upper-right hole 2000. Points are multiplied by your multiplier.",ja:"バンパー100点 · スリングショット50点 · ターゲット500点 · 上の星300点 · 右上の穴2000点。得点には倍率がかかります。",zh:"弹射柱100分 · 弹弓50分 · 靶子500分 · 上方星星300分 · 右上球洞2000分。得分会乘以倍数。"},"별 3개 → 멀티볼":{en:"3 stars → Multiball",ja:"星3つ → マルチボール",zh:"3颗星 → 多球"},"상대가 힘을 모으는 중…":{en:"Opponent is winding up…",ja:"相手が力をためています…",zh:"对手正在蓄力…"},"오른쪽 과녁 4개를 모두 쓰러뜨리면 +5000과 배수 UP (최대 ×9).":{en:"Knock down all 4 right-side targets for +5000 and a multiplier UP (max ×9).",ja:"右のターゲット4つを全部倒すと+5000と倍率UP（最大×9）。",zh:"击倒右侧全部4个靶子可得+5000并提升倍数（最高×9）。"},"위쪽 별 3개 켜기 → 멀티볼! · 과녁 4개 → 배수 UP · 오른쪽 위 구멍 +2000":{en:"Light 3 top stars → Multiball! · 4 targets → Multiplier UP · Upper-right hole +2000",ja:"上の星3つ点灯 → マルチボール！· ターゲット4つ → 倍率UP · 右上の穴 +2000",zh:"点亮上方3颗星 → 多球！· 4个靶子 → 倍数UP · 右上球洞 +2000"},"위쪽 별 3개를 모두 켜면 멀티볼! 공 두 개가 동시에 돌고 그동안 점수 2배.":{en:"Light all 3 top stars for Multiball! Two balls in play at once, with double points meanwhile.",ja:"上の星3つを全部点灯するとマルチボール！2球が同時に動き、その間は得点2倍。",zh:"点亮上方全部3颗星开启多球！两个球同时滚动，期间分数翻倍。"},"지금! 떼세요":{en:"Now! Let go",ja:"今！離して",zh:"就是现在！松手"},"화면 왼쪽을 누르면 왼쪽 플리퍼 2개(아래 · 왼쪽 벽 보조), 오른쪽을 누르면 오른쪽 플리퍼가 올라가요.":{en:"Tap the left side to raise both left flippers (bottom and the helper on the left wall), and the right side for the right flipper.",ja:"画面の左を押すと左のフリッパー2つ（下 · 左壁の補助）、右を押すと右のフリッパーが上がります。",zh:"按屏幕左侧抬起左边2个挡板（下方 · 左墙辅助），按右侧抬起右挡板。"},"화면 왼쪽을 누르면 왼쪽 플리퍼 2개, 오른쪽을 누르면 오른쪽 플리퍼 (← → 또는 Z · /)":{en:"Left side = both left flippers, right side = right flipper (← → or Z · /)",ja:"画面の左で左フリッパー2つ、右で右フリッパー（← → または Z · /）",zh:"按左侧操控左边2个挡板，右侧操控右挡板（← → 或 Z · /）"},"힘 모으는 중…":{en:"Charging…",ja:"力をためています…",zh:"蓄力中…"},"▲(위 방향)로 점프하고, 공중에서 스매시! 몸이 어느 쪽을 보든 강타는 항상 상대 코트로 날아가고, 누르고 있는 방향에 따라 궤적이 바뀝니다.":{en:"Jump with ▲ (up), then smash in midair! Whichever way you're facing, the smash always flies into the opponent's court, and the direction you hold changes its path.",ja:"▲（上）でジャンプして、空中でスマッシュ！どちらを向いていてもスマッシュは必ず相手コートへ飛び、押している方向で軌道が変わります。",zh:"按▲（上）跳起，在空中扣球！无论面朝哪边，扣球都一定飞向对方场地，按住的方向会改变轨迹。"},"나이스 디그!":{en:"Nice dig!",ja:"ナイスレシーブ！",zh:"漂亮救球！"},"높이 휘어 뒤쪽에 떨어지는 공":{en:"High arc that drops deep",ja:"高く弧を描いて奥に落ちる",zh:"高弧线落到后场"},"땅에서 방향키와 스매시를 함께 누르면 그쪽으로 몸을 날려(다이빙) 먼 공을 높이 받아 올립니다. 착지 후 잠깐 누워 있어요.":{en:"On the ground, press a direction and Smash together to dive that way and pop far balls high into the air. You lie down briefly after landing.",ja:"地上で方向キーとスマッシュを同時に押すと、その方向へ飛び込んで（ダイビング）遠い球を高く上げます。着地後は少し寝転がります。",zh:"在地面上同时按方向键和扣球，就会朝该方向飞身扑救（鱼跃），把远处的球高高垫起。落地后会躺一小会儿。"},"상대가 네트 앞에 붙어 있으면 앞 + 스매시로 뒤쪽 끝까지 길게 보내세요.":{en:"If your opponent is hugging the net, use Forward + Smash to send it deep to the back.",ja:"相手がネット前にいるときは、前 + スマッシュで奥まで長く送ろう。",zh:"对手贴近球网时，用前 + 扣球把球打到后场底线。"},"코트 끝까지 쭉 뻗는 직선 강타":{en:"Straight power shot to the back line",ja:"コートの奥までまっすぐ伸びる強打",zh:"直线强攻打到底线"},"툭 · 멀리 못 가는 짧은 공":{en:"Tap · A short ball that doesn't go far",ja:"トン · 遠くまで行かない短い球",zh:"轻推 · 飞不远的短球"},"툭!":{en:"Tap!",ja:"トン！",zh:"轻推！"},"5 · 10 · 15… 스테이지는 보스전: 거대한 외계 모선이 부채꼴 탄막을 뿌리고 작은 돌격병을 내보내요. 체력이 40% 아래로 떨어지면 더 거칠어져요.":{en:"Stages 5 · 10 · 15… are boss battles: a giant alien mothership sprays fan-shaped bullet barrages and sends out small raiders. Below 40% HP it gets even fiercer.",ja:"5 · 10 · 15…ステージはボス戦：巨大なエイリアン母船が扇状の弾幕をばらまき、小さな突撃兵を送り出します。体力が40%を切るとさらに激しくなります。",zh:"第5 · 10 · 15…关是首领战：巨大的外星母舰会喷射扇形弹幕并放出小型突击兵。体力低于40%时会更加凶猛。"},"가장 가까운 적을 쫓아가는 미사일을 자동 발사":{en:"Auto-fires missiles that chase the nearest enemy",ja:"一番近い敵を追いかけるミサイルを自動発射",zh:"自动发射追踪最近敌人的导弹"},"돌 딱정벌레 (6판부터)":{en:"Stone Beetle (from stage 6)",ja:"石カブトムシ（6面から）",zh:"石甲虫（第6关起）"},"떨어지는 캡슐이 전투기로 끌려와요":{en:"Falling capsules are pulled toward your fighter",ja:"落ちてくるカプセルが戦闘機に引き寄せられます",zh:"掉落的胶囊会被吸向战机"},"맞힐 때 확률로 터져 주변 적까지 함께":{en:"Hits may explode and take out nearby enemies too",ja:"命中時に確率で爆発し、周りの敵も巻き込みます",zh:"命中时有几率爆炸，连周围敌人一起消灭"},"몇 초마다 위로 레이저를 쏴 한 줄을 모두 태워요":{en:"Every few seconds, fires a laser upward that burns a whole column",ja:"数秒ごとに上へレーザーを撃ち、縦一列をまとめて焼き払います",zh:"每隔几秒向上发射激光，烧毁整列敌人"},"몇 초마다 파동이 적 탄을 지우고 가까운 적을 부숴요":{en:"Every few seconds, a pulse wipes enemy bullets and destroys nearby enemies",ja:"数秒ごとに波動が敵弾を消し、近くの敵を破壊します",zh:"每隔几秒释放冲击波，清除敌弹并摧毁附近敌人"},"모든 강화를 다 모았어요! 점수 보너스":{en:"You've collected every upgrade! Score bonus",ja:"すべての強化を集めました！スコアボーナス",zh:"所有强化都已集齐！分数奖励"},"모선 격추! +":{en:"Mothership down! +",ja:"母船撃墜！+",zh:"击落母舰！+"},"번개 레이저":{en:"Lightning Laser",ja:"いなずまレーザー",zh:"闪电激光"},"별가루 보너스":{en:"Stardust Bonus",ja:"星くずボーナス",zh:"星尘奖励"},"보스전엔 번개 레이저 · 유도 미사일이 특히 강해요. 부채꼴 탄막은 탄 사이 빈틈으로 빠져나가세요.":{en:"Lightning Laser and Homing Missiles are especially strong in boss battles. Slip through the gaps in the fan-shaped barrage.",ja:"ボス戦ではいなずまレーザー · 誘導ミサイルが特に強力。扇状の弾幕は弾の隙間をすり抜けよう。",zh:"首领战中闪电激光 · 追踪导弹特别强。扇形弹幕要从子弹间的空隙穿过去。"},"분열 해파리 (8판부터)":{en:"Splitting Jelly (from stage 8)",ja:"分裂クラゲ（8面から）",zh:"分裂水母（第8关起）"},"비스듬히 퍼지는 탄이 함께 나가요 (Lv2: 5갈래)":{en:"Fires extra shots that spread diagonally (Lv2: 5-way)",ja:"斜めに広がる弾も一緒に発射（Lv2: 5方向）",zh:"同时发射斜向扩散的子弹（Lv2：5路）"},"세 번 맞혀야 · 400":{en:"Takes 3 hits · 400",ja:"3回当てる必要あり · 400",zh:"需命中3次 · 400"},"스테이지를 깰 때마다 강화 카드 1장: 탄창 · 연사 · 관통 · 확산 포 · 유도 미사일 · 번개 레이저 · 호위 드론 · 전자기 파동 · 폭발탄 · 캡슐 자석 등 14가지. 모두 모으면 점수 보너스 카드가 나와요.":{en:"Each cleared stage gives 1 upgrade card: Magazine · Rapid Fire · Piercing · Spread Cannon · Homing Missile · Lightning Laser · Escort Drone · EM Pulse · Explosive Rounds · Capsule Magnet and more — 14 in all. Collect them all and a score bonus card appears.",ja:"ステージをクリアするたびに強化カード1枚：弾倉 · 連射 · 貫通 · 拡散砲 · 誘導ミサイル · いなずまレーザー · 護衛ドローン · 電磁波動 · 爆裂弾 · カプセル磁石など全14種。全部集めるとスコアボーナスカードが出ます。",zh:"每通关一关获得1张强化卡：弹匣 · 连射 · 穿透 · 扩散炮 · 追踪导弹 · 闪电激光 · 护卫无人机 · 电磁脉冲 · 爆裂弹 · 胶囊磁铁等共14种。全部集齐后会出现分数奖励卡。"},"외계 모선":{en:"Alien Mothership",ja:"エイリアン母船",zh:"外星母舰"},"외계 모선 보스 (5판마다)":{en:"Alien Mothership Boss (every 5 stages)",ja:"エイリアン母船ボス（5面ごと）",zh:"外星母舰首领（每5关）"},"유도 미사일":{en:"Homing Missile",ja:"誘導ミサイル",zh:"追踪导弹"},"잡으면 작은 돌격병 둘로 갈라짐 · 350":{en:"Splits into 2 small raiders when hit · 350",ja:"倒すと小さな突撃兵2体に分裂 · 350",zh:"击中后分裂成2个小突击兵 · 350"},"저격 외계인 (10판부터)":{en:"Sniper Alien (from stage 10)",ja:"狙撃エイリアン（10面から）",zh:"狙击外星人（第10关起）"},"전자기 파동":{en:"EM Pulse",ja:"電磁波動",zh:"电磁脉冲"},"전투기 곁을 도는 드론이 함께 쏴요":{en:"Drones orbit your fighter and shoot along with you",ja:"戦闘機のまわりを回るドローンが一緒に撃ちます",zh:"环绕战机的无人机会一起射击"},"처음 한 날":{en:"First played",ja:"初プレイ日",zh:"首次游玩"},"체력 막대 · 격추하면 큰 보너스 + 캡슐 2개":{en:"HP bar · Big bonus + 2 capsules when destroyed",ja:"体力バー · 撃墜で大ボーナス + カプセル2個",zh:"体力条 · 击落获得大奖励 + 2个胶囊"},"최근 결과":{en:"Last result",ja:"最近の結果",zh:"最近结果"},"캡슐 자석":{en:"Capsule Magnet",ja:"カプセル磁石",zh:"胶囊磁铁"},"틈새 오락실의 모든 게임 · 그림 · 소리는 한국 제작자가 직접 만들었어요. 회원가입 없이 바로 즐길 수 있고, 로그인하면 기록이 안전하게 보관돼요.":{en:"Every game, image and sound in BREAK Pocket was made by a creator in Korea. Play instantly without signing up, and log in to keep your records safe.",ja:"BREAK Pocketのすべてのゲーム · 絵 · 音は韓国の制作者が手作りしました。会員登録なしですぐ遊べて、ログインすると記録が安全に保管されます。",zh:"BREAK Pocket的所有游戏 · 画面 · 声音都由韩国制作者亲手打造。无需注册即可畅玩，登录后记录会被安全保存。"},"판":{en:" plays",ja:"回",zh:"局"},"편대에서 세 갈래 탄을 쏨 · 350":{en:"Fires 3-way shots from formation · 350",ja:"編隊から3方向に弾を撃つ · 350",zh:"在编队中发射三路子弹 · 350"},"평균":{en:"Average",ja:"平均",zh:"平均"},"플레이":{en:"Plays",ja:"プレイ",zh:"游玩"},"호위 드론":{en:"Escort Drone",ja:"護衛ドローン",zh:"护卫无人机"},"확산 포":{en:"Spread Cannon",ja:"拡散砲",zh:"扩散炮"},"🇰🇷 대한민국에서 기획하고 만든 게임입니다":{en:"🇰🇷 Designed and made in Korea",ja:"🇰🇷 韓国で企画・制作したゲームです",zh:"🇰🇷 由韩国策划制作的游戏"},"10장 · 80단계 · ⏱ 타임 어택 · 매번 새 그림":{en:"10 chapters · 80 stages · ⏱ Time Attack · New picture every time",ja:"10章 · 80ステージ · ⏱ タイムアタック · 毎回新しい絵",zh:"10章 · 80关 · ⏱ 限时挑战 · 每次都是新图"},"⏱ 60초! 찾을 때마다 +2초 · 한 장 깨면 +8초":{en:"⏱ 60 seconds! +2s per find · +8s per picture",ja:"⏱ 60秒！見つけるたび+2秒 · 1枚クリアで+8秒",zh:"⏱ 60秒！每找到一处+2秒 · 每通关一张+8秒"},"⏱ 시간 끝!":{en:"⏱ Time's up!",ja:"⏱ タイムアップ！",zh:"⏱ 时间到！"},"⏱ 타임 어택 ·":{en:"⏱ Time Attack ·",ja:"⏱ タイムアタック ·",zh:"⏱ 限时挑战 ·"},"⏱ 타임 어택 · 끝없이!":{en:"⏱ Time Attack · Endless!",ja:"⏱ タイムアタック · 終わりなし！",zh:"⏱ 限时挑战 · 无限畅玩！"},"⏱ 타임 어택: 60초에서 시작해 한 곳 찾을 때마다 +2초, 한 장 깨면 +8초, 헛짚으면 -3초. 그림은 10가지 장면에서 끝없이 새로 나오고, 갈수록 다른 곳이 많아져요. 몇 장까지 깰 수 있을까?":{en:"⏱ Time Attack: start with 60 seconds, +2s for each difference found, +8s for each picture cleared, -3s for a wrong tap. New pictures from 10 scenes keep coming forever, with more differences as you go. How many can you clear?",ja:"⏱ タイムアタック：60秒から始まり、1か所見つけるたびに+2秒、1枚クリアで+8秒、間違えると-3秒。絵は10種類の場面から終わりなく新しく出て、進むほど違いが増えます。何枚クリアできるかな？",zh:"⏱ 限时挑战：从60秒开始，每找到一处+2秒，每通关一张+8秒，点错-3秒。10种场景的新图无限出现，越往后不同之处越多。你能通关几张？"},"권":{en:" albums",ja:"冊",zh:"本"},"그림은 단계마다 새로 그려져요. 깬 그림은 사진첩에 모이고, 한 장(8단계)을 다 깨면 사진첩 한 권 완성. 모두 10장 · 80단계.":{en:"A new picture is drawn for every stage. Cleared pictures go into your photo album, and clearing a chapter (8 stages) completes one album. 10 chapters · 80 stages in all.",ja:"絵はステージごとに新しく描かれます。クリアした絵はアルバムに集まり、1章（8ステージ）をすべてクリアするとアルバム1冊が完成。全10章 · 80ステージ。",zh:"每一关都会画出新图。通关的图会收进相册，通关一章（8关）即完成一本相册。共10章 · 80关。"},"바닷속 탐험":{en:"Undersea Adventure",ja:"海の中の探検",zh:"海底探险"},"시골 농장":{en:"Country Farm",ja:"田舎の農場",zh:"乡村农场"},"우주 여행":{en:"Space Trip",ja:"宇宙旅行",zh:"太空旅行"},"위아래 두 그림에서 서로 다른 곳을 찾아 누르세요! 그림은 매번 새로 그려져요. 놀이공원 · 바닷속 · 농장 · 우주까지 10가지 장면, 끝없이 이어지는 ⏱ 타임 어택으로 몇 장까지 깰 수 있는지 도전해 보세요.":{en:"Find and tap the differences between the top and bottom pictures! A new picture is drawn every time. 10 scenes including an amusement park, undersea, a farm and space, plus an endless ⏱ Time Attack to see how many you can clear.",ja:"上下2枚の絵の違うところを見つけてタップしよう！絵は毎回新しく描かれます。遊園地 · 海の中 · 農場 · 宇宙まで10種類の場面、終わりのない⏱タイムアタックで何枚クリアできるか挑戦しよう。",zh:"找出上下两张图的不同之处并点击！每次都会画出新图。游乐园 · 海底 · 农场 · 太空等10种场景，还有无限的⏱限时挑战，看看你能通关几张。"},"장 깼어요 · 찾은 곳":{en:" pictures cleared · Found",ja:"枚クリア · 見つけた数",zh:"张已通关 · 找到"},"장째":{en:" picture",ja:"枚目",zh:"张"},"장째 성공! +8초":{en:" cleared! +8s",ja:"枚目クリア！+8秒",zh:"张通关！+8秒"},"🏁 그만":{en:"🏁 Quit",ja:"🏁 やめる",zh:"🏁 结束"},"따뜻한 응원단장":{en:"Warm Cheerleader",ja:"温かい応援団長",z
