<style>
:root{--ink:#2A1C14;--paper:#FFF9EF;--paper2:#F4EADA;--line:#E3D3B8;--mute:#7A6A58;--gold:#F2B630;--gold2:#D9921A;--mint:#3DBE8A;--coral:#E2584A;--sky:#4A8FE0;--shadow:0 10px 30px rgba(60,35,10,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#F7F2E8;overflow:hidden;font-family:"Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
.ib{position:absolute;width:40px;height:40px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#pauseB{right:8px;top:52px}
#crateB{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:2px solid var(--ink);background:linear-gradient(#FFE58A,#F2B630);box-shadow:0 3px 0 var(--ink);font:700 13px "Noto Sans KR";color:var(--ink);cursor:pointer;animation:bob 1.6s ease-in-out infinite}
#crateB small{font-weight:500;opacity:.75}
@keyframes bob{50%{transform:translateY(-3px)}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,26,12,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#ov[hidden],[hidden]{display:none!important}
.card{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink),var(--shadow);padding:22px 20px 18px;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.wide{max-width:560px}
h1,h2,.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.2px}
.logo{text-align:center;margin:-2px 0 6px}
.logo .crest{width:64px;height:64px;margin:0 auto 4px;display:block}
.logo small{display:block;font:700 11px "Chakra Petch",sans-serif;letter-spacing:4px;color:var(--gold2)}
.logo h1{font-size:40px;line-height:1.05;color:var(--ink);text-shadow:0 3px 0 #F2D27A}
.logo h1 span{display:block;font-size:22px;color:var(--gold2);text-shadow:none;margin-top:2px}
.tag{text-align:center;color:var(--mute);font-size:14px;line-height:1.55;margin:4px 6px 14px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;font:700 16px "Noto Sans KR";color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn small{font-weight:500;font-size:12px;opacity:.75;margin-top:1px}
.btn.pri{background:linear-gradient(#FFD45E,#F2B630);font:400 24px "Black Han Sans","Noto Sans KR";padding:14px}
.btn.pri small{font:500 12px "Noto Sans KR"}
.btn.go{background:linear-gradient(#6FD89F,#3DBE8A)}
.btn.ad{background:linear-gradient(#9CC8FF,#5A9CF0)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--mute);font-weight:500;font-size:14px;padding:8px}
.stack{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;font-size:14px}
.mini svg{flex:none}
.badge{display:inline-flex;align-items:center;gap:3px;background:var(--ink);color:#FFE58A;border-radius:999px;padding:1px 8px 1px 6px;font:700 12px "Chakra Petch","Noto Sans KR"}
.sect{font:700 12px "Noto Sans KR";color:var(--gold2);letter-spacing:1px;margin:16px 2px 8px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:8px 6px 9px;text-align:center}
.step svg{width:100%;height:auto;display:block;border-radius:10px;background:#DFF1FF}
.step b{display:block;font-size:13px;margin:6px 0 2px}
.step p{font-size:11.5px;line-height:1.45;color:var(--mute)}
.step .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#FFE58A;font:700 11px "Chakra Petch";margin-right:3px;vertical-align:1px}
.counter{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink)}
.chip b{color:var(--coral)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:8px 2px;font:700 13px "Chakra Petch","Noto Sans KR";color:var(--mute);cursor:pointer;position:relative}
.seg button.on{background:var(--ink);color:#FFE58A}
.seg button i{position:absolute;top:1px;right:4px;font-style:normal;font-size:10px;color:var(--mint)}
.seghint{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 12px}
.foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 12px "Noto Sans KR";color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill.on{border-color:var(--ink)}
.stat{font:600 12px "Noto Sans KR";color:var(--mute)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd h2{font-size:26px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);background:#fff;border-radius:16px;margin-bottom:8px}
.up .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.up b{font-size:14px}
.up p{font-size:12px;color:var(--mute);line-height:1.4}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--gold)}
.buy{border:2px solid var(--ink);border-radius:12px;background:linear-gradient(#FFD45E,#F2B630);box-shadow:0 3px 0 var(--ink);padding:7px 10px;font:700 13px "Chakra Petch","Noto Sans KR";cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.buy[disabled]{background:var(--paper2);color:var(--mute);box-shadow:none;border-color:var(--line);cursor:default}
.mis{padding:12px;border:2px solid var(--line);background:#fff;border-radius:16px;margin-bottom:8px}
.mis.done{border-color:var(--mint);background:#F1FBF5}
.mis .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--paper2);margin-top:8px;overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD45E,#F2B630)}
.mis.done .bar i{background:var(--mint)}
.mis small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.big{font:400 64px "Black Han Sans";text-align:center;line-height:1;color:var(--ink);text-shadow:0 4px 0 #F2D27A}
.big small{display:block;font:700 13px "Noto Sans KR";color:var(--mute);text-shadow:none;margin-top:6px}
.note{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 12px}
.earn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#FFE58A;border-radius:18px;padding:12px;font:400 26px "Black Han Sans";margin-bottom:6px}
.earn small{font:500 12px "Noto Sans KR";color:#E8D9B8}
.newb{display:block;width:max-content;margin:0 auto 8px;background:var(--coral);color:#fff;border-radius:999px;padding:3px 12px;font:700 12px "Noto Sans KR"}
.opt{text-align:left;align-items:flex-start;margin-bottom:10px}
.lead{font-size:13px;color:var(--mute);text-align:center;margin:-4px 0 14px;line-height:1.5}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-160%);opacity:0;background:var(--ink);color:#FFE58A;border-radius:999px;padding:9px 16px;font:700 13px "Noto Sans KR";transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap;z-index:9}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#adSim{position:absolute;inset:0;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;font:500 14px "Noto Sans KR";text-align:center;padding:24px}
#adSim b{font:400 30px "Black Han Sans";color:#fff}
@media (max-width:480px){.card{padding:18px 16px 16px}.logo .crest{width:50px;height:50px}.logo h1{font-size:34px}.logo h1 span{font-size:19px}.tag{font-size:13.5px;margin-bottom:12px}
 .how{grid-template-columns:1fr;gap:7px}.step{display:grid;grid-template-columns:104px 1fr;gap:12px;text-align:left;align-items:center;padding:7px 10px 7px 7px}.step b{margin:0 0 3px;font-size:14px}.step p{font-size:12.5px}}
.tag em{display:block;font-style:normal;font-size:12.5px;color:var(--gold2);font-weight:700;margin-top:4px}
.sticky{position:sticky;bottom:-18px;margin:0 -6px -18px;padding:12px 6px 18px;background:linear-gradient(rgba(255,249,239,0),var(--paper) 22%)}
.seg button{white-space:nowrap}
@media (max-width:400px){.seg button{font-size:11.5px}}
.mini{flex-direction:row;white-space:nowrap}
@media (max-width:400px){.mini{font-size:13px;gap:6px;padding:10px 6px}}
.cR,.cL{display:contents}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.tile{background:var(--paper2);border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}.tile b{display:block;font:700 20px 'Chakra Petch','Noto Sans KR'}.tile span{font-size:11px;color:var(--mute)}
@media (min-width:760px) and (min-height:520px){.card.tl{max-width:820px;display:grid;grid-template-columns:1.1fr 1fr;gap:6px 26px;padding:24px 26px 20px}
 .tl .cL{display:block;grid-column:1;grid-row:1/4}.tl .cR{grid-column:2;display:flex;flex-direction:column;justify-content:center}
 .tl .how{grid-template-columns:1fr;gap:8px}.tl .step{display:grid;grid-template-columns:118px 1fr;gap:12px;text-align:left;align-items:center;padding:7px 12px 7px 7px}.tl .step b{margin:0 0 3px;font-size:15px}.tl .step p{font-size:12.5px}
 .tl .sticky{position:static;margin:0;padding:0;background:none}.tl .sect{margin-top:4px}}
.vch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}.vch button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-width:0}.vch button.on{border-color:var(--ink);background:#FFF3C4}.vch i{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink)}.vch span{display:grid;min-width:0}.vch b{font-size:12.5px;line-height:1.2}.vch small{font-size:10.5px;color:var(--mute);line-height:1.25}
.fld{display:grid;gap:4px;font:700 12px "Noto Sans KR";color:var(--mute)}.fld input{font:500 15px "Noto Sans KR";padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}.fld input:focus{outline:none;border-color:var(--ink)}
.drk{display:grid;gap:8px;margin:6px 0}.drk div{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px}.drk div.win{border-color:var(--gold);background:#FFF3C4}.drk i{font:700 14px "Chakra Petch";font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper2)}.drk div.win i{background:var(--gold)}.drk b{font-size:15px;min-width:0;overflow-wrap:anywhere}.drk span{font:700 17px "Chakra Petch"}
.legal{font-size:10.5px;color:#A8977F;text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>

  <button id="crateB" hidden></button>
  <div id="ov" hidden></div>

  <div id="adSim" hidden></div>
</div>
<script>
(function(){
"use strict";

const P={night:'#121A2E',panel:'#1B2540',panel2:'#243052',line:'#2F3B61',ink:'#F3F1EA',mute:'#9AA6C8',coral:'#FF6B5A',sun:'#FFC940',mint:'#3DD6B0',sky:'#5AA9FF',grape:'#A98BFF',orange:'#FF9F4A'};

             set(k,v){if(DEMO)return;try{(this.be||localStorage).setItem('castle.'+k,JSON.stringify(v))}catch(e){}}};

다. 가진 공이 전부 줄지어 날아가요.": {"en": "Aim and shoot once per turn. All your balls fly out in a stream.", "ja": "毎ターン1回狙って撃つ。持っているボールが全部連なって飛ぶよ。", "zh": "每回合瞄准发射一次，所有球会连串飞出。"}, "공은 맞은 면의 각도대로 튕깁니다. 모서리에 맞으면 대각선으로 튀어요. Super Hard에서는 빗면이 있는 삼각 벽돌도 나와요.": {"en": "Balls bounce off at the angle of the surface they hit. Corners send them diagonal. Super Hard adds triangle bricks with slopes.", "ja": "ボールは当たった面の角度で跳ね返る。角に当たると斜めに跳ぶよ。Super Hardでは斜面のある三角ブロックも登場。", "zh": "球按击中面的角度反弹，打到角会斜着弹开。Super Hard中还会出现带斜面的三角砖块。"}, "벽돌의 숫자는 남은 체력입니다. 공이 한 번 닿을 때마다 {0}씩 줄어요.": {"en": "A brick's number is its HP. Each hit takes off {0}.", "ja": "ブロックの数字は残りHP。ボールが当たるたびに{0}ずつ減るよ。", "zh": "砖块上的数字是剩余血量，球每碰一次减{0}。"}, "턴이 끝나면 벽돌이 한 칸씩 내려오고, 맨 위에 새 줄이 생깁니다.": {"en": "After each turn, bricks move down one row and a new row appears at the top.", "ja": "ターンが終わるとブロックが1段下がり、一番上に新しい段ができる。", "zh": "回合结束后砖块下降一行，顶部生成新的一行。"}, "처음 떨어진 공의 자리가 다음 턴의 발사 위치가 됩니다.": {"en": "Where your first ball lands is your next launch spot.", "ja": "最初に落ちたボールの位置が次のターンの発射位置になるよ。", "zh": "第一个落地的球的位置就是下回合的发射点。"}, "{0}레벨마다 능력 {1}개 중 하나를 고릅니다 (공 +{2} · 쾌속 · 폭탄 · 강타).": {"en": "Every {0} levels, pick 1 of {1} powers (Ball +{2} · Rapid · Bomb · Power Hit).", "ja": "{0}レベルごとに{1}つの能力から1つ選ぶ(ボール +{2} · 高速 · 爆弾 · 強打)。", "zh": "每{0}级从{1}个能力中选一个（球 +{2} · 快速 · 炸弹 · 重击）。"}, "초록 고리": {"en": "Green Ring", "ja": "緑のリング", "zh": "绿环"}, "공 +{0} · 먹으면 초록 공이 바닥으로 떨어져 다음 턴부터 합류": {"en": "Ball +{0} · Grab it and a green ball drops, joining from next turn", "ja": "ボール +{0} · 取ると緑のボールが落ちて次のターンから合流", "zh": "球 +{0} · 吃到后绿球落下，下回合起加入"}, "파란 고리": {"en": "Blue Ring", "ja": "青いリング", "zh": "蓝环"}, "닿을 때마다 가로 또는 세로 한 줄 전체에 피해": {"en": "Each touch damages a whole row or column", "ja": "触れるたびに横か縦の1列全体にダメージ", "zh": "每次触碰对整行或整列造成伤害"}, "폭탄 벽돌": {"en": "Bomb Brick", "ja": "爆弾ブロック", "zh": "炸弹砖块"}, "깨지면 주변 {0}×{1} 벽돌에 큰 피해": {"en": "When broken, heavy damage to nearby {0}×{1} bricks", "ja": "壊れると周囲{0}×{1}のブロックに大ダメージ", "zh": "被击碎时对周围{0}×{1}砖块造成重创"}, "주황 고리": {"en": "Orange Ring", "ja": "オレンジのリング", "zh": "橙环"}, "지나간 공이 아무 방향으로 튀어요": {"en": "Balls passing through bounce off in random directions", "ja": "通ったボールがランダムな方向に跳ねるよ", "zh": "经过的球会随机弹向任意方向"}, "이어하기": {"en": "Continue", "ja": "コンティニュー", "zh": "继续"}, "바닥에 닿으면 한 판에 {0}번, 아래 {1}줄을 지우고 계속": {"en": "Hit bottom? {0}x per game, clear the bottom {1} rows and keep going", "ja": "底に着いたら1ゲーム{0}回まで、下{1}段を消して続行", "zh": "触底时每局可{0}次清除底部{1}行并继续"}, "삼각 벽돌 (Super Hard)": {"en": "Triangle Brick (Super Hard)", "ja": "三角ブロック (Super Hard)", "zh": "三角砖块 (Super Hard)"}, "빗면에 맞으면 대각선으로 튕겨요": {"en": "Hit the slope and it bounces diagonally", "ja": "斜面に当たると斜めに跳ね返るよ", "zh": "打到斜面会斜向反弹"}, "틈새 명중": {"en": "Gap Shot", "ja": "すき間命中", "zh": "缝隙命中"}, "두 벽돌 사이를 정확히 맞히면 둘 다 깎여요": {"en": "Hit right between two bricks to chip both", "ja": "2つのブロックの間を正確に当てると両方削れる", "zh": "精准击中两块砖之间，两块都会掉血"}, "주황 점선": {"en": "Orange Dotted Line", "ja": "オレンジの点線", "zh": "橙色虚线"}, "직전에 쏜 방향 (조준 참고용)": {"en": "Last shot direction (aim reference)", "ja": "直前に撃った方向 (照準の参考)", "zh": "上一次发射方向（瞄准参考）"}, "시작하기": {"en": "Start", "ja": "スタート", "zh": "开始"}, "오늘의 한판 #{0}": {"en": "Daily Round #{0}", "ja": "今日の一戦 #{0}", "zh": "今日一局 #{0}"}, "모두 같은 판": {"en": "Same for everyone", "ja": "みんな同じステージ", "zh": "大家同一局"}, "친구에게 이 게임 보내기": {"en": "Send this game to a friend", "ja": "このゲームを友達に送る", "zh": "把这个游戏发给好友"}, "조준 · 한 손 · Medium": {"en": "Aim · One hand · Medium", "ja": "照準 · 片手 · Medium", "zh": "瞄准 · 单手 · Medium"}, "내 차고 · ◆ {0}": {"en": "My Garage · ◆ {0}", "ja": "マイガレージ · ◆ {0}", "zh": "我的车库 · ◆ {0}"}, "빨강 꼬마": {"en": "Red Mini", "ja": "レッドミニ", "zh": "红色小车"}, "타는 중": {"en": "Driving", "ja": "乗車中", "zh": "使用中"}, "하늘 쿠페": {"en": "Sky Coupe", "ja": "スカイクーペ", "zh": "天空轿跑"}, "민트 경주": {"en": "Mint Racer", "ja": "ミントレーサー", "zh": "薄荷赛车"}, "노랑 택시": {"en": "Yellow Taxi", "ja": "イエロータクシー", "zh": "黄色出租车"}, "보라 번개": {"en": "Purple Bolt", "ja": "パープルボルト", "zh": "紫色闪电"}, "검정 전설": {"en": "Black Legend", "ja": "ブラックレジェンド", "zh": "黑色传奇"}, "출발 부스터 (한 판만)": {"en": "Start Booster (1 run)", "ja": "スタートブースター (1回のみ)", "zh": "起步加速（仅一局）"}, "주운 다이아는 차고에 쌓여요": {"en": "Diamonds you collect stack up in your garage", "ja": "拾ったダイヤはガレージに貯まるよ", "zh": "捡到的钻石会存进车库"}, "보험 ◆{0}": {"en": "Insurance ◆{0}", "ja": "保険 ◆{0}", "zh": "保险 ◆{0}"}, "한 번 부활": {"en": "One revive", "ja": "1回復活", "zh": "复活一次"}, "다이아 러시 ◆{0}": {"en": "Diamond Rush ◆{0}", "ja": "ダイヤラッシュ ◆{0}", "zh": "钻石冲刺 ◆{0}"}, "다이아 {0}배": {"en": "Diamonds ×{0}", "ja": "ダイヤ {0}倍", "zh": "钻石 {0}倍"}, "탭 한 번에 꺾는 원버튼 드리프트. 퍼펙트 {0}연속이면 피버 타임으로 장애물을 부수며 질주! 부스터와 움직이는 장애물까지.": {"en": "One-button drift: tap to turn. Hit {0} Perfects in a row for Fever Time and smash through obstacles! Plus boosters and moving obstacles.", "ja": "タップ1回で曲がるワンボタンドリフト。パーフェクト{0}連続でフィーバータイム、障害物を壊しながら爆走!ブースターや動く障害物も。", "zh": "点一下就转弯的单键漂移。连续{0}次完美触发狂热时间，撞碎障碍一路狂飙！还有加速带和移动障碍。"}, "길 밖으로 떨어지거나 장애물에 부딪히지 않고 최대한 멀리 달리세요.": {"en": "Drive as far as you can without falling off the road or crashing.", "ja": "道から落ちたり障害物にぶつかったりせず、できるだけ遠くまで走ろう。", "zh": "不掉出道路、不撞障碍，尽量跑得更远。"}, "차는 저절로 대각선으로 달립니다. 탭할 때마다 반대 대각선으로 꺾여요.": {"en": "Your car drives diagonally on its own. Each tap switches to the other diagonal.", "ja": "車は自動で斜めに走る。タップするたびに反対の斜めへ曲がるよ。", "zh": "车会自动斜向行驶，每点一下就转向另一条斜线。"}, "길은 넓은 길 · 좁은 나무 다리 · 급커브 연속 · 원형 광장으로 계속 바뀝니다.": {"en": "The road keeps changing: wide roads · narrow bridges · hairpin chains · round plazas.", "ja": "道は広い道 · 細い木の橋 · 連続急カーブ · 円形広場と次々変わる。", "zh": "道路不断变化：宽路 · 窄木桥 · 连续急弯 · 圆形广场。"}, "콘 · 바위 · 좌우로 움직이는 바리케이드에 부딪히면 끝입니다.": {"en": "Hit a cone, rock, or sliding barricade and it's over.", "ja": "コーン · 岩 · 左右に動くバリケードにぶつかったら終わり。", "zh": "撞上路锥 · 岩石 · 左右移动的路障就结束。"}, "코너 꼭짓점에서 꺾으면 퍼펙트. {0}연속이면 {1}초간 피버 타임: 불꽃차가 되어 장애물을 부수고 점수가 {2}배!": {"en": "Turn right at the corner tip for a Perfect. {0} in a row = {1}s Fever Time: become a fire car, smash obstacles, score ×{2}!", "ja": "コーナーの頂点で曲がればパーフェクト。{0}連続で{1}秒間フィーバータイム:炎の車になって障害物を壊し、スコア{2}倍!", "zh": "在弯道顶点转弯即为完美。连续{0}次触发{1}秒狂热时间：化身火焰车撞碎障碍，得分{2}倍！"}, "노란 화살표 부스터를 밟으면 순간 가속 +{0}점. 장애물을 아슬아슬하게 스치면 +{1}점.": {"en": "Hit a yellow arrow booster for a burst of speed +{0} pts. Barely graze an obstacle for +{1} pts.", "ja": "黄色い矢印のブースターを踏むと一気に加速 +{0}点。障害物をギリギリでかすめると +{1}点。", "zh": "踩到黄色箭头加速带瞬间加速 +{0}分。擦边掠过障碍 +{1}分。"}, "달릴수록 빨라지고 화면이 멀어지며, {0}점마다 새 구간(테마)이 열려요.": {"en": "The farther you go, the faster it gets and the camera pulls back. Every {0} pts unlocks a new zone (theme).", "ja": "走るほど速くなって画面が引いていき、{0}点ごとに新しいエリア(テーマ)が開くよ。", "zh": "越跑越快，镜头也越拉越远，每{0}分解锁新区域（主题）。"}, "퍼펙트": {"en": "Perfect", "ja": "パーフェクト", "zh": "完美"}, "코너 꼭짓점에서 꺾기 · 연속 보너스": {"en": "Turn at the corner tip · Streak bonus", "ja": "コーナー頂点で曲がる · 連続ボーナス", "zh": "在弯道顶点转弯 · 连续奖励"}, "피버 타임": {"en": "Fever Time", "ja": "フィーバータイム", "zh": "狂热时间"}, "퍼펙트 {0}연속 · 장애물 파괴 · {1}배": {"en": "{0} Perfects in a row · Smash obstacles · ×{1}", "ja": "パーフェクト{0}連続 · 障害物破壊 · {1}倍", "zh": "连续{0}次完美 · 撞碎障碍 · {1}倍"}, "부스터": {"en": "Booster", "ja": "ブースター", "zh": "加速带"}, "밟으면 가속 +{0}": {"en": "Step on it: speed +{0}", "ja": "踏むと加速 +{0}", "zh": "踩上加速 +{0}"}, "아슬아슬": {"en": "Close Call", "ja": "ギリギリ", "zh": "惊险擦边"}, "장애물을 스치듯 지나면 +{0}": {"en": "Graze past an obstacle for +{0}", "ja": "障害物をかすめて通ると +{0}", "zh": "擦着障碍通过 +{0}"}, "다이아": {"en": "Diamond", "ja": "ダイヤ", "zh": "钻石"}, "+{0}점": {"en": "+{0} pts", "ja": "+{0}点", "zh": "+{0}分"}, "바리케이드": {"en": "Barricade", "ja": "バリケード", "zh": "路障"}, "좌우로 움직여요": {"en": "Slides side to side", "ja": "左右に動くよ", "zh": "左右移动"}, "원버튼 · 운전 · Medium": {"en": "One button · Driving · Medium", "ja": "ワンボタン · ドライブ · Medium", "zh": "单键 · 驾驶 · Medium"}, "판 크기": {"en": "Board Size", "ja": "盤面サイズ", "zh": "棋盘大小"}, "{0}×{1} · 빠르고 빡빡하게": {"en": "{0}×{1} · Fast and tight", "ja": "{0}×{1} · 速くて窮屈", "zh": "{0}×{1} · 快速紧凑"}, "모드": {"en": "Mode", "ja": "モード", "zh": "模式"}, "줄을 지워야 시간이 늘어나요": {"en": "Clear lines to gain time", "ja": "列を消すと時間が増えるよ", "zh": "消除行才能加时间"}, "타임어택": {"en": "Time Attack", "ja": "タイムアタック", "zh": "限时挑战"}, "느긋하게": {"en": "Relaxed", "ja": "のんびり", "zh": "悠闲"}, "모험": {"en": "Adventure", "ja": "冒険", "zh": "冒险"}, "조각을 끌어다 놓고 가로·세로 줄을 채워 지우세요. 조각을 탭하면 돌릴 수 있어요.": {"en": "Drag pieces onto the board and fill rows and columns to clear them. Tap a piece to rotate it.", "ja": "ピースをドラッグして置き、縦横の列を埋めて消そう。ピースをタップすると回転できるよ。", "zh": "拖动方块放到棋盘上，填满横行或竖列即可消除。点击方块可旋转。"}, "타임어택: 시간이 바닥나기 전에 줄을 계속 지우며 최고 점수를 노리세요.": {"en": "Time Attack: keep clearing lines before time runs out and go for a high score.", "ja": "タイムアタック: 時間切れになる前に列を消し続けて最高スコアを狙おう。", "zh": "限时挑战：在时间耗尽前不断消行，冲击最高分。"}, "아래 조각 {0}개를 판에 끌어다 놓습니다. 조각을 한 번 탭하면 {1}°씩 돌아가요.": {"en": "Drag the {0} pieces below onto the board. Tap a piece once to rotate it {1}°.", "ja": "下の{0}つのピースを盤面にドラッグ。ピースを1回タップすると{1}°ずつ回るよ。", "zh": "把下方{0}个方块拖到棋盘上。点一下方块旋转{1}°。"}, "가로 한 줄이나 세로 한 줄을 꽉 채우면 사라지며 점수를 얻어요.": {"en": "Fill a full row or column to clear it and score.", "ja": "横1列か縦1列をぴったり埋めると消えてスコアゲット。", "zh": "填满一整行或一整列即可消除得分。"}, "타임어택에서는 시간이 계속 줄어듭니다. 줄을 지우면 시간이 충전돼요 (한 줄 +{0}초, 콤보마다 +{1}초).": {"en": "In Time Attack the clock keeps ticking. Clearing lines refills it (+{0}s per line, +{1}s per combo).", "ja": "タイムアタックでは時間がどんどん減る。列を消すと時間がチャージされるよ (1列 +{0}秒、コンボごとに +{1}秒)。", "zh": "限时挑战中时间不断减少，消行可充值时间（每行 +{0}秒，每次连击 +{1}秒）。"}, "점수가 높아질수록 시간이 더 빨리 줄어요. 시간이 {0}이 되거나, 남은 조각을 어떻게 돌려도 놓을 수 없으면 끝.": {"en": "The higher your score, the faster time drains. Game over at {0}, or when no piece fits however you rotate it.", "ja": "スコアが上がるほど時間が速く減る。時間が{0}になるか、残りのピースをどう回しても置けなくなったら終了。", "zh": "分数越高时间减得越快。时间归{0}，或剩余方块怎么转都放不下时结束。"}, "판 크기({0}×{1} · {2}×{3})와 모드(타임어택 · 느긋하게)를 고를 수 있고, 기록은 따로 저장돼요.": {"en": "Pick a board size ({0}×{1} · {2}×{3}) and mode (Time Attack · Relaxed); records are saved separately.", "ja": "盤面サイズ({0}×{1} · {2}×{3})とモード(タイムアタック · のんびり)を選べて、記録は別々に保存されるよ。", "zh": "可选择棋盘大小（{0}×{1} · {2}×{3}）和模式（限时挑战 · 悠闲），记录分开保存。"}, "★ 보석이 박힌 칸을 줄로 지우면 +{0}점, 타임어택은 +{1}초.": {"en": "★ Clear a gem cell in a line for +{0} pts, or +{1}s in Time Attack.", "ja": "★ ジェム入りマスを列で消すと +{0}点、タイムアタックでは +{1}秒。", "zh": "★ 消除嵌有宝石的格子 +{0}分，限时挑战 +{1}秒。"}, "💣 폭탄 조각(점수 {0} 이후 가끔)은 아무 칸에나 놓을 수 있고 주변 {1}×{2}을 한 번에 날려요. 꽉 막혔을 때 구원투수!": {"en": "💣 Bomb pieces (sometimes, after {0} pts) can go on any cell and blast the surrounding {1}×{2} at once. A lifesaver when you're stuck!", "ja": "💣 爆弾ピース(スコア{0}以降にときどき)はどのマスにも置けて、周囲{1}×{2}を一気に吹き飛ばす。詰んだ時の救世主!", "zh": "💣 炸弹方块（{0}分后偶尔出现）可放在任意格，一次炸掉周围{1}×{2}。卡住时的救星！"}, "{0}점마다 단계가 오르고 타임어택 시간이 가득 차요.": {"en": "Every {0} pts you level up and the Time Attack clock refills.", "ja": "{0}点ごとに段階が上がり、タイムアタックの時間が満タンに。", "zh": "每{0}分升一级，限时挑战时间回满。"}, "여러 줄 한 번에": {"en": "Multi-line Clear", "ja": "複数列を同時に", "zh": "一次消多行"}, "점수와 충전 시간이 크게 뛰어요": {"en": "Big jump in score and time refill", "ja": "スコアとチャージ時間が大きくアップ", "zh": "分数和充值时间大幅提升"}, "콤보": {"en": "Combo", "ja": "コンボ", "zh": "连击"}, "{0}번 안에 또 지우면 콤보 유지 · 배율과 시간 보너스 증가": {"en": "Clear again within {0} moves to keep the combo · bigger multiplier and time bonus", "ja": "{0}手以内にまた消すとコンボ継続 · 倍率と時間ボーナスアップ", "zh": "{0}步内再次消除保持连击 · 倍率和时间奖励提升"}, "판을 전부 비우면 +{0}": {"en": "Clear the whole board for +{0}", "ja": "盤面を全部空にすると +{0}", "zh": "清空整个棋盘 +{0}"}, "시간 게이지": {"en": "Time Gauge", "ja": "時間ゲージ", "zh": "时间槽"}, "{0}초 아래면 빨갛게 깜빡여요": {"en": "Flashes red under {0}s", "ja": "{0}秒を切ると赤く点滅", "zh": "低于{0}秒时红色闪烁"}, "보석 칸": {"en": "Gem Cell", "ja": "ジェムマス", "zh": "宝石格"}, "지우면 +{0}": {"en": "Clear it for +{0}", "ja": "消すと +{0}", "zh": "消除 +{0}"}, "폭탄 조각": {"en": "Bomb Piece", "ja": "爆弾ピース", "zh": "炸弹方块"}, "주변 {0}×{1} 제거": {"en": "Clears surrounding {0}×{1}", "ja": "周囲{0}×{1}を消去", "zh": "清除周围{0}×{1}"}, "퍼즐 · 타임어택 · Medium": {"en": "Puzzle · Time Attack · Medium", "ja": "パズル · タイムアタック · Medium", "zh": "拼图 · 限时挑战 · Medium"}, "꽃을 모두 먹고, 회전문으로 벌레 길을 막고, 파란 하트로 배율을, 글자로 EXTRA · SPECIAL을 완성하세요.": {"en": "Eat every flower, block bugs with turnstiles, boost your multiplier with blue hearts, and spell EXTRA · SPECIAL with letters.", "ja": "花を全部食べ、回転扉で虫の道をふさぎ、青いハートで倍率を、文字でEXTRA · SPECIALを完成させよう。", "zh": "吃光所有花朵，用旋转门挡住虫子的路，吃蓝心提升倍率，用字母拼出EXTRA · SPECIAL。"}, "벌레를 피해 미로의 꽃 · 하트 · 글자를 모두 먹으면 다음 미로로 넘어갑니다.": {"en": "Dodge the bugs and eat every flower · heart · letter in the maze to move on.", "ja": "虫をよけて迷路の花 · ハート · 文字を全部食べたら次の迷路へ。", "zh": "躲开虫子，吃光迷宫里的花 · 心 · 字母即可进入下一个迷宫。"}, "미로 테두리를 따라 보라색 타이머가 한 바퀴 돌 때마다 가운데에서 벌레가 한 마리씩 나옵니다 (최대 {0}마리).": {"en": "Each time the purple timer circles the maze border, a bug comes out of the center (up to {0}).", "ja": "迷路の縁を紫のタイマーが1周するたびに、真ん中から虫が1匹ずつ出てくる (最大{0}匹)。", "zh": "紫色计时器沿迷宫边框每转一圈，中央就会出来一只虫子（最多{0}只）。"}, "초록 회전문(주황 막대)은 나만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 벌레는 못 지나가요.": {"en": "Only you can push through green turnstiles (orange bars). Passing rotates them {0}° and changes the path. Bugs can't pass.", "ja": "緑の回転扉(オレンジの棒)は自分だけが押して通れて、通ると{0}°回って道が変わる。虫は通れないよ。", "zh": "绿色旋转门（橙色杆）只有你能推过去，通过后旋转{0}°改变道路。虫子过不去。"}, "하트와 글자는 평소 파란색이고, 몇 초마다 노란색 → 빨간색으로 잠깐 바뀝니다.": {"en": "Hearts and letters are usually blue, briefly turning yellow → red every few seconds.", "ja": "ハートと文字はふだん青で、数秒ごとに黄色 → 赤に一瞬変わる。", "zh": "心和字母平时是蓝色，每隔几秒会短暂变成黄色 → 红色。"}, "파란 하트를 먹으면 이번 스테이지 점수 배율이 ×{0} → ×{1} → ×{2}로 올라요.": {"en": "Eat a blue heart to raise this stage's multiplier ×{0} → ×{1} → ×{2}.", "ja": "青いハートを食べるとこのステージのスコア倍率が ×{0} → ×{1} → ×{2} に上がる。", "zh": "吃到蓝心，本关得分倍率升为 ×{0} → ×{1} → ×{2}。"}, "노란색일 때 먹은 글자는 EXTRA(완성 시 목숨 +{0}), 빨간색일 때 먹은 글자는 SPECIAL(완성 시 +{1})에 들어가요.": {"en": "Letters eaten while yellow go to EXTRA (complete for +{0} life); red ones go to SPECIAL (complete for +{1}).", "ja": "黄色の時に食べた文字はEXTRA(完成で残機 +{0})、赤の時はSPECIAL(完成で +{1})に入るよ。", "zh": "黄色时吃到的字母计入EXTRA（集齐命 +{0}），红色时计入SPECIAL（集齐 +{1}）。"}, "{0}번째 벌레가 나오면 가운데에 채소가 생깁니다. 먹으면 보너스 점수와 함께 벌레가 잠시 멈추지만, 닿으면 여전히 위험해요.": {"en": "When bug #{0} appears, a veggie spawns in the center. Eat it for bonus points and the bugs freeze briefly, but touching them is still deadly.", "ja": "{0}匹目の虫が出ると真ん中に野菜が出現。食べるとボーナス点とともに虫が少し止まるけど、触れるとやっぱり危険。", "zh": "第{0}只虫子出现时，中央会出现蔬菜。吃掉得奖励分且虫子暂停，但碰到仍然危险。"}, "해골은 나도, 벌레도 밟으면 끝. 벌레에 닿으면 목숨 −{0} (처음 {1}개).": {"en": "Skulls end it for you and bugs alike. Touching a bug costs −{0} life (start with {1}).", "ja": "ドクロは自分も虫も踏んだら終わり。虫に触れると残機 −{0} (最初は{1}つ)。", "zh": "骷髅谁踩到谁完蛋，你和虫子都一样。碰到虫子命 −{0}（初始{1}条）。"}, "꽃": {"en": "Flower", "ja": "花", "zh": "花朵"}, "{0}점 × 배율": {"en": "{0} pts × multiplier", "ja": "{0}点 × 倍率", "zh": "{0}分 × 倍率"}, "파란 하트": {"en": "Blue Heart", "ja": "青いハート", "zh": "蓝心"}, "배율 ↑ (×{0} → ×{1} → ×{2})": {"en": "Multiplier ↑ (×{0} → ×{1} → ×{2})", "ja": "倍率 ↑ (×{0} → ×{1} → ×{2})", "zh": "倍率 ↑ (×{0} → ×{1} → ×{2})"}, "노란 글자": {"en": "Yellow Letter", "ja": "黄色い文字", "zh": "黄色字母"}, "EXTRA 모으기 → 목숨 +{0}": {"en": "Collect EXTRA → +{0} life", "ja": "EXTRAを集める → 残機 +{0}", "zh": "集齐EXTRA → 命 +{0}"}, "빨간 글자": {"en": "Red Letter", "ja": "赤い文字", "zh": "红色字母"}, "SPECIAL 모으기 → +{0}": {"en": "Collect SPECIAL → +{0}", "ja": "SPECIALを集める → +{0}", "zh": "集齐SPECIAL → +{0}"}, "채소": {"en": "Veggie", "ja": "野菜", "zh": "蔬菜"}, "{0}점부터 스테이지마다 +{1} · 벌레 정지": {"en": "From {0} pts, +{1} per stage · Bugs freeze", "ja": "{0}点からステージごとに +{1} · 虫ストップ", "zh": "{0}分起每关 +{1} · 虫子暂停"}, "해골": {"en": "Skull", "ja": "ドクロ", "zh": "骷髅"}, "나도 벌레도 걸리면 끝": {"en": "Game over for you and bugs alike", "ja": "自分も虫も触れたら終わり", "zh": "你和虫子碰到都完蛋"}, "미로 · 추격 · Medium": {"en": "Maze · Chase · Medium", "ja": "迷路 · 追いかけっこ · Medium", "zh": "迷宫 · 追逐 · Medium"}, "검은 화면의 도트 오락실 미로. 회전문 {0}개, 테두리를 도는 벽돌 시계, 파랑 → 빨강 → 노랑으로 바뀌는 글자와 하트를 노려 보세요.": {"en": "A pixel arcade maze on a black screen. {0} turnstiles, a brick clock circling the border, and letters and hearts shifting blue → red → yellow.", "ja": "黒い画面のドット絵アーケード迷路。回転扉{0}個、縁を回るブロック時計、青 → 赤 → 黄色に変わる文字とハートを狙おう。", "zh": "黑屏像素街机迷宫。{0}个旋转门、沿边框转动的砖块时钟，瞄准由蓝 → 红 → 黄变化的字母和心。"}, "곤충을 피해 꽃 · 하트 · 글자를 모두 먹으면 다음 PART로 넘어갑니다.": {"en": "Dodge the insects and eat every flower · heart · letter to advance to the next PART.", "ja": "昆虫をよけて花 · ハート · 文字を全部食べたら次のPARTへ。", "zh": "躲开昆虫，吃光花 · 心 · 字母即可进入下一PART。"}, "미로는 {0}×{1}칸 고정 배치에 초록 회전문 {2}개가 있어요. 무당벌레는 아래 가운데에서 출발합니다.": {"en": "The maze is a fixed {0}×{1} grid with {2} green turnstiles. The ladybug starts at the bottom center.", "ja": "迷路は{0}×{1}マスの固定配置で、緑の回転扉が{2}個。てんとう虫は下の真ん中からスタート。", "zh": "迷宫为固定的{0}×{1}格，有{2}个绿色旋转门。瓢虫从下方中央出发。"}, "회전문은 무당벌레만 밀고 지나갈 수 있고, 지나가면 {0}° 돌아가 길이 바뀝니다. 곤충에게는 벽이에요.": {"en": "Only the ladybug can push through turnstiles; passing rotates them {0}° and changes the path. To insects, they're walls.", "ja": "回転扉はてんとう虫だけが押して通れて、通ると{0}°回って道が変わる。昆虫にとっては壁だよ。", "zh": "旋转门只有瓢虫能推过去，通过后旋转{0}°改变道路。对昆虫来说是墙。"}, "테두리 벽돌이 한 바퀴 초록으로 차오를 때마다(다음 바퀴엔 흰색으로 지워질 때마다) 가운데 상자에서 곤충이 {0}마리씩 나옵니다 (최대 {1}마리). 시계는 PART {2}이 가장 느리고 PART {3} · {4}에서 빨라져요.": {"en": "Each time the border bricks fill green (or wipe back to white on the next lap), {0} insect(s) leave the center box (up to {1}). The clock is slowest in PART {2} and speeds up in PART {3} · {4}.", "ja": "縁のブロックが1周緑に満ちるたびに(次の周は白く消えるたびに)真ん中の箱から昆虫が{0}匹ずつ出てくる (最大{1}匹)。時計はPART {2}が一番遅く、PART {3} · {4}で速くなる。", "zh": "边框砖块每填满一圈绿色（下一圈每变回白色）时，中央箱子会出来{0}只昆虫（最多{1}只）。时钟在PART {2}最慢，PART {3} · {4}变快。"}, "하트와 글자는 평소 파란색이고 약 {0}초마다 빨강(아주 잠깐) → 노랑으로 바뀝니다. 파랑 {1} · 노랑 {2} · 빨강 {3}점 × 배율.": {"en": "Hearts and letters are usually blue, turning red (very briefly) → yellow about every {0}s. Blue {1} · Yellow {2} · Red {3} pts × multiplier.", "ja": "ハートと文字はふだん青で、約{0}秒ごとに赤(ほんの一瞬) → 黄色に変わる。青{1} · 黄{2} · 赤{3}点 × 倍率。", "zh": "心和字母平时为蓝色，约每{0}秒变红（极短）→ 黄色。蓝{1} · 黄{2} · 红{3}分 × 倍率。"}, "파란 하트를 먹으면 이번 PART 배율이 ×{0} → ×{1} → ×{2}로 올라요.": {"en": "Eat a blue heart to raise this PART's multiplier ×{0} → ×{1} → ×{2}.", "ja": "青いハートを食べるとこのPARTの倍率が ×{0} → ×{1} → ×{2} に上がる。", "zh": "吃到蓝心，本PART倍率升为 ×{0} → ×{1} → ×{2}。"}, "빨간 글자는 SPECIAL(완성 시 +{0}), 노란 글자는 EXTRA(완성 시 목숨 +{1})에 켜집니다. 판마다 글자 {2}개: A 또는 E 하나, SPECIAL 전용 하나, EXTRA 전용 하나.": {"en": "Red letters light up SPECIAL (complete for +{0}); yellow ones light up EXTRA (complete for +{1} life). {2} letters per board: one A or E, one SPECIAL-only, one EXTRA-only.", "ja": "赤い文字はSPECIAL(完成で +{0})、黄色い文字はEXTRA(完成で残機 +{1})に点灯。1面ごとに文字{2}個: AかEが1つ、SPECIAL専用1つ、EXTRA専用1つ。", "zh": "红色字母点亮SPECIAL（集齐 +{0}），黄色字母点亮EXTRA（集齐命 +{1}）。每局{2}个字母：A或E一个、SPECIAL专用一个、EXTRA专用一个。"}, "{0}번째 곤충이 나오면 가운데에 채소가 나옵니다. 먹으면 {1}점(PART마다 +{2} 최대 {3})과 함께 곤충이 {4}초 멈춰요. 멈춰도 닿으면 위험.": {"en": "When insect #{0} appears, a veggie pops up in the center. Eat it for {1} pts (+{2} per PART, max {3}) and insects freeze for {4}s. Frozen ones are still deadly.", "ja": "{0}匹目の昆虫が出ると真ん中に野菜が出る。食べると{1}点(PARTごとに +{2}、最大{3})とともに昆虫が{4}秒止まる。止まっていても触れると危険。", "zh": "第{0}只昆虫出现时，中央会出现蔬菜。吃掉得{1}分（每PART +{2}，最高{3}），昆虫暂停{4}秒。暂停时碰到仍危险。"}, "해골은 PART {0}에 {1}개, 이후 최대 {2}개까지 늘어요. 무당벌레도 곤충도 밟으면 끝(곤충은 상자로 돌아감).": {"en": "PART {0} has {1} skull(s), growing to up to {2}. Ladybug or insect, step on one and it's over (insects return to the box).", "ja": "ドクロはPART {0}で{1}個、その後最大{2}個まで増える。てんとう虫も昆虫も踏んだら終わり(昆虫は箱に戻る)。", "zh": "骷髅在PART {0}有{1}个，之后最多增至{2}个。瓢虫和昆虫踩到都完蛋（昆虫会回到箱子）。"}, "PART {0}~{1}은 판마다 곤충 종류가 하나씩 바뀌고, {2}부터는 네 종류가 섞여 나와요.": {"en": "In PART {0}–{1}, the insect type changes each board; from {2} on, all four types mix.", "ja": "PART {0}~{1}は面ごとに昆虫の種類が1つずつ変わり、{2}からは4種類が混ざって出てくる。", "zh": "PART {0}~{1}每局昆虫种类各换一种，从{2}开始四种混合出现。"}, "{0}점 · 배율 ↑": {"en": "{0} pts · Multiplier ↑", "ja": "{0}点 · 倍率 ↑", "zh": "{0}分 · 倍率 ↑"}, "{0}점 · SPECIAL": {"en": "{0} pts · SPECIAL", "ja": "{0}点 · SPECIAL", "zh": "{0}分 · SPECIAL"}, "{0}점 · EXTRA": {"en": "{0} pts · EXTRA", "ja": "{0}点 · EXTRA", "zh": "{0}分 · EXTRA"}, "테두리 시계": {"en": "Border Clock", "ja": "縁の時計", "zh": "边框时钟"}, "한 바퀴 = 곤충 {0}마리": {"en": "One lap = {0} insect(s)", "ja": "1周 = 昆虫{0}匹", "zh": "一圈 = {0}只昆虫"}, "채소 {0}종": {"en": "{0} Veggies", "ja": "野菜{0}種", "zh": "{0}种蔬菜"}, "{0} ~ {1} · 곤충 {2}초 정지": {"en": "{0} ~ {1} · Insects freeze {2}s", "ja": "{0} ~ {1} · 昆虫{2}秒停止", "zh": "{0} ~ {1} · 昆虫暂停{2}秒"}, "{0}개 → 최대 {1}개": {"en": "{0} → up to {1}", "ja": "{0}個 → 最大{1}個", "zh": "{0}个 → 最多{1}个"}, "곤충 {0}종": {"en": "{0} Insect Types", "ja": "昆虫{0}種", "zh": "{0}种昆虫"}, "PART마다 바뀜": {"en": "Changes each PART", "ja": "PARTごとに変わる", "zh": "每PART变化"}, "오락실 · 미로 · Medium": {"en": "Arcade · Maze · Medium", "ja": "アーケード · 迷路 · Medium", "zh": "街机 · 迷宫 · Medium"}, "날아드는 벌레 편대를 쏘아 떨어뜨리는 우주 슈팅. 벌레 편대를 쏘고, 대장 벌레가 광선으로 끌어간 내 전투기를 되찾아 쌍발로! 변신 벌레와 도전 스테이지까지.": {"en": "A space shooter where you blast swooping bug squadrons. Shoot down the swarm and rescue the fighter the boss bug tractor-beamed to go dual! Plus morphing bugs and challenge stages.", "ja": "飛来する虫の編隊を撃ち落とす宇宙シューティング。虫の編隊を撃ち、ボス虫に光線でさらわれた自機を取り戻してダブルに!変身する虫やチャレンジステージも。", "zh": "击落来袭虫子编队的太空射击。射击虫群，夺回被虫王光束抓走的战机组成双发！还有变身虫和挑战关。"}, "편대를 모두 격추하면 다음 스테이지. 최대한 높은 스테이지와 점수를 노리세요.": {"en": "Shoot down the whole squadron to clear the stage. Go for the highest stage and score.", "ja": "編隊を全部撃ち落とせば次のステージ。できるだけ高いステージとスコアを狙おう。", "zh": "击落全部编队进入下一关，冲击最高关卡和分数。"}, "스테이지가 시작되면 벌레 {0}마리(대장 {1} · 나비 {2} · 벌 {3})가 무리 지어 날아와 편대를 짭니다. 날아오는 중에 맞히면 점수가 더 커요.": {"en": "Each stage, {0} bugs (boss {1} · butterfly {2} · bee {3}) swarm in to form a squadron. Hit them on the way in for bonus points.", "ja": "ステージが始まると虫{0}匹(ボス{1} · チョウ{2} · ハチ{3})が群れで飛んできて編隊を組む。飛んでくる途中に当てると点数アップ。", "zh": "每关开始时{0}只虫子（虫王{1} · 蝴蝶{2} · 蜜蜂{3}）成群飞来组成编队。在飞来途中击中得分更高。"}, "편대가 짜이면 벌레들이 하나씩, 대장은 나비 호위와 함께 급강하하며 총을 쏩니다.": {"en": "Once in formation, bugs dive one by one, and bosses swoop with butterfly escorts, firing as they go.", "ja": "編隊が組まれると虫が1匹ずつ、ボスはチョウの護衛を連れて急降下しながら撃ってくる。", "zh": "编队成形后，虫子逐个俯冲，虫王带着蝴蝶护卫俯冲并开火。"}, "대장 벌레는 두 번 맞혀야 떨어져요(초록 → 파랑). 대장이 광선을 쏘며 멈추면 피하세요. 잡히면 전투기를 빼앗겨요.": {"en": "Boss bugs take two hits (green → blue). Dodge when a boss stops to fire its beam. Get caught and your fighter is taken.", "ja": "ボス虫は2回当てないと落ちない(緑 → 青)。ボスが止まって光線を出したらよけよう。捕まると自機を奪われるよ。", "zh": "虫王要打两次才会掉落（绿 → 蓝）。虫王停下发射光束时要躲开，被抓到战机就会被夺走。"}, "빼앗긴 전투기를 단 대장이 급강하할 때 맞히면 전투기를 되찾아 두 대가 나란히 쏘는 쌍발이 됩니다. 편대에 있을 때 맞히면 잃어요.": {"en": "Hit a boss carrying your captured fighter while it dives to rescue it and fire dual side by side. Hit it in formation and the fighter is lost.", "ja": "奪われた自機を連れたボスが急降下する時に当てると自機を取り戻し、2機並んで撃つダブルに。編隊にいる時に当てると失うよ。", "zh": "在带着被夺战机的虫王俯冲时击中它，就能夺回战机，两架并排双发。在编队中击中则会失去。"}, "화면에 내 총알은 한 번에 {0}발(쌍발은 {1}쌍)까지만. 헛쏘면 다음 발이 늦어져요.": {"en": "Only {0} shots on screen at once ({1} pairs in dual). Missing delays your next shot.", "ja": "画面上の自弾は一度に{0}発(ダブルは{1}組)まで。外すと次の弾が遅れるよ。", "zh": "屏幕上同时最多{0}发子弹（双发为{1}对）。打空会延迟下一发。"}, "네 스테이지마다({0} · {1} · {2}…) 도전 스테이지: 적이 쏘지 않고 지나가기만 해요. 한 마리당 {3}점, {4}마리 전멸이면 {5}점.": {"en": "Every 4th stage ({0} · {1} · {2}…) is a challenge stage: enemies just fly by without shooting. {3} pts each, {4} for wiping out all {5}.", "ja": "4ステージごと({0} · {1} · {2}…)にチャレンジステージ: 敵は撃たずに通り過ぎるだけ。1匹{3}点、{4}匹全滅で{5}点。", "zh": "每4关（{0} · {1} · {2}…）为挑战关：敌人只飞过不开火。每只{3}分，{4}只全灭{5}分。"}, "{0}점과 {1}점마다 전투기 +{2}": {"en": "+{2} fighter at {0} and {1} pts", "ja": "{0}点と{1}点で自機 +{2}", "zh": "{0}分和{1}分时战机 +{2}"}, "벌": {"en": "Bee", "ja": "ハチ", "zh": "蜜蜂"}, "편대 {0} · 비행 중 {1}": {"en": "Formation {0} · Flying {1}", "ja": "編隊 {0} · 飛行中 {1}", "zh": "编队 {0} · 飞行中 {1}"}, "나비": {"en": "Butterfly", "ja": "チョウ", "zh": "蝴蝶"}, "대장 ({0}번 맞혀야)": {"en": "Boss ({0} hits)", "ja": "ボス ({0}回当てる)", "zh": "虫王（需击中{0}次）"}, "편대 {0} · 비행 중 {1} · 호위 {2}마리 {3} · {4}마리 {5}": {"en": "Formation {0} · Flying {1} · {2} escort {3} · {4} escorts {5}", "ja": "編隊 {0} · 飛行中 {1} · 護衛{2}匹 {3} · {4}匹 {5}", "zh": "编队 {0} · 飞行中 {1} · 护卫{2}只 {3} · {4}只 {5}"}, "광선": {"en": "Beam", "ja": "光線", "zh": "光束"}, "잡히면 전투기를 빼앗김": {"en": "Get caught and lose your fighter", "ja": "捕まると自機を奪われる", "zh": "被抓到会失去战机"}, "쌍발": {"en": "Dual Fighter", "ja": "ダブル", "zh": "双发"}, "빼앗긴 전투기를 구출하면 두 배 화력": {"en": "Rescue your captured fighter for double firepower", "ja": "奪われた自機を救出して火力2倍", "zh": "救回被夺战机，火力翻倍"}, "변신 벌레 ({0}판부터)": {"en": "Morphing Bug (from stage {0})", "ja": "変身虫 ({0}面から)", "zh": "变身虫（第{0}关起）"}, "깜빡이던 벌이 셋으로 갈라짐 · 하나 {0} · 셋 다 {1} / {2} / {3}": {"en": "A blinking bee splits into three · one {0} · all three {1} / {2} / {3}", "ja": "点滅するハチが3匹に分裂 · 1匹{0} · 3匹全部 {1} / {2} / {3}", "zh": "闪烁的蜜蜂分裂成三只 · 一只{0} · 三只全灭 {1} / {2} / {3}"}, "적이 된 전투기": {"en": "Turncoat Fighter", "ja": "敵になった自機", "zh": "变成敌人的战机"}, "대장을 편대에서 잡으면 빼앗긴 전투기가 덤벼요 · {0}": {"en": "Hit a boss in formation and your captured fighter attacks · {0}", "ja": "ボスを編隊で倒すと奪われた自機が襲ってくる · {0}", "zh": "在编队中击落虫王，被夺战机会扑过来 · {0}"}, "도전 스테이지": {"en": "Challenge Stage", "ja": "チャレンジステージ", "zh": "挑战关"}, "{0}판, 그 뒤 {1}판마다 · 적이 쏘지 않음 · {2}마리 전멸 +{3}": {"en": "Stage {0}, then every {1} · Enemies don't shoot · Wipe out {2} +{3}", "ja": "{0}面、その後{1}面ごと · 敵は撃たない · {2}匹全滅 +{3}", "zh": "第{0}关，之后每{1}关 · 敌人不开火 · 全灭{2}只 +{3}"}, "격납고 · 별가루 {0}": {"en": "Hangar · Stardust {0}", "ja": "格納庫 · 星くず {0}", "zh": "机库 · 星尘 {0}"}, "계급 훈련병 · 영구 강화": {"en": "Rank: Cadet · Permanent upgrades", "ja": "階級 訓練兵 · 永久強化", "zh": "军衔 新兵 · 永久强化"}, "슈팅 · 고전 · Medium": {"en": "Shooter · Classic · Medium", "ja": "シューティング · 名作 · Medium", "zh": "射击 · 经典 · Medium"}, "차를 피해 도로를 건너고, 통나무와 거북 등을 밟아 강을 건너 연못 다섯 곳을 모두 채우세요.": {"en": "Dodge cars to cross the road, hop on logs and turtles to cross the river, and fill all five ponds.", "ja": "車をよけて道路を渡り、丸太やカメの背中を踏んで川を渡り、5つの池を全部埋めよう。", "zh": "躲开车辆过马路，踩着木头和乌龟背过河，填满全部五个池塘。"}, "개구리 다섯 마리를 강 건너 연못 다섯 칸에 모두 들여보내면 다음 판.": {"en": "Get five frogs across the river into all five pond slots to clear the round.", "ja": "5匹のカエルを川の向こうの池5マスに全部入れたら次の面。", "zh": "把五只青蛙全部送进河对岸的五个池塘格，进入下一局。"}, "한 번에 한 칸씩 뜁니다. 앞으로 새 칸에 갈 때마다 {0}점.": {"en": "Hop one space at a time. {0} pts for each new space forward.", "ja": "1回に1マスずつ跳ぶ。前の新しいマスに進むたびに{0}点。", "zh": "每次跳一格，每前进到新的一格得{0}分。"}, "아래쪽 도로({0}줄)에서는 차에 닿으면 끝. 트럭 · 경주차 · 불도저 등 줄마다 속도와 방향이 달라요.": {"en": "On the road below ({0} lanes), touching a car ends it. Trucks · racers · bulldozers each lane has its own speed and direction.", "ja": "下の道路({0}車線)では車に触れたら終わり。トラック · レースカー · ブルドーザーなど車線ごとに速さと向きが違うよ。", "zh": "下方道路（{0}条车道）碰到车就结束。卡车 · 赛车 · 推土机等，每条车道速度和方向都不同。"}, "위쪽 강({0}줄)에서는 통나무나 거북 등 위에만 설 수 있고, 올라타면 함께 떠내려가요. 물에 빠지거나 화면 밖으로 밀려나면 끝.": {"en": "On the river above ({0} lanes), you can only stand on logs or turtles, and you drift with them. Fall in or get swept off-screen and it's over.", "ja": "上の川({0}列)では丸太かカメの背中にしか立てず、乗ると一緒に流される。水に落ちたり画面外に押し出されたら終わり。", "zh": "上方河流（{0}行）只能站在木头或乌龟背上，并随之漂流。掉进水里或被推出屏幕就结束。"}, "일부 거북은 물속으로 잠수합니다. 깜빡이면 곧 들어가요.": {"en": "Some turtles dive underwater. When they blink, they're about to go under.", "ja": "一部のカメは水中に潜る。点滅したらもうすぐ潜るよ。", "zh": "有些乌龟会潜入水中，一闪烁就快潜下去了。"}, "맨 위 연못 칸에 정확히 들어가면 {0}점 + 남은 시간 {1}초마다 {2}점. 이미 찬 칸이나 칸 사이 풀숲에 뛰면 끝.": {"en": "Land right in a top pond slot for {0} pts + {2} pts per {1}s left. Jumping into a filled slot or the bushes between ends it.", "ja": "一番上の池マスにぴったり入ると{0}点 + 残り時間{1}秒ごとに{2}点。埋まったマスやマスの間の草むらに跳ぶと終わり。", "zh": "准确跳进顶部池塘格得{0}分 + 剩余时间每{1}秒{2}分。跳进已占格子或格间草丛就结束。"}, "연못에 파리가 보일 때 들어가면 +{0} {1}판부터는 악어가 입을 벌린 칸이 생겨요.": {"en": "Enter a pond with a fly for +{0}. From round {1}, some slots have open-jawed gators.", "ja": "池にハエが見える時に入ると +{0}。{1}面からはワニが口を開けたマスが出てくる。", "zh": "池塘里有苍蝇时跳进去 +{0}。第{1}局起会出现鳄鱼张嘴的格子。"}, "다섯 칸을 모두 채우면 +{0}점, 다음 판은 더 빠르고 붐벼요. 한 마리당 {1}초, {2}점에 개구리 +{3}": {"en": "Fill all five slots for +{0} pts; the next round is faster and busier. {1}s per frog, +{3} frog at {2} pts", "ja": "5マス全部埋めると +{0}点、次の面はもっと速くて混雑。1匹あたり{1}秒、{2}点でカエル +{3}", "zh": "填满五格 +{0}分，下一局更快更拥挤。每只{1}秒，{2}分时青蛙 +{3}"}, "한 칸 전진": {"en": "Hop forward", "ja": "1マス前進", "zh": "前进一格"}, "{0}점": {"en": "{0} pts", "ja": "{0}点", "zh": "{0}分"}, "연못 도착": {"en": "Reach the pond", "ja": "池に到着", "zh": "到达池塘"}, "{0} + 남은 반초당 {1}": {"en": "{0} + {1} per half-second left", "ja": "{0} + 残り0.5秒ごとに{1}", "zh": "{0} + 剩余每半秒{1}"}, "파리": {"en": "Fly", "ja": "ハエ", "zh": "苍蝇"}, "다섯 칸 완성": {"en": "All five filled", "ja": "5マス完成", "zh": "五格全满"}, "+{0} · 다음 판": {"en": "+{0} · Next round", "ja": "+{0} · 次の面", "zh": "+{0} · 下一局"}, "통나무": {"en": "Log", "ja": "丸太", "zh": "木头"}, "올라타면 함께 이동": {"en": "Ride along", "ja": "乗ると一緒に移動", "zh": "站上去一起移动"}, "거북": {"en": "Turtle", "ja": "カメ", "zh": "乌龟"}, "깜빡이면 곧 잠수": {"en": "Blinking = diving soon", "ja": "点滅したらもうすぐ潜る", "zh": "闪烁即将潜水"}, "악어 ({0}판~)": {"en": "Gator (round {0}+)", "ja": "ワニ ({0}面〜)", "zh": "鳄鱼（第{0}局起）"}, "그 칸에 들어가면 끝": {"en": "Enter that slot and it's over", "ja": "そのマスに入ると終わり", "zh": "跳进那格就结束"}, "시간": {"en": "Time", "ja": "時間", "zh": "时间"}, "한 마리당 {0}초": {"en": "{0}s per frog", "ja": "1匹あたり{0}秒", "zh": "每只{0}秒"}, "길 건너기 · 고전 · Medium": {"en": "Road Crossing · Classic · Medium", "ja": "道路渡り · 名作 · Medium", "zh": "过马路 · 经典 · Medium"}, "모드 (오늘의 한판은 클래식)": {"en": "Mode (Daily Round is Classic)", "ja": "モード (今日の一戦はクラシック)", "zh": "模式（今日一局为经典）"}, "먹고 길어지기": {"en": "Eat and grow", "ja": "食べて伸びる", "zh": "吃了变长"}, "클래식": {"en": "Classic", "ja": "クラシック", "zh": "经典"}, "포털": {"en": "Portal", "ja": "ポータル", "zh": "传送门"}, "벽 쌓기": {"en": "Wall Builder", "ja": "壁づくり", "zh": "筑墙"}, "독사과": {"en": "Poison Apple", "ja": "毒リンゴ", "zh": "毒苹果"}, "먹이를 먹을수록 길어지고 빨라져요. 벽과 내 몸에 부딪히면 끝. 연달아 빨리 먹으면 콤보, 황금 별은 {0}초 한정!": {"en": "Eat to grow longer and faster. Hit a wall or yourself and it's over. Eat quickly in a row for combos; golden stars last only {0}s!", "ja": "エサを食べるほど長く速くなる。壁や自分の体にぶつかったら終わり。続けて素早く食べるとコンボ、金の星は{0}秒限定!", "zh": "吃得越多越长越快，撞到墙或自己就结束。快速连吃形成连击，金星仅限{0}秒！"}, "먹이를 먹어 최대한 길어지세요. 벽이나 내 몸에 부딪히면 끝.": {"en": "Eat food to grow as long as you can. Hit a wall or yourself and it's over.", "ja": "エサを食べてできるだけ長くなろう。壁や自分の体にぶつかったら終わり。", "zh": "吃食物尽量变长，撞到墙或自己就结束。"}, "지렁이는 계속 앞으로 가고, 방향만 바꿀 수 있어요. 바로 뒤로는 못 돌아요.": {"en": "The worm keeps moving forward; you only steer. No U-turns.", "ja": "ミミズはずっと前に進み、向きだけ変えられる。真後ろには戻れないよ。", "zh": "虫子一直向前，只能改变方向，不能直接掉头。"}, "빨간 먹이를 먹으면 {0}점, 한 칸 길어지고 조금 빨라집니다.": {"en": "Eat red food for {0} pts, grow one cell, and speed up a bit.", "ja": "赤いエサを食べると{0}点、1マス伸びて少し速くなる。", "zh": "吃红色食物得{0}分，变长一格并稍微加速。"}, "{0}초 안에 연달아 먹으면 콤보: 한 번 이어질 때마다 +{1}점씩 더.": {"en": "Eat again within {0}s for a combo: +{1} pts more for each link.", "ja": "{0}秒以内に続けて食べるとコンボ: つながるたびに +{1}点ずつ追加。", "zh": "{0}秒内连吃形成连击：每连一次额外 +{1}分。"}, "먹이 {0}개마다 황금 별이 {1}초 동안 나타나요. 먹으면 +{2}": {"en": "Every {0} foods, a golden star appears for {1}s. Eat it for +{2}", "ja": "エサ{0}個ごとに金の星が{1}秒間出現。食べると +{2}", "zh": "每吃{0}个食物，金星出现{1}秒。吃到 +{2}"}, "Easy: 벽을 통과해 반대편으로 나와요 · Medium: 벽에 부딪히면 끝 · Hard: 더 빠르고 돌 장애물까지.": {"en": "Easy: wrap through walls to the other side · Medium: hitting a wall ends it · Hard: faster, with rock obstacles.", "ja": "Easy: 壁を通り抜けて反対側に出る · Medium: 壁にぶつかったら終わり · Hard: もっと速く、岩の障害物も。", "zh": "Easy：穿墙从另一侧出来 · Medium：撞墙结束 · Hard：更快，还有石头障碍。"}, "먹이 {0}개마다 레벨 업: 보너스 점수와 함께 돌이 조금씩 늘어요 (벽 통과 모드 제외).": {"en": "Level up every {0} foods: bonus points and a few more rocks (except wrap-through mode).", "ja": "エサ{0}個ごとにレベルアップ: ボーナス点とともに岩が少しずつ増える (壁通り抜けモード除く)。", "zh": "每吃{0}个食物升级：获得奖励分，石头逐渐增多（穿墙模式除外）。"}, "아이템({0}초 뒤 사라짐): 시계 = {1}초 느리게 · 유령 = {2}초 동안 몸·돌 통과 · 자석 = 먹이가 머리 쪽으로 다가옴 · 가위 = 꼬리 {3}칸 자르기.": {"en": "Items (vanish after {0}s): Clock = {1}s slow-mo · Ghost = pass through body·rocks for {2}s · Magnet = food drifts to your head · Scissors = cut {3} tail cells.", "ja": "アイテム({0}秒で消える): 時計 = {1}秒スロー · おばけ = {2}秒間 体·岩をすり抜け · 磁石 = エサが頭に寄ってくる · ハサミ = しっぽ{3}マスカット。", "zh": "道具（{0}秒后消失）：时钟 = 减速{1}秒 · 幽灵 = {2}秒内穿过身体·石头 · 磁铁 = 食物向头部靠近 · 剪刀 = 剪掉尾巴{3}格。"}, "먹이": {"en": "Food", "ja": "エサ", "zh": "食物"}, "{0}점 · 한 칸 길어짐": {"en": "{0} pts · Grow one cell", "ja": "{0}点 · 1マス伸びる", "zh": "{0}分 · 变长一格"}, "황금 별": {"en": "Golden Star", "ja": "金の星", "zh": "金星"}, "{0}초 한정 +{1}": {"en": "{0}s only +{1}", "ja": "{0}秒限定 +{1}", "zh": "限时{0}秒 +{1}"}, "{0}초 안에 연달아 먹기": {"en": "Eat again within {0}s", "ja": "{0}秒以内に続けて食べる", "zh": "{0}秒内连吃"}, "돌 (Hard)": {"en": "Rock (Hard)", "ja": "岩 (Hard)", "zh": "石头 (Hard)"}, "부딪히면 끝": {"en": "Hit it and it's over", "ja": "ぶつかったら終わり", "zh": "撞上就结束"}, "시계": {"en": "Clock", "ja": "時計", "zh": "时钟"}, "{0}초 느리게": {"en": "{0}s slow-mo", "ja": "{0}秒スロー", "zh": "减速{0}秒"}, "유령": {"en": "Ghost", "ja": "おばけ", "zh": "幽灵"}, "{0}초 통과": {"en": "{0}s cleared", "ja": "{0}秒クリア", "zh": "坚持{0}秒"}, "자석": {"en": "Magnet", "ja": "マグネット", "zh": "磁铁"}, "먹이 끌어오기": {"en": "Pulls in food", "ja": "エサを引き寄せる", "zh": "吸引食物"}, "가위": {"en": "Scissors", "ja": "ハサミ", "zh": "剪刀"}, "꼬리 {0}칸 자르기": {"en": "Cuts {0} tail segments", "ja": "しっぽを{0}マスカット", "zh": "剪掉{0}节尾巴"}, "고전 · 한 손 · Medium": {"en": "Classic · One-hand · Medium", "ja": "クラシック · 片手 · Medium", "zh": "经典 · 单手 · Medium"}, "조작": {"en": "Controls", "ja": "操作", "zh": "操作"}, "화면 끌기 · 방향키": {"en": "Drag · Arrow keys", "ja": "ドラッグ · 方向キー", "zh": "拖动 · 方向键"}, "끌기": {"en": "Drag", "ja": "ドラッグ", "zh": "拖动"}, "기울이기": {"en": "Tilt", "ja": "傾き", "zh": "倾斜"}, "폰을 기울이거나 끌어서 노란 무당벌레를 움직여 쫓아오는 벌레 떼를 피하세요. 꽃 아이템을 먹으면 반격 시간! 거대 꽃 · 보호막 · 유도 잎 · 광선.": {"en": "Tilt or drag to move the yellow ladybug and dodge the chasing swarm. Eat flower items to strike back! Giant Flower · Shield · Homing Leaf · Beam.", "ja": "スマホを傾けるかドラッグして黄色いてんとう虫を動かし、迫る虫の群れをかわそう。花アイテムで反撃タイム!巨大花 · シールド · 追尾リーフ · ビーム。", "zh": "倾斜或拖动手机，操控黄色瓢虫躲避追来的虫群。吃到花朵道具就能反击！巨型花 · 护盾 · 追踪叶 · 光线。"}, "쫓아오는 벌레 떼를 최대한 오래 피하며 점수를 모으세요. 한 번 닿으면 끝(Easy는 목숨 {0}개).": {"en": "Dodge the chasing swarm as long as you can and rack up points. One touch and it's over (Easy: {0} lives).", "ja": "迫る虫の群れをできるだけ長くかわしてスコアを稼ごう。一度でも触れたら終わり(Easyはライフ{0})。", "zh": "尽可能久地躲避追来的虫群并收集分数。碰到一次就结束（Easy有{0}条命）。"}, "무당벌레는 화면을 끌거나 방향키로, 또는 폰을 기울여서 움직여요 (시작 화면에서 조작 방식 선택). 기울이기는 시작할 때 폰 자세가 기준이에요.": {"en": "Move the ladybug by dragging, arrow keys, or tilting your phone (pick on the start screen). Tilt uses your phone's starting position as center.", "ja": "てんとう虫はドラッグ、方向キー、またはスマホの傾きで動かせます(スタート画面で選択)。傾きは開始時のスマホの向きが基準です。", "zh": "瓢虫可通过拖动屏幕、方向键或倾斜手机来移动（在开始界面选择）。倾斜以开始时的手机姿势为基准。"}, "빨간 벌레는 계속 쫓아오고, 시간이 갈수록 더 많고 빨라져요. 줄지어 구불구불 내려오는 벌레 떼도 나와요.": {"en": "Red bugs keep chasing you, getting more numerous and faster over time. Swarms also wiggle down in lines.", "ja": "赤い虫はずっと追ってきて、時間とともに数もスピードも増します。列になってくねくね降りてくる群れも出現。", "zh": "红虫会一直追你，随着时间越来越多、越来越快。还会有排成一列蜿蜒而下的虫群。"}, "뚱벌은 크고 느리지만 세 번 맞혀야 쓰러져요. 파란 소용돌이는 근처의 무당벌레와 벌레를 빨아들여요.": {"en": "Fat bugs are big and slow but take three hits. Blue whirlpools suck in nearby ladybugs and bugs.", "ja": "デブ虫は大きくて遅いけど、3回当てないと倒れません。青い渦は近くのてんとう虫と虫を吸い込みます。", "zh": "胖虫又大又慢，但要打三次才会倒下。蓝色漩涡会吸入附近的瓢虫和虫子。"}, "나에게는 무기가 없어요. 떠내려오는 꽃 방울을 먹어야 반격할 수 있어요.": {"e ": {"en": "Volcano Zone", "ja": "火山地帯", "zh": "火山地带"}, "바위 골렘·폭탄병 · 보스 용": {"en": "Rock Golems·Bombers · Boss Dragon", "ja": "岩ゴーレム・爆弾兵 · ボスドラゴン", "zh": "岩石魔像·炸弹兵 · Boss巨龙"}, "유령 숲": {"en": "Haunted Forest", "ja": "幽霊の森", "zh": "幽灵森林"}, "유령·해골병 · 보스 해골 왕": {"en": "Ghosts·Skeletons · Boss Skeleton King", "ja": "幽霊・骸骨兵 · ボス骸骨王", "zh": "幽灵·骷髅兵 · Boss骷髅王"}, "용암 협곡": {"en": "Lava Canyon", "ja": "溶岩の峡谷", "zh": "熔岩峡谷"}, "바위 골렘·재생 트롤 · 보스 용": {"en": "Rock Golems·Regen Trolls · Boss Dragon", "ja": "岩ゴーレム・再生トロール · ボスドラゴン", "zh": "岩石魔像·再生巨魔 · Boss巨龙"}, "얼음 성채": {"en": "Ice Citadel", "ja": "氷の城塞", "zh": "冰之城塞"}, "철갑 기사·방패병 · 보스 거인": {"en": "Armored Knights·Shieldmen · Boss Giant", "ja": "鉄甲騎士・盾兵 · ボス巨人", "zh": "铁甲骑士·盾兵 · Boss巨人"}, "그림자 왕성": {"en": "Shadow Castle", "ja": "影の王城", "zh": "暗影王城"}, "유령·흑마법사 · 보스 해골 왕": {"en": "Ghosts·Dark Mages · Boss Skeleton King", "ja": "幽霊・黒魔術師 · ボス骸骨王", "zh": "幽灵·黑魔法师 · Boss骷髅王"}, "당겨서 쏘기": {"en": "Pull & Shoot", "ja": "引いて撃つ", "zh": "拉弓射击"}, "화면을 누른 채 뒤로 끌었다 놓으면 발사. 머리를 맞히면 {0}배!": {"en": "Hold, drag back and release to fire. Headshots deal ×{0}!", "ja": "画面を押したまま後ろに引いて離すと発射。頭に当てると{0}倍!", "zh": "按住屏幕向后拖再松开即可发射。爆头伤害{0}倍！"}, "영웅 키우기": {"en": "Grow Heroes", "ja": "英雄を育てる", "zh": "培养英雄"}, "웨이브 사이에 층을 쌓고 영웅을 고용·강화. Lv{0}·Lv{1}에 모습과 공격이 진화!": {"en": "Build floors and hire·upgrade heroes between Waves. Looks and attacks evolve at Lv{0}·Lv{1}!", "ja": "ウェーブの合間に階を増やし英雄を雇用・強化。Lv{0}・Lv{1}で見た目と攻撃が進化!", "zh": "在波次间加盖楼层、雇佣·强化英雄。Lv{0}·Lv{1}时外观和攻击会进化！"}, "각성 한 방": {"en": "Awakening Blast", "ja": "覚醒の一撃", "zh": "觉醒一击"}, "적을 쓰러뜨려 게이지 {0}% → 「각성」으로 {1}초 황금 연사. 메테오로 전장을 불바다로!": {"en": "Defeat enemies to fill the gauge to {0}% → 「Awaken」 for {1}s of golden rapid fire. Rain meteors on the field!", "ja": "敵を倒してゲージ{0}% → 「覚醒」で{1}秒間黄金連射。メテオで戦場を火の海に!", "zh": "击败敌人攒满{0}%能量 → 「觉醒」{1}秒黄金连射。用陨石让战场化为火海！"}, "철갑 기사 →": {"en": "Armored Knight →", "ja": "鉄甲騎士 →", "zh": "铁甲骑士 →"}, "마법": {"en": "Magic", "ja": "魔法", "zh": "魔法"}, "하늘 적 → 대포": {"en": "Air foes → Cannon", "ja": "空の敵 → 大砲", "zh": "空中敌人 → 大炮"}, "유령 →": {"en": "Ghost →", "ja": "幽霊 →", "zh": "幽灵 →"}, "트롤 →": {"en": "Troll →", "ja": "トロール →", "zh": "巨魔 →"}, "불": {"en": "Fire", "ja": "火", "zh": "火"}, "로 재생 차단": {"en": " stops regen", "ja": "で再生を阻止", "zh": "可阻止再生"}, "성문 누르기 →": {"en": "Tap the gate →", "ja": "城門をタップ →", "zh": "点击城门 →"}, "기사단 돌격": {"en": "Knight Charge", "ja": "騎士団突撃", "zh": "骑士团冲锋"}, "영웅 누르기 →": {"en": "Tap a hero →", "ja": "英雄をタップ →", "zh": "点击英雄 →"}, "전직표": {"en": "Class Tree", "ja": "転職表", "zh": "转职表"}, "끝없이 몰려오는 웨이브를 막으며 최대한 높은 웨이브까지 버티세요. 성벽이 무너지면 끝.": {"en": "Hold off endless Waves and survive to the highest Wave you can. If the wall falls, it's over.", "ja": "次々と押し寄せるウェーブを防ぎ、できるだけ高いウェーブまで耐えよう。城壁が崩れたら終わり。", "zh": "抵挡源源不断的波次，尽可能坚持到更高的波数。城墙倒塌就结束。"}, "화면을 누른 채 뒤로 끌었다 놓으면 내 화살. 머리를 맞히면 두 배.": {"en": "Hold, drag back and release to fire your arrow. Headshots deal double.", "ja": "画面を押したまま後ろに引いて離すと自分の矢を発射。頭に当てると2倍。", "zh": "按住屏幕向后拖再松开即可射出你的箭。爆头伤害翻倍。"}, "웨이브 사이 정비: 층을 올리면 영웅 자리가 생겨요. 빈 층을 눌러 영웅을 고용하고, 영웅 칸을 누르면 강화.": {"en": "Between Waves: add floors to make room for heroes. Tap an empty floor to hire a hero, tap a hero slot to upgrade.", "ja": "ウェーブの合間に準備:階を増やすと英雄の席ができます。空き階をタップで英雄を雇用、英雄枠をタップで強化。", "zh": "波次间整备：加盖楼层可增加英雄位置。点击空楼层雇佣英雄，点击英雄栏位进行强化。"}, "물리(궁수·대포·내 화살)는 철갑 기사에게 약하고, 마법(불·얼음·번개)은 잘 통해요.": {"en": "Physical (archers·cannons·your arrows) is weak vs Armored Knights; magic (fire·ice·lightning) works well.", "ja": "物理(弓兵・大砲・自分の矢)は鉄甲騎士に弱く、魔法(火・氷・雷)がよく効きます。", "zh": "物理攻击（弓箭手·大炮·你的箭）对铁甲骑士效果差，魔法（火·冰·雷）则很有效。"}, "방패병은 정면 화살을 막아요. 위에서 내리꽂거나 광역 공격으로.": {"en": "Shieldmen block arrows from the front. Hit them from above or with area attacks.", "ja": "盾兵は正面の矢を防ぎます。上から撃ち下ろすか範囲攻撃で。", "zh": "盾兵会挡住正面的箭。从上方射击或用范围攻击。"}, "대포는 하늘의 적(박쥐·용)을 못 맞혀요. 주술사는 주변 적을 회복시키니 먼저 처치!": {"en": "Cannons can't hit air enemies (bats·dragons). Shamans heal nearby foes, so take them out first!", "ja": "大砲は空の敵(コウモリ・ドラゴン)に当たりません。呪術師は周りの敵を回復するので先に倒そう!", "zh": "大炮打不到空中敌人（蝙蝠·龙）。巫师会治疗周围敌人，要优先消灭！"}, "{0}웨이브마다 보스(거인 · 용 · 해골 왕 · 거대 골렘). 체력이 반 아래로 떨어지면 화가 나서 빨라져요.": {"en": "A boss every {0} Waves (Giant · Dragon · Skeleton King · Giant Golem). Below half HP, they get angry and faster.", "ja": "{0}ウェーブごとにボス(巨人 · ドラゴン · 骸骨王 · 巨大ゴーレム)。体力が半分を切ると怒って速くなります。", "zh": "每{0}波出现Boss（巨人 · 巨龙 · 骷髅王 · 巨型魔像）。血量低于一半时会发怒加速。"}, "새 적: 적 궁수는 멀리서 쏘고, 폭탄병은 닿으면 터져요. 트롤은 불에 타는 동안만 재생이 멈추고, 골렘은 부서지면 갈라져요. 흑마법사의 보호막은 한 번 막아 주고, 유령이 흐릿할 땐 물리 화살이 통과해요.": {"en": "New foes: enemy archers shoot from afar, bombers explode on contact. Trolls stop regenerating only while burning, golems split when broken. Dark mage shields block one hit, and physical arrows pass through faded ghosts.", "ja": "新しい敵:敵弓兵は遠くから撃ち、爆弾兵は触れると爆発。トロールは燃えている間だけ再生が止まり、ゴーレムは壊れると分裂。黒魔術師のシールドは一度だけ防ぎ、幽霊が薄いときは物理の矢がすり抜けます。", "zh": "新敌人：敌方弓手远程射击，炸弹兵碰到就爆炸。巨魔只有在燃烧时才停止再生，魔像被打碎后会分裂。黑魔法师的护盾能挡一次攻击，幽灵变淡时物理箭会穿透过去。"}, "영웅을 Lv{0} · Lv{1}까지 강화하면 진화! 궁수는 화살이 늘고, 대포는 쌍포, 마법은 범위가 커져요.": {"en": "Upgrade heroes to Lv{0} · Lv{1} to evolve! Archers get more arrows, cannons go double, magic gets wider range.", "ja": "英雄をLv{0} · Lv{1}まで強化すると進化!弓兵は矢が増え、大砲は二連装、魔法は範囲が広がります。", "zh": "把英雄强化到Lv{0} · Lv{1}即可进化！弓箭手箭数增加，大炮变双管，魔法范围变大。"}, "적을 쓰러뜨리면 각성 게이지가 차요. {0}%에서 「각성」을 누르면 {1}초간 황금 화살이 쉴 새 없이 나가요.": {"en": "Defeating enemies fills the Awakening gauge. At {0}%, tap 「Awaken」 for {1}s of nonstop golden arrows.", "ja": "敵を倒すと覚醒ゲージがたまります。{0}%で「覚醒」を押すと{1}秒間黄金の矢が撃ち放題。", "zh": "击败敌人会积攒觉醒能量。达到{0}%时点「觉醒」，{1}秒内黄金箭连发不停。"}, "성문을 누르면 기사단이 말을 타고 돌격해 적을 밀어내요. 성벽 위 끓는 기름 가마솥은 성 앞 적에게 자동으로 쏟아져요.": {"en": "Tap the gate and the knights charge on horseback to push enemies back. Boiling oil cauldrons on the wall pour automatically on foes at the gate.", "ja": "城門をタップすると騎士団が馬で突撃し敵を押し返します。城壁の煮えたぎる油の大釜は城前の敵に自動で降り注ぎます。", "zh": "点击城门，骑士团会骑马冲锋击退敌人。城墙上的沸油大锅会自动倾倒在城前的敌人身上。"}, "성 창문의 영웅을 누르면 전직표가 열려요: {0}차 → {1}차(Lv{2}) → {3}차(Lv{4}) 모습과 능력을 볼 수 있어요.": {"en": "Tap a hero in the castle window to open the class tree: see looks and skills for tier {0} → tier {1} (Lv{2}) → tier {3} (Lv{4}).", "ja": "城の窓の英雄をタップすると転職表が開きます:{0}次 → {1}次(Lv{2}) → {3}次(Lv{4})の見た目と能力を確認できます。", "zh": "点击城堡窗口里的英雄可打开转职表：查看{0}转 → {1}转（Lv{2}） → {3}转（Lv{4}）的外观与能力。"}, "마을마다 나오는 적과 보스가 달라요. 새 전장 시작 때 이번 마을의 적을 알려 줘요.": {"en": "Each village has different enemies and bosses. When a new battlefield starts, you'll see who's coming.", "ja": "村ごとに出てくる敵とボスが違います。新しい戦場の開始時に、その村の敵をお知らせします。", "zh": "每个村庄的敌人和Boss都不同。新战场开始时会提示本村的敌人。"}, "아이템(불·다발·화살비·천둥)은 적이 가끔 떨어뜨리는 구슬, 보스, {0}웨이브마다 보급, 보너스 풍선 사격의 금 풍선에서 얻어요. 종류마다 최대 {1}개.": {"en": "Items (fire·volley·arrow rain·thunder) come from orbs enemies sometimes drop, bosses, supplies every {0} Waves, and gold balloons in the bonus balloon round. Max {1} of each.", "ja": "アイテム(火・束矢・矢の雨・雷)は、敵がたまに落とす玉、ボス、{0}ウェーブごとの補給、ボーナス風船射撃の金風船から入手。種類ごとに最大{1}個。", "zh": "道具（火·齐射·箭雨·雷电）可从敌人偶尔掉落的宝珠、Boss、每{0}波的补给、奖励气球射击中的金气球获得。每种最多{1}个。"}, "보스를 잡은 다음 웨이브는 보너스 풍선 사격! 영웅은 쉬고 직접 쏴서 금화와 아이템을 모아요.": {"en": "The Wave after a boss is a bonus balloon round! Heroes rest while you shoot to collect Gold and items.", "ja": "ボスを倒した次のウェーブはボーナス風船射撃!英雄は休み、自分で撃ってゴールドとアイテムを集めよう。", "zh": "击败Boss后的下一波是奖励气球射击！英雄休息，由你亲自射击收集金币和道具。"}, "왕국 정복: 지도에서 이웃한 땅을 하나씩 점령해요. 점령한 땅마다 모든 모드의 시작 금화와 성벽이 늘어나요.": {"en": "Conquer the Kingdom: capture neighboring lands on the map one by one. Each land boosts starting Gold and wall strength in all modes.", "ja": "王国征服:地図上の隣接する土地を一つずつ占領。占領した土地ごとに全モードの開始ゴールドと城壁が増えます。", "zh": "征服王国：在地图上逐一占领相邻的领地。每占领一块，所有模式的初始金币和城墙都会提升。"}, "성이 무너지면 그 웨이브 시작 직전으로 돌아가 다시 할 수 있어요 (시범 기간이라 횟수 제한 없음). 나갔다 들어오는 건 언제든 자유 (웨이브 시작 직전부터 이어져요). 일시정지에서 「지금 기록 남기기」로 점수를 바로 기록할 수 있어요.": {"en": "If the castle falls, you can retry from just before that Wave (unlimited during the trial). Leave and return anytime (resumes from just before the Wave). Use 「Save Score Now」 in pause to record your score right away.", "ja": "城が崩れたら、そのウェーブ開始直前に戻ってやり直せます(試験期間中は回数無制限)。出入りはいつでも自由(ウェーブ開始直前から再開)。一時停止の「今すぐ記録」でスコアをすぐ記録できます。", "zh": "城堡被攻破后，可回到该波开始前重新挑战（试玩期间不限次数）。随时可以退出再进入（从该波开始前继续）。在暂停菜单点「立即记录」可马上保存分数。"}, "궁수": {"en": "Archer", "ja": "弓兵", "zh": "弓箭手"}, "빠른 단일 · 물리": {"en": "Fast single · Physical", "ja": "高速単体 · 物理", "zh": "快速单体 · 物理"}, "불 마법사": {"en": "Fire Mage", "ja": "炎の魔法使い", "zh": "火焰法师"}, "광역 · 마법": {"en": "Area · Magic", "ja": "範囲 · 魔法", "zh": "范围 · 魔法"}, "얼음 마법사": {"en": "Ice Mage", "ja": "氷の魔法使い", "zh": "冰霜法师"}, "광역 둔화 · 마법": {"en": "Area slow · Magic", "ja": "範囲スロー · 魔法", "zh": "范围减速 · 魔法"}, "대포": {"en": "Cannon", "ja": "大砲", "zh": "大炮"}, "지상 광역 큰 피해": {"en": "Big ground area damage", "ja": "地上範囲に大ダメージ", "zh": "地面范围高伤害"}, "번개 사제": {"en": "Lightning Priest", "ja": "雷の司祭", "zh": "雷电祭司"}, "{0}명 연쇄 · 마법": {"en": "Chains {0} foes · Magic", "ja": "{0}体連鎖 · 魔法", "zh": "连锁{0}人 · 魔法"}, "수리공": {"en": "Repairer", "ja": "修理工", "zh": "修理工"}, "성벽 회복": {"en": "Restores the wall", "ja": "城壁を回復", "zh": "修复城墙"}, "이번 주 도전 · {0}주차": {"en": "Weekly Challenge · Week {0}", "ja": "今週のチャレンジ · 第{0}週", "zh": "本周挑战 · 第{0}周"}, "모두 같은 판 · Hard · 강화 보너스 없음 · 실력 순위": {"en": "Same round for all · Hard · No upgrade bonus · Skill ranking", "ja": "全員同じ盤面 · Hard · 強化ボーナスなし · 実力ランキング", "zh": "所有人同一局 · Hard · 无强化加成 · 实力排名"}, "친구와 점수 대결": {"en": "Score battle with friends", "ja": "友だちとスコア対決", "zh": "与好友比分数"}, "같은 판 {0}웨이브 · 돌려 하기 또는 도전장": {"en": "Same round, Wave {0} · Pass-and-play or challenge", "ja": "同じ盤面 ウェーブ{0} · 交代プレイまたは挑戦状", "zh": "同一局 第{0}波 · 轮流玩或发挑战书"}, "기록에 남길 이름": {"en": "Name for the record", "ja": "記録に残す名前", "zh": "纪录用名字"}, "내 나라": {"en": "My Country", "ja": "自分の国", "zh": "我的国家"}, "디펜스 · 전략 · Medium": {"en": "Defense · Strategy · Medium", "ja": "ディフェンス · 戦略 · Medium", "zh": "塔防 · 策略 · Medium"}, "연승": {"en": "Win streak", "ja": "連勝", "zh": "连胜"}, "· 최고 {0}연승": {"en": "· Best {0} win streak", "ja": "· 最高{0}連勝", "zh": "· 最高{0}连胜"}, "삼삼 금지": {"en": "No Double-Three", "ja": "三三禁止", "zh": "禁止双三"}, "흑 · 백 모두 금지": {"en": "Banned for Black · White", "ja": "黒 · 白ともに禁止", "zh": "黑 · 白均禁止"}, "흑백 모두": {"en": "Both colors", "ja": "黒白とも", "zh": "黑白均禁"}, "흑만": {"en": "Black only", "ja": "黒のみ", "zh": "仅黑方"}, "CPU 대전에서 내 돌": {"en": "My stones vs CPU", "ja": "CPU戦での自分の石", "zh": "人机对战中我的棋子"}, "흑 · 내가 먼저": {"en": "Black · I go first", "ja": "黒 · 自分が先手", "zh": "黑 · 我先手"}, "흑 (먼저)": {"en": "Black (first)", "ja": "黒(先手)", "zh": "黑（先手）"}, "백 (나중)": {"en": "White (second)", "ja": "白(後手)", "zh": "白（后手）"}, "{0}×{1} 판에 먼저 다섯 줄을 만들면 승리. 열린 {2}을 한 번에 두 개 만드는 삼삼은 금지! CPU · 한 기기 둘이서 · 온라인 방 대전.": {"en": "Make five in a row first on a {0}×{1} board. No double-three (two open {2}s in one move)! CPU · Two on one device · Online rooms.", "ja": "{0}×{1}の盤で先に五つ並べたら勝ち。一手で活き{2}を二つ作る三三は禁止!CPU · 1台で2人 · オンライン対戦。", "zh": "在{0}×{1}棋盘上先连成五子即获胜。禁止一步同时形成两个活{2}的双三！人机 · 同机双人 · 在线房间对战。"}, "가로 · 세로 · 대각선 어느 방향이든 내 돌 다섯 개를 먼저 한 줄로 이으세요.": {"en": "Be first to line up five stones in any direction: horizontal · vertical · diagonal.", "ja": "横 · 縦 · 斜め、どの方向でも先に自分の石を五つ一列に並べよう。", "zh": "横 · 竖 · 斜任意方向，先把自己的五颗棋子连成一线。"}, "흑이 먼저 두고, 한 수씩 번갈아 둡니다.": {"en": "Black goes first, then players alternate one move at a time.", "ja": "黒が先手で、一手ずつ交互に打ちます。", "zh": "黑方先下，双方轮流各下一步。"}, "삼삼 금지: 한 수로 \"열린 {0}\"을 두 개 동시에 만드는 자리에는 둘 수 없어요. 지금 둘 수 없는 자리는 판에 빨간 ×로 보여 줘요.": {"en": "No double-three: you can't play a spot that makes two “open {0}s” at once. Spots you can't play now show a red × on the board.", "ja": "三三禁止:一手で「活き{0}」を二つ同時に作る場所には打てません。今打てない場所は盤上に赤い×で表示されます。", "zh": "禁止双三：不能下在一步同时形成两个“活{0}”的位置。当前不能下的位置会在棋盘上显示红色×。"}, "열린 {0}: 양 끝이 비어 있어서 한 수만 더 두면 막을 수 없는 열린 {1}가 되는 세 돌 (한 칸 띈 모양 포함).": {"en": "Open {0}: three stones with both ends empty that become an unstoppable open {1} with one more move (gapped shapes included).", "ja": "活き{0}:両端が空いていて、あと一手で止められない活き{1}になる三つの石(一つ飛びの形も含む)。", "zh": "活{0}：两端皆空、再下一步就会成为无法阻挡的活{1}的三颗棋子（含跳一格的形状）。"}, "다섯이 완성되는 자리는 삼삼이어도 둘 수 있어요. {0}-{1} · {2}-{3}은 허용, 여섯 개 이상도 승리로 쳐요.": {"en": "A move that completes five is allowed even if it's a double-three. {0}-{1} · {2}-{3} are allowed, and six or more also wins.", "ja": "五つが完成する場所なら三三でも打てます。{0}-{1} · {2}-{3}は許可、六つ以上も勝ちになります。", "zh": "能连成五子的位置即使是双三也可以下。{0}-{1} · {2}-{3}允许，六子以上也算获胜。"}, "설정에서 삼삼 금지를 흑백 모두 / 흑만 중에 고를 수 있어요. 온라인에서는 방장 설정을 따라요.": {"en": "In Settings, set No Double-Three to Both colors / Black only. Online follows the host's setting.", "ja": "設定で三三禁止を黒白とも / 黒のみから選べます。オンラインでは部屋主の設定に従います。", "zh": "可在设置中将禁止双三设为黑白均禁 / 仅黑方。在线对战以房主设置为准。"}, "흑": {"en": "Black", "ja": "黒", "zh": "黑"}, "먼저 두는 돌": {"en": "Moves first", "ja": "先手の石", "zh": "先手棋子"}, "백": {"en": "White", "ja": "白", "zh": "白"}, "나중에 두는 돌": {"en": "Moves second", "ja": "後手の石", "zh": "后手棋子"}, "빨간 ×": {"en": "Red ×", "ja": "赤い×", "zh": "红色×"}, "이번 차례에 둘 수 없는 삼삼 자리": {"en": "Double-three spot you can't play this turn", "ja": "この手番で打てない三三の場所", "zh": "本回合不能下的双三位置"}, "빨간 점": {"en": "Red dot", "ja": "赤い点", "zh": "红点"}, "방금 둔 수": {"en": "Last move", "ja": "直前の一手", "zh": "刚下的一步"}, "Medium · {0}연승 중": {"en": "Medium · {0} win streak", "ja": "Medium · {0}連勝中", "zh": "Medium · {0}连胜中"}, "{0}P · 둘이서": {"en": "{0}P · Two players", "ja": "{0}P · 2人で", "zh": "{0}P · 双人"}, "한 기기에서 대전": {"en": "Play on one device", "ja": "1台で対戦", "zh": "同机对战"}, "리그 도전 · {0}번째 상대 새싹": {"en": "League Challenge · Opponent {0}: Rookie", "ja": "リーグ挑戦 · {0}人目の相手 ルーキー", "zh": "联赛挑战 · 第{0}位对手 新手"}, "{0}명을 차례로 꺾으면 우승": {"en": "Beat {0} opponents in a row to win", "ja": "{0}人を順に倒せば優勝", "zh": "依次击败{0}人即夺冠"}, "온라인 대전": {"en": "Online Match", "ja": "オンライン対戦", "zh": "在线对战"}, "방 코드로 친구와 · 서로 다른 폰에서": {"en": "With friends via room code · on separate phones", "ja": "ルームコードで友だちと · 別々のスマホで", "zh": "用房间码和好友 · 各用一部手机"}, "보드 · {0}P/{1}P/온라인 · Medium": {"en": "Board · {0}P/{1}P/Online · Medium", "ja": "ボード · {0}P/{1}P/オンライン · Medium", "zh": "棋类 · {0}P/{1}P/在线 · Medium"}, "균형형 · 주먹과 발 모두 무난": {"en": "Balanced · Solid punches and kicks", "ja": "バランス型 · パンチもキックも安定", "zh": "均衡型 · 拳脚皆稳"}, "강산": {"en": "Rocky", "ja": "ゴウ", "zh": "阿强"}, "하나": {"en": "Hana", "ja": "ハナ", "zh": "小花"}, "곰태": {"en": "Bear", "ja": "クマタ", "zh": "熊太"}, "{0}P 캐릭터 (둘이 할 때)": {"en": "{0}P character (two players)", "ja": "{0}Pキャラ(2人プレイ時)", "zh": "{0}P角色（双人时）"}, "빠른 발 · 발차기 강함": {"en": "Quick feet · Strong kicks", "ja": "俊足 · キックが強い", "zh": "步伐快 · 踢击强"}, "{0}D 시점 격투. 왼손·오른손·왼발·오른발 {1}버튼, 옆걸음으로 피하고, 어퍼컷으로 띄워 공중 콤보! {2}판 {3}선승.": {"en": "{0}D fighting. {1} buttons for left/right punch & kick, sidestep to dodge, launch with an uppercut for air combos! Best of {2}, first to {3}.", "ja": "{0}D視点の格闘。左手・右手・左足・右足の{1}ボタン、横移動でかわし、アッパーで浮かせて空中コンボ!{2}本中{3}本先取。", "zh": "{0}D视角格斗。左拳·右拳·左脚·右脚{1}键，侧移闪避，上勾拳挑空接空中连击！{2}局{3}胜。"}, "상대 체력을 {0}으로 만들어 K.O.! {1}판 중 {2}판을 먼저 이기면 승리 (한 판 {3}초).": {"en": "Drop your opponent's HP to {0} for a K.O.! First to win {2} of {1} rounds wins ({3}s per round).", "ja": "相手の体力を{0}にしてK.O.!{1}本中{2}本先取で勝利(1本{3}秒)。", "zh": "把对手体力打到{0}即可K.O.！{1}局中先赢{2}局获胜（每局{3}秒）。"}, "{0}·{1}는 왼손·오른손, {2}·{3}는 왼발·오른발. {4} → {5} → {6} 처럼 이어 누르면 연속기가 나가요.": {"en": "{0}·{1} are left/right punch, {2}·{3} are left/right kick. Chain like {4} → {5} → {6} for combos.", "ja": "{0}・{1}は左手・右手、{2}・{3}は左足・右足。{4} → {5} → {6}のように続けて押すと連続技に。", "zh": "{0}·{1}为左拳·右拳，{2}·{3}为左脚·右脚。像{4} → {5} → {6}这样连按可打出连招。"}, "막기: 뒤로 누르고 있으면 상단·중단을 막아요. 하단(앉아서 치는 공격)은 앉아서 막아야 해요.": {"en": "Block: hold back to block highs·mids. Lows (crouching attacks) must be blocked crouching.", "ja": "ガード:後ろを押し続けると上段・中段をガード。下段(しゃがみ攻撃)はしゃがんでガード。", "zh": "防御：按住后方向可挡上段·中段。下段（蹲下攻击）需要蹲下防御。"}, "앉으면 상단 공격이 머리 위로 지나가요. 대신 중단에는 맞아요.": {"en": "Crouch and high attacks pass overhead. But mids will hit you.", "ja": "しゃがむと上段攻撃が頭上を通過。ただし中段には当たります。", "zh": "蹲下时上段攻击会从头顶掠过。但会被中段击中。"}, "옆걸음: 위·아래를 짧게 톡. 직선 공격을 옆으로 피해요. 돌려차기처럼 휘는 공격은 못 피해요.": {"en": "Sidestep: quick tap up·down. Dodges straight attacks, but not curving ones like roundhouse kicks.", "ja": "横移動:上・下を短くタップ。直線攻撃を横にかわします。回し蹴りのような曲がる攻撃はかわせません。", "zh": "侧移：轻点上·下。可侧身闪避直线攻击，回旋踢这类弧线攻击躲不开。"}, "앞+{0} 어퍼컷에 맞으면 공중에 떠요. 떨어지기 전에 계속 때리면 공중 콤보!": {"en": "Forward+{0} uppercut launches the foe. Keep hitting before they land for an air combo!", "ja": "前+{0}のアッパーが当たると宙に浮きます。落ちる前に叩き続ければ空中コンボ!", "zh": "被前+{0}上勾拳击中会浮空。落地前持续攻击就是空中连击！"}, "{0}+{1} 동시: 잡기 (막고 있는 상대에게 강함). 체력이 {2}% 아래로 떨어지면 분노 버튼이 한 번 생겨요.": {"en": "{0}+{1} together: Throw (strong vs blocking foes). Below {2}% HP, a one-time Rage button appears.", "ja": "{0}+{1}同時:投げ(ガード中の相手に強い)。体力が{2}%を切ると怒りボタンが一度だけ出現。", "zh": "{0}+{1}同时按：投技（克制防御中的对手）。体力低于{2}%时会出现一次怒气按钮。"}, "상단 ({0} · {1} · {2})": {"en": "High ({0} · {1} · {2})", "ja": "上段({0} · {1} · {2})", "zh": "上段（{0} · {1} · {2}）"}, "서서 막기 가능 · 앉으면 피함": {"en": "Block standing · Dodge by crouching", "ja": "立ちガード可 · しゃがむと回避", "zh": "可站立防御 · 蹲下可躲"}, "중단 ({0} · 앞+{1} · 앞+{2})": {"en": "Mid ({0} · Fwd+{1} · Fwd+{2})", "ja": "中段({0} · 前+{1} · 前+{2})", "zh": "中段（{0} · 前+{1} · 前+{2}）"}, "서서 막기 가능 · 앉으면 맞음": {"en": "Block standing · Hits crouchers", "ja": "立ちガード可 · しゃがむと被弾", "zh": "可站立防御 · 蹲下会中招"}, "하단 (아래+{0} · {1} · {2})": {"en": "Low (Down+{0} · {1} · {2})", "ja": "下段(下+{0} · {1} · {2})", "zh": "下段（下+{0} · {1} · {2}）"}, "앉아서 막기": {"en": "Block crouching", "ja": "しゃがみガード", "zh": "蹲下防御"}, "잡기 ({0}+{1})": {"en": "Throw ({0}+{1})", "ja": "投げ({0}+{1})", "zh": "投技（{0}+{1}）"}, "막기 불가 · 앉은 상대는 못 잡음": {"en": "Unblockable · Can't grab crouching foes", "ja": "ガード不可 · しゃがんだ相手は掴めない", "zh": "无法防御 · 抓不到蹲下的对手"}, "{0}D 격투 · {1}P/{2}P · Medium": {"en": "{0}D Fighting · {1}P/{2}P · Medium", "ja": "{0}D格闘 · {1}P/{2}P · Medium", "zh": "{0}D格斗 · {1}P/{2}P · Medium"}, "· {0}별": {"en": "· {0} stars", "ja": "· 星{0}", "zh": "· {0}星"}, "풀을 심어 동물을 먹이고, 달걀·우유·양털을 주워 빵·치즈·옷감으로 가공해 트럭으로 팔아요. 곰이 오면 연타로 가둬요! 빨리 목표를 채울수록 별이 많아요.": {"en": "Plant grass to feed animals, collect eggs·milk·wool, make bread·cheese·cloth, and sell by truck. Tap fast to trap bears! Hit goals fast for more stars.", "ja": "草を植えて動物にエサをやり、卵・牛乳・羊毛を拾ってパン・チーズ・布に加工し、トラックで売ろう。クマが来たら連打で閉じ込めて!早く目標を達成するほど星が増えます。", "zh": "种草喂动物，捡鸡蛋·牛奶·羊毛，加工成面包·奶酪·布料，再用卡车卖掉。熊来了就连点关起来！越快完成目标星星越多。"}, "단계마다 정해진 목표(달걀 몇 개, 빵 몇 개, 금화 얼마)를 채우면 성공. 빨리 채울수록 별이 많아요 ({0}단계 · 별 {1}개).": {"en": "Hit each stage's goals (eggs, bread, Gold) to clear. Faster means more stars ({0} stages · {1} stars).", "ja": "ステージごとの目標(卵何個、パン何個、ゴールドいくら)を達成でクリア。早いほど星が増えます({0}ステージ · 星{1}個)。", "zh": "完成每关的目标（几个鸡蛋、几个面包、多少金币）即过关。越快星星越多（{0}关 · {1}颗星）。"}, "빈 풀밭을 누르면 풀이 자라요. 우물 물 {0}칸이 들어요. 물이 떨어지면 우물을 눌러 다시 퍼 올리세요.": {"en": "Tap empty grassland to grow grass. Uses {0} well water. When water runs out, tap the well to draw more.", "ja": "空いた草地をタップすると草が生えます。井戸の水を{0}マス使います。水がなくなったら井戸をタップしてくみ直そう。", "zh": "点击空草地就能长草，消耗{0}格井水。水用完了就点水井重新打水。"}, "배고픈 동물(머리 위 노랑·빨강 점)은 풀을 찾아 먹어요. 너무 오래 굶으면 떠나요.": {"en": "Hungry animals (yellow·red dot overhead) look for grass to eat. Starve too long and they leave.", "ja": "お腹がすいた動物(頭上の黄・赤の点)は草を探して食べます。長く空腹だと去ってしまいます。", "zh": "饥饿的动物（头顶黄·红点）会找草吃。饿太久就会离开。"}, "동물이 떨어뜨린 달걀·우유·양털을 눌러 창고에 담아요. 오래 두면 사라져요 (깜빡이면 곧 사라짐).": {"en": "Tap eggs·milk·wool that animals drop to store them. Leave them too long and they vanish (blinking = soon gone).", "ja": "動物が落とした卵・牛乳・羊毛をタップして倉庫へ。放っておくと消えます(点滅したらもうすぐ消える)。", "zh": "点击动物掉落的鸡蛋·牛奶·羊毛放进仓库。放太久会消失（闪烁表示快消失了）。"}, "공방(빵집·치즈 공방·베틀)을 지으면 재료를 더 비싼 물건으로 가공해요.": {"en": "Build workshops (bakery·cheese shop·loom) to turn goods into pricier items.", "ja": "工房(パン屋・チーズ工房・機織り)を建てると材料をもっと高い品に加工できます。", "zh": "建造工坊（面包房·奶酪坊·织布机）就能把原料加工成更值钱的商品。"}, "트럭을 누르면 창고 물건을 모두 싣고 시장에 가서 금화로 바꿔 와요.": {"en": "Tap the truck to load everything in storage and sell it at market for Gold.", "ja": "トラックをタップすると倉庫の品を全部積んで市場でゴールドに換えてきます。", "zh": "点击卡车，会装上仓库所有货物去市场换成金币。"}, "곰이 오면 동물을 노려요. 여러 번 눌러 우리에 가두고, 우리째 팔 수 있어요.": {"en": "Bears go after your animals. Tap repeatedly to cage them, then sell them, cage and all.", "ja": "クマが来ると動物を狙います。何度もタップして檻に閉じ込め、檻ごと売れます。", "zh": "熊来了会盯上动物。连点多次把它关进笼子，还能连笼一起卖掉。"}, "달걀 · 우유 · 양털": {"en": "Eggs · Milk · Wool", "ja": "卵 · 牛乳 · 羊毛", "zh": "鸡蛋 · 牛奶 · 羊毛"}, "닭 · 소 · 양이 생산": {"en": "From chickens · cows · sheep", "ja": "ニワトリ · ウシ · ヒツジが生産", "zh": "鸡 · 牛 · 羊产出"}, "빵 · 치즈 · 옷감": {"en": "Bread · Cheese · Cloth", "ja": "パン · チーズ · 布", "zh": "面包 · 奶酪 · 布料"}, "공방에서 가공 · 비싸게 팔림": {"en": "Made in workshops · Sell high", "ja": "工房で加工 · 高く売れる", "zh": "工坊加工 · 卖价高"}, "우물": {"en": "Well", "ja": "井戸", "zh": "水井"}, "풀 {0}번 = 물 {1}칸": {"en": "{0} grass = {1} water", "ja": "草{0}回 = 水{1}マス", "zh": "草{0}次 = 水{1}格"}, "곰": {"en": "Bear", "ja": "クマ", "zh": "熊"}, "여러 번 눌러 가두기": {"en": "Tap repeatedly to cage", "ja": "何度もタップで閉じ込め", "zh": "连点关进笼子"}, "농장으로 가기": {"en": "Go to Farm", "ja": "農場へ", "zh": "前往农场"}, "{0}단계 · 단계마다 별 {1}개": {"en": "{0} stages · {1} stars each", "ja": "{0}ステージ · 各ステージ星{1}個", "zh": "{0}关 · 每关{1}颗星"}, "농장 경영 · 시간 도전 · Medium": {"en": "Farm Sim · Time Challenge · Medium", "ja": "農場経営 · タイムチャレンジ · Medium", "zh": "农场经营 · 限时挑战 · Medium"}, "순위": {"en": "Rank", "ja": "順位", "zh": "排名"}, "· {0}번 {1}위": {"en": "· {0} times #{1}", "ja": "· {0}回 {1}位", "zh": "· {0}次第{1}名"}, "내 카트 · 코인 {0}": {"en": "My Kart · Coins {0}", "ja": "マイカート · コイン{0}", "zh": "我的卡丁车 · 金币{0}"}, "꼬마 카트": {"en": "Mini Kart", "ja": "ミニカート", "zh": "迷你卡丁车"}, "번개호": {"en": "Thunderbolt", "ja": "イナズマ号", "zh": "闪电号"}, "코인 {0}": {"en": "Coins {0}", "ja": "コイン{0}", "zh": "金币{0}"}, "꿀벌호": {"en": "Bumblebee", "ja": "ミツバチ号", "zh": "蜜蜂号"}, "초록 질주": {"en": "Green Dash", "ja": "グリーンダッシュ", "zh": "绿色疾驰"}, "보라 유성": {"en": "Purple Meteor", "ja": "パープルメテオ", "zh": "紫色流星"}, "황금 왕관": {"en": "Gold Crown", "ja": "ゴールドクラウン", "zh": "黄金王冠"}, "꼬마 카트: 속도 {0} · 가속 {1} · 핸들 {2} · 드리프트 {3}": {"en": "Mini Kart: Speed {0} · Accel {1} · Handling {2} · Drift {3}", "ja": "ミニカート:スピード{0} · 加速{1} · ハンドル{2} · ドリフト{3}", "zh": "迷你卡丁车：速度{0} · 加速{1} · 操控{2} · 漂移{3}"}, "레이스 모드": {"en": "Race Mode", "ja": "レースモード", "zh": "比赛模式"}, "한 판 레이스": {"en": "Single Race", "ja": "シングルレース", "zh": "单场比赛"}, "한 판": {"en": "Single", "ja": "1レース", "zh": "单场"}, "그랑프리 ({0}트랙)": {"en": "Grand Prix ({0} tracks)", "ja": "グランプリ({0}トラック)", "zh": "大奖赛（{0}条赛道）"}, "트랙": {"en": "Track", "ja": "トラック", "zh": "赛道"}, "햇살 시티": {"en": "Sunny City", "ja": "サニーシティ", "zh": "阳光城"}, "숲속 계곡": {"en": "Forest Valley", "ja": "森の渓谷", "zh": "森林溪谷"}, "노을 해안": {"en": "Sunset Coast", "ja": "夕焼け海岸", "zh": "晚霞海岸"}, "아이템 상자를 먹고 물풍선·미사일·바나나로 견제! 드리프트를 길게 할수록 불꽃이 파랑→주황→보라로 바뀌며 더 센 가속. 코인을 모아 더 빠른 카트를 사세요.": {"en": "Grab item boxes and harass rivals with water balloons·missiles·bananas! Longer Drifts turn sparks blue→orange→purple for bigger boosts. Collect coins for faster karts.", "ja": "アイテムボックスを取って水風船・ミサイル・バナナで妨害!ドリフトが長いほど火花が青→オレンジ→紫に変わり加速アップ。コインを集めて速いカートを買おう。", "zh": "吃道具箱，用水球·导弹·香蕉干扰对手！漂移越久火花由蓝→橙→紫，加速越猛。收集金币买更快的卡丁车。"}, "CPU 카트 {0}대와 {1}바퀴 아이템전. {2}위를 노리고 코인을 모아 더 좋은 카트를 사세요.": {"en": "Item race vs {0} CPU karts over {1} laps. Aim for #{2} and earn coins for better karts.", "ja": "CPUカート{0}台と{1}周のアイテム戦。{2}位を目指し、コインを集めていいカートを買おう。", "zh": "与{0}辆电脑卡丁车进行{1}圈道具赛。冲击第{2}名，攒金币买更好的车。"}, "자동으로 달려요. 도로 밖 풀밭에서는 느려져요.": {"en": "Driving is automatic. You slow down on grass off the road.", "ja": "自動で走ります。コース外の草地では遅くなります。", "zh": "自动行驶。驶出路面到草地会减速。"}, "드리프트 버튼을 누른 채 꺾으면 미끄러져요. 같은 방향으로 더 꺾으면 크게, 반대로 꺾으면 작게 돌아요.": {"en": "Hold the Drift button while steering to slide. Steer more the same way for a wide turn, the opposite way for a tight one.", "ja": "ドリフトボタンを押したまま曲がると滑ります。同じ方向にさらに切ると大きく、逆に切ると小さく回ります。", "zh": "按住漂移键转向即可滑行。同方向多打方向转大弯，反方向打则转小弯。"}, "길게 미끄러질수록 불꽃이 하양 → 파랑 → 주황 → 보라. 손을 떼는 순간 그 색만큼 가속!": {"en": "The longer you slide, sparks go white → blue → orange → purple. Release for a boost matching the color!", "ja": "長く滑るほど火花が白 → 青 → オレンジ → 紫に。離した瞬間その色に応じて加速!", "zh": "滑行越久火花由白 → 蓝 → 橙 → 紫。松手瞬间按颜色加速！"}, "드리프트를 끝내자마자 드리프트 버튼을 한 번 더 톡: 순간 부스터.": {"en": "Tap Drift once more right as the Drift ends: instant boost.", "ja": "ドリフト終了直後にもう一度ドリフトボタンをタップ:瞬間ブースト。", "zh": "漂移结束后立刻再点一次漂移键：瞬间加速。"}, "게이지가 차면 부스터 {0}개(최대 {1}개). 부스터 중엔 앞 차를 밀어낼 수 있어요.": {"en": "Full gauge = {0} boost (max {1}). While boosting you can shove cars ahead.", "ja": "ゲージが満タンでブースト{0}個(最大{1}個)。ブースト中は前の車を押しのけられます。", "zh": "能量满了获得{0}个加速（最多{1}个）。加速时可以撞开前车。"}, "? 상자: 아이템 ({0}칸). 순위가 낮을수록 센 아이템이 나와요.": {"en": "? Box: Item ({0} slots). The lower your rank, the stronger the item.", "ja": "?ボックス:アイテム({0}枠)。順位が低いほど強いアイテムが出ます。", "zh": "?箱：道具（{0}格）。名次越低，道具越强。"}, "원뿔·통나무·게·기름·바나나에 닿으면 미끄러지거나 느려져요.": {"en": "Cones·logs·crabs·oil·bananas make you spin or slow down.", "ja": "コーン・丸太・カニ・オイル・バナナに触れるとスリップや減速。", "zh": "碰到路锥·圆木·螃蟹·油渍·香蕉会打滑或减速。"}, "코인과 순위 상금으로 차고에서 카트를 사요. 카트마다 속도·가속·핸들·드리프트가 달라요.": {"en": "Buy karts in the garage with coins and race prizes. Each kart has different Speed·Accel·Handling·Drift.", "ja": "コインと順位賞金でガレージのカートを購入。カートごとにスピード・加速・ハンドル・ドリフトが違います。", "zh": "用金币和名次奖金在车库买卡丁车。每辆车的速度·加速·操控·漂移各不相同。"}, "바로 가속": {"en": "Instant boost", "ja": "即加速", "zh": "立即加速"}, "바나나": {"en": "Banana", "ja": "バナナ", "zh": "香蕉"}, "뒤에 떨어뜨려 함정": {"en": "Drop behind as a trap", "ja": "後ろに落として罠に", "zh": "丢在身后当陷阱"}, "물풍선": {"en": "Water Balloon", "ja": "水風船", "zh": "水球"}, "앞 차를 잠깐 가둠": {"en": "Briefly traps the car ahead", "ja": "前の車を一瞬閉じ込める", "zh": "短暂困住前车"}, "미사일": {"en": "Missile", "ja": "ミサイル", "zh": "导弹"}, "멀리 있는 앞 차까지 따라가 명중": {"en": "Homes in on far cars ahead", "ja": "遠くの前の車まで追尾して命中", "zh": "追踪远处前车并命中"}, "방패": {"en": "Shield", "ja": "シールド", "zh": "护盾"}, "공격 {0}번 막음": {"en": "Blocks {0} attack", "ja": "攻撃を{0}回防ぐ", "zh": "抵挡{0}次攻击"}, "앞 차를 향해 끌려가듯 가속": {"en": "Pulls you toward the car ahead", "ja": "前の車に引き寄せられるように加速", "zh": "像被牵引般冲向前车"}, "번개": {"en": "Lightning", "ja": "イナズマ", "zh": "闪电"}, "뒤처졌을 때만 · 모든 상대 멈칫": {"en": "Only when behind · All rivals stall", "ja": "遅れている時だけ · 全員一瞬停止", "zh": "仅落后时 · 所有对手停顿"}, "출발하기": {"en": "Start", "ja": "スタート", "zh": "出发"}, "CPU {0}대 · {1}바퀴 · 코인으로 새 카트": {"en": "{0} CPUs · {1} laps · New karts with coins", "ja": "CPU{0}台 · {1}周 · コインで新カート", "zh": "电脑{0}辆 · {1}圈 · 金币买新车"}, "레이싱 · 아이템전 · Medium": {"en": "Racing · Item Battle · Medium", "ja": "レース · アイテム戦 · Medium", "zh": "竞速 · 道具赛 · Medium"}, "게임 속도": {"en": "Game Speed", "ja": "ゲームスピード", "zh": "游戏速度"}, "보통": {"en": "Normal", "ja": "ふつう", "zh": "普通"}, "느림": {"en": "Slow", "ja": "おそい", "zh": "慢"}, "빠름": {"en": "Fast", "ja": "はやい", "zh": "快"}, "승리 점수": {"en": "Winning Score", "ja": "勝利点", "zh": "获胜分数"}, "{0}점 먼저 따면 승리": {"en": "First to {0} points wins", "ja": "{0}点先取で勝利", "zh": "先得{0}分获胜"}, "{0}점제": {"en": "{0} pts", "ja": "{0}点制", "zh": "{0}分制"}, "통통 튀는 {0}:{1} 배구. 방향 + 스매시로 강타 방향을 고르고, 땅에서 스매시를 누르면 몸을 날려 받아냅니다. {2}·{3}·{4}점제 선택.": {"en": "Bouncy {0}:{1} volleyball. Use direction + Smash to aim spikes; Smash on the ground to dive for the ball. Play to {2}·{3}·{4}.", "ja": "ぽんぽん弾む{0}:{1}バレー。方向+スマッシュで強打の向きを選び、地上でスマッシュを押すと飛び込んでレシーブ。{2}・{3}・{4}点制から選択。", "zh": "弹来弹去的{0}:{1}排球。方向+扣球选择扣杀方向，在地面按扣球可飞身救球。可选{2}·{3}·{4}分制。"}, "공을 상대 코트 바닥에 떨어뜨려 정한 점수({0} · {1} · {2}점)를 먼저 따세요.": {"en": "Land the ball on your rival's court and reach the set score ({0} · {1} · {2} pts) first.", "ja": "ボールを相手コートに落とし、決めた点数({0} · {1} · {2}点)を先に取ろう。", "zh": "把球打落在对方场地，先拿到设定分数（{0} · {1} · {2}分）。"}, "공이 내 코트 바닥에 닿으면 상대가 {0}점. 점수를 딴 쪽이 다음 서브를 넣어요.": {"en": "If the ball hits your floor, your rival scores {0}. The scorer serves next.", "ja": "ボールが自分のコートに落ちると相手に{0}点。得点した側が次にサーブします。", "zh": "球落在己方场地，对方得{0}分。得分方发下一球。"}, "머리·몸에 맞은 공은 맞은 위치에서 먼 쪽으로 튕겨 나갑니다. 가장자리에 맞힐수록 멀리 가요.": {"en": "Balls bounce off your head·body away from the contact point. Hit closer to the edge to send it farther.", "ja": "頭・体に当たったボールは当たった位置から遠い方へはね返ります。端で当てるほど遠くへ飛びます。", "zh": "打在头·身上的球会朝远离接触点的方向弹出。越靠边缘击中飞得越远。"}, "▲(위 방향)로 점프하고, 공중에서 스매시: 누르고 있는 방향에 따라 강타 방향이 바뀝니다.": {"en": "Jump with ▲ (up), then Smash in the air: the direction you hold changes the spike angle.", "ja": "▲(上)でジャンプし、空中でスマッシュ:押している方向で強打の向きが変わります。", "zh": "按▲（上）跳起，空中扣球：按住的方向决定扣杀方向。"}, "땅에서 방향키와 스매시를 함께 누르면 그쪽으로 몸을 날려(다이빙) 먼 공을 받아냅니다. 착지 후 잠깐 누워 있어요.": {"en": "On the ground, press a direction and Smash together to dive that way for far balls. You'll lie down briefly after landing.", "ja": "地上で方向キーとスマッシュを同時に押すとその方向に飛び込み(ダイビング)遠いボールを拾います。着地後は少し倒れたまま。", "zh": "在地面同时按方向键和扣球，会向该方向飞扑（鱼跃）救远球。落地后会短暂躺下。"}, "공이 바닥에 떨어지는 순간 잠깐 슬로 모션이 걸려요.": {"en": "Slow motion kicks in briefly when the ball hits the floor.", "ja": "ボールが床に落ちる瞬間、少しスローモーションになります。", "zh": "球落地的瞬间会短暂慢动作。"}, "스매시만": {"en": "Smash only", "ja": "スマッシュのみ", "zh": "仅扣球"}, "수평 강스파이크": {"en": "Flat power spike", "ja": "水平の強スパイク", "zh"
