 "Italy", "ja": "イタリア", "zh": "意大利"}, "포르투갈": {"en": "Portugal", "ja": "ポルトガル", "zh": "葡萄牙"}, "네덜란드": {"en": "Netherlands", "ja": "オランダ", "zh": "荷兰"}, "미국": {"en": "USA", "ja": "アメリカ", "zh": "美国"}, "내 선수": {"en": "My Player", "ja": "マイ選手", "zh": "我的球员"}, "민트 · 균형형 · 파워: 불꽃슛 (직선 강타)": {"en": "Mint · Balanced · Power: Fire Shot (straight blast)", "ja": "ミント · バランス型 · パワー:炎シュート(直線強打)", "zh": "薄荷 · 均衡型 · 必杀：火焰射门（直线重射）"}, "민트": {"en": "Mint", "ja": "ミント", "zh": "薄荷"}, "탱크": {"en": "Tank", "ja": "タンク", "zh": "坦克"}, "스프링": {"en": "Spring", "ja": "スプリング", "zh": "弹簧"}, "박사": {"en": "Doc", "ja": "ハカセ", "zh": "博士"}, "캡틴": {"en": "Captain", "ja": "キャプテン", "zh": "队长"}, "{0}P 나라": {"en": "{0}P Country", "ja": "{0}Pの国", "zh": "{0}P国家"}, "일본 유니폼": {"en": "Japan kit", "ja": "日本ユニフォーム", "zh": "日本球衣"}, "{0}P 선수 (둘이 하기)": {"en": "{0}P Player (two players)", "ja": "{0}P選手(2人プレイ)", "zh": "{0}P球员（双人）"}, "번개 · 빠른 발 · 파워: 번개슛 (가장 빠른 슛)": {"en": "Bolt · Quick feet · Power: Lightning Shot (fastest shot)", "ja": "イナズマ · 俊足 · パワー:イナズマシュート(最速シュート)", "zh": "闪电 · 速度快 · 必杀：闪电射门（最快射门）"}, "나라와 선수를 골라 {0}:{1} 머리 큰 축구. {2}초 승부, 동점이면 서든 데스! 게이지가 차면 파워 버튼으로 불꽃슛.": {"en": "Pick a country and player for {0}:{1} big-head soccer. {2}s matches, sudden death on a tie! Fill the gauge and hit Power for a Fire Shot.", "ja": "国と選手を選んで{0}:{1}のデカ頭サッカー。{2}秒勝負、同点ならサドンデス!ゲージが満タンになったらパワーボタンで炎シュート。", "zh": "选择国家和球员进行{0}:{1}大头足球。{2}秒决胜，平局进入突然死亡！能量满了按必杀键射出火焰射门。"}, "{0}초 동안 상대 골대(오른쪽)에 더 많이 넣으면 승리. 동점이면 서든 데스(먼저 넣는 쪽이 승리).": {"en": "Score more in the rival's goal (right) in {0}s to win. Tie = sudden death (next goal wins).", "ja": "{0}秒間で相手ゴール(右)により多く入れたら勝ち。同点ならサドンデス(先に決めた方が勝ち)。", "zh": "{0}秒内往对方球门（右侧）进球更多者获胜。平局进入突然死亡（先进球者胜）。"}, "머리 · 몸 · 발로 공을 다룹니다. 킥 버튼은 발차기, 점프 헤딩도 가능해요.": {"en": "Play the ball with head · body · feet. Kick button kicks, and jump headers work too.", "ja": "頭 · 体 · 足でボールを操ります。キックボタンでキック、ジャンプヘディングもOK。", "zh": "用头 · 身体 · 脚控球。踢球键踢球，也可以跳起头球。"}, "같은 방향을 빠르게 두 번 누르면 대시(순간 돌진). 파란 막대가 다시 찰 때까지 기다려야 해요.": {"en": "Double-tap a direction to Dash (quick burst). Wait for the blue bar to refill.", "ja": "同じ方向をすばやく2回押すとダッシュ(瞬間突進)。青いバーが再びたまるまで待とう。", "zh": "快速连按两次同一方向可冲刺（瞬间突进）。需等蓝条重新充满。"}, "파워 게이지는 시간이 지나거나 공을 만질수록 찹니다. 가득 차면 파워 버튼으로 선수마다 다른 파워슛을 씁니다 (선수마다 고유 필살기).": {"en": "The Power gauge fills over time and as you touch the ball. When full, hit Power for each player's unique Power Shot (signature move).", "ja": "パワーゲージは時間経過やボールに触れるほどたまります。満タンでパワーボタンを押すと選手ごとに違うパワーシュート(固有の必殺技)。", "zh": "必杀能量随时间和触球增加。满了按必杀键，每位球员会使出各自不同的必杀射门（专属绝招）。"}, "서든 데스 중에는 파워 게이지가 차지 않고 파워도 쓸 수 없어요.": {"en": "During sudden death the Power gauge doesn't fill and Power can't be used.", "ja": "サドンデス中はパワーゲージがたまらず、パワーも使えません。", "zh": "突然死亡期间必杀能量不会增加，也无法使用必杀。"}, "공중에 아이템 방울이 떠요. 공으로 맞히면 효과가 납니다 (시작 화면에서 끄기 가능).": {"en": "Item bubbles float in the air. Hit them with the ball to trigger effects (can turn off on start screen).", "ja": "空中にアイテムの玉が浮かびます。ボールで当てると効果発動(スタート画面でオフ可能)。", "zh": "空中会漂浮道具泡泡。用球击中触发效果（可在开始界面关闭）。"}, "나라(유니폼)와 선수를 고를 수 있고, 선수마다 속도·점프·슛·게이지 능력이 달라요.": {"en": "Pick a country (kit) and player; each player has different speed·jump·shot·gauge stats.", "ja": "国(ユニフォーム)と選手を選べ、選手ごとにスピード・ジャンプ・シュート・ゲージ能力が違います。", "zh": "可选择国家（球衣）和球员，每位球员的速度·跳跃·射门·能量能力各不相同。"}, "월드컵 모드: {0}강 → {1}강 → {2}강 → 결승. 이길수록 상대가 강해지고, 한 번 지면 탈락. {3}연승이면 트로피 (도중에 나가도 다음 판에서 이어져요).": {"en": "World Cup mode: Round of {0} → {1} → {2} → Final. Rivals get tougher as you win; one loss and you're out. {3} wins in a row = trophy (progress carries over if you quit).", "ja": "ワールドカップモード:ベスト{0} → ベスト{1} → ベスト{2} → 決勝。勝つほど相手が強くなり、一度負けたら敗退。{3}連勝でトロフィー(途中でやめても次回続きから)。", "zh": "世界杯模式：{0}强 → {1}强 → {2}强 → 决赛。越赢对手越强，输一场即淘汰。{3}连胜得奖杯（中途退出下次可继续）。"}, "선수별 파워슛": {"en": "Player Power Shots", "ja": "選手別パワーシュート", "zh": "球员专属必杀射门"}, "불꽃 · 번개 · 대포(기절) · 스카이 드롭 · 지그재그 · 바나나": {"en": "Fire · Lightning · Cannon (stun) · Sky Drop · Zigzag · Banana", "ja": "炎 · イナズマ · 大砲(気絶) · スカイドロップ · ジグザグ · バナナ", "zh": "火焰 · 闪电 · 大炮（眩晕） · 天降 · 之字形 · 香蕉"}, "대시": {"en": "Dash", "ja": "ダッシュ", "zh": "冲刺"}, "같은 방향 두 번": {"en": "Same direction twice", "ja": "同じ方向を2回", "zh": "同方向按两次"}, "서든 데스": {"en": "Sudden Death", "ja": "サドンデス", "zh": "突然死亡"}, "동점이면 다음 골로 결판": {"en": "Tie? Next goal decides it", "ja": "同点なら次のゴールで決着", "zh": "平局时下一球定胜负"}, "선수 능력": {"en": "Player Stats", "ja": "選手能力", "zh": "球员能力"}, "번개=발, 탱크=슛, 스프링=점프, 박사=게이지": {"en": "Bolt=Feet, Tank=Shot, Spring=Jump, Doc=Gauge", "ja": "イナズマ=足、タンク=シュート、スプリング=ジャンプ、ハカセ=ゲージ", "zh": "闪电=速度，坦克=射门，弹簧=跳跃，博士=能量"}, "큰 공 · 작은 공": {"en": "Big Ball · Small Ball", "ja": "大きいボール · 小さいボール", "zh": "大球 · 小球"}, "공으로 아이템 방울을 건드리면 {0}초간 공 크기가 바뀜": {"en": "Ball touches the item bubble: ball size changes for {0}s", "ja": "ボールでアイテムの玉に触れると{0}秒間ボールの大きさが変わる", "zh": "用球碰到道具泡泡，球的大小改变{0}秒"}, "얼음": {"en": "Ice", "ja": "氷", "zh": "冰冻"}, "마지막으로 공을 찬 선수의 상대가 {0}초 얼어붙음": {"en": "The last kicker's rival freezes for {0}s", "ja": "最後にボールを蹴った選手の相手が{0}秒凍る", "zh": "最后踢球者的对手被冻住{0}秒"}, "왕머리": {"en": "Bobblehead", "ja": "デカ頭", "zh": "大头"}, "마지막으로 공을 찬 선수의 머리가 {0}초간 커짐": {"en": "The last kicker's head grows for {0}s", "ja": "最後にボールを蹴った選手の頭が{0}秒間大きくなる", "zh": "最后踢球者的头变大{0}秒"}, "권법가 · 균형형 · 특수: 장풍": {"en": "Brawler · Balanced · Special: Air Blast", "ja": "拳法家 · バランス型 · 特殊:掌風", "zh": "拳法家 · 均衡型 · 特技：掌风"}, "권법가": {"en": "Brawler", "ja": "拳法家", "zh": "拳法家"}, "검객": {"en": "Swordsman", "ja": "剣士", "zh": "剑客"}, "봉술가": {"en": "Staff Fighter", "ja": "棒術家", "zh": "棍术家"}, "닌자": {"en": "Ninja", "ja": "忍者", "zh": "忍者"}, "{0}P 캐릭터 (둘이 하기)": {"en": "{0}P character (two players)", "ja": "{0}Pキャラ(2人プレイ)", "zh": "{0}P角色（双人）"}, "검객 · 긴 칼 · 특수: 돌진베기 (장풍 관통)": {"en": "Swordsman · Long blade · Special: Dash Slash (pierces Air Blast)", "ja": "剣士 · 長い剣 · 特殊:突進斬り(掌風を貫通)", "zh": "剑客 · 长剑 · 特技：突进斩（贯穿掌风）"}, "막대인간 {0}명 중 골라 {1}:{2} 격투. 주먹 · 발차기 버튼이 따로! 캐릭터마다 고유 특수기와 가위바위보 상성이 있어요. {3}판 {4}선승.": {"en": "Pick from {0} stick fighters for {1}:{2} battles. Separate punch · kick buttons! Each has a unique special and rock-paper-scissors matchups. Best of {3}, first to {4}.", "ja": "棒人間{0}人から選んで{1}:{2}の格闘。パンチ · キックボタンが別々!キャラごとに固有の特殊技とじゃんけん相性あり。{3}本中{4}本先取。", "zh": "从{0}名火柴人中选择进行{1}:{2}格斗。拳 · 脚按键分开！每个角色都有专属特技和石头剪刀布克制关系。{3}局{4}胜。"}, "상대 체력을 {0}으로 만들면 라운드 승리. {1}판 {2}선승입니다.": {"en": "Drop the rival's HP to {0} to win the round. Best of {1}, first to {2}.", "ja": "相手の体力を{0}にするとラウンド勝利。{1}本中{2}本先取です。", "zh": "把对手体力打到{0}即赢下本局。{1}局{2}胜。"}, "캐릭터 {0}명(권법가 · 검객 · 봉술가 · 닌자)마다 무기 사거리, 속도, 고유 특수기가 다릅니다.": {"en": "Each of the {0} characters (Brawler · Swordsman · Staff Fighter · Ninja) has different reach, speed, and special.", "ja": "キャラ{0}人(拳法家 · 剣士 · 棒術家 · 忍者)ごとに武器のリーチ、速さ、固有の特殊技が違います。", "zh": "{0}名角色（拳法家 · 剑客 · 棍术家 · 忍者）的武器距离、速度和专属特技各不相同。"}, "특수기 상성: 회전봉은 장풍을 되받아치고, 돌진베기는 장풍을 뚫고, 순간이동은 돌진베기를 피하고, 회전봉은 뒤로 온 닌자도 때려요.": {"en": "Special matchups: Spinning Staff reflects Air Blast, Dash Slash pierces Air Blast, Teleport dodges Dash Slash, and Spinning Staff hits Ninjas from behind.", "ja": "特殊技の相性:回転棒は掌風を跳ね返し、突進斬りは掌風を貫き、瞬間移動は突進斬りをかわし、回転棒は背後に回った忍者も叩きます。", "zh": "特技克制：旋转棍可反弹掌风，突进斩可贯穿掌风，瞬移可躲开突进斩，旋转棍还能打到绕到背后的忍者。"}, "주먹과 발차기 버튼이 따로 있어요. 주먹을 연타하면 잽 → 스트레이트 → 돌려차기 {0}단 콤보, 잽 · 스트레이트 뒤에 발차기를 누르면 바로 돌려차기로 이어져요.": {"en": "Punch and kick have separate buttons. Mash punch for a {0}-hit jab → straight → roundhouse combo; press kick after jab · straight to go straight to the roundhouse.", "ja": "パンチとキックのボタンは別々。パンチ連打でジャブ → ストレート → 回し蹴りの{0}段コンボ、ジャブ · ストレートの後にキックを押すとすぐ回し蹴りへ。", "zh": "拳和脚按键分开。连按拳打出刺拳 → 直拳 → 回旋踢{0}段连招，刺拳 · 直拳后按踢可直接接回旋踢。"}, "방향과 공격을 조합하면 기술이 바뀝니다 (아래 기술표 참고).": {"en": "Combine direction and attack to change moves (see the move list below).", "ja": "方向と攻撃の組み合わせで技が変わります(下の技表を参照)。", "zh": "方向与攻击组合可改变招式（参考下方招式表）。"}, "가위바위보 상성: 때리기 → 잡기를 이기고, 잡기 → 막기 · 반격기를 이기고, 반격기 → 때리기를 이겨요. 상대 습관을 읽으세요.": {"en": "RPS matchups: Strikes → beat Throws, Throws → beat Blocks · Counters, Counters → beat Strikes. Read your rival's habits.", "ja": "じゃんけん相性:打撃 → 投げに勝ち、投げ → ガード · 返し技に勝ち、返し技 → 打撃に勝つ。相手のクセを読もう。", "zh": "石头剪刀布克制：打击 → 克投技，投技 → 克防御 · 反击技，反击技 → 克打击。读懂对手的习惯。"}, "상대 반대쪽으로 방향을 누르고 있으면 막기(피해 {0}% 감소). 다리 쓸기는 앉아서 막아야 하고, 내려찍기는 서서 막아야 해요.": {"en": "Hold away from the rival to block ({0}% less damage). Block leg sweeps crouching and slams standing.", "ja": "相手と反対方向を押し続けるとガード(ダメージ{0}%減)。足払いはしゃがんで、叩きつけは立ってガード。", "zh": "按住远离对手的方向即可防御（伤害减少{0}%）。扫腿要蹲下防，下劈要站着防。"}, "▼로 앉으면 장풍이 머리 위로 지나갑니다.": {"en": "Crouch with ▼ and Air Blasts pass overhead.", "ja": "▼でしゃがむと掌風が頭上を通過します。", "zh": "按▼蹲下，掌风会从头顶掠过。"}, "때리거나 맞으면 기 게이지가 차고, 절반 이상이면 특수(장풍)를 쏠 수 있어요. {0}초가 지나면 체력이 많은 쪽이 승리.": {"en": "Hitting or getting hit fills the Ki gauge; at half or more, fire your special (Air Blast). After {0}s, the one with more HP wins.", "ja": "攻撃したりされたりすると気ゲージがたまり、半分以上で特殊技(掌風)が撃てます。{0}秒経つと体力の多い方が勝ち。", "zh": "攻击或被打都会积攒气槽，过半即可发出特技（掌风）。{0}秒后体力多的一方获胜。"}, "앞 + 주먹 (붙어서)": {"en": "Fwd + Punch (close)", "ja": "前 + パンチ(密着)", "zh": "前 + 拳（贴身）"}, "잡기 · 막기와 반격기를 뚫고 뒤로 던짐 (때리기엔 짐)": {"en": "Throw · Beats blocks and counters, tosses behind (loses to strikes)", "ja": "投げ · ガードと返し技を崩して後ろへ投げる(打撃に負ける)", "zh": "投技 · 破防御和反击技向后摔（输给打击）"}, "뒤 + 주먹": {"en": "Back + Punch", "ja": "後ろ + パンチ", "zh": "后 + 拳"}, "반격기 · {0}초 안에 맞으면 받아치기 (잡기엔 짐)": {"en": "Counter · Hit within {0}s to strike back (loses to throws)", "ja": "返し技 · {0}秒以内に攻撃されると反撃(投げに負ける)", "zh": "反击技 · {0}秒内被打就反击（输给投技）"}, "점프 + 주먹": {"en": "Jump + Punch", "ja": "ジャンプ + パンチ", "zh": "跳 + 拳"}, "어퍼컷 · 공중의 상대를 높이 띄움": {"en": "Uppercut · Launches airborne rivals high", "ja": "アッパー · 空中の相手を高く打ち上げる", "zh": "上勾拳 · 把空中的对手打得更高"}, "앞 + 점프 + 주먹": {"en": "Fwd + Jump + Punch", "ja": "前 + ジャンプ + パンチ", "zh": "前 + 跳 + 拳"}, "솟구치는 주먹 · 가장 센 기술({0})": {"en": "Rising Fist · Strongest move ({0})", "ja": "昇り拳 · 最強の技({0})", "zh": "升龙拳 · 最强招式（{0}）"}, "▼ + 발차기 (또는 ▼ + 주먹)": {"en": "▼ + Kick (or ▼ + Punch)", "ja": "▼ + キック(または ▼ + パンチ)", "zh": "▼ + 踢（或 ▼ + 拳）"}, "다리 쓸기 · 서서 막기를 뚫음": {"en": "Leg Sweep · Breaks standing guard", "ja": "足払い · 立ちガードを崩す", "zh": "扫腿 · 破站立防御"}, "공중 ▼ + 발차기": {"en": "Air ▼ + Kick", "ja": "空中 ▼ + キック", "zh": "空中 ▼ + 踢"}, "내려찍기 · 앉아 막기를 뚫음": {"en": "Slam · Breaks crouching guard", "ja": "叩きつけ · しゃがみガードを崩す", "zh": "下劈 · 破蹲下防御"}, "발차기": {"en": "Kick", "ja": "キック", "zh": "踢"}, "묵직한 돌려차기 · 멀리 밀어냄": {"en": "Heavy roundhouse · Knocks far back", "ja": "重い回し蹴り · 遠くへ押し出す", "zh": "重回旋踢 · 击退很远"}, "앞 · 앞 (두 번)": {"en": "Fwd · Fwd (twice)", "ja": "前 · 前(2回)", "zh": "前 · 前（两次）"}, "돌진 기술: 베기 · 내려치기 · 펀치 · 발차기 (앉아 막기 뚫음)": {"en": "Dash moves: Slash · Chop · Punch · Kick (breaks crouching guard)", "ja": "突進技:斬り · 振り下ろし · パンチ · キック(しゃがみガードを崩す)", "zh": "突进技：斩 · 劈 · 拳 · 踢（破蹲下防御）"}, "특수 (기 {0})": {"en": "Special (Ki {0})", "ja": "特殊(気{0})", "zh": "特技（气{0}）"}, "캐릭터별: 장풍 · 돌진베기 · 회전봉 · 순간이동": {"en": "By character: Air Blast · Dash Slash · Spinning Staff · Teleport", "ja": "キャラ別:掌風 · 突進斬り · 回転棒 · 瞬間移動", "zh": "按角色：掌风 · 突进斩 · 旋转棍 · 瞬移"}, "공중 발차기": {"en": "Air Kick", "ja": "空中キック", "zh": "空中踢"}, "날아차기": {"en": "Flying Kick", "ja": "飛び蹴り", "zh": "飞踢"}, "격투 · {0}P/{1}P · Medium": {"en": "Fighting · {0}P/{1}P · Medium", "ja": "格闘 · {0}P/{1}P · Medium", "zh": "格斗 · {0}P/{1}P · Medium"}, "콩이 · 균형형": {"en": "Bean · Balanced", "ja": "マメ · バランス型", "zh": "豆豆 · 均衡型"}, "콩이": {"en": "Bean", "ja": "マメ", "zh": "豆豆"}, "방울": {"en": "Bell", "ja": "スズ", "zh": "铃铛"}, "뚱이": {"en": "Chubby", "ja": "ポチャ", "zh": "胖胖"}, "꼬미": {"en": "Tiny", "ja": "チビ", "zh": "小不点"}, "{0}P 캐릭터 (둘이서)": {"en": "{0}P character (two players)", "ja": "{0}Pキャラ(2人で)", "zh": "{0}P角色（双人）"}, "방울 · 정확함 · 바람 영향 적음": {"en": "Bell · Accurate · Less wind effect", "ja": "スズ · 正確 · 風の影響が少ない", "zh": "铃铛 · 精准 · 受风影响小"}, "각도를 잡고 꾹 눌러 힘을 모아 던지세요. 바람을 읽고, 찬스 {0}가지로 역전! 둘이서 폰 하나로도 대결.": {"en": "Set your angle, hold to charge, and throw. Read the wind and turn it around with {0} power-ups! Two players can share one phone.", "ja": "角度を決めて長押しで力をためて投げよう。風を読み、チャンス{0}種で逆転!2人でスマホ1台でも対戦OK。", "zh": "调好角度，按住蓄力后投掷。读懂风向，用{0}种机会道具逆转！两人用一部手机也能对战。"}, "번갈아 던져서 상대 체력을 먼저 {0}으로 만들면 승리. CPU를 이기면 연승이 쌓여요.": {"en": "Take turns throwing; drop the rival's HP to {0} first to win. Beat the CPU to build a win streak.", "ja": "交互に投げて、先に相手の体力を{0}にしたら勝ち。CPUに勝つと連勝が積み上がります。", "zh": "轮流投掷，先把对手体力打到{0}即获胜。战胜电脑可累积连胜。"}, "화면을 누르고 있으면 힘이 차올라요. 누른 채 손가락을 움직이면 그 방향으로 각도가 바뀌고, 떼는 순간 던집니다.": {"en": "Hold the screen to build power. Move your finger while holding to change the angle, and release to throw.", "ja": "画面を押し続けると力がたまります。押したまま指を動かすとその方向に角度が変わり、離した瞬間に投げます。", "zh": "按住屏幕蓄力。按住时移动手指可调整角度，松手即投掷。"}, "바람이 돌을 밀어요. 맞바람이면 더 세게, 뒷바람이면 약하게. 보라 표시는 지난번 힘과 각도예요.": {"en": "Wind pushes the stone. Throw harder into headwind, softer with tailwind. The purple mark shows your last power and angle.", "ja": "風が石を押します。向かい風なら強く、追い風なら弱く。紫の印は前回の力と角度です。", "zh": "风会推动石头。逆风要用力，顺风要轻投。紫色标记是上次的力度和角度。"}, "머리에 맞으면 {0}배. 바닥에 떨어져도 가까우면 살짝 스쳐서 피해가 들어가요.": {"en": "Headshots deal ×{0}. Landing close still grazes for some damage.", "ja": "頭に当たると{0}倍。地面に落ちても近ければかすってダメージが入ります。", "zh": "命中头部{0}倍伤害。落地时离得近也能擦伤造成伤害。"}, "가운데 언덕이 있는 판은 높게 던져서 넘기세요.": {"en": "On maps with a hill in the middle, throw high to clear it.", "ja": "真ん中に丘があるマップでは高く投げて越えよう。", "zh": "中间有山丘的地图要高抛越过。"}, "×{0} 두 번 던지기": {"en": "×{0} Double Throw", "ja": "×{0} 2回投げ", "zh": "×{0} 投两次"}, "이번 턴에 한 번 더": {"en": "One more this turn", "ja": "このターンもう一回", "zh": "本回合再投一次"}, "왕돌": {"en": "Big Rock", "ja": "大岩", "zh": "巨石"}, "피해 {0}배, 크기도 큼": {"en": "{0}× damage, bigger too", "ja": "ダメージ{0}倍、サイズも大", "zh": "伤害{0}倍，体积也大"}, "반창고": {"en": "Bandage", "ja": "ばんそうこう", "zh": "创可贴"}, "체력 {0} 회복": {"en": "Restore {0} HP", "ja": "体力{0}回復", "zh": "恢复{0}体力"}, "고양이 던지기": {"en": "Cat Toss", "ja": "ネコ投げ", "zh": "扔猫咪"}, "튕기며 넓게 피해": {"en": "Bounces for wide damage", "ja": "跳ねて広範囲ダメージ", "zh": "弹跳造成大范围伤害"}, "턴제 · {0}P/{1}P · Medium": {"en": "Turn-based · {0}P/{1}P · Medium", "ja": "ターン制 · {0}P/{1}P · Medium", "zh": "回合制 · {0}P/{1}P · Medium"}, "{0}색 · 천장 {1}초": {"en": "{0} colors · ceiling {1}s", "ja": "{0}色 · 天井{1}秒", "zh": "{0}色 · 顶部{1}秒"}, "같은 색 방울 {0}개 이상을 붙여 터뜨리고, 매달린 방울을 통째로 떨어뜨리세요. 벽에 튕겨 쏘는 각도가 실력!": {"en": "Match {0}+ bubbles of the same color to pop them, and drop hanging ones all at once. Bank shots off walls show your skill!", "ja": "同じ色のバブルを{0}個以上つなげて割り、ぶら下がったバブルをまとめて落とそう。壁バウンドの角度が腕の見せどころ!", "zh": "将{0}个以上同色泡泡连在一起消除，让悬挂的泡泡整片掉落。借墙反弹的角度最考验技术！"}, "같은 색 방울을 {0}개 이상 붙여 터뜨려 판을 비우세요. 아래 빨간 선에 닿으면 끝.": {"en": "Match {0}+ same-color bubbles to clear the board. Touch the red line below and it's over.", "ja": "同じ色のバブルを{0}個以上つなげて割り、盤面を空にしよう。下の赤い線に届いたら終わり。", "zh": "将{0}个以上同色泡泡连起来消除，清空棋盘。碰到下方红线就结束。"}, "끌어서 조준, 떼면 발사. 벽에 맞으면 튕겨 나가요 (점선은 두 번 튕김까지 보여 줘요).": {"en": "Drag to aim, release to shoot. Bubbles bounce off walls (dotted line shows up to two bounces).", "ja": "ドラッグで狙って、離して発射。壁に当たると跳ね返るよ(点線は2回バウンドまで表示)。", "zh": "拖动瞄准，松开发射。碰到墙会反弹（虚线最多显示两次反弹）。"}, "터진 방울 아래에 매달려 있던 방울은 우수수 떨어지고 점수 {0}배.": {"en": "Bubbles hanging below popped ones fall off for {0}× points.", "ja": "割れたバブルの下にぶら下がっていたバブルはまとめて落ちて、得点{0}倍。", "zh": "被消除泡泡下方悬挂的泡泡会纷纷掉落，得分{0}倍。"}, "연속으로 터뜨리면 콤보 배율이 최대 ×{0}까지 올라가요.": {"en": "Pop in a row to raise the combo multiplier up to ×{0}.", "ja": "連続で割るとコンボ倍率が最大×{0}まで上がるよ。", "zh": "连续消除可使连击倍率最高升至×{0}。"}, "헛쏘기가 쌓이면(왼쪽 위 점) 천장이 한 줄 내려와요.": {"en": "Too many misses (dots, top left) and the ceiling drops a row.", "ja": "ミスショットがたまると(左上の点)天井が1段下がるよ。", "zh": "空射累积（左上圆点）后，顶部会下降一行。"}, "오른쪽 아래 다음 방울을 누르면 지금 방울과 바꿀 수 있어요.": {"en": "Tap the next bubble (bottom right) to swap it with the current one.", "ja": "右下の次のバブルをタップすると今のバブルと交換できるよ。", "zh": "点击右下角的下一个泡泡，可与当前泡泡交换。"}, "무지개 방울": {"en": "Rainbow Bubble", "ja": "レインボーバブル", "zh": "彩虹泡泡"}, "어떤 색과도 붙어요": {"en": "Matches any color", "ja": "どの色ともくっつく", "zh": "可与任意颜色相连"}, "폭탄 방울": {"en": "Bomb Bubble", "ja": "爆弾バブル", "zh": "炸弹泡泡"}, "주변을 한 번에 터뜨려요": {"en": "Pops everything nearby", "ja": "周りをまとめて割る", "zh": "一次消除周围一圈"}, "판 클리어": {"en": "Board Clear", "ja": "盤面クリア", "zh": "清空棋盘"}, "레벨 × {0}점": {"en": "Level × {0} pts", "ja": "レベル × {0}点", "zh": "等级 × {0}分"}, "퍼즐 · 조준 · Medium": {"en": "Puzzle · Aim · Medium", "ja": "パズル · エイム · Medium", "zh": "益智 · 瞄准 · Medium"}, "격파": {"en": "K.O.", "ja": "撃破", "zh": "击破"}, "태풍 · 균형형 · 장풍과 승천권": {"en": "Typhoon · Balanced · Fireball & Rising Uppercut", "ja": "タイフーン · バランス型 · 掌風と昇天拳", "zh": "台风 · 均衡型 · 掌风与升天拳"}, "태풍": {"en": "Typhoon", "ja": "タイフーン", "zh": "台风"}, "바위": {"en": "Boulder", "ja": "ボルダー", "zh": "巨岩"}, "바람": {"en": "Gale", "ja": "ゲイル", "zh": "疾风"}, "번개 · 빠름 · 연속 발차기": {"en": "Bolt · Fast · Rapid Kicks", "ja": "ボルト · 速い · 連続キック", "zh": "闪电 · 迅捷 · 连环踢"}, "↓↘→ + 주먹 같은 커맨드로 필살기! 뒤로 누르면 막기, 콤보를 이어 상대를 하나씩 꺾는 아케이드. 필살 버튼만 눌러도 기술이 나가요.": {"en": "Pull off specials with commands like ↓↘→ + Punch! Hold back to block, chain combos and beat foes one by one in this arcade brawler. Just tap the Special button to pull off moves too.", "ja": "↓↘→ + パンチなどのコマンドで必殺技!後ろ入力でガード、コンボをつないで相手を一人ずつ倒すアーケード。必殺ボタンだけでも技が出るよ。", "zh": "用↓↘→ + 拳等指令放必杀技！按后方向防御，连段击败一个个对手的街机格斗。只按必杀键也能出招。"}, "아케이드: 상대 {0}명(마지막은 그림자 태풍)을 차례로 {1}판 {2}선승으로 꺾으면 챔피언. 둘이서 모드는 한 판 승부.": {"en": "Arcade: Beat {0} foes in a row (the last is Shadow Typhoon), best of {1}, first to {2} wins, to become champion. 2P mode is a single match.", "ja": "アーケード:相手{0}人(最後はシャドウタイフーン)を順に{1}本{2}先取で倒せばチャンピオン。2人モードは一本勝負。", "zh": "街机模式：依次击败{0}名对手（最后是暗影台风），{1}局{2}胜即成冠军。双人模式一局定胜负。"}, "상대 반대쪽으로 누르고 있으면 막기. 다리 걸기는 앉아서 막고, 점프 공격은 서서 막아야 해요.": {"en": "Hold away from the foe to block. Crouch-block sweeps, stand-block jump attacks.", "ja": "相手と逆方向を押し続けるとガード。足払いはしゃがみガード、ジャンプ攻撃は立ちガードで。", "zh": "按住远离对手的方向即可防御。扫腿要蹲防，跳跃攻击要站防。"}, "주먹 → 주먹 → 발로 {0}단 콤보. 맞히는 중에 필살기를 누르면 이어져요(캔슬).": {"en": "Punch → Punch → Kick for a {0}-hit combo. Hit Special mid-combo to chain it (cancel).", "ja": "パンチ → パンチ → キックで{0}段コンボ。ヒット中に必殺技を押すとつながるよ(キャンセル)。", "zh": "拳 → 拳 → 踢，{0}段连击。命中时按必杀可接上（取消）。"}, "붙어서 앞+주먹은 잡아 던지기(막아도 소용없음).": {"en": "Up close, Forward + Punch is a throw (can't be blocked).", "ja": "密着して前+パンチで投げ(ガード不能)。", "zh": "贴身时前+拳为投技（无法防御）。"}, "때리고 맞으면 아래 게이지가 차요. 가득 차면 필살 버튼으로 초필살!": {"en": "Hitting and getting hit fills the gauge below. When full, hit Special for a Super!", "ja": "攻撃したり受けたりすると下のゲージがたまる。満タンで必殺ボタンを押すと超必殺!", "zh": "攻击和受击都会积攒下方能量槽。满了按必杀键放超必杀！"}, "커맨드가 어려우면 필살 버튼만: 방향 없이=첫째 기술, 위=둘째, 뒤=셋째.": {"en": "Commands too hard? Just use Special: no direction = 1st move, Up = 2nd, Back = 3rd.", "ja": "コマンドが難しければ必殺ボタンだけで:方向なし=1つ目、上=2つ目、後ろ=3つ目。", "zh": "指令太难就只按必杀键：无方向=第一招，上=第二招，后=第三招。"}, "↓↘→ + 주먹": {"en": "↓↘→ + Punch", "ja": "↓↘→ + パンチ", "zh": "↓↘→ + 拳"}, "첫째 필살 (장풍 · 기공탄 · 돌진 · 표창)": {"en": "1st Special (Fireball · Ki Blast · Rush · Shuriken)", "ja": "1つ目の必殺 (掌風 · 気功弾 · 突進 · 手裏剣)", "zh": "第一必杀 (掌风 · 气功弹 · 突进 · 飞镖)"}, "→↓↘ + 주먹": {"en": "→↓↘ + Punch", "ja": "→↓↘ + パンチ", "zh": "→↓↘ + 拳"}, "둘째 필살 (승천권 · 올려차기 · 몸통 누르기 · 순간이동)": {"en": "2nd Special (Rising Uppercut · Launch Kick · Body Slam · Teleport)", "ja": "2つ目の必殺 (昇天拳 · 蹴り上げ · のしかかり · 瞬間移動)", "zh": "第二必杀 (升天拳 · 上踢 · 泰山压顶 · 瞬移)"}, "↓↙← + 발": {"en": "↓↙← + Kick", "ja": "↓↙← + キック", "zh": "↓↙← + 踢"}, "셋째 필살 (회오리발 · 번개발 · 메치기 · 급강하)": {"en": "3rd Special (Whirlwind Kick · Lightning Kick · Suplex · Dive)", "ja": "3つ目の必殺 (旋風脚 · 稲妻脚 · 投げ落とし · 急降下)", "zh": "第三必杀 (旋风腿 · 闪电腿 · 摔投 · 俯冲)"}, "↓↘→↓↘→ + 주먹": {"en": "↓↘→↓↘→ + Punch", "ja": "↓↘→↓↘→ + パンチ", "zh": "↓↘→↓↘→ + 拳"}, "초필살 (게이지 가득일 때)": {"en": "Super (when gauge is full)", "ja": "超必殺 (ゲージ満タン時)", "zh": "超必杀 (能量槽满时)"}, "캐릭터": {"en": "Characters", "ja": "キャラクター", "zh": "角色"}, "태풍 균형 · 번개 빠름 · 바위 힘 · 바람 날쌤": {"en": "Typhoon balanced · Bolt fast · Boulder strong · Gale agile", "ja": "タイフーン バランス · ボルト 速い · ボルダー パワー · ゲイル 身軽", "zh": "台风均衡 · 闪电迅捷 · 巨岩力量 · 疾风灵巧"}, "🗺 원정 {0}단계": {"en": "🗺 Campaign Stage {0}", "ja": "🗺 遠征 ステージ{0}", "zh": "🗺 远征 第{0}关"}, "내 탱크": {"en": "My Tank", "ja": "マイ戦車", "zh": "我的坦克"}, "번개호 · 균형형 · 특수: 삼연발": {"en": "Thunder · Balanced · Special: Triple Shot", "ja": "サンダー号 · バランス型 · 特殊:3連射", "zh": "雷电号 · 均衡型 · 特殊：三连发"}, "바위호": {"en": "Rock", "ja": "ロック号", "zh": "岩石号"}, "깃털호": {"en": "Feather", "ja": "フェザー号", "zh": "羽毛号"}, "불꽃호": {"en": "Blaze", "ja": "ブレイズ号", "zh": "火焰号"}, "CPU 상대 수 ({0}P)": {"en": "CPU opponents ({0}P)", "ja": "CPU相手の数 ({0}P)", "zh": "CPU对手数 ({0}P)"}, "{0}대{1} 맞대결": {"en": "{0} vs {1}", "ja": "{0}対{1}", "zh": "{0}对{1}"}, "CPU {0}대": {"en": "{0} CPUs", "ja": "CPU {0}台", "zh": "CPU {0}台"}, "{0}P 탱크 (둘이서)": {"en": "{0}P Tank (2P)", "ja": "{0}P 戦車 (2人で)", "zh": "{0}P 坦克 (双人)"}, "바위호 · 튼튼함 · 체력 {0} · 특수: 땅 꺼트리기": {"en": "Rock · Sturdy · {0} HP · Special: Ground Collapse", "ja": "ロック号 · 頑丈 · 体力{0} · 特殊:地面崩し", "zh": "岩石号 · 坚固 · 体力{0} · 特殊：地面塌陷"}, "각도를 잡고 힘을 모아 쏘면 땅이 움푹 파여요! 바람을 읽고, 연료로 자리를 옮기고, 탱크마다 다른 특수탄으로 상대를 구덩이에 빠뜨리세요.": {"en": "Set your angle, charge power and fire to blast craters! Read the wind, use fuel to move, and drop foes into pits with each tank's special shell.", "ja": "角度を決めてパワーをためて撃つと地面がえぐれる!風を読み、燃料で移動し、戦車ごとの特殊弾で相手を穴に落とそう。", "zh": "调好角度、蓄力发射，地面会被炸出坑！看准风向，用燃料移动，用每辆坦克独有的特殊弹把对手打进坑里。"}, "번갈아 포탄을 쏴서 상대 탱크를 먼저 쓰러뜨리거나 물에 빠뜨리면 승리. CPU를 이기면 연승이 쌓여요.": {"en": "Take turns firing shells. Destroy the enemy tank or sink it in water first to win. Beat the CPU to build a win streak.", "ja": "交互に砲弾を撃って、先に相手の戦車を倒すか水に落とせば勝ち。CPUに勝つと連勝が積み上がるよ。", "zh": "轮流发射炮弹，先击毁对手坦克或让它掉进水里就赢。战胜CPU可累积连胜。"}, "◀ ▶로 움직이면 연료가 줄어요(매 턴 절반 충전). 가파른 비탈은 못 올라가요.": {"en": "Moving with ◀ ▶ uses fuel (half refills each turn). Can't climb steep slopes.", "ja": "◀ ▶で動くと燃料が減る(毎ターン半分回復)。急な坂は登れないよ。", "zh": "用◀ ▶移动会消耗燃料（每回合回复一半）。陡坡上不去。"}, "▲ ▼ 또는 화면을 끌어서 각도. 「발사」를 누르고 있으면 힘이 {0}→{1}→{2}으로 오르내려요. 주황 선은 지난번 힘.": {"en": "▲ ▼ or drag the screen to aim. Hold \"Fire\" and power swings {0}→{1}→{2}. Orange line = last power.", "ja": "▲ ▼ または画面ドラッグで角度。「発射」を長押しするとパワーが{0}→{1}→{2}と上下するよ。オレンジの線は前回のパワー。", "zh": "▲ ▼或拖动屏幕调角度。按住「发射」力度会在{0}→{1}→{2}间往返。橙线是上次力度。"}, "포탄이 떨어진 자리는 땅이 파여요. 밑의 땅이 사라지면 탱크가 떨어지고, 높이 떨어지면 피해, 물까지 떨어지면 끝!": {"en": "Shells dig craters where they land. Lose the ground below and your tank falls — big drops hurt, and falling into water ends it!", "ja": "砲弾が落ちた場所は地面がえぐれる。足元の地面がなくなると戦車が落下、高く落ちるとダメージ、水まで落ちたら終わり!", "zh": "炮弹落点会炸出坑。脚下地面没了坦克就会掉落，摔得高会受伤，掉进水里就完蛋！"}, "바람은 매 턴 바뀌어요. 깃털호는 바람을 절반만 받아요.": {"en": "Wind changes every turn. Feather takes only half the wind.", "ja": "風は毎ターン変わるよ。フェザー号は風の影響が半分。", "zh": "风向每回合都会变。羽毛号只受一半风力影响。"}, "번개호 · 삼연발": {"en": "Thunder · Triple Shot", "ja": "サンダー号 · 3連射", "zh": "雷电号 · 三连发"}, "작은 포탄 {0}발이 부채꼴로": {"en": "{0} small shells in a fan", "ja": "小さな砲弾{0}発が扇状に", "zh": "{0}发小炮弹呈扇形射出"}, "바위호 · 땅 꺼트리기": {"en": "Rock · Ground Collapse", "ja": "ロック号 · 地面崩し", "zh": "岩石号 · 地面塌陷"}, "큰 구덩이로 상대를 떨어뜨려요": {"en": "Drops foes into a huge crater", "ja": "大きな穴で相手を落とす", "zh": "用大坑让对手掉下去"}, "깃털호 · 통통탄": {"en": "Feather · Bounce Shell", "ja": "フェザー号 · ポンポン弾", "zh": "羽毛号 · 弹弹弹"}, "두 번 튕긴 뒤 크게 터져요": {"en": "Bounces twice, then blows up big", "ja": "2回跳ねてから大爆発", "zh": "弹两次后大爆炸"}, "불꽃호 · 불비": {"en": "Blaze · Fire Rain", "ja": "ブレイズ号 · 火の雨", "zh": "火焰号 · 火雨"}, "꼭대기에서 불덩이 {0}개로": {"en": "{0} fireballs from the peak", "ja": "頂点から火の玉{0}個", "zh": "在最高点洒下{0}个火球"}, "두 번 쏘기 · 체력 {0} 회복 (한 판에 하나씩)": {"en": "Double Shot · Restore {0} HP (one each per match)", "ja": "2回撃ち · 体力{0}回復 (1戦に1つずつ)", "zh": "双发 · 恢复{0}体力 (每局各一次)"}, "정비소 · 부품 {0}": {"en": "Garage · Parts {0}", "ja": "整備工場 · パーツ{0}", "zh": "修理厂 · 零件{0}"}, "칭호 신병 · 영구 강화": {"en": "Title: Rookie · Permanent upgrades", "ja": "称号 新兵 · 永久強化", "zh": "称号 新兵 · 永久强化"}, "턴제 포격 · {0}P/{1}P · Medium": {"en": "Turn-based artillery · {0}P/{1}P · Medium", "ja": "ターン制砲撃 · {0}P/{1}P · Medium", "zh": "回合制炮击 · {0}P/{1}P · Medium"}, "동네 말썽꾼들을 혼내 주며 앞으로! 주먹 {0}단 콤보, 붙잡아 던지기, 쓰레기통 집어 던지기, 분노 폭발까지. 구역마다 몰려오는 녀석들을 다 쓰러뜨려야 지나갈 수 있어요.": {"en": "Teach the neighborhood troublemakers a lesson and push forward! {0}-hit punch combos, grabs and throws, trash can tosses, even Rage mode. Beat every gang in each zone to move on.", "ja": "近所の悪ガキを懲らしめながら前進!パンチ{0}段コンボ、つかみ投げ、ゴミ箱投げ、怒り爆発まで。エリアごとに押し寄せる連中を全員倒せば先へ進めるよ。", "zh": "教训街区里的捣蛋鬼，一路向前！{0}段拳连击、抓投、扔垃圾桶，还有怒气爆发。打倒每个区域涌来的家伙才能通过。"}, "구역마다 몰려오는 동네 말썽꾼들을 모두 쓰러뜨리고 앞으로! {0}개 동네의 대장을 꺾으면 골목 평정.": {"en": "Beat all the troublemakers swarming each zone and push on! Defeat the bosses of {0} neighborhoods to rule the alleys.", "ja": "エリアごとに押し寄せる悪ガキを全員倒して前進!{0}つの町の大将を倒せば路地を制覇。", "zh": "打倒每个区域涌来的捣蛋鬼，继续前进！击败{0}个街区的老大即可称霸小巷。"}, "구역에 들어가면 화면이 잠겨요. 적을 다 쓰러뜨리면 「GO ▶」가 떠요.": {"en": "Entering a zone locks the screen. Beat every enemy and \"GO ▶\" appears.", "ja": "エリアに入ると画面がロックされる。敵を全員倒すと「GO ▶」が出るよ。", "zh": "进入区域后画面锁定。打倒全部敌人会出现「GO ▶」。"}, "주먹 {0}번 = {1}단 콤보(마지막에 넘어뜨림). 점프 중 주먹 = 날아차기. 적이 없을 때 「들기」 = 밀어내기.": {"en": "Punch {0}× = {1}-hit combo (last hit knocks down). Punch mid-jump = flying kick. \"Grab\" with no enemy near = shove.", "ja": "パンチ{0}回 = {1}段コンボ(最後でダウン)。ジャンプ中パンチ = 飛び蹴り。敵がいない時の「つかむ」= 押し出し。", "zh": "拳{0}次 = {1}段连击（最后一击击倒）。跳跃中出拳 = 飞踢。无敌人时「抓取」= 推开。"}, "비틀거리거나 체력이 반 남은 꼬마 옆에서 「들기」 = 붙잡기 → 주먹으로 무릎치기, 「들기」 한 번 더 = 던지기(다른 적까지 쓰러뜨려요).": {"en": "Next to a dazed or half-HP Kid, \"Grab\" = hold → Punch for knee strikes, \"Grab\" again = throw (knocks down other foes too).", "ja": "ふらついているか体力半分のチビの横で「つかむ」= つかみ → パンチで膝蹴り、もう一度「つかむ」= 投げ(他の敵も倒せる)。", "zh": "在摇晃或剩半血的小鬼旁「抓取」= 抓住 → 出拳膝撞，再按「抓取」= 投掷（还能撞倒其他敌人）。"}, "쓰레기통 · 타이어 · 물풍선 상자를 집어 던질 수 있어요. 물풍선은 맞은 적을 어지럽게 해요.": {"en": "You can pick up and throw trash cans, tires and water balloon crates. Water balloons make foes dizzy.", "ja": "ゴミ箱 · タイヤ · 水風船の箱を持ち上げて投げられるよ。水風船は当たった敵を目まわしにする。", "zh": "可以举起垃圾桶 · 轮胎 · 水气球箱扔出去。水气球会让被砸中的敌人头晕。"}, "때리고 맞으면 분노가 차요. 가득 차면 「분노」로 {0}초 동안 두 배로 세지고, 들기 = 회전 공격.": {"en": "Hitting and getting hit fills Rage. When full, \"Rage\" doubles your power for {0}s, and Grab = spin attack.", "ja": "攻撃したり受けたりすると怒りがたまる。満タンで「怒り」を押すと{0}秒間パワー2倍、つかむ = 回転攻撃。", "zh": "攻击和受击都会积攒怒气。满了按「怒气」{0}秒内力量翻倍，抓取 = 旋转攻击。"}, "꼬마": {"en": "Kid", "ja": "チビ", "zh": "小鬼"}, "약하지만 여럿이 와요 · 붙잡을 수 있어요": {"en": "Weak but come in groups · Can be grabbed", "ja": "弱いけど群れで来る · つかめる", "zh": "弱但成群而来 · 可抓取"}, "덩치": {"en": "Bruiser", "ja": "デカブツ", "zh": "大块头"}, "잘 안 밀려요 · 콤보 마지막 타로 넘어뜨리세요": {"en": "Hard to push · Knock down with combo finisher", "ja": "押されにくい · コンボの最後でダウンさせよう", "zh": "不容易被击退 · 用连击最后一击打倒"}, "새총": {"en": "Slingshot", "ja": "パチンコ", "zh": "弹弓手"}, "멀리서 돌을 쏴요 · 먼저 처리": {"en": "Shoots rocks from afar · Take out first", "ja": "遠くから石を撃つ · 先に倒そう", "zh": "远程射石子 · 优先解决"}, "날쌘이": {"en": "Speedy", "ja": "すばしっこ", "zh": "飞毛腿"}, "빨라요": {"en": "Fast", "ja": "速い", "zh": "速度快"}, "동네 대장": {"en": "Block Boss", "ja": "町の大将", "zh": "街区老大"}, "돌진에 주의! 옆줄로 피하세요": {"en": "Watch the charge! Dodge to another lane", "ja": "突進に注意!横のラインへよけよう", "zh": "小心冲撞！换到旁边那条线躲开"}, "출동하기": {"en": "Let's Go", "ja": "出動", "zh": "出动"}, "동네 {0}곳 · 대장 {1}명 · 끝없는 회차 · 스테이지마다 보상": {"en": "{0} neighborhoods · {1} bosses · Endless loops · Rewards every stage", "ja": "町{0}か所 · 大将{1}人 · エンドレス周回 · ステージごとに報酬", "zh": "{0}个街区 · {1}名老大 · 无限轮回 · 每关都有奖励"}, "문방구 · 용돈 {0}": {"en": "Corner Shop · Allowance {0}", "ja": "駄菓子屋 · おこづかい{0}", "zh": "文具店 · 零花钱{0}"}, "칭호 동네 꼬마 · 영구 강화": {"en": "Title: Street Kid · Permanent upgrades", "ja": "称号 町のチビ · 永久強化", "zh": "称号 街头小鬼 · 永久强化"}, "횡스크롤 난투 · 한판 · Medium": {"en": "Side-scrolling brawler · Single run · Medium", "ja": "横スクロール乱闘 · 一発勝負 · Medium", "zh": "横版乱斗 · 一局 · Medium"}, "한 줄로 묶인 도도와 토토! 왼쪽 화면은 도도, 오른쪽 화면은 토토. 혼자 두 손으로, 또는 친구와 한 폰으로 호흡을 맞춰 절벽을 건너요. 떨어진 친구는 버티고 서서 끌어올리세요.": {"en": "Dodo and Toto, tied by one rope! Left side is Dodo, right side is Toto. Play solo with two hands or with a friend on one phone and cross the cliffs in sync. If your buddy falls, hold steady and pull them up.", "ja": "1本のロープでつながったドドとトト!画面左はドド、右はトト。1人で両手で、または友達と1台のスマホで息を合わせて崖を渡ろう。落ちた相棒は踏ん張って引き上げて。", "zh": "被一根绳子拴在一起的多多和托托！左半屏是多多，右半屏是托托。一个人用双手，或和朋友共用一部手机，配合默契跨越悬崖。伙伴掉下去就稳住把他拉上来。"}, "한 줄로 묶인 도도와 토토를 함께 깃발까지! {0}단계를 건너면 완주.": {"en": "Get Dodo and Toto, tied by one rope, to the flag together! Clear {0} stages to finish.", "ja": "1本のロープでつながったドドとトトを一緒に旗まで!{0}ステージ渡ればクリア。", "zh": "带着拴在一起的多多和托托一起到达旗帜！通过{0}关即完成。"}, "왼쪽 화면 = 도도, 오른쪽 화면 = 토토. 혼자라면 두 엄지로, 둘이라면 한 폰을 나눠 잡아요.": {"en": "Left side = Dodo, right side = Toto. Solo, use two thumbs; with two, share one phone.", "ja": "画面左 = ドド、右 = トト。1人なら両手の親指で、2人なら1台のスマホを分けて持とう。", "zh": "左半屏 = 多多，右半屏 = 托托。一个人就用两个拇指，两个人就分握一部手机。"}, "누르고 있으면 앞으로 걷고, 톡 치면 점프. 누른 채 왼쪽으로 끌면 뒤로 걸어요.": {"en": "Hold to walk forward, tap to jump. Hold and drag left to walk back.", "ja": "長押しで前に歩き、タップでジャンプ。押したまま左にドラッグで後ろ歩き。", "zh": "按住向前走，轻点跳跃。按住向左拖动则后退。"}, "줄은 일정 길이 이상 늘어나지 않아요. 절벽 너머로 먼저 뛴 친구가 떨어지면 줄에 매달려요.": {"en": "The rope only stretches so far. If one jumps past a cliff and falls, they dangle from the rope.", "ja": "ロープは一定以上伸びないよ。先に崖を飛び越えた相棒が落ちるとロープにぶら下がる。", "zh": "绳子不会超过一定长度。先跳过悬崖的伙伴掉下去会吊在绳子上。"}, "매달린 친구는 누르고 있으면 줄을 타고 올라와요(영차!). 매달린 채 톡 치면 흔들어 뛰어올라요.": {"en": "A dangling buddy climbs the rope by holding (heave-ho!). Tap while hanging to swing up.", "ja": "ぶら下がった相棒は長押しでロープを登る(よいしょ!)。ぶら下がったままタップで揺らして飛び上がる。", "zh": "吊着的伙伴按住就能顺绳往上爬（嘿哟！）。吊着时轻点会荡起来跳上去。"}, "가만히 선 쪽은 단단히 버티지만, 걷고 있으면 같이 끌려가요. 둘 다 물에 빠지면 목숨 {0}개가 줄어요.": {"en": "Standing still holds firm, but walking gets you dragged along. If both fall in the water, you lose {0} lives.", "ja": "止まっている方はしっかり踏ん張るけど、歩いていると一緒に引きずられる。2人とも水に落ちると残機{0}つ減るよ。", "zh": "站着不动的一方会稳稳撑住，走动时则会被一起拖走。两人都掉水里会失去{0}条命。"}, "{0}단계부터 위아래로 움직이는 발판이 나와요. 빨리 도착할수록 별과 점수가 많아요.": {"en": "From stage {0}, moving platforms go up and down. Arrive faster for more stars and points.", "ja": "ステージ{0}から上下に動く足場が登場。早く着くほど星とスコアが増えるよ。", "zh": "从第{0}关开始出现上下移动的平台。越快到达，星星和分数越多。"}, "도도": {"en": "Dodo", "ja": "ドド", "zh": "多多"}, "왼쪽 화면 · 주황": {"en": "Left side · Orange", "ja": "画面左 · オレンジ", "zh": "左半屏 · 橙色"}, "토토": {"en": "Toto", "ja": "トト", "zh": "托托"}, "오른쪽 화면 · 파랑": {"en": "Right side · Blue", "ja": "画面右 · ブルー", "zh": "右半屏 · 蓝色"}, "줄": {"en": "Rope", "ja": "ロープ", "zh": "绳子"}, "팽팽하면 빨갛게 변해요": {"en": "Turns red when taut", "ja": "ピンと張ると赤くなる", "zh": "绷紧时变红"}, "움직이는 발판": {"en": "Moving Platform", "ja": "動く足場", "zh": "移动平台"}, "노란 점이 있어요": {"en": "Has yellow dots", "ja": "黄色い点があるよ", "zh": "带有黄点"}, "출발!": {"en": "Go!", "ja": "出発!", "zh": "出发！"}, "{0}단계 · 한 줄로 묶인 두 친구": {"en": "{0} stages · Two friends, one rope", "ja": "{0}ステージ · 1本のロープでつながった2人", "zh": "{0}关 · 拴在一根绳上的两个好友"}, "협동 · 혼자 두 손 / 둘이서 · Medium": {"en": "Co-op · Solo two-handed / 2P · Medium", "ja": "協力 · 1人で両手 / 2人で · Medium", "zh": "合作 · 单人双手 / 双人 · Medium"}, "모임 · 뽑기": {"en": "Group · Picks", "ja": "みんなで · 抽選", "zh": "聚会 · 抽签"}, "인원": {"en": "Players", "ja": "人数", "zh": "人数"}, "접힌 쪽지를 한 명씩 골라 펼칩니다. 당첨 개수는 원하는 대로.": {"en": "Each person picks and opens a folded slip. Set as many winners as you like.", "ja": "折りたたんだ紙を1人ずつ選んで開こう。当たりの数は自由に。", "zh": "每人轮流挑一张折好的纸条打开。中签数量随意设定。"}, "참가자 (한 줄에 한 명, 쉼표로 구분해도 돼요)": {"en": "Players (one per line, or comma-separated)", "ja": "参加者 (1行に1人、カンマ区切りでもOK)", "zh": "参与者 (每行一人，也可用逗号分隔)"}, "민수": {"en": "Alex", "ja": "ハルト", "zh": "小明"}, "지영": {"en": "Sam", "ja": "ユイ", "zh": "小红"}, "현우": {"en": "Max", "ja": "ソウタ", "zh": "小刚"}, "서연": {"en": "Emma", "ja": "ヒナ", "zh": "小丽"}, "준호": {"en": "Leo", "ja": "レン", "zh": "小军"}, "하은": {"en": "Mia", "ja": "アオイ", "zh": "小芳"}, "민수\n지영\n현우\n서연\n준호\n하은": {"en": "Alex\nSam\nMax\nEmma\nLeo\nMia", "ja": "ハルト\nユイ\nソウタ\nヒナ\nレン\nアオイ", "zh": "小明\n小红\n小刚\n小丽\n小军\n小芳"}, "당첨 개수": {"en": "Winners", "ja": "当たりの数", "zh": "中签数量"}, "입력한 이름은 이 기기에만 저장돼요": {"en": "Names are saved on this device only", "ja": "入力した名前はこの端末にのみ保存されます", "zh": "输入的名字仅保存在本设备"}, "민수 지우기": {"en": "Remove Alex", "ja": "ハルトを削除", "zh": "删除小明"}, "지영 지우기": {"en": "Remove Sam", "ja": "ユイを削除", "zh": "删除小红"}, "현우 지우기": {"en": "Remove Max", "ja": "ソウタを削除", "zh": "删除小刚"}, "서연 지우기": {"en": "Remove Emma", "ja": "ヒナを削除", "zh": "删除小丽"}, "준호 지우기": {"en": "Remove Leo", "ja": "レンを削除", "zh": "删除小军"}, "하은 지우기": {"en": "Remove Mia", "ja": "アオイを削除", "zh": "删除小芳"}, "입력 후 Enter (쉼표로 여러 개)": {"en": "Type, then Enter (commas for several)", "ja": "入力してEnter (カンマで複数)", "zh": "输入后按Enter (逗号分隔可多个)"}, "이름과 결과를 적으면 사다리가 새로 그려집니다. 이름을 누르면 길을 따라 내려가요.": {"en": "Enter names and results to redraw the ladder. Tap a name to follow its path down.", "ja": "名前と結果を入れるとあみだが新しく描かれます。名前をタップすると線をたどって下りるよ。", "zh": "填好名字和结果就会重新画梯子。点名字即可沿路往下走。"}, "참가자 (위쪽, 최대 {0}명)": {"en": "Players (top, up to {0})", "ja": "参加者 (上側、最大{0}人)", "zh": "参与者 (上方，最多{0}人)"}, "민수\n지영\n현우\n서연": {"en": "Alex\nSam\nMax\nEmma", "ja": "ハルト\nユイ\nソウタ\nヒナ", "zh": "小明\n小红\n小刚\n小丽"}, "결과 (아래쪽 · 비워 두면 당첨 {0}개, 나머지 꽝)": {"en": "Results (bottom · leave blank for {0} winner(s), rest lose)", "ja": "結果 (下側 · 空欄なら当たり{0}個、残りはハズレ)", "zh": "结果 (下方 · 留空则{0}个中签，其余落空)"}, "커피 쏘기": {"en": "Buys coffee", "ja": "コーヒーおごり", "zh": "请喝咖啡"}, "꽝": {"en": "Miss", "ja": "ハズレ", "zh": "落空"}, "커피 쏘기\n꽝\n꽝\n꽝": {"en": "Buys coffee\nMiss\nMiss\nMiss", "ja": "コーヒーおごり\nハズレ\nハズレ\nハズレ", "zh": "请喝咖啡\n落空\n落空\n落空"}, "커피 쏘기 지우기": {"en": "Remove Buys coffee", "ja": "コーヒーおごりを削除", "zh": "删除请喝咖啡"}, "꽝 지우기": {"en": "Remove Miss", "ja": "ハズレを削除", "zh": "删除落空"}, "공 굴려 순위 뽑기": {"en": "Marble Race", "ja": "ビー玉レース", "zh": "弹珠排名"}, "이름 붙은 공들이 핀볼 장애물을 지나 굴러 떨어집니다. 먼저 도착한 순서대로 {0}등, {1}등….": {"en": "Named marbles roll down past pinball obstacles. Rank by arrival: {0}st, {1}nd…", "ja": "名前付きのビー玉がピンボールの障害物を抜けて転がり落ちます。到着順に{0}位、{1}位…。", "zh": "带名字的弹珠穿过弹球障碍滚落下来。按到达顺序排第{0}名、第{1}名…。"}, "참가자 (한 줄에 한 명, 최대 {0}명)": {"en": "Players (one per line, up to {0})", "ja": "参加者 (1行に1人、最大{0}人)", "zh": "参与者 (每行一人，最多{0}人)"}, "몇 등까지 발표할까요? (비워 두면 전체 순위)": {"en": "Announce down to which place? (blank = full ranking)", "ja": "何位まで発表する? (空欄なら全順位)", "zh": "公布到第几名？(留空则公布全部排名)"}, "술게임 · 폰 돌리기": {"en": "Drinking Games · Pass the Phone", "ja": "飲みゲーム · スマホ回し", "zh": "酒桌游戏 · 传手机"}, "넘김": {"en": "Pass", "ja": "パス", "zh": "传过"}, "주제에 맞는 단어를 말하고 폰을 옆 사람에게! 언제 터질지는 아무도 몰라요.": {"en": "Say a word that fits the topic and pass the phone! Nobody knows when it'll blow.", "ja": "お題に合う言葉を言って隣の人にスマホを!いつ爆発するかは誰にもわからない。", "zh": "说出符合主题的词，把手机传给下一个人！谁也不知道什么时候爆炸。"}, "시작하면 주제가 나와요. 주제에 맞는 단어를 외치고 화면을 톡 누른 뒤 옆 사람에게 넘기세요": {"en": "Start to reveal a topic. Shout a word that fits, tap the screen, and pass it on", "ja": "スタートするとお題が出るよ。お題に合う言葉を叫んで画面をタップし、隣の人に回そう", "zh": "开始后会出现主题。喊出符合主题的词，点一下屏幕，再传给下一个人"}, "앞사람이 말한 단어는 다시 쓰면 안 돼요": {"en": "No repeating words someone already said", "ja": "前の人が言った言葉はもう使えないよ", "zh": "前面的人说过的词不能再用"}, "폭탄이 터질 때 폰을 들고 있는 사람이 당첨": {"en": "Whoever holds the phone when it blows loses", "ja": "爆弾が爆発した時にスマホを持っている人がアウト", "zh": "炸弹爆炸时拿着手机的人中招"}, "폭탄 시간 (정 (指定旁边的人)"}, "소원 하나 들어주기 지우기": {"en": "Remove Grant a wish", "ja": "願いを1つ叶えるを削除", "zh": "删除满足一个愿望"}, "애교 한 번 지우기": {"en": "Remove Act cute once", "ja": "ぶりっ子1回を削除", "zh": "删除撒娇一次"}, "물 한 잔 (쉬어 가기) 지우기": {"en": "Remove Glass of water (take a break)", "ja": "水1杯 (ひと休み)を削除", "zh": "删除一杯水 (歇一歇)"}, "술게임 · 차례로": {"en": "Drinking Games · Take Turns", "ja": "飲みゲーム · 順番に", "zh": "酒桌游戏 · 轮流"}, "속으로 {0}초를 세고 정확히 멈추기. {1}초에서 가장 먼 사람이 벌칙!": {"en": "Count {0} seconds in your head and stop dead on. Furthest from {1}s loses!", "ja": "心の中で{0}秒数えてピッタリ止めよう。{1}秒から一番遠い人が罰ゲーム!", "zh": "心里数{0}秒，精准停下。离{1}秒最远的人受罚！"}, "차례가 된 사람이 화면을 눌러 시작하고, {0}초라고 생각될 때 다시 누르세요": {"en": "On your turn, tap to start, and tap again when you think it's been {0}s", "ja": "自分の番になったら画面をタップしてスタート、{0}秒だと思ったらもう一度タップ", "zh": "轮到的人点屏幕开始，觉得到{0}秒时再点一次"}, "숨김 모드에서는 {0}초 뒤 시계가 사라져요": {"en": "In hidden mode, the clock vanishes after {0}s", "ja": "隠しモードでは{0}秒後に時計が消えるよ", "zh": "隐藏模式下，{0}秒后计时器会消失"}, "모두 끝나면 {0}초에서 가장 먼 사람이 벌칙": {"en": "When everyone's done, furthest from {0}s loses", "ja": "全員終わったら{0}秒から一番遠い人が罰ゲーム", "zh": "所有人结束后，离{0}秒最远的人受罚"}, "참가자 (한 줄에 한 명 · 쉼표도 돼요)": {"en": "Players (one per line · commas work too)", "ja": "参加者 (1行に1人 · カンマもOK)", "zh": "参与者 (每行一人 · 逗号也可)"}, "{0}초 뒤 숨김": {"en": "Hide after {0}s", "ja": "{0}秒後に隠す", "zh": "{0}秒后隐藏"}, "끝까지 보임 (쉬움)": {"en": "Always visible (easy)", "ja": "最後まで表示 (かんたん)", "zh": "全程可见 (简单)"}, "숨은 폭탄 숫자를 피해 번갈아 숫자를 부르기. 범위는 점점 좁아지고, 폭탄을 부른 사람이 벌칙!": {"en": "Take turns calling numbers, avoiding the hidden bomb. The range keeps shrinking — whoever hits the bomb loses!", "ja": "隠れた爆弾の数字を避けて交互に数字を言おう。範囲はどんどん狭まり、爆弾を言った人が罰ゲーム!", "zh": "轮流报数，避开隐藏的炸弹数字。范围越来越小，报中炸弹的人受罚！"}, "차례대로 범위 안의 숫자 하나를 입력하세요": {"en": "Take turns entering one number in range", "ja": "順番に範囲内の数字を1つ入力しよう", "zh": "轮流输入范围内的一个数字"}, "폭탄보다 작으면 \"업\", 크면 \"다운\" — 범위가 좁아져요": {"en": "Lower than the bomb: \"Up\", higher: \"Down\" — the range narrows", "ja": "爆弾より小さければ「アップ」、大きければ「ダウン」— 範囲が狭まるよ", "zh": "比炸弹小就是\"大一点\"，比炸弹大就是\"小一点\"——范围缩小"}, "폭탄 숫자를 부른 사람이 당첨. 남은 숫자가 폭탄 하나뿐이면 다음 사람이 당첨": {"en": "Whoever calls the bomb loses. If only the bomb is left, the next player loses", "ja": "爆弾の数字を言った人がアウト。残りが爆弾だけなら次の人がアウト", "zh": "报出炸弹数字的人中招。如果只剩炸弹一个数，下一个人中招"}, "숫자 범위": {"en": "Number range", "ja": "数字の範囲", "zh": "数字范围"}, "거짓말쟁이 찾기": {"en": "Find the Liar", "ja": "ウソつき探し", "zh": "找出说谎者"}, "술게임 · 추리": {"en": "Drinking Games · Deduction", "ja": "飲みゲーム · 推理", "zh": "酒桌游戏 · 推理"}, "한 명만 제시어를 몰라요. 한 마디씩 설명하며 거짓말쟁이를 찾아내세요!": {"en": "One person doesn't know the word. Each gives a one-line hint — find the liar!", "ja": "1人だけお題を知らない。1人ずつひと言で説明してウソつきを見つけよう!", "zh": "只有一个人不知道关键词。每人用一句话描述，找出说谎者！"}, "폰을 돌려 가며 자기 카드만 몰래 확인해요. 거짓말쟁이 카드에는 제시어가 없어요": {"en": "Pass the phone around and secretly check only your card. The liar's card has no word", "ja": "スマホを回して自分のカードだけこっそり確認。ウソつきのカードにはお題がないよ", "zh": "传着手机，每人只偷偷看自己的卡。说谎者的卡上没有关键词"}, "한 명씩 제시어를 한 마디로 설명하세요. 거짓말쟁이는 눈치껏 맞춰 말해야 해요": {"en": "Each person describes the word in one line. The liar has to bluff along", "ja": "1人ずつお題をひと言で説明しよう。ウソつきは空気を読んで合わせよう", "zh": "每人用一句话描述关键词。说谎者要见机行事蒙混过关"}, "다 같이 한 명을 지목! 거짓말쟁이가 잡히면 제시어를 맞힐 기회 한 번": {"en": "Everyone points at once! If the liar is caught, they get one guess at the word", "ja": "全員で1人を指名!ウソつきが見つかったらお題を当てるチャンスが1回", "zh": "大家一起指认一个人！说谎者被抓到后有一次猜关键词的机会"}, "주제 ({0}가지)": {"en": "Topics ({0})", "ja": "お題 ({0}種)", "zh": "主题 ({0}种)"}, "무작위": {"en": "Random", "ja": "ランダム", "zh": "随机"}, "음식": {"en": "Food", "ja": "食べ物", "zh": "食物"}, "동물": {"en": "Animals", "ja": "動物", "zh": "动物"}, "장소": {"en": "Places", "ja": "場所", "zh": "地点"}, "직업": {"en": "Jobs", "ja": "職業", "zh": "职业"}, "물건": {"en": "Objects", "ja": "モノ", "zh": "物品"}, "운동": {"en": "Sports", "ja": "スポーツ", "zh": "运动"}, "나라": {"en": "Countries", "ja": "国", "zh": "国家"}, "과일·채소": {"en": "Fruits·Veggies", "ja": "果物·野菜", "zh": "水果·蔬菜"}, "음료·간식": {"en": "Drinks·Snacks", "ja": "飲み物·おやつ", "zh": "饮料·零食"}, "탈것": {"en": "Vehicles", "ja": "乗り物", "zh": "交通工具"}, "악기": {"en": "Instruments", "ja": "楽器", "zh": "乐器"}, "집 안": {"en": "At Home", "ja": "家の中", "zh": "家里"}, "날씨·자연": {"en": "Weather·Nature", "ja": "天気·自然", "zh": "天气·自然"}, "취미": {"en": "Hobbies", "ja": "趣味", "zh": "爱好"}, "학교": {"en": "School", "ja": "学校", "zh": "学校"}, "명절·기념일": {"en": "Holidays", "ja": "祝日·記念日", "zh": "节日·纪念日"}, "이미지 · 밸런스 카드": {"en": "Balance Cards", "ja": "バランスカード", "zh": "二选一卡片"}, "술게임 · 질문 카드": {"en": "Drinking Games · Question Cards", "ja": "飲みゲーム · 質問カード", "zh": "酒桌游戏 · 问题卡"}, "장": {"en": "cards", "ja": "枚", "zh": "张"}, "\"가장 ~할 것 같은 사람\"을 동시에 가리키거나, 둘 중 하나를 고르는 질문 카드. 소수가 벌칙!": {"en": "Point at \"Most likely to ~\" together, or pick one of two. The minority loses!", "ja": "「一番~しそうな人」を一斉に指さすか、2択から選ぶ質問カード。少数派が罰ゲーム!", "zh": "同时指向\"最可能~的人\"，或二选一的问题卡。少数派受罚！"}, "이미지 카드: 셋을 세고 동시에 한 사람을 가리켜요. 가장 많이 지목된 사람이 벌칙": {"en": "Image card: count to three and point at one person. Most-picked loses", "ja": "イメージカード:3つ数えて一斉に1人を指さそう。一番多く指された人が罰ゲーム", "zh": "印象卡：数到三同时指一个人。被指最多的人受罚"}, "밸런스 카드: 셋을 세고 동시에 A 또는 B를 외쳐요. 적은 쪽이 벌칙": {"en": "Balance card: count to three and shout A or B. The smaller side loses", "ja": "バランスカード:3つ数えて一斉にAかBを叫ぼう。少ない方が罰ゲーム", "zh": "二选一卡：数到三同时喊A或B。人少的一方受罚"}, "화면을 누르면 다음 카드. 그만하려면 왼쪽 위 뒤로 가기": {"en": "Tap for the next card. To stop, tap back at top left", "ja": "画面をタップで次のカード。やめるには左上の戻るで", "zh": "点屏幕翻下一张。想结束就点左上角返回"}, "카드 종류": {"en": "Card type", "ja": "カードの種類", "zh": "卡片类型"}, "섞어서": {"en": "Mixed", "ja": "ミックス", "zh": "混合"}, "이미지만": {"en": "Image only", "ja": "イメージのみ", "zh": "仅印象卡"}, "밸런스만": {"en": "Balance only", "ja": "バランスのみ", "zh": "仅二选一"}, "나온 초성으로 된 단어를 제한 시간 안에! 한 바퀴 돌 때마다 시간이 줄어요.": {"en": "Say a word with the given initials before time's up! Time shrinks each round.", "ja": "出た頭文字で始まる言葉を制限時間内に!1周するごとに時間が短くなるよ。", "zh": "在时限内说出符合首字母的词！每轮一圈时间都会缩短。"}, "예: ㄱㅅ → 가수, 과사, 감사… 앞사람과 같은 단어는 안 돼요": {"en": "e.g. S·T → star, stop, salt… No repeating the last word", "ja": "例: か·さ → かさ、かしこい、こさめ… 前の人と同じ言葉はNG", "zh": "例：S·J → 手机、时间、世界… 不能和前一个人说的一样"}, "말했으면 \"성공\" 버튼을 누르고 다음 사람에게": {"en": "Said it? Tap \"Got it\" and pass to the next player", "ja": "言えたら「成功」を押して次の人へ", "zh": "说出来就点\"成功\"，交给下一个人"}, "시간이 다 되면 폭탄이 터져요. 그때 차례인 사람이 벌칙": {"en": "When time runs out, the bomb blows. Whoever's up loses", "ja": "時間切れで爆弾が爆発。その時の番の人が罰ゲーム", "zh": "时间到炸弹就爆炸。轮到的人受罚"}, "처음 제한 시간": {"en": "Starting time limit", "ja": "最初の制限時間", "zh": "初始时限"}, "{0}초": {"en": "{0}s", "ja": "{0}秒", "zh": "{0}秒"}, "번개 탭 대결": {"en": "Lightning Tap", "ja": "稲妻タップ対決", "zh": "闪电点击对决"}, "술게임 · 한 화면 대결": {"en": "Drinking Games · One-Screen Duel", "ja": "飲みゲーム · 1画面対決", "zh": "酒桌游戏 · 同屏对决"}, "폰을 가운데 두고 각자 자기 칸 위에 손가락 대기. \"지금!\"이 뜨면 누르기. 제일 늦거나 먼저 누른 사람이 벌칙!": {"en": "Put the phone in the middle, fingers over your own zone. Tap when \"Now!\" shows. Slowest or too early loses!", "ja": "スマホを真ん中に置いて各自の枠の上に指を構える。「今!」が出たらタップ。一番遅いかフライングした人が罰ゲーム!", "zh": "手机放中间，各自手指悬在自己格子上方。出现\"现在！\"就点。最慢或抢先的人受罚！"}, "폰을 테이블 가운데 두고 각자 자기 색 칸 위에 손가락을 띄워 두세요 (닿으면 반칙)": {"en": "Place the phone in the middle of the table and hover a finger over your color zone (touching = foul)", "ja": "スマホをテーブルの真ん中に置き、自分の色の枠の上に指を浮かせておこう (触れたら反則)", "zh": "把手机放在桌子中间，每人手指悬在自己颜色的格子上方 (碰到算犯规)"}, "화면이 초록으로 바뀌며 \"지금!\"이 뜨면 바로 누르기": {"en": "When the screen turns green and \"Now!\" appears, tap right away", "ja": "画面が緑になって「今!」が出たらすぐタップ", "zh": "屏幕变绿出现\"现在！\"就立刻点"}, "신호 전에 누르면 반칙으로 바로 당첨. 아니면 가장 늦은 사람이 당첨": {"en": "Tapping before the signal is a foul and you lose. Otherwise, the slowest loses", "ja": "合図の前に押すと反則で即アウト。それ以外は一番遅い人がアウト", "zh": "信号前按下算犯规直接中招。否则最慢的人中招"}, "{0}명": {"en": "{0} players", "ja": "{0}人", "zh": "{0}人"}, "지금!": {"en": "Now!", "ja": "今!", "zh": "现在！"}, "당첨": {"en": "Loser", "ja": "当たり", "zh": "中招"}, "단계": {"en": "Stage", "ja": "ステージ", "zh": "关卡"}, "신기록 진행 중!": {"en": "New record pace!", "ja": "新記録更新中!", "zh": "正在刷新纪录！"}, "최고 {0}": {"en": "Best {0}", "ja": "ベスト {0}", "zh": "最佳 {0}"}, "탭하면 출발!": {"en": "Tap to go!", "ja": "タップでスタート!", "zh": "点击出发！"}, "달리는 중에 탭할 때마다 좌우로 꺾여요": {"en": "Each tap while driving turns left or right", "ja": "走行中にタップするたびに llect every gold medal.", "ja": "ゲームごとに銅・銀・金。金メダルをすべて集めてみよう。", "zh": "每个游戏都有铜、银、金牌。试着集齐所有金牌吧。"}, "겨울 하면 떠오르는 것": {"en": "What comes to mind when you think of winter", "ja": "冬といえば思い浮かぶもの", "zh": "说到冬天会想到什么"}, "겨울에 반팔 입기": {"en": "Wearing short sleeves in winter", "ja": "冬に半袖を着る", "zh": "冬天穿短袖"}, "격납고 · 별가루": {"en": "Hangar · Stardust", "ja": "格納庫 · 星くず", "zh": "机库 · 星尘"}, "격려": {"en": "Encouragement", "ja": "励まし", "zh": "鼓励"}, "격파!": {"en": "Destroyed!", "ja": "撃破!", "zh": "击破!"}, "격파! 인장": {"en": "Destroyed! Seal", "ja": "撃破! 印章", "zh": "击破!印章"}, "결과": {"en": "Result", "ja": "結果", "zh": "结果"}, "결과 공유하기": {"en": "Share result", "ja": "結果をシェア", "zh": "分享结果"}, "결과 발표": {"en": "Results announced", "ja": "結果発表", "zh": "公布结果"}, "결과:": {"en": "Result:", "ja": "結果:", "zh": "结果:"}, "결단력": {"en": "Decisiveness", "ja": "決断力", "zh": "决断力"}, "결승": {"en": "Final", "ja": "決勝", "zh": "决赛"}, "결정": {"en": "Decision", "ja": "決定", "zh": "决定"}, "결정할 때 공정함이 분위기보다 중요하다": {"en": "When deciding, fairness matters more than the mood", "ja": "決めるときは、雰囲気より公平さが大事だ", "zh": "做决定时,公平比气氛更重要"}, "결혼기념일": {"en": "Wedding anniversary", "ja": "結婚記念日", "zh": "结婚纪念日"}, "결혼식 축가 부를 것 같은 사람": {"en": "Who's most likely to sing at a wedding", "ja": "結婚式で祝いの歌を歌いそうな人", "zh": "最有可能在婚礼上献唱的人"}, "결혼식장": {"en": "Wedding hall", "ja": "結婚式場", "zh": "婚礼会场"}, "경제": {"en": "Economy", "ja": "経済", "zh": "经济"}, "경제(분배 ↔ 시장)와 사회(자유 ↔ 질서) 두 축으로 내 생각의 위치를 좌표에 찍어 봐요. 특정 정당 · 인물과는 관계없고, 맞고 틀린 답도 없어요.": {"en": "Place your views on a coordinate map using two axes: economy (redistribution ↔ market) and society (freedom ↔ order). It has nothing to do with any party or person, and there are no right or wrong answers.", "ja": "経済(分配 ↔ 市場)と社会(自由 ↔ 秩序)の2軸で、自分の考えの位置を座標に落とし込みます。特定の政党や人物とは無関係で、正解も不正解もありません。", "zh": "用经济(分配 ↔ 市场)和社会(自由 ↔ 秩序)两条轴,在坐标上标出你想法的位置。与任何政党或人物无关,也没有对错之分。"}, "경제가 성장하면 분배 문제는 자연히 풀린다": {"en": "If the economy grows, redistribution problems solve themselves", "ja": "経済が成長すれば、分配の問題は自然と解決する", "zh": "经济增长了,分配问题自然会解决"}, "경찰": n you hear someone's worries, solutions come to mind first", "ja": "悩み相談を聞くと、まず解決策が浮かぶ", "zh": "听别人倾诉烦恼时,脑子里先冒出解决办法"}, "고백 제일 많이 받아 봤을 것 같은 사람": {"en": "Who's most likely to have been confessed to the most", "ja": "一番告白されてきたと思う人", "zh": "最有可能被告白次数最多的人"}, "고양이": {"en": "Cat", "ja": "猫", "zh": "小猫"}, "고장 난 건 일단 뜯어 봐요. 말보다 손이 먼저, 위기에 침착해요.": {"en": "Take apart whatever's broken first. Hands before words, calm in a crisis.", "ja": "壊れたものはとりあえず分解。言葉より手が先、ピンチでも冷静。", "zh": "坏了的东西先拆开看看。动手比动嘴快,遇到危机也很冷静。"}, "고추": {"en": "Chili pepper", "ja": "唐辛子", "zh": "辣椒"}, "고추냉이": {"en": "Wasabi", "ja": "わさび", "zh": "芥末"}, "곤충과 꽃 관찰": {"en": "Watching insects and flowers", "ja": "虫や花の観察", "zh": "观察昆虫和花"}, "곤충은 평소엔 이리저리 헤매다가, 시간이 지나면 한 마리씩 몇 초 동안 곧장 쫓아와요. 오래 끌수록 추격이 잦아져요.": {"en": "Bugs usually wander around, but as time passes they chase you straight for a few seconds, one at a time. The longer you stall, the more often they chase.", "ja": "虫は普段あちこち迷い歩きますが、時間が経つと1匹ずつ数秒間まっすぐ追いかけてきます。長引くほど追跡が増えます。", "zh": "虫子平时到处乱晃,时间一长就会一只接一只直直追你几秒钟。拖得越久,追击越频繁。"}, "곤충이 나오기 직전 경고음이 울려요. 가운데 상자 근처에서 멀어지세요.": {"en": "A warning sound plays just before bugs appear. Move away from the middle box.", "ja": "虫が出る直前に警告音が鳴ります。真ん中の箱から離れましょう。", "zh": "虫子出现前会响起警告音。请远离中间的箱子。"}, "골!": {"en": "Goal!", "ja": "ゴール!", "zh": "进球!"}, "골목 평정!": {"en": "Alley conquered!", "ja": "路地を制覇!", "zh": "巷子称霸!"}, "골목 형": {"en": "Alley bro", "ja": "路地の兄貴", "zh": "巷子大哥"}, "골목 형님": {"en": "Alley big bro", "ja": "路地の親分", "zh": "巷子老大哥"}, "골프": {"en": "Golf", "ja": "ゴルフ", "zh": "高尔夫"}, "곰을 가뒀어요! 눌러서 창고로": {"en": "Bear trapped! Tap to send it to storage", "ja": "クマを閉じ込めた! タップして倉庫へ", "zh": "把熊关住了!点一下送进仓库"}, "곰이": {"en": "Bear", "ja": "クマが", "zh": "熊"}, "곰이 나타났어요! 여러 번 눌러 가두세요": {"en": "A bear appeared! Tap several times to trap it", "ja": "クマが現れた! 何度かタップして閉じ込めよう", "zh": "熊出现了!连续点几下把它关起来"}, "곱창": {"en": "Gopchang", "ja": "ホルモン", "zh": "烤肥肠"}, "공 +{0}": {"en": "Balls +{0}", "ja": "ボール +{0}", "zh": "球 +{0}"}, "공 뒤쪽(내 골대 쪽)으로 돌아가서 차야 상대 골대로 날아가요.": {
